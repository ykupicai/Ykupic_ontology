# 法令檢核規則檔欄位定義（唯一規格來源）
#
# rule_check.py、rulebook_export.py、core/ykkb/rules.py 都讀這份檔；改規格只改這裡（由總部 TN 維護）。
#
# ── 規則檔格式 ──────────────────────────────────────────────
# 一檔一條：rules/<分類>/.../<rule_id>.yaml，檔名（不含 .yaml）必須等於 rule_id。
# 內容依序為下方 columns 的 21 個原中文欄名（順序不可改），接著是 extension_fields 的擴充欄。
# 21 欄的值只能是字串或 null（空白）；會被 YAML 當成數字的值（例 10、1.5）要寫成 '10'。
# 標準格式＝core/ykkb/rules.py 的 dump_rule 輸出（UTF-8 無 BOM、LF、多行文字用 |、引號只在必要時加）。
# 手寫時格式不拘，跑 rulebook_export.py 會自動整理成標準格式（值不變）；rule_check 與 CI 都把非標準格式列為錯誤。
# 範本見 rules/_template.yaml。
#
# ── 分類（放哪個資料夾）──────────────────────────────────────
#   rules/national/<rule_id>.yaml            中央法規、已轉正
#   rules/local/<縣市代碼>/<rule_id>.yaml     地方規定、已轉正（縣市代碼見 county_codes）
#   rules/pending/<辦公室代碼>/<rule_id>.yaml  各辦公室新增、尚未轉正（ID 為 X<辦公室代碼>-<流水號>）
# 2026-11-17 從臺南 xlsx 匯入的 346 條依下列規則分類（之後新規則由覆核者依法規性質決定放哪裡）：
#   - 屬地方規定 ＝ rule_id 第一段是縣市代碼（TNN-、KCG-、PTH-），
#     或第一段是 LOCAL、第二段是縣市代碼（LOCAL-TNN-、LOCAL-TPE-），
#     或「法規代碼」為縣市法規系統代碼（GL 開頭且括號註明縣市，例：GL000306(臺南市)）。
#   - 注意：GL 開頭不一定是地方法規。農業部、財政部等中央機關的法規系統也用 GL 代碼
#     （GL001127 農產品初級加工場管理辦法、GL001615 寵物生命紀念設施要點、GL008781(財政部)），這些歸中央。
#   - LOCAL-00（「縣市自訂審查規定」通用占位列）不屬任何單一縣市，放 rules/local/ANY/。
#   - 其餘全部歸中央（national）。
# 已轉正規則的 rule_id 前綴規定：local/<縣市代碼>/ 底下的規則，rule_id 必須以「<縣市代碼>-」或
# 「LOCAL-<縣市代碼>-」開頭（ANY 資料夾為「LOCAL-」）。

schema_version: 1

# 匯出 20_規則庫 工作表與 CSV 的欄名與順序（原 xlsx 21 欄，不可增刪改名）
columns:
  - rule_id
  - 法規
  - 法規代碼
  - 現行版本
  - 編
  - 條號
  - 條文要旨
  - 適用辦理方式
  - 觸發條件
  - 回答型態
  - 資料來源／判斷依據
  - 進綜理表
  - 評估事項
  - ○△╳判定邏輯(初擬)
  - 因應手段
  - 手段法源
  - 手段門檻
  - 時程約束
  - 完成後可升級為○
  - 核對狀態
  - 覆寫/從屬總編規則

# 21 欄中不可空白的欄位（現有 346 條全部有值）
required_nonempty:
  - rule_id
  - 法規
  - 法規代碼
  - 條號
  - 條文要旨
  - 適用辦理方式
  - 回答型態
  - 進綜理表
  - 核對狀態

# 列舉欄位：值必須是清單之一（由現有 346 條歸納；要新增選項先改這裡並說明理由）。
# 「適用辦理方式」「評估事項」「完成後可升級為○」現有寫法帶大量括號補充，不是封閉列舉，故不設 enum。
enums:
  回答型態:
    - 1敬略
    - 2不適用
    - 3遵照辦理
    - 4專編豁免
    - 5交互參照
    - 6實質計算
    - 2不適用／6實質計算
    - 2不適用／3遵照辦理
    - 1敬略（非特農區時）／6實質計算（特農區時）
    - 是否
    - 逐點檢核
    - 數值
    - 實算
    - 說明
  進綜理表:
    - 是
    - 否

# 格式欄位：有值時須符合正規式（null 可）
patterns:
  編: '^(總編|第\d+編|—)$'

# 擴充欄（不進 21 欄匯出；寫在 21 欄之後）
extension_fields:
  status:
    required: true
    enum: [active, deprecated]
    說明: active＝現行；deprecated＝廢止或已轉正（須同時填 superseded_by）。已轉正規則不可刪檔，要廢止改這欄。
  superseded_by:
    required: false
    說明: status 為 deprecated 時必填。填取代它的 rule_id（須存在），或無取代規則時寫文字原因（例：法規廢止）。
  added_by:
    required: true
    enum_source: offices.yaml
    說明: 新增這條規則的辦公室代碼（TN、HC、TP…，以 repo 根 offices.yaml 為準）。轉正後保留原新增辦公室。
  reviewed_by:
    required: false
    enum_source: offices.yaml
    說明: 轉正時填覆核辦公室代碼（他辦覆核填覆核辦公室；自行轉正填自己的辦公室，即等於 added_by，review_mode 須為 self）。national／local 的非匯入規則必填。
  reviewed_at:
    required: false
    format: YYYY-MM-DD
    說明: 覆核日期；有 reviewed_by 時必填。
  review_mode:
    required: false
    enum: [peer, self]
    說明: >-
      轉正方式（2026-11-23 起）。peer＝他辦覆核（reviewed_by ≠ added_by）；self＝自行轉正（reviewed_by ＝ added_by）。
      有 reviewed_by 時必填，且須與 reviewed_by／added_by 是否相同一致；reviewed_by 空白時本欄也須空白。
      legacy_import: true 的匯入規則不需要本欄。自行轉正的規則每月抽查一部分回官方原文核對，下游與報告可依本欄區分。
  spot_checked_at:
    required: false
    format: YYYY-MM-DD
    說明: 抽查核對日期（回官方原文核對自行轉正規則的日期）。只有 review_mode 為 self 的規則可以填；沒抽查過省略或寫 null。
  spot_check_note:
    required: false
    說明: 抽查結果一句話（例：「與官方原文一致」「§5 門檻已更正」）。只有 review_mode 為 self 的規則可以填。
  source_url:
    required: false
    說明: 官方法規資料庫網址（網域須在 source_url 白名單）。非匯入規則必填；匯入規則改過 21 欄內容時也必填。
  legacy_import:
    required: false
    type: bool
    說明: 只有 rules/_meta/legacy_import.yaml 列出的原匯入規則可為 true；新規則省略或填 false。

# 規則 ID
id:
  pattern: '^[A-Z][A-Z0-9]*(-[A-Z0-9]+)+$'
  # 第一個連字號之後須含數字（與臺南盤點腳本 _rule_mapping_audit.ID_PATTERN 一致，避免把一般縮寫當 ID）
  digit_after_first_hyphen: true
  # pending 規則：X＋辦公室代碼＋流水號，例 XHC-1；放在 rules/pending/<辦公室代碼>/
  pending_pattern: '^X(?P<office>[A-Z][A-Z0-9]*)-\d+$'
  # 全 repo 唯一（含 deprecated 的 pending 規則；轉正要改配新 ID，舊 pending ID 不可被正式規則重用）

# 轉正流程（rule_check 依此檢查）：
#   轉正者在 national/ 或 local/<縣市>/ 新增「正式 ID」規則檔（added_by＝原辦公室、reviewed_by＝轉正辦公室、
#   reviewed_at、review_mode、source_url 必填）；原 pending 檔不刪，只改 status: deprecated 並新增 superseded_by: <正式 ID>，其他欄位不動。
#   兩種轉正方式（2026-11-23 起）：
#     peer：他辦覆核，reviewed_by ≠ added_by；
#     self：自行轉正，reviewed_by ＝ added_by（只能轉正自己辦公室新增的規則；每月抽查，結果填 spot_checked_at／spot_check_note）。
#   本機 push 時，修改他辦公室 pending 資料夾只放行 peer 轉正這一種變動；自己的 pending 資料夾本來就可以自由修改。

# 匯出設定
export:
  # 只有已轉正（national、local）的規則進匯出；pending（含已 deprecated 的）一律不進。
  # deprecated 的 national／local 規則仍匯出（下游清單可能還引用），狀態另見匯出 xlsx 的 90_規則狀態 工作表。
  include_categories: [national, local]
  # 排序鍵（穩定、可重現）：
  #   1. rules/_meta/legacy_import.yaml 列出的原匯入規則在前，依原 xlsx 列順序；
  #   2. 其餘規則接在後面，依 rule_id 自然排序（數字段以數值比較：GEN-2 < GEN-10），ID 不變順序就不變。
  sort_key: legacy_order_then_natural_rule_id
  csv:
    file: exports/法令檢核規則庫.csv
    encoding: utf-8-sig   # UTF-8 with BOM、LF 換行；儲存格內換行寫成字面 \n、反斜線寫成 \\（與臺南原匯出相同）
  xlsx:
    file: exports/法令檢核規則庫.xlsx
    # 工作表順序與非規則工作表內容見 rules/_meta/workbook.yaml；
    # 另附 90_規則狀態 工作表（擴充欄），原五個工作表的表名、欄名、欄序不變。
  # review_mode、spot_checked_at 於 2026-11-23 加入（只加在 90 表；20_規則庫 與 CSV 的 21 欄不變）
  status_sheet_columns: [rule_id, status, superseded_by, added_by, reviewed_by, reviewed_at, review_mode, spot_checked_at, source_url, legacy_import]

# 官方來源網址白名單
source_url:
  allowed_hosts:
    - law.moj.gov.tw        # 全國法規資料庫
    - glrs.moi.gov.tw       # 內政部主管法規
    - law.moa.gov.tw        # 農業部主管法規
    - rmis.ardswc.gov.tw    # 農村發展及水土保持署
    - law.moea.gov.tw       # 經濟部主管法規
    - oaout.moenv.gov.tw    # 環境部主管法規
  # 各縣市法規系統：主機名稱以 .gov.tw 結尾，且 .gov.tw 之前任一段含下列字樣
  # （例：law01.tainan.gov.tw、ptlaw.pthg.gov.tw、outlaw 系列、legal 系列）
  local_host_suffix: .gov.tw
  local_host_tokens: [law, legal, glrs]
  # 匯入規則的 source_url 由「法規代碼」機械推得，未逐條上網驗證：
  #   - 全國法規資料庫 pcode（英文字母＋7 位數，如 D0060013）→ https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=<代碼>
  #     （多個代碼以「／」並列時取第一個）
  #   - FL／GL 代碼且「核對狀態」寫明出自 glrs（內政部）或 law.moa（農業部）→ https://<該主機>/LawContent.aspx?id=<代碼>
  #   - 其他（縣市法規系統、函釋文號、會議附件、行政指引）推不出 → null

# 縣市代碼（local/ 資料夾名與地方規則 ID 前綴；總部維護，不要自創）
# 已有規則使用的前綴沿用（高雄 KCG、屏東 PTH）；彰化用 CHW，避開中央規則前綴 CHA（文化資產）。
county_codes:
  TPE: 臺北市
  NWT: 新北市
  TAO: 桃園市
  TXG: 臺中市
  TNN: 臺南市
  KCG: 高雄市
  KEE: 基隆市
  HSZ: 新竹市
  HSQ: 新竹縣
  MIA: 苗栗縣
  CHW: 彰化縣
  NAN: 南投縣
  YUN: 雲林縣
  CYI: 嘉義市
  CYQ: 嘉義縣
  PTH: 屏東縣
  ILA: 宜蘭縣
  HUA: 花蓮縣
  TTT: 臺東縣
  PEN: 澎湖縣
  KIN: 金門縣
  LJF: 連江縣
  ANY: 跨縣市通用（占位列，如 LOCAL-00）

