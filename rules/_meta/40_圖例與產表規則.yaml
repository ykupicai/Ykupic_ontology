# 原 xlsx 工作表「40_圖例與產表規則」的內容（匯出時原樣還原成同名工作表）。
# format: records＝每列一個「欄名: 值」對照；columns 為表頭與欄序。改內容請保持欄名不變。
sheet: 40_圖例與產表規則
format: records
width: 2
columns:
- 項目
- 內容
rows:
- 項目: 圖例（★2026-07-26 定案）
  內容: ○：具可行性（一定可行）　　△：需經後續作業／審議認定　　╳：不具可行性（直接不合法）
- 項目: 圖例沿革
  內容: 歷史簡報多用「△ 有條件辦理」；金門2021 已用「△ 需經相關局處認定及後續審議」，與本次定案同義。新案一律採定案文字，不再用「有條件辦理」
- 項目: 記號正規化
  內容: △ = Δ = ▲（同義，輸出統一用 △）；╳ = × = X（統一用 ╳）；另保留第四記號「-」＝該法規非此宗地／坵塊之項目（金門案用法）
- 項目: 執行疑義列（★定案）
  內容: 本列記號＝【整案結論】，不是該列自身判定。實證：雲林口湖2022 各列為 △/△/╳ → 執行重點列給 ╳（整案不可行）；官田2026 各列 ○△ → 執行疑義列給 △。高雄蔗農2024 留空僅列文字，新案不採此做法
- 項目: 欄位三種變體
  內容: ①單欄評估成果（官田、苗栗、高雄大樹）②多坵塊／多分區並列（高雄大社 坵塊A|B、金門洋山 A|C、金門金沙逐地號7欄並標分區別）③「-」表非此法規之項目。★變體②與制式檢核表「北坵塊／南坵塊」、產線 persite 分組同構，產表器須支援 N 欄
- 項目: L0 分流的實務做法
  內容: ★同一案要把【可行的辦理路線都各評一張表】，不是選一條。實證：雲林口湖2022 出「開發許可／農業經營結合綠能專案計畫／農業容許」三張表各自判定；金門洋山測 A/C 坵塊走風景區開發許可、B 坵塊走農業區容許（同案不同坵塊不同路線）
- 項目: 臨路判定校準（★重要）
  內容: 不足8公尺【不必然是△】：①寫出可援引之但書／替代方案路徑且能出具證明 → ○（官田：援引區委會第461次會議紀錄但書＋出具證明）②只陳述寬度不足 → △（高雄大樹）③完全不臨路或僅塭堤道路 → ╳（高雄大社坵塊A、苗栗、雲林、金門）
- 項目: 其他判定實證
  內容: 面積未達2公頃 → ╳（高雄大社坵塊A 0.3公頃）｜第一級環敏且屬與水資源保育直接相關 → ╳（高雄大樹水庫集水區＋山坡地30%）｜第一級環敏但可取得同意函 → △（高雄蔗農）｜坡度30%以上為基地主體 → ╳（臺南龍崎）｜坡度30%以上占42~73%但仍有可用地 → △（高雄蔗農）｜現況與申請型態不符（無魚塭卻走漁電須開挖）→ ╳（花蓮鳳林§27）
- 項目: 語料來源
  內容: NAS 1.案件統整\2.評估案件\02非都市土地\001再生能源；掃描167個pptx → 37案/71表頁含○△╳表；分析12案（2020~2026、9縣市、4種辦理方式）。詳 判準驗證發現_12案.md、評估表語料_12案.md
- 項目: 臨路門檻（v7 更新）
  內容: ★依太陽光電設施開發案基地聯絡道路審議原則：≥8公尺→○（總編§26本文）；4~8公尺且可供施工維修車輛及消防車通行並承諾施工交管→○（已寫出援引路徑）或△（待消防單位/區委會認定）；<4公尺且無退縮留設或替代方案→╳。★轉彎進出需6公尺（吊車與大型運輸車），故須轉彎進入之基地實質門檻為6公尺
- 項目: 兩條路線臨路標準不同
  內容: ★走【開發許可】（達2公頃）→ 審議作業規範§26＋聯絡道路審議原則；走【變更編定】（未達2公頃）→ 實施區域計畫地區建築管理辦法及建築技術規則（光電審查作業要點第五點(六)）。產表時須先確定路線再套門檻
- 項目: ★路線決定適用法規（v8）
  內容: 產表第一步必須先定【辦理方式】：面積<2公頃→變更編定（適用光電要點附表、臨路依建築管理辦法與建築技術規則）；面積≥2公頃→開發許可（不適用附表、臨路依開發審議規範§26＋聯絡道路審議原則、土地使用計畫依開發審議規範）。同一案不同宗基地面積不同時，可能分屬不同路線，須逐宗判定
