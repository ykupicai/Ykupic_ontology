法規: 縣市自訂審查規定（可擴充層）
法規代碼: —
現行版本: —
編: —
條號: —
條文要旨: ★架構列：各縣市另訂之光電審查規定須逐案掛載。已知案例：金門縣—金門特定區細部計畫（土地使用分區管制要點）／金門特定區計畫風景區開發許可作業規定（風景區出入口須連12公尺以上都市計畫道路、銜接道路≥8公尺；基地規模≥1公頃且最小寬度≥30公尺；周邊綠地≥申請開發總面積20%且最小淨深≥10公尺；必要性服務設施≥總面積30%）／金門縣金門特定區計畫農業區保護區土地使用審查要點（申請基地應面臨6公尺以上道路；基地面積不得超過3,000㎡，經同意得放寬但不得超過3公頃；原始地形平均坡度不得超過30%）。★以上皆屬都市計畫書與縣府審查規定，非法規資料庫收錄，須向縣市府取得官方文件
適用辦理方式: 全路線
觸發條件: 案件位於該縣市
回答型態: 6實質計算
資料來源／判斷依據: 縣市自訂規定（須逐案取得）
