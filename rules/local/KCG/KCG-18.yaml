rule_id: KCG-18
法規: 都市計畫法高雄市施行細則
法規代碼: GL000627(高雄市)
現行版本: 115.06.01 高市府都發規字第11532497400號令
編: —
條號: 18附表一
條文要旨: 都市計畫農業區（附表一「十一、農業區」）項次四【休閒農業設施、自然保育設施、綠能設施】：①經目的事業主管機關核准；②休閒農業設施建蔽率≤20%、自然保育設施≤40%，且項次二至四（農舍、農業產銷必要設施、本項）合計建蔽率≤60%；③綠能設施以結合農業經營者為限。另第21條：依本細則允許設置之再生能源發電設備及輸變電設施，建蔽率不受附表二限制但最高80%。
適用辦理方式: 都市計畫變更／容許使用
觸發條件: 基地位於高雄市都市計畫農業區
回答型態: 6實質計算
資料來源／判斷依據: 都市計畫分區圖
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:符合農業區綠能設施管制事項／△:須經目的事業主管機關核准且結合農業經營（結果未定）／╳:不符管制事項
因應手段: 向高雄市農業局申請核准並結合農業經營
手段法源: 都計法高雄市施行細則§18附表一
手段門檻: —
時程約束: 送件前
完成後可升級為○: 可
核對狀態: 已核對(高雄市法規資料庫 GL000627 115.06.01 修正附件 PDF 第38～39頁附表一十一、農業區，2026-11-12 知識庫逐頁核對；71層 都市計畫法高雄市施行細則-重點)
