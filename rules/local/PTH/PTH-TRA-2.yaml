rule_id: PTH-TRA-2
法規: 屏東縣非都市土地申請變更編定為交通用地興辦事業計畫審查作業要點
法規代碼: GL000685(屏東縣)
現行版本: 109.05.26 修正（99.04.12 公發布；屏東縣政府交通旅遊處）
編: —
條號: 第二點
條文要旨: 適用設施限非都市土地使用管制規則許可使用之【汽車運輸業場站、停車場】：汽車運輸業場站指經監理機關同意立案之汽車運輸業所申請設置客運站、貨運站、停車場及其附屬設施（如保養廠、辦公室）；路外停車場指道路路面外以平面、立體、機械或塔臺式等所設停放車輛場所及附屬設施用地。
適用辦理方式: 變更編定
觸發條件: 屏東縣非都市土地申請變更編定為交通用地（汽車運輸業場站及設施暨路外停車場）
回答型態: 是否
資料來源／判斷依據: 興辦事業內容；監理機關立案文件
進綜理表: 是
評估事項: —
○△╳判定邏輯(初擬): ○:屬汽車運輸業場站或路外停車場／╳:非屬（不適用本要點）
因應手段: —
手段法源: —
手段門檻: —
時程約束: 接案初期
完成後可升級為○: —
核對狀態: 已核對(屏東縣法規資料庫 ptlaw.pthg.gov.tw GL000685 本文，2026-11-12 知識庫拆條；71層 屏東縣非都市土地申請變更編定為交通用地興辦事業計畫審查作業要點-重點)
覆寫/從屬總編規則: —
