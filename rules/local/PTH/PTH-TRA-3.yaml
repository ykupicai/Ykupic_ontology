rule_id: PTH-TRA-3
法規: 屏東縣非都市土地申請變更編定為交通用地興辦事業計畫審查作業要點
法規代碼: GL000685(屏東縣)
現行版本: 109.05.26 修正（99.04.12 公發布；屏東縣政府交通旅遊處）
編: —
條號: 第三點
條文要旨: 申請書件一式二份向縣府提出，由交通旅遊處會簽書面審查：審查表（附件一）、土地權利證明、身分證明、變更編定申請書（附件二）、變更編定同意書、謄本、地籍圖、興辦事業計畫書圖（附件三）、農地變更使用說明書（涉農業用地者）。涉農業用地變更者，應於計畫書詳細說明使用農業用地之區位、面積之【必要性、合理性及無可替代性，無合理說明者不予審查】；附件四應查詢項目及應加會機關，申請者應【先取得審查合格證明文件】。
適用辦理方式: 變更編定
觸發條件: 屏東縣非都市土地申請變更編定為交通用地（汽車運輸業場站及設施暨路外停車場）
回答型態: 3遵照辦理
資料來源／判斷依據: —
進綜理表: 是
評估事項: 農業用地變更
○△╳判定邏輯(初擬): ○:書件齊備且無可替代性說明完整／△:無可替代性論述或附件四查詢結果待補／╳:—
因應手段: 撰擬農業用地無可替代性說明；先完成附件四查詢
手段法源: —
手段門檻: —
時程約束: 送件前
完成後可升級為○: 可
核對狀態: 已核對(屏東縣法規資料庫 ptlaw.pthg.gov.tw GL000685 本文，2026-11-12 知識庫拆條；71層 屏東縣非都市土地申請變更編定為交通用地興辦事業計畫審查作業要點-重點)
覆寫/從屬總編規則: 與農變要點 AGR 系列併用
