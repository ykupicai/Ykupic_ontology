rule_id: PTH-TRA-4
法規: 屏東縣非都市土地申請變更編定為交通用地興辦事業計畫審查作業要點
法規代碼: GL000685(屏東縣)
現行版本: 109.05.26 修正（99.04.12 公發布；屏東縣政府交通旅遊處）
編: —
條號: 第四點、第五點
條文要旨: 縣府審查時應依管制規則§30Ⅳ徵得【變更前目的事業主管機關】及有關機關同意，並就事業計畫之【可行性、必要性（或總量管制）、土地區位或面積規模】予以審查；書面審查後召集相關單位會勘，核准文件應敘明已完成查詢項目查核、無禁限建及不得設置情事。
適用辦理方式: 變更編定
觸發條件: 屏東縣非都市土地申請變更編定為交通用地（汽車運輸業場站及設施暨路外停車場）
回答型態: 3遵照辦理
資料來源／判斷依據: —
進綜理表: 是
評估事項: —
○△╳判定邏輯(初擬): ○:已取得變更前目的事業主管機關同意／△:待取得或可行性必要性論證待審／╳:變更前目的事業主管機關不同意
因應手段: —
手段法源: —
手段門檻: —
時程約束: 審查階段
完成後可升級為○: 可
核對狀態: 已核對(屏東縣法規資料庫 ptlaw.pthg.gov.tw GL000685 本文，2026-11-12 知識庫拆條；71層 屏東縣非都市土地申請變更編定為交通用地興辦事業計畫審查作業要點-重點)
覆寫/從屬總編規則: —
