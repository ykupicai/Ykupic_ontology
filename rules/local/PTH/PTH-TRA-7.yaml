rule_id: PTH-TRA-7
法規: 屏東縣非都市土地申請變更編定為交通用地興辦事業計畫審查作業要點
法規代碼: GL000685(屏東縣)
現行版本: 109.05.26 修正（99.04.12 公發布；屏東縣政府交通旅遊處）
編: —
條號: 第七點
條文要旨: 核准變更編定後如有用水需求：(一)依水利法申請水權或檢具其他合法水源供水證明；(二)位於經濟部公告【嚴重地層下陷地區】者，開發所需水源【不得抽取地下水】，依水利法施行細則§46Ⅰ辦理或取得合法水源證明，並以低耗水為原則。
適用辦理方式: 變更編定
觸發條件: 屏東縣非都市土地申請變更編定為交通用地（汽車運輸業場站及設施暨路外停車場）
回答型態: 6實質計算
資料來源／判斷依據: 經濟部公告嚴重地層下陷地區範圍
進綜理表: 是
評估事項: 環境敏感
○△╳判定邏輯(初擬): ○:非嚴重地層下陷地區或用水採自來水／△:位於下陷地區須取得合法水源證明／╳:—
因應手段: 採自來水或取得合法水源證明
手段法源: —
手段門檻: —
時程約束: 核准後
完成後可升級為○: —
核對狀態: 已核對(屏東縣法規資料庫 ptlaw.pthg.gov.tw GL000685 本文，2026-11-12 知識庫拆條；71層 屏東縣非都市土地申請變更編定為交通用地興辦事業計畫審查作業要點-重點)
覆寫/從屬總編規則: —
