rule_id: PTH-TRA-9
法規: 屏東縣非都市土地申請變更編定為交通用地興辦事業計畫審查作業要點
法規代碼: GL000685(屏東縣)
現行版本: 109.05.26 修正（99.04.12 公發布；屏東縣政府交通旅遊處）
編: —
條號: 第九點
條文要旨: 興辦事業計畫經核准後，停車場附屬設施應取得使用許可；【供公眾停車使用收費者，應於領得停車場登記證後始得營業】。
適用辦理方式: 變更編定
觸發條件: 屏東縣非都市土地申請變更編定為交通用地（汽車運輸業場站及設施暨路外停車場）
回答型態: 3遵照辦理
資料來源／判斷依據: —
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): 營運前置，不判○△╳
因應手段: —
手段法源: —
手段門檻: —
時程約束: 營業前
完成後可升級為○: —
