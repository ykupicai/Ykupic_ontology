rule_id: PTH-TRA-A1-1
法規: 屏東縣非都市土地申請變更編定為交通用地興辦事業計畫審查作業要點（附件一 審查表）
法規代碼: GL000685(屏東縣)
現行版本: 109.05.26 修正（附件一審查表）
編: —
條號: 附件一 交通旅遊處（運輸管理科）一
條文要旨: 屏東縣申請設置【路外停車場】：基地供小型車停放者應臨接【6公尺以上實際寬度】道路；大型車停放者應臨接【10公尺以上】（審查表未列中央辦法之5公尺、6公尺但書）。地面層出入口：距順向道路交叉口5公尺以上；無人行道者自建築線退縮1.5公尺以上；建築線後退2公尺之出入口中心線左右各60度無礙視線緩衝空間；停等空間小型車6×6公尺、大型車6×12公尺（內藏式轉盤除外）。
適用辦理方式: 變更編定
觸發條件: 屏東縣非都市土地變更編定為交通用地供路外停車場使用
回答型態: 6實質計算
資料來源／判斷依據: 臨路評估成果（實際路寬）；配置圖出入口
進綜理表: 是
評估事項: 臨路情形
○△╳判定邏輯(初擬): ○:實際路寬達6／10公尺且出入口配置符合／△:出入口須調整配置／╳:實際路寬未達6公尺（小型車）或10公尺（大型車）
因應手段: 改停小型車；調整出入口配置
手段法源: —
手段門檻: 6／10公尺；路口5公尺；停等6×6／6×12公尺
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(屏東縣法規資料庫 GL000685 附件一 PDF，2026-11-12 知識庫拆條；71層 屏東縣非都市土地申請變更編定為交通用地興辦事業計畫審查作業要點-重點)
覆寫/從屬總編規則: 屏東版覆寫 PKT-4（無但書寬度）；出入口同 PKT-5
