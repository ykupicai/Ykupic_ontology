rule_id: PTH-TRA-A1-2
法規: 屏東縣非都市土地申請變更編定為交通用地興辦事業計畫審查作業要點（附件一 審查表）
法規代碼: GL000685(屏東縣)
現行版本: 109.05.26 修正（附件一審查表）
編: —
條號: 附件一 工務處 1～3
條文要旨: 屏東縣申請【汽車運輸業場站】：基地臨接【非編號道路寬度大於12公尺】，或臨接【編號道路寬度大於10公尺】；基地【臨街面寬大於12公尺】；並查基地內有無現有道路、變更編定是否妨礙公眾通行。另公路監理單位審查銜接道路寬度是否容許兩部大型客貨車會車、是否造成週邊重大交通衝擊。
適用辦理方式: 變更編定
觸發條件: 屏東縣非都市土地變更編定為交通用地供汽車運輸業場站使用
回答型態: 6實質計算
資料來源／判斷依據: 臨路評估成果（道路是否為編號道路、實際路寬）；基地臨街面寬
進綜理表: 是
評估事項: 臨路情形
○△╳判定邏輯(初擬): ○:非編號道路>12公尺或編號道路>10公尺，且臨街面寬>12公尺／△:路寬接近門檻或會車條件待公路監理單位認定／╳:路寬或臨街面寬未達門檻
因應手段: 改選臨接較寬道路之基地；改作路外停車場（PTH-TRA-A1-1）
手段法源: —
手段門檻: 非編號道路12公尺／編號道路10公尺；臨街面寬12公尺
時程約束: 接案初期
完成後可升級為○: —
核對狀態: 已核對(屏東縣法規資料庫 GL000685 附件一 PDF，2026-11-12 知識庫拆條；71層 屏東縣非都市土地申請變更編定為交通用地興辦事業計畫審查作業要點-重點)
覆寫/從屬總編規則: 屏東專屬，嚴於 MTB-4-A
