rule_id: PTH-TRA-A1-3
法規: 屏東縣非都市土地申請變更編定為交通用地興辦事業計畫審查作業要點（附件一 審查表）
法規代碼: GL000685(屏東縣)
現行版本: 109.05.26 修正（附件一審查表）
編: —
條號: 附件一 交通旅遊處三、警察局、附件三
條文要旨: 屏東縣交通用地興辦事業計畫應附：建築師簽證之【透水性綠建材鋪面】書圖；設圍籬者【透空率≥70%】並經專業技師簽證；出入口設【安全維護照明及監視攝影系統】（警察局）；計畫書圖含交通影響評估（現況、需求預測、服務水準與停車供需、改善措施）、洗車設備與油污廢水處理。
適用辦理方式: 變更編定
觸發條件: 屏東縣非都市土地變更編定為交通用地
回答型態: 3遵照辦理
資料來源／判斷依據: —
進綜理表: 否
評估事項: 規劃配置
