rule_id: LOCAL-TNN-001
法規: 縣市自訂審查規定（可擴充層）－臺南市
法規代碼: 府農務字第1130169295B號
現行版本: 113.02.05 臺南市政府公告（府農務字第1130169295B號；依據申請農業用地作農業設施容許使用審查辦法§35、行政程序法§15；增列附屬綠能設施委任事項，自106.06.28起生效）
編: —
條號: 公告事項二、三
條文要旨: 臺南市政府委任各區公所辦理農業設施容許使用審查及核發同意書：(一)【農作產銷設施】位於非都市土地特定農業區、特定專用區、一般農業區、山坡地保育區，及都市計畫農業區、保護區，每一申請人【前後申請容許使用累積面積330平方公尺以下】者；(二)林業設施：非都市土地一般農業區、山坡地保育區、森林區；(三)水產養殖設施：非都市土地一般農業區、都市計畫農業區，每農戶申請面積1萬平方公尺以下；(四)畜牧設施：豬隻200頭以下等（依頭隻數）。逾越者由臺南市政府（農業局）審查。【附屬綠能設施】採二階段：第一階段依各類農業設施程序與核定權限；第二階段於農業設施設置完成（依法須使用執照者取得使照）後，檢具農業生產實績向原核發機關申請，經查核確有農業經營事實始核發附屬綠能設施容許使用同意書。
適用辦理方式: 容許使用
觸發條件: 臺南市轄內農業設施（農作產銷、林業、水產養殖、畜牧、附屬綠能）容許使用申請案
回答型態: 3遵照辦理
資料來源／判斷依據: 先算樓地板上限（AGF-002）與申請人**前後累積**面積，再對 330 ㎡ 門檻
進綜理表: 是
評估事項: —
○△╳判定邏輯(初擬): ○:程序性；本列的作用是**指出正確受理機關**，不產生實體障礙
因應手段: 落在門檻內＝向土地所在區公所申請；逾越＝向臺南市政府農業局申請
手段法源: 府農務字第1130169295B號公告
手段門檻: 累積 330 ㎡
時程約束: 送件前
完成後可升級為○: —
核對狀態: 已核對(臺南市政府公告原件 府農務字第1130169295B號 113.02.05，使用者 2026-11-12 提供，原件存 _佐證 資料夾；OCR 讀取，畜牧設施第2款字跡不清未收)
覆寫/從屬總編規則: 覆寫 AGF-005 之受理機關
