rule_id: TNN-CDW-17-2
法規: 臺南市營建工程賸餘土石方處理及資源堆置處理場設置管理自治條例
法規代碼: GL000306(臺南市)
現行版本: 112.10.19 府法制字1121355105A號令（101.11.22 公發布；主管機關＝臺南市政府工務局）
編: —
條號: §17Ⅱ
條文要旨: 土資場或目的事業處理場所設置於【都市計畫農業區或保護區】者，【不得進行開挖填埋作業】；但進行整地者不在此限。
適用辦理方式: 容許使用／變更編定
觸發條件: 臺南市轄內設置土石方資源堆置處理場（土資場）或目的事業處理場所
回答型態: 6實質計算
資料來源／判斷依據: 都市計畫使用分區；現況地形（魚塭、低窪地）
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:非都計農業區／保護區／△:位於都計農業區或保護區，營運限整地，現況低窪地填實是否屬填埋須向工務局釋疑／╳:營運計畫必須開挖填埋
因應手段: 營運方式限整地；向工務局釋疑
手段法源: —
手段門檻: —
時程約束: 送件前
完成後可升級為○: —
核對狀態: 已核對(臺南市法規資料庫 law01.tainan.gov.tw GL000306 原文，2026-11-12 知識庫拆條；71層 臺南市營建工程賸餘土石方處理及資源堆置處理場設置管理自治條例-重點)
覆寫/從屬總編規則: —
