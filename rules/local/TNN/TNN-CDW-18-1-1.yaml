rule_id: TNN-CDW-18-1-1
法規: 臺南市營建工程賸餘土石方處理及資源堆置處理場設置管理自治條例
法規代碼: GL000306(臺南市)
現行版本: 112.10.19 府法制字1121355105A號令（101.11.22 公發布；主管機關＝臺南市政府工務局）
編: —
條號: §18Ⅰ①
條文要旨: 設置面積在【非山坡地不得少於1公頃】；在【山坡地不得少於10公頃】。但目的事業處理場所未涉及變更編定者不在此限。
適用辦理方式: 容許使用／變更編定
觸發條件: 臺南市轄內設置土石方資源堆置處理場（土資場）或目的事業處理場所
回答型態: 6實質計算
資料來源／判斷依據: 基地登記面積；山坡地範圍
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:非山坡地≥1公頃或山坡地≥10公頃／╳:未達門檻（目的事業處理場所未涉變更編定者不適用）
因應手段: —
手段法源: —
手段門檻: 1公頃／山坡地10公頃
時程約束: 接案初期
完成後可升級為○: —
核對狀態: 已核對(臺南市法規資料庫 law01.tainan.gov.tw GL000306 原文，2026-11-12 知識庫拆條；71層 臺南市營建工程賸餘土石方處理及資源堆置處理場設置管理自治條例-重點)
覆寫/從屬總編規則: —
