rule_id: TNN-CDW-18-1-2
法規: 臺南市營建工程賸餘土石方處理及資源堆置處理場設置管理自治條例
法規代碼: GL000306(臺南市)
現行版本: 112.10.19 府法制字1121355105A號令（101.11.22 公發布；主管機關＝臺南市政府工務局）
編: —
條號: §18Ⅰ②
條文要旨: 連接已開闢完成之道路，其寬度【不得小於8公尺】，且【不得為禁止砂石車通行之道路】；以私設通路連接者，其許可及容許使用依相關法令辦理。
適用辦理方式: 容許使用／變更編定
觸發條件: 臺南市轄內設置土石方資源堆置處理場（土資場）或目的事業處理場所
回答型態: 6實質計算
資料來源／判斷依據: 臨路評估成果（道路寬度、開闢狀況）；砂石車禁行路段公告
進綜理表: 是
評估事項: 臨路情形
○△╳判定邏輯(初擬): ○:連接已開闢≥8m且非禁止砂石車道路／△:以私設通路連接或禁行狀態待查／╳:<8m或屬禁止砂石車通行道路
因應手段: 私設通路依相關法令申請；變更運輸路線
手段法源: —
手段門檻: 8公尺
時程約束: 送件前
完成後可升級為○: 可
核對狀態: 已核對(臺南市法規資料庫 law01.tainan.gov.tw GL000306 原文，2026-11-12 知識庫拆條；71層 臺南市營建工程賸餘土石方處理及資源堆置處理場設置管理自治條例-重點)
覆寫/從屬總編規則: —
