rule_id: TNN-CDW-18-1-3
法規: 臺南市營建工程賸餘土石方處理及資源堆置處理場設置管理自治條例
法規代碼: GL000306(臺南市)
現行版本: 112.10.19 府法制字1121355105A號令（101.11.22 公發布；主管機關＝臺南市政府工務局）
編: —
條號: §18Ⅰ③
條文要旨: 與【營區、名勝古蹟、醫院、學校、文教設施、社會福利事業機構及十戶以上之村莊或聚落】之最短水平距離應【大於200公尺】。
適用辦理方式: 容許使用／變更編定
觸發條件: 臺南市轄內設置土石方資源堆置處理場（土資場）或目的事業處理場所
回答型態: 6實質計算
資料來源／判斷依據: 古蹟／歷史建築圖資；醫院學校社福營區聚落多無點位圖資須函詢
進綜理表: 是
評估事項: 環境敏感
○△╳判定邏輯(初擬): ○:200m內均無／△:無點位圖資之類別待函詢／╳:200m內有列名設施或十戶以上聚落
因應手段: —
手段法源: —
手段門檻: 200公尺
時程約束: 接案初期
完成後可升級為○: —
核對狀態: 已核對(臺南市法規資料庫 law01.tainan.gov.tw GL000306 原文，2026-11-12 知識庫拆條；71層 臺南市營建工程賸餘土石方處理及資源堆置處理場設置管理自治條例-重點)
覆寫/從屬總編規則: —
