rule_id: TNN-CDW-18-2
法規: 臺南市營建工程賸餘土石方處理及資源堆置處理場設置管理自治條例
法規代碼: GL000306(臺南市)
現行版本: 112.10.19 府法制字1121355105A號令（101.11.22 公發布；主管機關＝臺南市政府工務局）
編: —
條號: §18Ⅱ、Ⅲ
條文要旨: 土資場面積【2公頃以下】者，日進場量或日出場量均【≤1,000立方公尺】；逾2公頃者均【≤3,000立方公尺】；目的事業處理場所日進場量≤1,000立方公尺。兼收營建混合物者，混合物每日進場量≤200立方公尺，且與餘土合計不得超過前述總量。
適用辦理方式: 容許使用／變更編定
觸發條件: 臺南市轄內設置土石方資源堆置處理場（土資場）或目的事業處理場所
回答型態: 6實質計算
資料來源／判斷依據: 營運計畫
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): 營運規模約束，不判○△╳；營運計畫數量須在上限內
因應手段: —
手段法源: —
手段門檻: 1,000／3,000 m³/日
時程約束: 營運
完成後可升級為○: —
核對狀態: 已核對(臺南市法規資料庫 law01.tainan.gov.tw GL000306 原文，2026-11-12 知識庫拆條；71層 臺南市營建工程賸餘土石方處理及資源堆置處理場設置管理自治條例-重點)
覆寫/從屬總編規則: —
