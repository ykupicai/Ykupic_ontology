rule_id: TNN-CDW-19-7
法規: 臺南市營建工程賸餘土石方處理及資源堆置處理場設置管理自治條例
法規代碼: GL000306(臺南市)
現行版本: 112.10.19 府法制字1121355105A號令（101.11.22 公發布；主管機關＝臺南市政府工務局）
編: —
條號: §19⑦
條文要旨: 不得設置於其他依法令或經主管機關、各目的事業主管機關基於環境保護或安全考量【公告禁止設置地區】。
適用辦理方式: 容許使用／變更編定
觸發條件: 臺南市轄內設置土石方資源堆置處理場（土資場）或目的事業處理場所
回答型態: 6實質計算
資料來源／判斷依據: 工務局及各目的事業主管機關公告；須函詢
進綜理表: 是
評估事項: 環境敏感
○△╳判定邏輯(初擬): ○:經查復未涉及／△:待函詢／╳:位於公告禁止設置地區
因應手段: —
手段法源: —
手段門檻: —
時程約束: 接案初期
完成後可升級為○: —
