rule_id: TNN-CDW-21
法規: 臺南市營建工程賸餘土石方處理及資源堆置處理場設置管理自治條例
法規代碼: GL000306(臺南市)
現行版本: 112.10.19 府法制字1121355105A號令（101.11.22 公發布；主管機關＝臺南市政府工務局）
編: —
條號: §21
條文要旨: 應繕具申請書並檢附文件一式二十份：身分證明、土地權利證明、設置場地計畫（技師簽證位置圖、地形圖、周圍現況圖、設施配置圖、排水計畫等）、污染防治措施計畫、交通運輸計畫（含面前道路非禁止砂石車通行證明、指定建築線成果圖）、總量管制計畫書、環評報告及核准函、水保計畫及核准函、農業用地變更使用同意函（非農地免附）、整地之開挖填埋作業計畫書、再利用計畫、其他。第七至九款（環評、水保、農地變更同意）得於核准前補正。
適用辦理方式: 容許使用／變更編定
觸發條件: 臺南市轄內設置土石方資源堆置處理場（土資場）或目的事業處理場所
回答型態: 3遵照辦理
資料來源／判斷依據: —
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): 書件要求，不判○△╳；環評／水保／農地變更同意可於核准前補正
因應手段: —
手段法源: —
手段門檻: —
時程約束: 送件時（第七至九款得於核准前補正）
完成後可升級為○: —
核對狀態: 已核對(臺南市法規資料庫 law01.tainan.gov.tw GL000306 原文，2026-11-12 知識庫拆條；71層 臺南市營建工程賸餘土石方處理及資源堆置處理場設置管理自治條例-重點)
覆寫/從屬總編規則: —
