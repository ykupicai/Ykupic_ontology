rule_id: TNN-CDW-22-1
法規: 臺南市營建工程賸餘土石方處理及資源堆置處理場設置管理自治條例
法規代碼: GL000306(臺南市)
現行版本: 112.10.19 府法制字1121355105A號令（101.11.22 公發布；主管機關＝臺南市政府工務局）
編: —
條號: §22Ⅰ
條文要旨: 應有設施六項：①入口標示牌；②場址周圍【1.8公尺以上圍牆】及【寬度3公尺以上綠帶】隔離設施（位於農業用地者，隔離綠帶或設施依農業主管機關規定）；③防止塵土飛散、導水及排水設施；④出入口清洗設施及沉澱池；⑤遠端監控系統；⑥兼營營建混合物者設地磅。
適用辦理方式: 容許使用／變更編定
觸發條件: 臺南市轄內設置土石方資源堆置處理場（土資場）或目的事業處理場所
回答型態: 6實質計算
資料來源／判斷依據: 設施配置圖
進綜理表: 是
評估事項: 規劃配置
○△╳判定邏輯(初擬): ○:配置含六項設施且綠帶≥3m／△:位於農業用地，綠帶寬度須另依農業主管機關規定（AGR-010）／╳:—
因應手段: 配置圍牆、綠帶及各項設施
手段法源: —
手段門檻: 圍牆1.8m；綠帶3m
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(臺南市法規資料庫 law01.tainan.gov.tw GL000306 原文，2026-11-12 知識庫拆條；71層 臺南市營建工程賸餘土石方處理及資源堆置處理場設置管理自治條例-重點)
覆寫/從屬總編規則: 位於農業用地者從農變要點 AGR-010
