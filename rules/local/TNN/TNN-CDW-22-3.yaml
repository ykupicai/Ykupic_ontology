法規: 臺南市營建工程賸餘土石方處理及資源堆置處理場設置管理自治條例
法規代碼: GL000306(臺南市)
現行版本: 112.10.19 府法制字1121355105A號令（101.11.22 公發布；主管機關＝臺南市政府工務局）
編: —
條號: §22Ⅲ
條文要旨: 依§22Ⅱ申請之建築執照應加註「本建築執照在土石方資源堆置處理場營運許可失效時一併失效」；申請人應自行拆除建築物，【不得要求補償】。
適用辦理方式: 容許使用／變更編定
觸發條件: 臺南市轄內設置土石方資源堆置處理場（土資場）或目的事業處理場所
回答型態: 3遵照辦理
資料來源／判斷依據: —
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): 風險揭露，不判○△╳
因應手段: —
手段法源: —
手段門檻: —
時程約束: 營運許可失效時
完成後可升級為○: —
