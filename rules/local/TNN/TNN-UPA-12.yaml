rule_id: TNN-UPA-12
法規: 臺南市都市計畫保護區農業區土地使用審查要點
法規代碼: GL000316(臺南市)
現行版本: 115.08.31 府都管字第1151316013號函修正（101.11.28 公發布；主管機關＝臺南市政府都市發展局）
編: —
條號: 第十二點
條文要旨: 核准者應於核准函送達之日起【1年內】向建築主管機關申請或變更建築執照；得於期限屆滿前敘明理由申請展延，展延不得逾1年並以1次為限；未申請展延或展延未核准者，核准函自期限屆滿之日起失效。申請建照前都市計畫有變更者，依變更後內容。
適用辦理方式: 容許使用（都市計畫保護區、農業區）
觸發條件: 臺南市都市計畫保護區或農業區，依都市計畫法臺南市施行細則§25、§27、§28 申請設施土地核准使用
回答型態: 3遵照辦理
資料來源／判斷依據: —
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): 時程約束，不判○△╳
因應手段: —
手段法源: —
手段門檻: —
時程約束: 核准後1年內申請建照（展延1次、不逾1年）
完成後可升級為○: —
核對狀態: 已核對(臺南市法規資料庫 GL000316 115.08.31 版本文及附表一至三，2026-11-12 知識庫拆條；71層 臺南市都市計畫保護區農業區土地使用審查要點-重點)
覆寫/從屬總編規則: —
