rule_id: TNN-UPA-6-5
法規: 臺南市都市計畫保護區農業區土地使用審查要點
法規代碼: GL000316(臺南市)
現行版本: 115.08.31 府都管字第1151316013號函修正（101.11.28 公發布；主管機關＝臺南市政府都市發展局）
編: —
條號: 第六點(五)
條文要旨: 設施不得設置於【水質水量保護區、飲用水水源水質保護區或飲用水取水口一定距離內之地區】。但為居民生活所必要，且經目的事業主管機關核准者，不在此限。
適用辦理方式: 容許使用（都市計畫保護區、農業區）
觸發條件: 臺南市都市計畫保護區或農業區，依都市計畫法臺南市施行細則§25、§27、§28 申請設施土地核准使用
回答型態: 6實質計算
資料來源／判斷依據: 環敏套疊（自來水水質水量保護區、飲用水保護區、取水口）
進綜理表: 是
評估事項: 環境敏感
○△╳判定邏輯(初擬): ○:未涉及／△:位於範圍內，屬居民生活所必要待目的事業主管機關核准／╳:位於範圍內且非居民生活所必要
因應手段: 舉證為居民生活所必要並取得目的事業主管機關核准
手段法源: —
手段門檻: —
時程約束: 送件前
完成後可升級為○: 可
核對狀態: 已核對(臺南市法規資料庫 GL000316 115.08.31 版本文及附表一至三，2026-11-12 知識庫拆條；71層 臺南市都市計畫保護區農業區土地使用審查要點-重點)
覆寫/從屬總編規則: —
