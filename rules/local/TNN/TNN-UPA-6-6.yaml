rule_id: TNN-UPA-6-6
法規: 臺南市都市計畫保護區農業區土地使用審查要點
法規代碼: GL000316(臺南市)
現行版本: 115.08.31 府都管字第1151316013號函修正（101.11.28 公發布；主管機關＝臺南市政府都市發展局）
編: —
條號: 第六點(六)
條文要旨: 設施不得設置於環境地質上有崩塌滑動危險之虞之地區：1.依【建築法第47條】公告劃定之地區；2.都市計畫主要計畫及細部計畫所列山坡地、地質敏感區或【土壤液化潛在區】，並【載明不得開發】之地區；3.經濟部地質調查及礦業管理中心已公告【斷層帶】之地區。
適用辦理方式: 容許使用（都市計畫保護區、農業區）
觸發條件: 臺南市都市計畫保護區或農業區，依都市計畫法臺南市施行細則§25、§27、§28 申請設施土地核准使用
回答型態: 6實質計算
資料來源／判斷依據: 建築法§47公告範圍；都市計畫書；地質敏感區（活動斷層）套疊
進綜理表: 是
評估事項: 環境敏感
○△╳判定邏輯(初擬): ○:三目均未涉及（液化潛勢區但都市計畫書未載明不得開發者不觸發）／△:圖資或計畫書記載待確認／╳:位於任一目地區
因應手段: —
手段法源: —
手段門檻: —
時程約束: 接案初期
完成後可升級為○: —
核對狀態: 已核對(臺南市法規資料庫 GL000316 115.08.31 版本文及附表一至三，2026-11-12 知識庫拆條；71層 臺南市都市計畫保護區農業區土地使用審查要點-重點)
