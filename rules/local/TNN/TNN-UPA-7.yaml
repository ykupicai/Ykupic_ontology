rule_id: TNN-UPA-7
法規: 臺南市都市計畫保護區農業區土地使用審查要點
法規代碼: GL000316(臺南市)
現行版本: 115.08.31 府都管字第1151316013號函修正（101.11.28 公發布；主管機關＝臺南市政府都市發展局）
編: —
條號: 第七點
條文要旨: 申請基地範圍原始地形平均坡度【不得超過30%】；位於山坡地者，應依建築技術規則建築設計施工編第十三章第一節山坡地基地不得開發建築認定基準辦理。
適用辦理方式: 容許使用（都市計畫保護區、農業區）
觸發條件: 臺南市都市計畫保護區或農業區，依都市計畫法臺南市施行細則§25、§27、§28 申請設施土地核准使用
回答型態: 6實質計算
資料來源／判斷依據: 地形坡度分析（山坡地者技師簽證等高線）
進綜理表: 是
評估事項: 地形坡度
○△╳判定邏輯(初擬): ○:平均坡度≤30%／╳:>30%（可調整範圍者改△）
因應手段: —
手段法源: —
手段門檻: 30%
時程約束: 接案初期
完成後可升級為○: —
核對狀態: 已核對(臺南市法規資料庫 GL000316 115.08.31 版本文及附表一至三，2026-11-12 知識庫拆條；71層 臺南市都市計畫保護區農業區土地使用審查要點-重點)
覆寫/從屬總編規則: —
