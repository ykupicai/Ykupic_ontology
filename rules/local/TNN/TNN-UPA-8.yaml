rule_id: TNN-UPA-8
法規: 臺南市都市計畫保護區農業區土地使用審查要點
法規代碼: GL000316(臺南市)
現行版本: 115.08.31 府都管字第1151316013號函修正（101.11.28 公發布；主管機關＝臺南市政府都市發展局）
編: —
條號: 第八點
條文要旨: 申請基地面積【不得超過0.3公頃】。但有下列情形之一者不在此限：(一)同一申請者於同一地號或毗鄰土地申請設置數相關設施，經確認未影響附近農業生產環境及交通順暢且未違反設施設置規定，合計未逾1公頃；(二)經各目的事業主管機關依其相關法規核准之申請案。（附表另有面積規定者從其規定）
適用辦理方式: 容許使用（都市計畫保護區、農業區）
觸發條件: 臺南市都市計畫保護區或農業區，依都市計畫法臺南市施行細則§25、§27、§28 申請設施土地核准使用
回答型態: 6實質計算
資料來源／判斷依據: 基地登記面積
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:≤0.3公頃，或符合但書／△:>0.3公頃，待目的事業主管機關核准或確認合計未逾1公頃／╳:>0.3公頃且無但書適用
因應手段: 縮減申請範圍或取得目的事業主管機關核准
手段法源: —
手段門檻: 0.3公頃（但書1公頃）
時程約束: 接案初期
完成後可升級為○: 可
核對狀態: 已核對(臺南市法規資料庫 GL000316 115.08.31 版本文及附表一至三，2026-11-12 知識庫拆條；71層 臺南市都市計畫保護區農業區土地使用審查要點-重點)
覆寫/從屬總編規則: —
