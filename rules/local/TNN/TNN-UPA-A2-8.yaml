rule_id: TNN-UPA-A2-8
法規: 臺南市都市計畫保護區農業區土地使用審查要點
法規代碼: GL000316(臺南市)
現行版本: 115.08.31 府都管字第1151316013號函修正（101.11.28 公發布；主管機關＝臺南市政府都市發展局）
編: —
條號: 附表二 八
條文要旨: 都市計畫【農業區】設置【戶外球類運動場及運動訓練設施】：(一)申請基地應面臨【12公尺以上道路】，其臨接面寬【不得小於12公尺】；(二)設施（含停車空間規模）及使用內容依目的事業主管機關依其事業主管法規核准之事業計畫辦理；(三)除建築物及必要附屬設施外，停車空間及空地地面以綠化及可透水性材質為主；(四)不得影響附近農業生產環境。受理申請機關＝體育局（附表三十四(三)）。
適用辦理方式: 容許使用（都市計畫保護區、農業區）
觸發條件: 臺南市都市計畫農業區申請設置戶外球類運動場及運動訓練設施（保護區另依附表一第十二項臨時性遊憩，條件不同）
回答型態: 6實質計算
資料來源／判斷依據: 臨路評估成果（道路寬度與臨接面寬，道路依第四點定義）
進綜理表: 是
評估事項: 臨路情形
○△╳判定邏輯(初擬): ○:面臨≥12m道路且臨接面寬≥12m／△:道路或面寬待確認，或以私設通路連接（寬度須≥12m並附通行權利證明）／╳:道路或面寬<12m且無法改善
因應手段: 取得私設通路通行權利證明；調整基地臨接面寬
手段法源: GL000316 第四點第一項第四款
手段門檻: 道路12m；面寬12m
時程約束: 送件前
完成後可升級為○: 可
核對狀態: 已核對(臺南市法規資料庫 GL000316 115.08.31 版本文及附表一至三，2026-11-12 知識庫拆條；71層 臺南市都市計畫保護區農業區土地使用審查要點-重點)
覆寫/從屬總編規則: —
