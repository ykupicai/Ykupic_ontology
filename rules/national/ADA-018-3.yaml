rule_id: ADA-018-3
法規: 農業發展條例
法規代碼: M0020001
現行版本: （現行）
編: null
條號: 18-III
條文要旨: 本條例89年1月4日修正施行前取得農業用地，且無自用農舍而需興建者，得依相關土地使用管制及建築法令規定申請興建農舍（不適用 FARM-002 之0.25公頃與取得／戶籍滿二年門檻；但依農舍辦法§3 申請人【仍須為農民】並符合§2Ⅰ④無自用農舍、⑤所有權人且確供農業使用）；89.01.04前共有、其後分割為單獨所有者亦同。
適用辦理方式: 容許使用（興建農舍）
觸發條件: 單筆面積不足0.25公頃
回答型態: 是否
資料來源／判斷依據: ★登記謄本所有權部之取得日期（地籍資料的「登記日期」常為地籍圖重測，不是取得日）
進綜理表: 是
評估事項: 興建農舍
○△╳判定邏輯(初擬): ○:謄本確認89.01.04前取得且無自用農舍／△:取得日未確認／╳:其後取得
因應手段: 調閱土地登記謄本
手段法源: —
手段門檻: —
時程約束: —
完成後可升級為○: 是
核對狀態: 已核對(2026-10-02～03 官方原文逐條核對（彌陀安港段587案）)
覆寫/從屬總編規則: FARM-002 之例外
