rule_id: AGF-000
法規: 申請農業用地作農業設施容許使用審查辦法
法規代碼: M0020022
現行版本: （M0020022，農業部）
編: —
條號: （待補）
條文要旨: 漁電／農電容許使用法源：綠能設施三型態—屋頂型(§28)／地面型結合農業(§29、§29-1)／地面型免結合農業(§30，限嚴重地層下陷不利農業經營區、污染控制整治場址、盜濫採土石坑洞善後區)；農業設施總面積≤土地面積40%(§7)、免結合農業之綠能≤70%(§30Ⅴ)；§29-1 養殖事實須通過產銷履歷驗證或配置監控設備上傳資料
適用辦理方式: 容許使用
觸發條件: 走漁電／農電容許使用路線
回答型態: 6實質計算
資料來源／判斷依據: 養殖用地面積＋既存航照證明
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:落於中央公告漁業結合綠能區位且覆蓋率符40%/70%上限／△:須先取得中央核准農業經營結合綠能專案計畫或補養殖事實驗證／╳:非屬§29/§30所列區位
因應手段: 擬具農業經營結合綠能專案計畫送中央核准(§29Ⅱ)；辦理產銷履歷驗證或裝設監控設備(§29-1)
手段法源: 農業設施容許辦法§27~§30、§29-1
手段門檻: 覆蓋率40%（免結合農業70%）
時程約束: 綠能設施6個月內向能源主管機關申請同意備案(§32)
完成後可升級為○: 可
核對狀態: 已核對(衍古71層「申請農業用地作農業設施容許使用審查辦法-重點」)
覆寫/從屬總編規則: —
