rule_id: AGF-FN01
法規: 申請農業用地作農業設施容許使用審查辦法－解釋函
法規代碼: 農糧字第1021046207號
現行版本: 103.01.09 行政院農業委員會函（現農業部；自即日生效）
編: —
條號: 說明二
條文要旨: 就審查辦法§13附表一所定【農機具設施、農產運銷加工設施、農事操作及管理設施】3類農作產銷設施，坐落特定農業區農牧用地之審認原則：(一)經營計畫除依§12應敘明事項外，應另敘明無可避免使用特定農業區農牧用地之理由，由受理審查單位審認合理性；(二)在不影響生產經營環境下，設施坐落位置符合下列【之一】：1.毗連建築用地或其他使用分區土地；2.毗連既有建築物或農業設施；3.毗連道路或配置於坐落土地邊緣；4.合併申請多項設施經集中規劃配置；(三)已取得容許使用同意書之既有農業設施，申請擴建同一許可使用細目之設施者，免再審。
適用辦理方式: 容許使用
觸發條件: 農機具設施、農產運銷加工設施或農事操作及管理設施坐落特定農業區農牧用地
回答型態: 3遵照辦理
資料來源／判斷依據: 本函把 AGF-004 第3款的抽象要求落成兩個可操作的配置條件：設施位置要嘛毗連道路、要嘛靠土地邊緣，不得置於農地中央
進綜理表: 是
評估事項: 規劃配置
○△╳判定邏輯(初擬): ○:配置符合四款之一（毗連建築用地／他分區、毗連既有建物或農業設施、毗連道路或土地邊緣、多項設施集中規劃），或屬既有設施同細目擴建／△:配置未定，或四款皆未符須調整配置；無可避免使用之理由待審認
因應手段: 調整設施配置至毗連建築用地、既有建物、道路或土地邊緣，或多項設施集中規劃；經營計畫敘明無可避免使用特定農業區農牧用地之理由
手段法源: 農糧字第1021046207號函
手段門檻: —
時程約束: 經營計畫擬定前
完成後可升級為○: 可
核對狀態: 已核對(農業部農村發展及水土保持署 rmis.ardswc.gov.tw 解釋函原文 NewsDetail id=5522，使用者 2026-11-12 提供；原規則只列第3款，已補全四款擇一)
覆寫/從屬總編規則: 從屬 AGF-004
