rule_id: AGR-001
法規: 農業主管機關同意農業用地變更使用審查作業要點
法規代碼: FL014304
現行版本: 111.03.17 農企字第1110012296號令
編: —
條號: 第一點
條文要旨: 立法目的：為執行農業發展條例第十條「農業用地於劃定或變更為非農業使用時，應徵得主管機關同意」之規定，據以辦理同意農業用地變更使用審查作業，特訂定本要點
適用辦理方式: 容許使用／變更編定／開發許可／都計變更
觸發條件: —（母法授權依據）
回答型態: 1敬略
資料來源／判斷依據: 規則（母法連結：農業發展條例§10）
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): —（不單獨判定）
因應手段: —
手段法源: 農業發展條例第十條
手段門檻: —
時程約束: —
完成後可升級為○: —
核對狀態: 已核對(農業部 law.moa FL014304 原文逐點抄錄，2026-07-29；第一~十一點全部留有紀錄，逐點掃完可驗證)
