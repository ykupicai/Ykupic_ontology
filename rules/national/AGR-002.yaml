rule_id: AGR-002
法規: 農業主管機關同意農業用地變更使用審查作業要點
法規代碼: FL014304
現行版本: 111.03.17 農企字第1110012296號令
編: —
條號: 第二點
條文要旨: 應徵得農業主管機關同意之四種情形：(一)非都市土地特定農業區、一般農業區變更為其他分區；(二)非都市土地農牧/養殖/水利/林業/生態保護/國土保安用地變更為其他類別；★(三)【都市計畫農業區、保護區農業用地劃定或變更為非農業使用】；★(四)依非都市土地使用管制規則作【非農業使用性質之容許使用或臨時使用】
適用辦理方式: 容許使用／變更編定／開發許可／都計變更
觸發條件: 基地含農業用地且擬作非農業使用（含容許使用）
回答型態: 3遵照辦理
資料來源／判斷依據: ②join 的 使分/使類 ＋ 都市計畫分區
進綜理表: 是
評估事項: 農業用地變更
○△╳判定邏輯(初擬): ○:屬第二點所列情形、依程序申請同意即可／△:須先取得目的事業評估意見或涉第五~七點限制／╳:落入第六點(特農區)或第七點(養殖漁業生產區)且不符例外
因應手段: 擬具農業用地變更使用說明書（第三點九項）送農業主管機關；都市土地由縣市農業局受理
手段法源: 本要點第二點、第三點
手段門檻: —
時程約束: 目的事業許可前
完成後可升級為○: 可
核對狀態: 已核對(農業部 law.moa FL014304 原文逐點抄錄，2026-07-29；第一~十一點全部留有紀錄，逐點掃完可驗證)
覆寫/從屬總編規則: —
