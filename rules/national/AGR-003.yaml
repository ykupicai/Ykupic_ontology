rule_id: AGR-003
法規: 農業主管機關同意農業用地變更使用審查作業要點
法規代碼: FL014304
現行版本: 111.03.17 農企字第1110012296號令
編: —
條號: 第三點
條文要旨: 申請者應擬具【農業用地變更使用說明書】，載明九項事項：使用現況、分區編定面積、灌排水系統、隔離綠帶、農業環境影響、聯外道路、因應設施、★【土地使用區位面積之必要性、合理性及無可替代性】等
適用辦理方式: 容許使用／變更編定／開發許可／都計變更
觸發條件: 已確認須依第二點徵得同意者
回答型態: 3遵照辦理
資料來源／判斷依據: 規則（文件清單）
進綜理表: 是
評估事項: 農業用地變更
○△╳判定邏輯(初擬): ○:九項均可具備／△:區位必要性與無可替代性須另作論述、待審查認定
因應手段: 製作說明書；區位必要性一節須說明為何非本基地不可（審查最常被挑的一項）
手段法源: 本要點第三點
手段門檻: —
時程約束: 送件前
完成後可升級為○: 可
核對狀態: 已核對(農業部 law.moa FL014304 原文逐點抄錄，2026-07-29；第一~十一點全部留有紀錄，逐點掃完可驗證)
覆寫/從屬總編規則: AGR-002
