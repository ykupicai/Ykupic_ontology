rule_id: AGR-005
法規: 農業主管機關同意農業用地變更使用審查作業要點
法規代碼: FL014304
現行版本: 111.03.17 農企字第1110012296號令
編: —
條號: 第五點
條文要旨: ★不同意變更使用之七款：(一)未依規定規劃設置隔離綠帶或設施；(二)使用具農業灌溉功能之系統作廢污水排放或妨礙上下游農業灌排水系統輸水能力；(三)申請範圍內夾雜未申請變更之農業用地且妨礙農業經營；(四)妨礙原有區域性農路通行；(五)辦理部分土地分割致坵塊零碎不利農業經營(線狀公共建設除外)；(六)目的事業主管機關未提評估意見或未表支持意見；(七)其他依本要點規定不得同意變更使用之情形
適用辦理方式: 容許使用／變更編定／開發許可／都計變更
觸發條件: 基地屬農業用地且擬作非農業使用
回答型態: 6實質計算
資料來源／判斷依據: 緩衝綠帶成果＋灌排系統圖＋農路圖＋②join 夾雜地判讀
進綜理表: 是
評估事項: 農業用地變更
○△╳判定邏輯(初擬): ★逐款比對並寫下結果：全部不觸及→○／可改設計避開者→△／無法避開者→╳。特別注意(三)夾雜未申請變更之農業用地、(五)分割致坵塊零碎——多宗基地案常觸及
因應手段: (一)依第九~十一點劃設隔離綠帶；(二)另設排水不接農灌系統；(三)一併申請或調整範圍界線；(四)保留農路或另闢替代通行；(五)避免細碎分割；(六)先取得目的事業主管機關支持意見
手段法源: 本要點第五點各款＋第九~十一點
手段門檻: 隔離綠帶最小1.5公尺（第九點）
時程約束: 同意變更前
完成後可升級為○: 可
核對狀態: 已核對(農業部 law.moa FL014304 原文逐點抄錄，2026-07-29；第一~十一點全部留有紀錄，逐點掃完可驗證)
覆寫/從屬總編規則: —
