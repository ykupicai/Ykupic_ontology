rule_id: AGR-006
法規: 農業主管機關同意農業用地變更使用審查作業要點
法規代碼: FL014304
現行版本: 111.03.17 農企字第1110012296號令
編: —
條號: 第六點
條文要旨: ★【非都市土地特定農業區之農業用地，不同意變更使用】。但符合下列情形之一，且無第五點各款情形之一者，得申請變更使用：(一)國防或防止災害之所需用地；(二)經行政院核定之計畫或公共建設之所需用地；(三)依土地徵收條例規定得辦理徵收事業之所需用地；(四)【政府機關興辦】之公共建設設施或提供公眾使用設施之所需用地；(五)符合非都市土地使用管制規則規定，為自然地形或合法建築用地包圍、夾雜之零星農業用地；(六)供公眾通行且具有公用地役關係之既成道路，或公立公墓更新計畫之所需用地；(七)經中央農業主管機關核准或輔導之產、製、儲、銷等農業相關設施之所需用地。
適用辦理方式: 變更編定／開發許可
觸發條件: 基地位於【非都市土地特定農業區】之農業用地
回答型態: 1敬略（非特農區時）／6實質計算（特農區時）
資料來源／判斷依據: ②join 的 使分＝特定農業區
進綜理表: 是
評估事項: 農業用地變更
○△╳判定邏輯(初擬): 非特農區→「－」／特農區且符合七款之一→△／★特農區但該用途有行政院核定之輔導計畫或專案計畫（但書第2款）→△／特農區且不符任一款且無上位計畫→╳。★私人興辦社福／長照：不符第4款（限政府機關興辦），預設╳；主張屬行政院核定計畫（如長照2.0）所需用地須取得主管機關書面意見才可改判△（2026-10-19 湖口案，查無前例）
因應手段: ①先查該用途有無行政院核定之輔導計畫／專案計畫（但書第2款活門）②確認無第五點各款情形（尤其§5②農業灌排）③均無者才考慮調整基地範圍避開特農區
手段法源: 本要點第六點但書；已知案例：特定工廠＝行政院110.09.14院臺經字第1100181578號核定「特定工廠申請利用非都市土地特定農業區用地變更輔導計畫」（實施至民國129.03.19）
手段門檻: —
時程約束: 同意變更前
完成後可升級為○: —
核對狀態: 已核對(農業部 law.moa FL014304 原文逐點抄錄，2026-07-29)；2026-07-30 補正但書第2款；2026-10-19 七款全文自 law.moa.gov.tw 下載重新抄錄（湖口成功段長照案）
覆寫/從屬總編規則: —
