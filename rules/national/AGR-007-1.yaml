rule_id: AGR-007-1
法規: 農業主管機關同意農業用地變更使用審查作業要點
法規代碼: FL014304
現行版本: 111.03.17 農企字第1110012296號令
編: —
條號: 第七點之一
條文要旨: 非都市土地【農牧用地、林業用地、養殖用地】及【都市計畫農業區、保護區】之農業用地變更作【太陽光電設施】使用，變更使用面積【未達2公頃】者，不同意變更使用。但無第五點各款情形且符合下列之一者得申請：(一)為自然地形或其他非農業用地所包圍、夾雜之零星農業用地；(二)屬109.07.31前經台電核准再生能源發電設備併聯審查意見書，或行政院核定「109年太陽光電6.5GW達標計畫」列管有案之太陽光電專案推動區域。
適用辦理方式: 變更編定
觸發條件: 非都市土地農牧、林業、養殖用地或都市計畫農業區、保護區之農業用地變更作太陽光電設施
回答型態: 6實質計算
資料來源／判斷依據: 申請變更面積；使用地類別；周邊使用地（零星夾雜認定）；台電併聯審查意見書
進綜理表: 是
評估事項: 農業用地變更
○△╳判定邏輯(初擬): ○:變更面積≥2公頃，或非太陽光電設施（獨立儲能依 REN-3 分列定義）／△:未達2公頃但主張零星夾雜或專案推動區域待認定／╳:未達2公頃且無但書適用
因應手段: 擴大申請面積至2公頃以上；舉證零星夾雜
手段法源: —
手段門檻: 2公頃
時程約束: 接案初期
完成後可升級為○: 可
核對狀態: 已核對(農業部 law.moa.gov.tw FL014304 111.03.17 版第七點之一，2026-11-12 知識庫拆條；71層 農業用地變更使用審查作業要點-重點)
覆寫/從屬總編規則: AGR-005 第五點不同意情形優先檢核
