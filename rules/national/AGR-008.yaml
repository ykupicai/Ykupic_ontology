rule_id: AGR-008
法規: 農業主管機關同意農業用地變更使用審查作業要點
法規代碼: FL014304
現行版本: 111.03.17 農企字第1110012296號令
編: —
條號: 第八點
條文要旨: ★【都市計畫農業區、保護區農業用地，除直轄市或縣（市）主管機關另定有限制條件外，應依本要點規定辦理】——都市土地案件適用本要點之直接依據
適用辦理方式: 容許使用／變更編定／開發許可／都計變更
觸發條件: 基地為【都市計畫】農業區或保護區之農業用地
回答型態: 5交互參照
資料來源／判斷依據: 都市計畫分區圖套疊（zone＝農業區/保護區）
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): —（本點為適用依據，不單獨判定）
因應手段: 都市土地案件一律併同適用本要點第二點至第十一點；另查該縣市是否另訂限制條件
手段法源: 本要點第八點
手段門檻: —
時程約束: —
完成後可升級為○: —
核對狀態: 已核對(農業部 law.moa FL014304 原文逐點抄錄，2026-07-29；第一~十一點全部留有紀錄，逐點掃完可驗證)
覆寫/從屬總編規則: AGR-002
