rule_id: AGR-013
法規: 農業主管機關同意農業用地變更使用審查作業要點
法規代碼: FL014304
現行版本: 111.03.17 農企字第1110012296號令
編: —
條號: 第十三點
條文要旨: 非都市土地農業用地變更案件之農業主管機關審查層級：(一)達應送區域計畫擬定機關審議規模、屬【中央區委會審議】者，由中央目的事業主管機關徵詢【中央農業主管機關】審查同意（中央目的事業主管機關已授權縣市審查者，僅就產業政策合理性、必要性提供評估或表達支持與否）；(二)屬【委辦縣市代為許可審議】者，由目的事業主管機關徵詢【縣市農業主管機關】審查同意；但【109年8月1日後受理之太陽光電設施開發案件】，應經縣市農業主管機關徵詢【中央農業主管機關】審查同意。未達審議規模者，依管制規則及變更編定執行要點徵詢縣市農業主管機關審查同意。經行政院核定之專案另有審查程序者，依其規定。
適用辦理方式: 變更編定／開發許可
觸發條件: 非都市土地農業用地變更使用案件，需判斷由哪一級農業主管機關審查同意
回答型態: 3遵照辦理
資料來源／判斷依據: 申請面積是否達區域計畫審議規模；審議機關（中央或委辦縣市）；用途是否為太陽光電、受理日期
進綜理表: 否
評估事項: 農業用地變更
○△╳判定邏輯(初擬): 程序分流，不判○△╳：未達審議規模→縣市農業主管機關；委辦縣市審議→縣市（太陽光電且109.08.01後受理→中央）；中央區委會審議→中央
因應手段: —
手段法源: —
手段門檻: 區域計畫審議規模；109.08.01
時程約束: 排程時計入中央審查期程
完成後可升級為○: —
核對狀態: 已核對(農業部 law.moa.gov.tw FL014304 111.03.17 版第十三點，2026-11-12 知識庫拆條；71層 農業用地變更使用審查作業要點-重點)
覆寫/從屬總編規則: 與 AGR-002（應徵得同意情形）、AGR-014（免依本要點審查）併用
