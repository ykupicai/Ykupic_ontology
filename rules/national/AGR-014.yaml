rule_id: AGR-014
法規: 農業主管機關同意農業用地變更使用審查作業要點
法規代碼: FL014304
現行版本: 111.03.17
編: null
條號: 十四
條文要旨: 下列情形由目的事業主管機關逕依相關作業規定徵詢直轄市、縣（市）農業主管機關審核同意，【免再依本要點審查規定辦理】：①國家公園區、鄉村區、工業區、風景區或河川區範圍內之農業用地變更 ②符合管制規則規定，為自然地形或合法建築用地包圍、夾雜之零星農業用地變更 ③既成道路變更為交通用地 ④公立公墓更新計畫變更為墳墓用地。
適用辦理方式: 變更編定
觸發條件: 符合 LUR-035／035-1 之零星農業用地，或位於鄉村區等分區
回答型態: 是否
資料來源／判斷依據: 使分欄＋LUR-035／035-1 判定結果
進綜理表: 否
評估事項: 農業主管機關同意
○△╳判定邏輯(初擬): —（程序簡化，非禁止事由）
因應手段: 仍須經農業主管機關審核同意（管制規則§30Ⅶ），但免擬農業用地變更使用說明書、免套§9～§11 隔離綠帶
手段法源: 本點＋管制規則§30Ⅶ
手段門檻: —
時程約束: —
完成後可升級為○: 是
核對狀態: 已核對(2026-10-02～03 官方原文逐條核對（彌陀安港段587案）)
覆寫/從屬總編規則: 覆寫 AGR-010（隔離綠帶）於零星土地情形
