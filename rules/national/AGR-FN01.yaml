rule_id: AGR-FN01
法規: 農業用地變更使用審查作業要點－解釋函
法規代碼: 農企字第1080013640號
現行版本: 108.12.17
編: —
條號: 解釋函
條文要旨: ★「非都市土地農業用地變更作太陽光電設施使用，達應送區域計畫擬定機關審議規模之案件…僅需依作業規範第40點規定，設置不得小於10公尺之緩衝綠帶」「…毋須再受其配置面積不得少於申請事業面積之30%之限制」。輔導方案＝105.10.27行政院核定經濟部所報「太陽光電二年推動計畫」
適用辦理方式: 開發許可
觸發條件: ★限「達應送區域計畫擬定機關審議規模」之農地光電案；未達規模僅辦變更編定者本函未涵蓋，須個案函詢
回答型態: 5交互參照
資料來源／判斷依據: 規則（AGR-010 之適用依據）
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): —
因應手段: 以本函釋主張免受30%面積比限制
手段法源: 審查作業要點第十點(五)
手段門檻: 10公尺
時程約束: 送件前備附函釋
完成後可升級為○: —
核對狀態: 已核對(農水署rmis.ardswc.gov.tw id=5596 逐字抄錄)
覆寫/從屬總編規則: AGR-010
