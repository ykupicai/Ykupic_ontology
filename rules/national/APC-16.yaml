rule_id: APC-16
法規: 空氣污染防制法
法規代碼: O0020001
現行版本: 107.08.01 修正（環境部）
編: —
條號: §16
條文要旨: 各級主管機關得對排放空氣污染物之固定污染源及移動污染源徵收【空氣污染防制費】；固定污染源依排放種類及數量向所有人（或實際使用人、管理人；營建工程向業主）徵收。
適用辦理方式: 全路線
觸發條件: 工廠製程具排放空氣污染物之固定污染源
回答型態: 3遵照辦理
資料來源／判斷依據: 製程排放（如揮發性有機物）
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): 營運義務，不判○△╳
因應手段: —
手段法源: —
手段門檻: —
時程約束: 營運
完成後可升級為○: —
核對狀態: 已核對(全國法規資料庫 O0020001 §16、§24，2026-11-12 知識庫拆條；71層 空氣污染防制法-固定污染源-重點)
覆寫/從屬總編規則: —
