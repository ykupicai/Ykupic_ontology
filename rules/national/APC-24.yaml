rule_id: APC-24
法規: 空氣污染防制法
法規代碼: O0020001
現行版本: 107.08.01 修正（環境部）
編: —
條號: §24
條文要旨: 公私場所具中央主管機關【指定公告之固定污染源】，應於設置或變更前檢具空氣污染防制計畫，申請取得【設置許可證】；設置或變更後檢具證明申請取得【操作許可證】並依許可內容操作。許可證核發前主管機關應將申請資料登載於公開網站供民眾表示意見。
適用辦理方式: 全路線
觸發條件: 工廠製程具排放空氣污染物之固定污染源
回答型態: 3遵照辦理
資料來源／判斷依據: 製程設備是否屬公告固定污染源
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): 後續許可，不判○△╳；製程涉公告固定污染源者排入設置、操作許可時程
因應手段: —
手段法源: —
手段門檻: —
時程約束: 設置或變更前
完成後可升級為○: —
核對狀態: 已核對(全國法規資料庫 O0020001 §16、§24，2026-11-12 知識庫拆條；71層 空氣污染防制法-固定污染源-重點)
覆寫/從屬總編規則: —
