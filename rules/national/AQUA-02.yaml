rule_id: AQUA-02
法規: 農業部養殖漁業經營結合綠能設施專案計畫審查作業要點
法規代碼: GL001009
現行版本: 112.10.02 農授漁字第1121348165號令
編: —
條號: 2（另涉3、4、5）
條文要旨: ★法源＝容許辦法§29Ⅱ。【第二點】縣市政府擬具專案計畫時應確保養殖漁業與綠能相互結合共同發展，並由縣市能源主管機關【完成環境及社會檢核議題辨認且評估具可行性】；專案計畫推動範圍內之【農業用地面積達10公頃以上，且養殖魚塭面積占60%以上者，優先推動】。【第三點】得提專案計畫建議書者限【養殖漁民、養殖漁民團體或營業項目登記有水產養殖業之業者】，應備建議推動範圍圖（以明顯道路/通路/進排渠道/重要地標為界）、土地清冊、養殖經營模式結合可行性、設施空間配置圖等。【第四點】縣市政府應召開專案計畫評估會議審查區位範圍、產業可行性評估、設施空間配置。【第五點】評估可推動者檢附評估表函送農業部審查
適用辦理方式: 容許使用（漁電專案計畫）
觸發條件: 走地面型（室外型）漁電共生：容許辦法§29 要求須位於政府推動之農業結合綠能專案計畫範圍內
回答型態: 6實質計算
資料來源／判斷依據: 農業部已公告專區範圍＋基地面積＋現況魚塭面積占比（正射影像／國土利用調查判讀）
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:基地已位於農業部公告之專區計畫範圍內且符合計畫措施／△:未位於已公告專區，但農地≥10公頃且魚塭占≥60%符優先推動條件，可自提建議書（須經縣市評估會議→環社檢核→報部審查→公告，時程長）／╳:魚塭占比過低而難符優先推動、或申請人不具第三點資格、或現況須大規模開挖魚塭（另觸容許辦法§27點狀基樁不得改變原地形地貌）
因應手段: 向縣市農業局自提專區計畫建議書；辦理環境與社會檢核議題辨認報告；召開專案計畫評估會議；報部審查
手段法源: 本要點第三點、第四點、第五點
手段門檻: 農地10公頃／魚塭占60%（優先推動條件）
時程約束: ★專區計畫須經農業部公告後方能申請室外型漁電；前置期間須計入排程
完成後可升級為○: 可
核對狀態: 已核對(農業部law.moa GL001009官方頁面全5點逐點)
