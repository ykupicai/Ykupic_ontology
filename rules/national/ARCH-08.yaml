rule_id: ARCH-08
法規: 考古遺址監管保護辦法
法規代碼: H0170056
現行版本: 106.06.28
編: —
條號: '8'
條文要旨: 營建工程或其他開發行為，其空間範圍涵蓋【經列冊之考古遺址】者，開發單位應先邀請考古學者專家，進行考古遺址價值及內涵調查評估，並將其結果報主管機關處理
適用辦理方式: 全路線
觸發條件: 基地涵蓋列冊考古遺址
回答型態: 2不適用／3遵照辦理
資料來源／判斷依據: 文化資產圖層套疊
進綜理表: 是
評估事項: 生態文資
○△╳判定邏輯(初擬): ○:未涵蓋列冊考古遺址／△:涵蓋，須先邀考古學者專家調查評估並報主管機關（結果未定）／╳:—
因應手段: 邀請考古學者專家辦理考古遺址價值及內涵調查評估並報主管機關
手段法源: 考古遺址監管保護辦法§8
手段門檻: —
時程約束: ★開發行為前（先調查後開發）
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫逐條抄錄)；2026-11-12 知識庫回官方原文重讀相符（71層 考古遺址監管保護辦法-重點）
覆寫/從屬總編規則: —
