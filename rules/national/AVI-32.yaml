rule_id: AVI-32
法規: 民用航空法
法規代碼: K0090001
現行版本: 112.06.28 修正（交通部民用航空局）
編: —
條號: §32
條文要旨: 為維護飛航安全，民航局對航空站、飛行場及助航設備四周之建築物、其他障礙物之【高度】或燈光照射角度，得劃定【禁止或限制之一定範圍】，報交通部會商內政部等核定後由直轄市、縣（市）政府公告。但經評估不影響飛航安全，並經【行政院專案核准】者不在此限。範圍、高度與專案核准程序之管理辦法由交通部會同內政部、國防部定之。
適用辦理方式: 全路線
觸發條件: 基地位於航空站、飛行場或助航設備四周之禁止或限制建築範圍（高度管制範圍）
回答型態: 6實質計算
資料來源／判斷依據: 環敏套疊（民用航空法之禁止或限制建築地區或高度管制範圍，第二級環境敏感地區）；各航空站公告高度限制圖
進綜理表: 是
評估事項: 環境敏感
○△╳判定邏輯(初擬): ○:未位於禁限建範圍／△:位於限制範圍，建築高度須符合公告限制並向民航局查詢；機場非屬高度管理辦法（K0090016）列名八座者，發函詢問民航局及機場管理機關（含國防部）確認依據／╳:規劃高度超過公告限制且無專案核准
因應手段: 調降建築高度；向民航局查詢或申請專案核准
手段法源: 民用航空法§32Ⅰ但書
手段門檻: —
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫 K0090001 §32～§34，2026-11-12 知識庫拆條；71層 民用航空法-禁限建-重點)
覆寫/從屬總編規則: —
