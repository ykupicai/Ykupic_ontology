rule_id: AVI-33-1
法規: 民用航空法
法規代碼: K0090001
現行版本: 112.06.28 修正（交通部民用航空局）
編: —
條號: §33-1
條文要旨: 建築物或其他設施【超過一定高度】者，物主應裝置障礙燈、標誌並保持正常使用；低於一定高度而經民航局評估影響飛航安全者亦同。標準由交通部會同內政部定之。
適用辦理方式: 全路線
觸發條件: 基地位於航空站、飛行場或助航設備四周之禁止或限制建築範圍（高度管制範圍）
回答型態: 3遵照辦理
資料來源／判斷依據: 建築高度
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): 設計義務，不判○△╳
因應手段: —
手段法源: —
手段門檻: —
時程約束: 設計階段
完成後可升級為○: —
