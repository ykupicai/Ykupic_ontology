rule_id: AVI-33
法規: 民用航空法
法規代碼: K0090001
現行版本: 112.06.28 修正（交通部民用航空局）
編: —
條號: §33
條文要旨: 違反§32 禁止或限制規定者，民航局得會同有關機關通知物主限期改善或拆遷；經專案核准者，物主應負責裝置障礙燈、標誌。公告時已存在者，拆遷或裝設由航空站或飛行場經營人補償；未拆遷者強制拆除。
適用辦理方式: 全路線
觸發條件: 基地位於航空站、飛行場或助航設備四周之禁止或限制建築範圍（高度管制範圍）
回答型態: 3遵照辦理
資料來源／判斷依據: —
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): 風險揭露，不判○△╳
