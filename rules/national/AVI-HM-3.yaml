rule_id: AVI-HM-3
法規: 航空站飛行場助航設備四周禁止限制建築物及其他障礙物高度管理辦法
法規代碼: K0090016
現行版本: 115.02.24 修正（交通部會同內政部、國防部；法源＝民用航空法§32Ⅱ）
編: —
條號: §3、§5、§7①
條文要旨: 【禁止建築地區】：航空站起落地帶（跑道全長加兩端各延伸60公尺，寬自跑道中心線兩側各150公尺；恆春75公尺、蘭嶼綠島40公尺），及儀器降落系統定位臺、滑降臺之指定範圍。禁止建築地區除飛航安全所必需之設施外，不得有任何建築物及其他障礙物。列名航空站：桃園、臺北、金門、臺東、高雄、恆春、蘭嶼、綠島。
適用辦理方式: 全路線
觸發條件: 基地位於列名航空站起落地帶或儀器降落系統範圍
回答型態: 6實質計算
資料來源／判斷依據: 民航局繪製並經縣市公告之禁止建築地區平面圖
進綜理表: 是
評估事項: 環境敏感
○△╳判定邏輯(初擬): ○:未位於禁止建築地區／╳:位於禁止建築地區（非飛航安全必需設施）
因應手段: 剔除涉及範圍
手段法源: —
手段門檻: 跑道兩側150公尺、兩端60公尺
時程約束: 接案初期
完成後可升級為○: —
核對狀態: 已核對(全國法規資料庫 K0090016 全文，2026-11-12 知識庫拆條；71層 民用航空法-禁限建-重點)
覆寫/從屬總編規則: AVI-32 之授權子法；僅適用§3、§4 列名之航空站，軍民合用機場未列入者另查
