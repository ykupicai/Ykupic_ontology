rule_id: AVI-HM-4
法規: 航空站飛行場助航設備四周禁止限制建築物及其他障礙物高度管理辦法
法規代碼: K0090016
現行版本: 115.02.24 修正（交通部會同內政部、國防部；法源＝民用航空法§32Ⅱ）
編: —
條號: §4、§5、§7②、§8
條文要旨: 【限制建築地區】：列名航空站之進場面（距跑道端60公尺起，至3,060公尺高距比1:50，其後至15,060公尺1:40，各站長度坡度另定）、水平面（如高雄：跑道南側3,000／5,000／7,500／10,000公尺半徑四層，距機場標高60／90／120／150公尺；臺北南側內層60／90公尺、外層145／600公尺；桃園、金門、臺東45公尺）、轉接面（1:7）、圓錐面（向外2,000公尺、1:20），及多向導航臺300公尺、機場搜索雷達350公尺、助航燈光30公尺範圍。限制建築地區內建築物及障礙物高度不得超過上開標準；超高之公共建設須經行政院審核、民航局臨時審查會審查並報行政院核定。軍民合用航空站自移交民航局管理時起始依本辦法（§9）。
適用辦理方式: 全路線
觸發條件: 基地位於列名航空站之限制建築地區（高度管制範圍）
回答型態: 6實質計算
資料來源／判斷依據: 民航局公告高度限制圖；基地與跑道端距離、機場標高；規劃建築高度
進綜理表: 是
評估事項: 環境敏感
○△╳判定邏輯(初擬): ○:未位於限制建築地區，或規劃高度低於該處限制高度／△:位於列名航空站限制範圍，須依公告圖計算容許高度並向民航局查詢；★機場非屬本辦法列名八座（桃園、臺北、高雄、金門、臺東、恆春、蘭嶼、綠島），如臺南、嘉義、臺中等軍民合用機場，一律判△並【發函詢問】民航局及機場管理機關（含國防部）確認高度管制依據與容許高度／╳:規劃高度超過容許高度且非公共建設
因應手段: 調降建築高度；列名機場向民航局查詢容許高度；非列名機場發函詢問民航局及機場管理機關（含國防部）
手段法源: §8（公共建設例外）
手段門檻: 依各航空站進場面、水平面、轉接面、圓錐面計算
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫 K0090016 全文，2026-11-12 知識庫拆條；71層 民用航空法-禁限建-重點)
覆寫/從屬總編規則: AVI-32 之授權子法；僅適用§3、§4 列名之航空站，軍民合用機場未列入者另查
