rule_id: BLD-FN-1110802400
法規: 內政部函釋（儲能系統免請領雜項執照）
法規代碼: 內授營建管字第1110802400號
現行版本: 111.02.17 內政部函（援引107.08.15 內授營建管字第1070813588號函）
編: —
條號: 函釋說明二
條文要旨: 依內政部107.08.15內授營建管字第1070813588號函，儲能設備非屬建築法所稱雜項工作物適用範圍；儲能系統（依用戶用電設備裝置規則§396-65第4款，含整套型儲能貨櫃或儲能單元、套件型、其他型）符合定義者，【尚無建築法之適用，無須請領雜項執照，亦無須檢討建蔽率及容積率】。
適用辦理方式: 全路線
觸發條件: 設置儲能系統（儲能貨櫃、儲能單元等）
回答型態: 3遵照辦理
資料來源／判斷依據: 儲能系統型式（是否符合用戶用電設備裝置規則§396-65定義）
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): ○:儲能系統符合定義，免雜照、免檢討建蔽容積／△:另有管理室、圍籬等構造物，仍依建築法辦理／╳:—
因應手段: —
手段法源: —
手段門檻: —
時程約束: —
完成後可升級為○: —
核對狀態: 已核對(國土管理署網站函釋 interpcomp/13783 頁面截圖，使用者 2026-11-12 提供，存 _佐證；71層 再生能源發展條例與電業法-儲能-重點)
覆寫/從屬總編規則: 儲能案改引本函；營建署109.02.03營署建管字第1090002450號函係針對屋外型開關設備（升壓站）
