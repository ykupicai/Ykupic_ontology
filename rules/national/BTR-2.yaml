rule_id: BTR-2
法規: 建築技術規則建築設計施工編
法規代碼: D0070115
現行版本: 115.02.23 修正（內政部）
編: —
條號: §2
條文要旨: 基地應與【建築線相連接】，連接部分最小長度應在【2公尺以上】。基地內私設通路寬度：長度未滿10公尺者2公尺；10～未滿20公尺者3公尺；大於20公尺者5公尺；以私設通路進出之建築物總樓地板面積合計1,000㎡以上者6公尺。私設通路得穿越同一基地建築物地面層（深度≤15公尺、淨高≥3公尺）；通路長度自建築線量至最遠出入口。
適用辦理方式: 全路線
觸發條件: 基地申請建築（建築執照、雜項執照）
回答型態: 6實質計算
資料來源／判斷依據: 建築線指示（定）圖；臨路評估成果
進綜理表: 是
評估事項: 臨路情形
○△╳判定邏輯(初擬): ○:基地與建築線連接≥2公尺，私設通路寬度符合／△:建築線待指定或私設通路寬度須調整／╳:無法連接建築線
因應手段: 申請建築線指示；調整私設通路寬度
手段法源: —
手段門檻: 連接2公尺；通路2／3／5／6公尺
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫 D0070115 §2、§262，2026-11-12 知識庫拆條；71層 建築技術規則建築設計施工編-臨路與山坡地不得開發建築-重點)
覆寫/從屬總編規則: 非都市土地另見實施區域計畫地區建築管理辦法（RBM 系列）
