rule_id: BTR-262
法規: 建築技術規則建築設計施工編
法規代碼: D0070115
現行版本: 115.02.23 修正（內政部）
編: —
條號: §262
條文要旨: 【山坡地】有下列情形之一者【不得開發建築】（穿過性道路、通路或公共設施管溝經適當邊坡穩定處理者除外）：(一)坡度陡峭：坵塊圖均質區平均坡度超過30%（區內高低點坡度小於15%且無獨立山頭或跨主嶺線者除外）；(二)地質結構不良、地層破碎或順向坡有滑動之虞；(三)【活動斷層】：歷史最大地震規模M≧7者斷層帶二外側邊各100公尺、7>M≧6者各50公尺、M<6或無記錄者各30公尺內；(四)有危害安全之礦場或坑道；(五)廢土堆區；(六)河岸或向源侵蝕（岸高5公尺以上，依角度與地質計算範圍）；(七)洪患周期小於10年之河床兩岸低地；(八)斷崖上下各2倍崖高範圍。坡度超過55%不得計入法定空地，30～55%得作法定空地或開放空間但不得配置建築物。
適用辦理方式: 全路線（限山坡地範圍）
觸發條件: 基地位於山坡地範圍且有建築行為
回答型態: 6實質計算
資料來源／判斷依據: 山坡地範圍；坵塊圖坡度分析；活動斷層地質敏感區與斷層帶歷史地震規模；地質鑽探
進綜理表: 是
評估事項: 地形坡度
○△╳判定邏輯(初擬): ○:非山坡地，或山坡地內均無八款情形／△:涉及款次待技師調查確認範圍，或屬但書情形／╳:建築配置落入八款不得開發建築範圍（如活動斷層帶兩側30／50／100公尺內）
因應手段: 建築物配置避開不得開發建築範圍；該範圍改作開放空間、道路或管溝
手段法源: —
手段門檻: 斷層帶兩側30／50／100公尺；坡度30%、55%
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫 D0070115 §2、§262，2026-11-12 知識庫拆條；71層 建築技術規則建築設計施工編-臨路與山坡地不得開發建築-重點)
覆寫/從屬總編規則: 與 GEN-016、GEN-024、GEO-8 併用；臺南都計保護區農業區另見 TNN-UPA-6-6
