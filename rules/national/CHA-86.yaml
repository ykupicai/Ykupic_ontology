rule_id: CHA-86
法規: 文化資產保存法
法規代碼: H0170001
現行版本: 115.07.01 修正（自然地景主管機關＝農業部）
編: —
條號: §78、§81、§84、§86
條文要旨: 自然地景依性質分為【自然保留區】、地質公園（§78），由各級主管機關審查指定後公告（§81）；進入指定審議程序者為暫定自然地景，效力準用暫定古蹟（§84）。【自然保留區禁止改變或破壞其原有自然狀態】；除其他法律另有規定外，非經主管機關許可不得任意進入（§86）。
適用辦理方式: 全路線
觸發條件: 基地位於自然保留區或暫定自然地景
回答型態: 6實質計算
資料來源／判斷依據: 環敏套疊（自然保留區，第一級環境敏感地區）；暫定自然地景須函詢
進綜理表: 是
評估事項: 環境敏感
○△╳判定邏輯(初擬): ○:未涉及／△:涉及暫定自然地景或圖資邊界待確認／╳:位於自然保留區（禁止改變原有自然狀態）
因應手段: 剔除涉及範圍
手段法源: —
手段門檻: —
時程約束: 接案初期
完成後可升級為○: —
核對狀態: 已核對(全國法規資料庫 H0170001 §78、§81、§84、§86，2026-11-12 知識庫拆條；71層 文化資產保存法-自然地景-重點)
覆寫/從屬總編規則: —
