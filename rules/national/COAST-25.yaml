rule_id: COAST-25
法規: 海岸管理法
法規代碼: D0070222
現行版本: 104.02.04
編: —
條號: '25'
條文要旨: 在一級海岸保護區以外之海岸地區【特定區位】內，從事【一定規模以上】之開發利用、工程建設、建築或使用性質特殊者，申請人應檢具【海岸利用管理說明書】申請中央主管機關許可。★第2項：前項申請未經中央主管機關許可前，各目的事業主管機關【不得】為開發、工程行為之許可
適用辦理方式: 全路線
觸發條件: 位於海岸地區特定區位且達一定規模
回答型態: 2不適用／6實質計算
資料來源／判斷依據: 海岸圖層（特定區位）＋基地面積／長度／樓地板面積
進綜理表: 是
評估事項: 海岸管理
○△╳判定邏輯(初擬): ○:非位於特定區位或未達一定規模（宜函詢中央主管機關確認）／△:位於特定區位且達門檻，須擬海岸利用管理說明書並取得中央主管機關許可（結果未定）／╳:位於一級海岸保護區，或無法符合§26五款許可條件
因應手段: 擬具海岸利用管理說明書送中央主管機關許可
手段法源: 海岸管理法§25
手段門檻: 見 COASTR-03
時程約束: ★中央主管機關許可在前、目的事業主管機關許可在後（§25Ⅱ）
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫逐條抄錄)
覆寫/從屬總編規則: —
