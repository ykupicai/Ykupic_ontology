rule_id: COAST-26
法規: 海岸管理法
法規代碼: D0070222
現行版本: 104.02.04
編: —
條號: '26'
條文要旨: 許可條件五款：①符合整體海岸管理計畫利用原則 ②符合海岸保護計畫、海岸防護計畫管制事項 ③保障公共通行或具替代措施 ④對海岸生態環境衝擊採取避免或減輕之有效措施 ⑤開發使用自然海岸或填海造地時應以最小需用為原則，並於適當區位採取彌補或復育生態環境損失之措施
適用辦理方式: 全路線
觸發條件: 已觸發 COAST-25 者
回答型態: 6實質計算
資料來源／判斷依據: 海岸利用管理說明書內容
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): —
因應手段: 於說明書中逐款回應五項許可條件
手段法源: 海岸管理法§26
手段門檻: —
時程約束: 許可審查中
完成後可升級為○: —
