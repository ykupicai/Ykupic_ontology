rule_id: COASTR-03
法規: 一級海岸保護區以外特定區位利用管理辦法
法規代碼: D0070234
現行版本: 109.12.04
編: —
條號: '3'
條文要旨: ★一定規模認定基準：【面積】濱海陸地內太陽光電（僅位海岸防護區陸域緩衝區）達【5公頃】；濱海陸地其他利用達【1公頃】；近岸海域達【5公頃】。【長度】濱海陸地達1公里；近岸海域達5公里。【高度】於重要海岸景觀區內建築或設施高度超過【10.5公尺】。【樓地板面積】建築物總樓地板達【2,000平方公尺】。【自然狀態改變】面積達330平方公尺或長度達100公尺。★皆為「申請或累積」計算
適用辦理方式: 全路線
觸發條件: 基地位於特定區位
回答型態: 6實質計算
資料來源／判斷依據: 基地面積／長度／樓地板面積＋海岸防護區陸域緩衝區圖層
進綜理表: 是
評估事項: 海岸管理
○△╳判定邏輯(初擬): ○:未達任一門檻／△:達門檻須擬說明書（結果未定）／╳:—
因應手段: ★光電位於海岸防護區陸域緩衝區者門檻為5公頃（非一般1公頃），可先確認區位以判定是否觸發
手段法源: 特定區位辦法§3
手段門檻: 光電5公頃／一般1公頃／樓地板2,000㎡／高度10.5公尺
時程約束: 送件前
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫逐條抄錄)
覆寫/從屬總編規則: COAST-25
