rule_id: EIA-03-1
法規: 開發行為應實施環境影響評估細目及範圍認定標準
法規代碼: O0090012
現行版本: 115.02.05
編: —
條號: 3-I-1
條文要旨: 工廠之設立：【附表一】之工業類別，【興建或增加生產線】者，應實施環評（無面積門檻）。§3Ⅲ汰舊換新、產能及污染量未增加且單位能耗降低經目的事業主管機關同意者免環評。
適用辦理方式: 全路線
觸發條件: 新設或增加生產線之工廠，且業別屬附表一
回答型態: 2不適用／6實質計算
資料來源／判斷依據: 工廠業別對照認定標準附表一
進綜理表: 是
評估事項: 環評
○△╳判定邏輯(初擬): ○:非附表一業別／△:業別歸類待環保主管機關認定／╳:屬附表一且興建或增加生產線（須環評）
因應手段: 函請環保主管機關認定業別；符合§3Ⅲ汰舊換新者申請免環評
手段法源: 認定標準§3
手段門檻: —
時程約束: 設立許可或建造執照申請時認定（§3Ⅸ）
完成後可升級為○: 部分（認定非附表一或符合汰舊換新）
核對狀態: 已核對(全國法規資料庫 O0090012 115.02.05 版§3 逐款抄錄，2026-11-13；71層 環境影響評估法及認定標準-重點；附表一～四未逐列核對)
覆寫/從屬總編規則: —
