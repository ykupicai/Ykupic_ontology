rule_id: EIA-03-2
法規: 開發行為應實施環境影響評估細目及範圍認定標準
法規代碼: O0090012
現行版本: 115.02.05
編: —
條號: 3-I-2
條文要旨: 工廠之設立：【附表一】工業類別【擴建或擴增產能】，符合下列之一應環評：位於國家公園、野生動物保護區或重要棲息環境、重要濕地、自然保護區、水庫集水區、自來水水質水量保護區、海拔1500公尺以上；山坡地、國家風景區或一般保護區1公頃以上；特定農業區之農業用地1公頃以上；【擴增產能10%以上】（空污、水污總量及廢棄物未增加，經主管及目的事業主管機關同意者除外）；都市土地5公頃以上；非都市土地10公頃以上（均為申請或累積開發面積）。
適用辦理方式: 全路線
觸發條件: 既有附表一業別工廠擴建或擴增產能
回答型態: 2不適用／6實質計算
資料來源／判斷依據: 環境敏感套疊.csv＋使用分區＋累積開發面積＋擴增產能比例
進綜理表: 是
評估事項: 環評
○△╳判定邏輯(初擬): ○:各款均不命中／△:擴增產能接近10%或區位待函復／╳:明確命中（須環評）
因應手段: 控制擴增產能<10%或證明污染總量未增加；函請環保主管機關認定
手段法源: 認定標準§3
手段門檻: 產能10%；山坡地／特農1公頃；都市5公頃；非都市10公頃；已完成環評之園區面積加倍(§3Ⅱ)
時程約束: 設立許可或建造執照申請時認定（§3Ⅸ）
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫 O0090012 115.02.05 版§3 逐款抄錄，2026-11-13；71層 環境影響評估法及認定標準-重點；附表一～四未逐列核對)
覆寫/從屬總編規則: —
