rule_id: EIA-03-4
法規: 開發行為應實施環境影響評估細目及範圍認定標準
法規代碼: O0090012
現行版本: 115.02.05
編: —
條號: 3-I-4
條文要旨: 【其他工廠】（非附表一、二）興建或擴建，符合下列之一應環評：國家公園（≤1000㎡經同意除外）；野生動物保護區或重要棲息環境（棲息環境≤1000㎡經同意除外）；重要濕地；自然保護區；水庫集水區（附表三行業，或非附表三行業位於第一級水庫集水區；≤1000㎡經同意除外）；海拔1500公尺以上；山坡地或一般保護區1公頃以上；特定農業區之農業用地1公頃以上。★本款無都市／非都市土地面積款。
適用辦理方式: 全路線
觸發條件: 非附表一、二業別之工廠興建或擴建
回答型態: 2不適用／6實質計算
資料來源／判斷依據: 環境敏感套疊.csv＋使用分區＋累積開發面積
進綜理表: 是
評估事項: 環評
○△╳判定邏輯(初擬): ○:各款均不命中（一般農業區、非山坡地不因面積觸發）／△:區位或業別待函復／╳:明確命中（須環評）
因應手段: 縮減山坡地或特農區內開發面積<1公頃；函請環保主管機關認定
手段法源: 認定標準§3
手段門檻: 山坡地／特農1公頃；區位款1000㎡但書
時程約束: 設立許可或建造執照申請時認定（§3Ⅸ）
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫 O0090012 115.02.05 版§3 逐款抄錄，2026-11-13；71層 環境影響評估法及認定標準-重點；附表一～四未逐列核對)
覆寫/從屬總編規則: —
