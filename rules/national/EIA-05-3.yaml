rule_id: EIA-05-3
法規: 環境影響評估法
法規代碼: O0090001
現行版本: 114.11.28
編: —
條號: 5-III
條文要旨: ★太陽光電應實施環評之九款：①國家風景區或地質遺跡／山崩與地滑地質敏感區 ②野生動物保護區或重要棲息環境 ③重要濕地 ④沿海自然保護區 ⑤【位於特定農業區之農業用地】(無面積容量門檻) ⑥政府補助獎勵造林之國公有／國公營事業土地 ⑦山坡地且裝置容量1萬瓩以上或面積5公頃以上 ⑧水面型且1萬瓩以上或5公頃以上 ⑨【裝置容量4萬瓩以上或面積40公頃以上】（「累積」計算）
適用辦理方式: 全路線
觸發條件: 設置太陽光電發電系統（先以§5Ⅳ排除，再逐一比對九款）
回答型態: 2不適用／6實質計算
資料來源／判斷依據: ★基地面積（使用者2026-07-27確認：評估階段一律以基地面積視為設置面積，拉大容錯率較保險）＋裝置容量＋環境敏感套疊.csv＋使分欄（特農區判別）
進綜理表: 是
評估事項: 環評
○△╳判定邏輯(初擬): ○:九款均不命中（宜函請環保主管機關書面確認）／△:命中任一款而應實施環境影響評估，或接近門檻、區位認定待函復——★應實施環評屬「需經後續作業／審議認定」，依使用者定義為△而非╳（時程與成本大幅增加，其不可行性由執行疑義列綜合判斷）／╳:經環保主管機關認定不應開發，或業主明確不進入環評程序而無縮減方案
因應手段: 函請環保主管機關認定是否應實施環評；命中者調整基地範圍使面積<40公頃或容量<4萬瓩；落於特定農業區者無量化門檻可調，須改變區位
手段法源: 環評法§5Ⅲ、Ⅳ（114.11.28）
手段門檻: 40公頃／4萬瓩(面積以基地面積認定)；山坡地與水面型5公頃／1萬瓩；特農區無門檻
時程約束: 電業籌設許可階段即應併行函詢
完成後可升級為○: 可（取得免實施環評函）
核對狀態: 已核對(全國法規資料庫 O0090001 §5Ⅲ逐款抄錄；已建 71 層筆記)
覆寫/從屬總編規則: —
