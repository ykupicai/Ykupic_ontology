rule_id: EIA-17
法規: 開發行為應實施環境影響評估細目及範圍認定標準
法規代碼: O0090012
現行版本: 115.02.05
編: —
條號: '17'
條文要旨: ★魚塭或魚池之興建或擴建，有下列情形之一者應實施環評：①位於野生動物保護區或野生動物重要棲息環境（經該主管機關及目的事業主管機關同意者不在此限）②位於重要濕地 ③位於臺灣沿海地區自然環境保護計畫核定公告之自然保護區 ④位於【地下水管制區，申請開發面積5公頃以上】⑤【申請開發面積10公頃以上】。★注意：既有簡報引為§15 有誤，§15 實為休閒農場與農產品加工場所
適用辦理方式: 全路線
觸發條件: 漁電案需開挖或擴建魚塭時
回答型態: 2不適用／6實質計算
資料來源／判斷依據: 開挖／擴建魚塭面積＋地下水管制區圖層＋環境敏感套疊.csv
進綜理表: 是
評估事項: 環評
○△╳判定邏輯(初擬): ○:五款均不命中（宜函請環保主管機關確認）／△:接近門檻或區位認定待函復／╳:明確命中（須進入環評）
因應手段: 縮減開挖魚塭面積使 <10公頃（地下水管制區 <5公頃）；或函請環保主管機關認定
手段法源: 認定標準§17
手段門檻: 10公頃／地下水管制區5公頃
時程約束: 電業籌設階段併行函詢
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫逐條抄錄)
覆寫/從屬總編規則: —
