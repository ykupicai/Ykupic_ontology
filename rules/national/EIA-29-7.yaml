條號: 29-I-7
條文要旨: ★§29Ⅰ⑦現行原文僅為「設置太陽光電發電系統，依本法第五條第三項及第四項規定辦理」；且§29Ⅳ明定第一項開發行為「除第七款之太陽光電外」裝置容量未達2000瓩者免環評——太陽光電被排除於該免辦通則。110~112年案件援引之§29舊門檻已不適用
適用辦理方式: 全路線
