rule_id: ELE-15
法規: 電業法
法規代碼: J0030011
現行版本: 115.01.05 修正（經濟部）
編: —
條號: §15
條文要旨: 發電業、輸配電業應於籌設或擴建許可期間內取得工作許可證（有效5年）施工，完工後申請電業執照，查驗合格取得執照後始得營業。【特定電力供應業以設置儲能設備方式供電者，應於設置前向電業管制機關申請同意備案】，完成設置後申請核發電業執照；售電業及特定電力供應業應取得電業執照後始得營業。
適用辦理方式: 全路線
觸發條件: 設置儲能設備參與電力交易平台（特定電力供應業）
回答型態: 3遵照辦理
資料來源／判斷依據: 電業管制機關同意備案文件；台電併聯審查
進綜理表: 是
評估事項: —
○△╳判定邏輯(初擬): ○:已取得同意備案／△:備案或併聯審查申請中（亦為事業必要性論證之核心事實）／╳:—
因應手段: 向電業管制機關申請同意備案並辦理台電併聯審查
手段法源: —
手段門檻: —
時程約束: 設置前
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫 J0030011 §2、§15，2026-11-12 知識庫拆條；71層 再生能源發展條例與電業法-儲能-重點)
覆寫/從屬總編規則: —
