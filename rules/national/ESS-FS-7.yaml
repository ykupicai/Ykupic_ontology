rule_id: ESS-FS-7
法規: 提升儲能系統消防安全管理指引（行政指引）
法規代碼: FL099497(內政部消防署)
現行版本: 114.11.03 內授消字第1141605454號
編: —
條號: 第七點
條文要旨: 併網型儲能系統處所外牆（或相當設施外側）與下列場所距離【30公尺以上】：公共危險物品場所、可燃性高壓氣體場所、設置標準§12①⑥場所、【住宅】、建築物、停車場、公共道路。設【2小時防火時效防火牆】並設自動撒水或水霧滅火設備，或經大型燃燒測試（CNS/IEC62933-5-2 附錄C或UL9540A）者，與建築物、停車場、公共道路得縮為【3公尺】（住宅不得縮減）。與案場內建築物距離3公尺以上（設防火牆得1.5公尺）；儲能系統高度【4.5公尺以下】。
適用辦理方式: 全路線
觸發條件: 設置固定式裝置容量達20 kWh以上之併網型鋰系電池等儲能系統
回答型態: 6實質計算
資料來源／判斷依據: 基地周邊30公尺內住宅、建築物、停車場、道路、危險物品場所（正射影像＋地籍）
進綜理表: 是
評估事項: 規劃配置
○△╳判定邏輯(初擬): ○:30公尺內無列名場所／△:30公尺內有建築物、停車場或道路，須防火牆＋滅火設備或燃燒測試縮為3公尺／╳:30公尺內有住宅且無法調整配置
因應手段: 調整儲能櫃配置位置；設2小時防火牆及撒水設備；辦理大型燃燒測試
手段法源: —
手段門檻: 30公尺（縮減3公尺）；高度4.5公尺
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(內政部消防署 law.nfa.gov.tw FL099497 全文，使用者 2026-11-12 提供連結；原件存 _佐證；71層 提升儲能系統消防安全管理指引-重點)
覆寫/從屬總編規則: 行政指引，非法規命令；地方消防審查依據
