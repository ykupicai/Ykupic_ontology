rule_id: FMA-28-10
法規: 工廠管理輔導法
法規代碼: J0030043
現行版本: 113.05.24 修正（經濟部）
編: —
條號: §28-10
條文要旨: 主管機關對取得特定工廠登記者，得依下列辦理土地變更：(一)【群聚地區】優先採新訂都市計畫或開發產業園區；(二)非群聚且位於【都市計畫以外】，擬具【用地計畫】申請核發特定工廠使用地證明書辦理變更編定，但因前款整體規劃需要【縣市得駁回】；(三)非群聚且位於都市計畫內，依都市計畫法辦理。依第二款變更編定前應繳【回饋金】撥交農業發展基金。各款核准條件應符合都計法、區計法§15、§15-2、國土計畫法§26，並得由各法規主管機關基於輔導需求及安全原則檢討簡化相關法規（§28-10Ⅳ）。
適用辦理方式: 變更編定／開發許可（特定工廠用地計畫）
觸發條件: 取得特定工廠登記之工廠申請土地合法化
回答型態: 6實質計算
資料來源／判斷依據: 特定工廠登記；群聚地區範圍；都市計畫範圍
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): 分流列：群聚地區→新訂都計或產業園區（△）／都計外→用地計畫（接 SFA 系列）／都計內→都市計畫法；不判○△╳
因應手段: —
手段法源: J0030153 特定工廠審查辦法
手段門檻: —
時程約束: 接案初期分流
完成後可升級為○: —
核對狀態: 已核對(全國法規資料庫 J0030043 §28-7、§28-10，2026-11-12 知識庫拆條；71層 工廠管理輔導法-特定工廠-重點)
