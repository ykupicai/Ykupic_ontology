rule_id: FMA-28-7
法規: 工廠管理輔導法
法規代碼: J0030043
現行版本: 113.05.24 修正（經濟部）
編: —
條號: §28-7
條文要旨: 核准登記之特定工廠每年應繳交【營運管理金】至取得土地及建築物合法使用證明為止，屆期未繳者【廢止特定工廠登記】；第三項授權中央主管機關訂定【低污染之認定基準】、申請條件與程序、營運管理金數額等辦法。
適用辦理方式: 變更編定／開發許可（特定工廠用地計畫）
觸發條件: 取得特定工廠登記之工廠申請土地合法化
回答型態: 是否
資料來源／判斷依據: 特定工廠登記狀態；營運管理金繳納紀錄
進綜理表: 是
評估事項: —
○△╳判定邏輯(初擬): ○:登記有效且營運管理金已繳／╳:登記已廢止（用地計畫途徑失效）
因應手段: —
手段法源: —
手段門檻: —
時程約束: 申請前
完成後可升級為○: —
核對狀態: 已核對(全國法規資料庫 J0030043 §28-7、§28-10，2026-11-12 知識庫拆條；71層 工廠管理輔導法-特定工廠-重點)
覆寫/從屬總編規則: SFA-6-4 低污染認定之上位授權
