rule_id: GEN-003-1
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 總編
條號: 三之一
條文要旨: 應說明基地無法於下列地區開發之理由，經徵得所在縣市政府及區域計畫委員會審議同意後始得開發：(一)都市計畫地區之推動都市更新地區及整體開發地區；(二)都市計畫通盤檢討得變更使用之都市計畫農業區；(三)新訂或擴大都市計畫地區；(四)第三點第二項劃設區位。興辦國防、行政院核定之重大建設或緊急救災安置需要者不受限制；位於第三點第二項設施型使用分區變更區位或國土計畫劃定之未登記工廠聚落者，免依三之一、三之二辦理。
適用辦理方式: 開發許可
觸發條件: —
回答型態: 6實質計算
資料來源／判斷依據: 周邊都市計畫圖層＋人工論述
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): —
