rule_id: GEN-009-1
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 總編
條號: 九之一
條文要旨: 零星夾雜之第一級環敏土地得納入基地之5條件（不得逾基地面積10%或2公頃等）
適用辦理方式: 開發許可
觸發條件: —
回答型態: 2不適用／6實質計算
資料來源／判斷依據: 環境敏感套疊.csv＋基地面積（算夾雜比例）
進綜理表: 是
評估事項: 環境敏感
○△╳判定邏輯(初擬): ○:無夾雜／△:夾雜≤10%且≤2ha並可維持原地形地貌／╳:夾雜逾10%或2ha
因應手段: 夾雜地維持原地形地貌不開發、同意變更為國土保安用地並擬定管理維護措施
手段法源: 開發審議規範§9-1
手段門檻: ≤基地面積10%且≤2公頃
時程約束: 送件前
完成後可升級為○: 可
核對狀態: 已核對(大福能源北門案定稿本制式檢核表 p.97-113)；2026-11-12 知識庫回內政部 glrs.moi.gov.tw FL003635 111.05.20 版原文逐點核對（71層 非都市土地開發審議作業規範-重點）
覆寫/從屬總編規則: —
