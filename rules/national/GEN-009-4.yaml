rule_id: GEN-009-4
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 總編
條號: 九之四
條文要旨: 位於第二級環境敏感地區者應提具體防範補救措施、規範使用種類強度，並徵詢各主管機關意見
適用辦理方式: 開發許可
觸發條件: —
回答型態: 6實質計算
資料來源／判斷依據: 環境敏感套疊.csv（第二級項目）＋需函詢各該主管機關
進綜理表: 是
評估事項: 環境敏感
○△╳判定邏輯(初擬): ○:無第二級套疊／△:有套疊（須提措施並徵詢主管機關，結果未定）／╳:違反該敏感項目中央法令之禁止規定
因應手段: 提具體防範及補救措施並徵詢各該主管機關；涉淹水潛勢者以「將辦理出流管制」回應
手段法源: 開發審議規範§9-4＋出流管制辦法§3
手段門檻: 見 WRA-003
時程約束: 區委會審議前取得核定函
完成後可升級為○: 可
核對狀態: 已核對(大福能源北門案定稿本制式檢核表 p.97-113)；2026-11-12 知識庫回內政部 glrs.moi.gov.tw FL003635 111.05.20 版原文逐點核對（71層 非都市土地開發審議作業規範-重點）
覆寫/從屬總編規則: —
