rule_id: GEN-009
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 總編
條號: 九
條文要旨: 申請開發之基地不得位於附表二之一所列第一級環境敏感地區（5款例外）
適用辦理方式: 開發許可
觸發條件: —
回答型態: 2不適用／6實質計算
資料來源／判斷依據: 環境敏感套疊.csv（第一級項目）
進綜理表: 是
評估事項: 環境敏感
○△╳判定邏輯(初擬): ○:無第一級套疊／△:有套疊但符合§9五款例外之一且待主管機關同意／╳:有第一級套疊且無明文例外
因應手段: 排除敏感地縮減基地範圍；或援引§9第1項五款例外並取得該敏感項目中央目的事業主管機關同意函
手段法源: 開發審議規範§9Ⅰ各款
手段門檻: —
時程約束: 送件前取得書面意見
完成後可升級為○: 部分（例外成立才可）
核對狀態: 已核對(大福能源北門案定稿本制式檢核表 p.97-113)；2026-11-12 知識庫回內政部 glrs.moi.gov.tw FL003635 111.05.20 版原文逐點核對（71層 非都市土地開發審議作業規範-重點）
覆寫/從屬總編規則: —
