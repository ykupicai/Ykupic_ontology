rule_id: GEN-010
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 總編
條號: 十
條文要旨: 位於自來水水質水量保護區者依自來水法管制；承受水體未達水質標準、已超過管制總量或經水利主管機關認為河防安全堪虞者【不得開發】，但經區域計畫委員會同意興辦之各項供公眾使用之設施不在此限。保護區尚未公告飲用水水源水質保護區或取水口一定距離前，距豐水期水體岸邊水平1,000公尺內、取水口上游半徑1公里集水區及下游400公尺內禁止水保以外之一切開發整地（提出廢水三級處理等措施經主管機關同意並經區委會審查通過者，得不受此限）。
適用辦理方式: 開發許可
觸發條件: —
回答型態: 2不適用／6實質計算
資料來源／判斷依據: 環境敏感套疊.csv（自來水水質水量保護區）
進綜理表: 否
