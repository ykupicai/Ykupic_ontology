rule_id: GEN-015
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 總編
條號: 十五
條文要旨: 基地內公有土地或未登記土地應先取得同意合併開發或核准讓售文件
適用辦理方式: 開發許可
觸發條件: —
回答型態: 6實質計算
資料來源／判斷依據: joined shp 權屬欄（公有地逐筆點名）＋需函詢：國產署／管理機關
進綜理表: 是
評估事項: 土地權屬
○△╳判定邏輯(初擬): ○:全私有或已取得同意書／△:有公有地尚未取得同意合併開發文件／╳:管理機關明確不同意
因應手段: 向管理機關申請出具「同意合併開發同意書」或核准讓售文件
手段法源: 開發審議規範§15
手段門檻: —
時程約束: 送件前
完成後可升級為○: 可
核對狀態: 已核對(大福能源北門案定稿本制式檢核表 p.97-113)；2026-11-12 知識庫回內政部 glrs.moi.gov.tw FL003635 111.05.20 版原文逐點核對（71層 非都市土地開發審議作業規範-重點）
覆寫/從屬總編規則: —
