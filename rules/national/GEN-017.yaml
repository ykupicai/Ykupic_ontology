rule_id: GEN-017
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 總編
條號: 十七
條文要旨: 應劃設必要之保育區，設置連貫並儘量集中；保育區面積不得小於扣除不可開發區後剩餘基地面積30%，且【保育區面積70%以上應維持原始地形地貌】不得開發；保育區不得計入道路、公設或必要性服務設施，不得劃設建築基地；生態滯洪設施、人工濕地經區委會同意得納入保育區計算（變更原始地形地貌比例調整不得大於保育區面積50%）。
適用辦理方式: 開發許可
