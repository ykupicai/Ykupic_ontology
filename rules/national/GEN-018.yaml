rule_id: GEN-018
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 總編
條號: 十八
條文要旨: 應優先列為保育區之7種情形：①珍貴稀有之動、植物保護地區 ②主要野生動物棲息地 ③【林相良好之主要林帶】④文化資產之保護地區 ⑤經濟部認定之重要礦區且地下有多條舊坑道通過之地區 ⑥特殊地質地形資源 ⑦坡度陡峭地區（坡度40%以上）。★第十四編§2【未豁免】本點，且明文「基地有本規範總編第十八點情形者，仍應劃為保育區」
適用辦理方式: 開發許可
觸發條件: ★走開發許可且基地含林業用地／林木者，本點為林業用地之正確檢核路徑（非光電審查作業要點附表；附表僅適用變更編定）
回答型態: 6實質計算
資料來源／判斷依據: joined shp 使類欄（林業用地筆數與面積）＋環境敏感套疊.csv＋國土利用調查（LUIMAP）＋特生中心圖資＋現地生態調查
進綜理表: 是
評估事項: 生態文資
○△╳判定邏輯(初擬): ○:七種情形均無（或經調查認定林相非屬良好之主要林帶）／△:含林業用地或林木須調查林相與生態，經認定者應劃為保育區（影響可開發面積，非否決條件）／╳:—（本點不構成否決，僅影響配置與可開發面積）
因應手段: 辦理林相調查與生態調查、函詢特生中心／文資主管機關；經認定者於配置中劃設保育區並編為國土保安用地，並重新評估可開發面積與開發效益
手段法源: 開發審議規範§18（★第14編§2未豁免）
手段門檻: —
時程約束: 專案小組審查前
完成後可升級為○: 可
核對狀態: 已核對(大福能源北門案定稿本制式檢核表 p.97-113)；2026-11-12 知識庫回內政部 glrs.moi.gov.tw FL003635 111.05.20 版原文逐點核對（71層 非都市土地開發審議作業規範-重點）
覆寫/從屬總編規則: —
