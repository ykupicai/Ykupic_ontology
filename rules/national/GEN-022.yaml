rule_id: GEN-022
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 總編
條號: 二十二
條文要旨: 應提供滯洪設施及排水路；量體與逕流量計算以水利主管機關核定之出流管制規劃書或水保規劃書為準
適用辦理方式: 開發許可
觸發條件: —
回答型態: 6實質計算
資料來源／判斷依據: 需審查：出流管制規劃書（水利技師）
進綜理表: 是
評估事項: 出流管制
○△╳判定邏輯(初擬): ○:經核定得免留設滯洪池／△:須辦理出流管制規劃並經水利主管機關核定（結果未定）／╳:排水路無法滿足聯外通洪能力
因應手段: 辦理出流管制規劃書並取得水利主管機關核定函
手段法源: 出流管制辦法§3Ⅰ（J0110108）
手段門檻: 面積≥1公頃且涉非都市土地分區變更
時程約束: ★區域計畫委員會審議前取得核定函
完成後可升級為○: 可
核對狀態: 已核對(大福能源北門案定稿本制式檢核表 p.97-113)；2026-11-12 知識庫回內政部 glrs.moi.gov.tw FL003635 111.05.20 版原文逐點核對（71層 非都市土地開發審議作業規範-重點）
覆寫/從屬總編規則: —
