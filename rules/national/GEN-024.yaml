rule_id: GEN-024
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 總編
條號: 二十四
條文要旨: 應分析環境地質及基地地質；災害影響範圍內不得開發；地質敏感區應做基地地質調查及安全評估
適用辦理方式: 開發許可
觸發條件: —
回答型態: 2不適用／6實質計算
資料來源／判斷依據: 環境敏感套疊.csv（地質敏感區）＋地質技師簽證
進綜理表: 是
評估事項: 地質
○△╳判定邏輯(初擬): ○:非地質敏感區且無地質災害因子／△:屬地質敏感區須辦基地地質調查及安全評估／╳:潛在地質災害影響範圍內
因應手段: 辦理基地地質調查及地質安全評估（依法登記開業之地質技師簽證）
手段法源: 地質法＋開發審議規範§24Ⅲ
手段門檻: 位於公告地質敏感區
時程約束: 送件前
完成後可升級為○: 可
核對狀態: 已核對(大福能源北門案定稿本制式檢核表 p.97-113)；2026-11-12 知識庫回內政部 glrs.moi.gov.tw FL003635 111.05.20 版原文逐點核對（71層 非都市土地開發審議作業規範-重點）
覆寫/從屬總編規則: —
