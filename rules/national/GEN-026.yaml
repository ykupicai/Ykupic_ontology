rule_id: GEN-026
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 總編
條號: 二十六
條文要旨: 基地聯絡道路應至少有獨立二條通往聯外道路，其中一條路寬至少8公尺，另一條可為緊急通路且能容納消防車；區委會認定情況特殊者不在此限
適用辦理方式: 開發許可
觸發條件: —
回答型態: 6實質計算
資料來源／判斷依據: 臨路評估/成果.xlsx（臨路三態＋道路寬度）
進綜理表: 是
評估事項: 臨路情形
○△╳判定邏輯(初擬): ○:≥2條獨立聯外且其一≥8公尺／△:寬度不足但可援引區委會但書（需承諾施工交通管制並取得供公眾通行函）／╳:不臨路且無法取得通行權
因應手段: ★改引 PVROAD-02（太陽光電設施開發案基地聯絡道路審議原則，111.10.13）而非會議紀錄：主張寬度可供施工維修車輛（原則≥4公尺，轉彎進出≥6公尺）及消防車通行並承諾施工期間交通管制；或退縮留設道路編為交通用地；或留設2個獨立出入口；或以板橋/他人土地供緊急通行作替代方案。另可取得區公所供公眾通行道路函、函詢水利主管機關確認水防道路可否認定為聯絡道路
手段法源: PVROAD-02 審議原則貳（總編§26但書之操作化）
手段門檻: 8公尺（本文）／4公尺（施工維修車輛下限）／6公尺（轉彎進出）
時程約束: 送件前啟動函詢
完成後可升級為○: 可
核對狀態: 已核對(大福能源北門案定稿本制式檢核表 p.97-113)；2026-11-12 知識庫回內政部 glrs.moi.gov.tw FL003635 111.05.20 版原文逐點核對（71層 非都市土地開發審議作業規範-重點）
覆寫/從屬總編規則: —
