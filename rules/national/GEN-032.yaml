rule_id: GEN-032
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 總編
條號: 三十二
條文要旨: 開發後基地內透水面積：山坡地不得小於扣除不可開發區及保育區後剩餘基地面積50%、平地不得小於30%；但經區域計畫委員會認定無影響安全之虞者不在此限。基地位於地下水補注地質敏感區者，透水面積依地質敏感區基地地質調查及地質安全評估作業準則辦理。
適用辦理方式: 開發許可
觸發條件: —
回答型態: 6實質計算
資料來源／判斷依據: 基地面積＋設施配置面積（可由產線算）
進綜理表: 是
評估事項: 透水率
○△╳判定邏輯(初擬): ○:平地≥30%／山坡地≥50%／△:未達標須調整配置或經區委會認定無安全之虞／╳:—
因應手段: 調整設施配置提高透水面積；或報請區委會認定無影響安全之虞
手段法源: 開發審議規範§32但書
手段門檻: 平地30%／山坡地50%
時程約束: 審議前
完成後可升級為○: 可
核對狀態: 已核對(大福能源北門案定稿本制式檢核表 p.97-113)；2026-11-12 知識庫回內政部 glrs.moi.gov.tw FL003635 111.05.20 版原文逐點核對（71層 非都市土地開發審議作業規範-重點）
覆寫/從屬總編規則: —
