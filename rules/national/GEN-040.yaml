rule_id: GEN-040
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 總編
條號: 四十
條文要旨: 與周邊土地使用不相容者，應自基地邊界線退縮設置緩衝綠帶，寬度不得小於10公尺，且每單位平方公尺（以所選喬木成樹樹冠直徑平方計）至少植喬木一株；天然植被茂密經認定具緩衝綠帶功能者不在此限。與區外公園、綠地鄰接部分可縮減5公尺；鄰接河川區域或海域區者得以退縮建築（≥10公尺並植栽綠化）辦理。緊鄰鐵路、大眾捷運系統、高速公路或10公尺以上公路、已開闢之計畫道路者，得以等寬度之隔離設施替代；但【緊鄰非高架式公路或道路之對向屬住宅、學校、醫院或其他寧適性高之土地使用者，不得以隔離設施替代】。隔離設施限道路、平面停車場、水道、公園、綠地、滯洪池、蓄水池、廣場、開放球場等開放性設施。
適用辦理方式: 開發許可
觸發條件: —
回答型態: 6實質計算
資料來源／判斷依據: 緩衝綠帶/（buffer-greenbelt 面積統計）＋周邊土地使用相容性
進綜理表: 是
評估事項: 規劃配置
○△╳判定邏輯(初擬): ○:可完整劃設10公尺緩衝綠帶且無須拆除地上物／△:部分邊界受限須以隔離設施替代或退縮建築（替代前須確認對向非住宅、學校、醫院等寧適性高使用）／╳:劃設綠帶後無足夠可利用面積
因應手段: 劃設10公尺緩衝綠帶；鄰公園綠地得縮減5公尺；鄰河川區域或海域區改以退縮建築辦理；鄰10公尺以上公路得以等寬隔離設施替代
手段法源: 開發審議規範§40Ⅱ~Ⅳ
手段門檻: 寬度≥10公尺（替代方案為等寬）
時程約束: 審議前完成配置
完成後可升級為○: 可
核對狀態: 已核對(大福能源北門案定稿本制式檢核表 p.97-113)；2026-11-12 知識庫回內政部 glrs.moi.gov.tw FL003635 111.05.20 版原文逐點核對（71層 非都市土地開發審議作業規範-重點）
覆寫/從屬總編規則: —
