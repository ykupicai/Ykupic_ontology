rule_id: GEN-044-6
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 總編
條號: 四十四之六
條文要旨: 位於經濟部公告嚴重地層下陷地區者不得抽取地下水並以低耗水為原則；應依近5年年平均下陷量評估並提防洪排水禦潮措施；彰雲高鐵沿線另有規定
適用辦理方式: 開發許可
觸發條件: —
回答型態: 2不適用／6實質計算
資料來源／判斷依據: 環境敏感套疊.csv（嚴重地層下陷）＋水利署地層下陷監測資料
進綜理表: 是
評估事項: 地層下陷
○△╳判定邏輯(初擬): ○:非公告嚴重地層下陷地區／△:屬下陷地區須提防洪排水禦潮措施並承諾不抽地下水／╳:—
因應手段: 承諾不抽取地下水並取得自來水公司供水同意函；提出防洪、排水及禦潮措施
手段法源: 開發審議規範§44-6
手段門檻: 位於經濟部公告嚴重地層下陷地區
時程約束: 送件前取得供水同意
完成後可升級為○: 可
核對狀態: 已核對(大福能源北門案定稿本制式檢核表 p.97-113)；2026-11-12 知識庫回內政部 glrs.moi.gov.tw FL003635 111.05.20 版原文逐點核對（71層 非都市土地開發審議作業規範-重點）
覆寫/從屬總編規則: —
