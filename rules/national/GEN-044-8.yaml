rule_id: GEN-044-8
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號令
編: 總編
條號: 四十四之八
條文要旨: 依工廠管理輔導法取得主管機關核定用地計畫申請開發，基地面積【2公頃以上且未超過5公頃】者，不受總編三之一、三之二、十七、二十六、二十八、三十二Ⅰ、三十三、三十五～三十九、四十四之限制，改依：(一)聯絡道路至少獨立二條，主要聯絡道路≥8公尺（不足經區委會認定不影響安全者得退縮建築至8公尺或酌減），緊急通路容納消防車，並徵詢工業主管機關是否足供營運；(二)規劃營運及避難動線；(三)透水面積≥基地面積30%；(四)依總編四十設緩衝綠帶或隔離設施（區委會認定特殊並規劃等面積不計建蔽率綠地者得酌減，最小1.5公尺；退縮建築供通行部分達1.5公尺免留綠帶）；(五)公設（含緩衝綠帶、隔離設施、綠地、滯洪設施）或必要性服務設施用地≥基地面積30%，其中綠地或緩衝綠帶≥10%；(六)視覺景觀分析；(七)防災計畫加強火災、爆炸等非天然災害。
適用辦理方式: 開發許可
觸發條件: 特定工廠取得用地計畫核定、基地2公頃以上未超過5公頃申請開發許可（接 SFA-2-3）
回答型態: 6實質計算
資料來源／判斷依據: 基地面積；臨路評估成果；配置圖
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:兩條獨立聯絡道路其一≥8m、透水≥30%、公設≥30%且綠地≥10%／△:道路寬度不足須區委會認定退縮或酌減，或綠帶須酌減至1.5m／╳:無法取得兩條獨立聯絡道路
因應手段: 退縮建築至8公尺可通行寬度；規劃等面積綠地申請酌減緩衝綠帶
手段法源: FL003635 總編四十四之八
手段門檻: 2～5公頃；主要道路8m；透水30%；公設30%（綠地10%）
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(內政部 glrs.moi.gov.tw FL003635 111.05.20 版原文，2026-11-12 知識庫新增；71層 非都市土地開發審議作業規範-重點)
