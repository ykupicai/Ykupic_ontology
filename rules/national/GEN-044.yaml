法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 總編
條號: 四十四
條文要旨: 位於高鐵、高速公路兩側2公里（或至最近稜線，取較小者），或區域計畫景觀道路（附表七）兩側1公里（或至最近山稜線，取較小者）範圍內者，應做視覺景觀分析。
適用辦理方式: 開發許可
觸發條件: —
回答型態: 2不適用／6實質計算
資料來源／判斷依據: 路網圖層＋附表七景觀道路清單
進綜理表: 否
