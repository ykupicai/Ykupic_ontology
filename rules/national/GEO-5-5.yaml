rule_id: GEO-5-5
法規: 地質法
法規代碼: J0020052
現行版本: 114.11.28 修正（經濟部地質調查及礦業管理中心）
編: —
條號: §5Ⅴ、Ⅵ
條文要旨: 經劃定之【地質遺跡地質敏感區、山崩與地滑地質敏感區】，【不得設置地面型或水面型太陽光電系統】。但經環境影響評估審查通過，且設置或累積設置面積【1公頃以下】者，不在此限。前項不含屋頂型，或設置面積100㎡以下且供自用之太陽光電發電系統。（114.11.28 修正新增）
適用辦理方式: 容許使用／變更編定／開發許可（地面型、水面型太陽光電）
觸發條件: 地面型或水面型太陽光電基地位於地質遺跡或山崩與地滑地質敏感區
回答型態: 6實質計算
資料來源／判斷依據: 地質敏感區套疊（地質遺跡、山崩與地滑）
進綜理表: 是
評估事項: 環境敏感
○△╳判定邏輯(初擬): ○:未涉及上述兩類地質敏感區，或屬屋頂型／≤100㎡自用／△:涉及且設置面積≤1公頃，待環評審查通過／╳:涉及且設置面積>1公頃
因應手段: 剔除涉及範圍；或縮減至1公頃以下並辦理環評
手段法源: —
手段門檻: 1公頃
時程約束: 接案初期
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫 J0020052 §5、§6、§8，2026-11-12 知識庫拆條；71層 地質法-重點)
覆寫/從屬總編規則: —
