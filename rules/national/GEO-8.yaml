rule_id: GEO-8
法規: 地質法
法規代碼: J0020052
現行版本: 114.11.28 修正（經濟部地質調查及礦業管理中心）
編: —
條號: §8
條文要旨: 土地開發行為基地有【全部或一部位於地質敏感區】內者，應於申請土地開發前，進行【基地地質調查及地質安全評估】（緊急救災者除外）；調查評估依作業準則辦理並由技師簽證，結果納入開發送審書圖。
適用辦理方式: 全路線
觸發條件: 基地全部或一部位於公告之地質敏感區
回答型態: 6實質計算
資料來源／判斷依據: 地質敏感區套疊（地質遺跡、地下水補注、活動斷層、山崩與地滑）
進綜理表: 是
評估事項: 環境敏感
○△╳判定邏輯(初擬): ○:未涉及任何地質敏感區／△:涉及，須辦基地地質調查及安全評估（結果未定）／╳:—（程序義務；實體限制見 GEO-5-5、GEN-024）
因應手段: 委託技師辦理基地地質調查及地質安全評估
手段法源: J0020056 作業準則
手段門檻: —
時程約束: 申請土地開發前
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫 J0020052 §5、§6、§8，2026-11-12 知識庫拆條；71層 地質法-重點)
覆寫/從屬總編規則: —
