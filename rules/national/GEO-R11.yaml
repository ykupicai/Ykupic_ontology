rule_id: GEO-R11
法規: 地質敏感區基地地質調查及地質安全評估作業準則
法規代碼: J0020056
現行版本: 113.01.09 修正
編: —
條號: §11
條文要旨: 【地下水補注地質敏感區】基地地質安全評估：開發後細部調查範圍內土地透水面積——非都市土地申請【土地使用分區變更】者【不得小於60%】（未涉分區變更者依其他法令）；都市土地以不小於法定空地面積60%為原則（應提供公共使用土地者扣除後計算）。未符合者，不足部分應採有效因應措施補償。
適用辦理方式: 全路線
觸發條件: 基地位於地下水補注地質敏感區
回答型態: 6實質計算
資料來源／判斷依據: 地下水補注地質敏感區套疊；配置圖透水面積
進綜理表: 是
評估事項: 透水率
○△╳判定邏輯(初擬): ○:未涉及，或透水面積≥60%／△:未達60%須採補償措施／╳:—
因應手段: —
手段法源: —
手段門檻: 60%
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫 J0020056 §11，2026-11-12 知識庫拆條；71層 地質法-重點)
覆寫/從屬總編規則: GEN-032 第二項指向本條
