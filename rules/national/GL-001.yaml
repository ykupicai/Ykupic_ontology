rule_id: GL-001
法規: 農產品初級加工場管理辦法
法規代碼: GL001127
現行版本: （GL001127，農業部，109.03.26發布）
編: —
條號: 第二條、第五條
條文要旨: 申請人資格——農糧類：全民健保投保資格為農民健康保險被保險人，或已通過百大青年農民輔導認定；水產類：持有效漁業執照之漁民；林產類：森林所有人；或前述之農民團體（農會／漁會／農業合作社）。§5：以「農業用地作農業設施容許使用同意書」為申辦加工場登記之前提文件
適用辦理方式: 容許使用
觸發條件: 申請初級農產加工場登記（土地容許使用取得後之**後續不同程序**）
回答型態: 3遵照辦理
資料來源／判斷依據: 須向申請人確認身分別，產線無法自動判定
進綜理表: 是
評估事項: —
○△╳判定邏輯(初擬): ○:資格已具備並可檢附證明／△:尚未確認申請人身分別（評估階段常態）
因應手段: 確認並檢附農保投保證明或百大青農認定文件；資格不符者改以農民團體名義或先行取得資格
手段法源: GL001127§2
手段門檻: —
時程約束: 容許使用同意書取得後
完成後可升級為○: 可
核對狀態: 已核對(GL001127，2026-08-06，新化王公廟小段案)。⚠ 本辦法管**設施登記與產品標示合法化**，**非土地容許使用依據**，兩者是先後銜接的不同程序、受理單位也不同（容許＝區公所或農業局；登記＝農業局行銷科）
覆寫/從屬總編規則: —
