rule_id: GL-002
法規: 農產品初級加工場管理辦法
法規代碼: GL001127
現行版本: （GL001127，農業部，109.03.26發布）
編: —
條號: 第三條
條文要旨: 申請登記之**加工作業區**樓地板面積以 200 ㎡ 為上限（加工作業區不含辦公、倉儲等附屬空間）
適用辦理方式: 容許使用
觸發條件: 申請初級農產加工場登記
回答型態: 6實質計算
資料來源／判斷依據: 與 AGF-002（基地×40%）、AGF-004（附表一990㎡）三者取最嚴；⚠ 三者的**計算對象不同**（總設施面積／總樓地板／加工作業區），不是同一個量的三個數字，比較前要先對齊對象
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:加工作業區規劃在200㎡內／△:規模未定
因應手段: 作業動線與設備配置先確定加工作業區面積
手段法源: GL001127§3
手段門檻: 加工作業區 200 ㎡
時程約束: 配置圖繪製前
完成後可升級為○: 可
核對狀態: 已核對(GL001127，2026-08-06，新化王公廟小段案)
覆寫/從屬總編規則: 與 AGF-002、AGF-004 取最嚴
