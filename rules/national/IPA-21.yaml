rule_id: IPA-21
法規: 原住民族基本法
法規代碼: D0130003
現行版本: 107.06.20
編: —
條號: '21'
條文要旨: 政府或私人於【原住民族土地（傳統領域土地及原住民保留地，§2⑤）或部落及其周邊一定範圍內之公有土地】從事土地開發、資源利用、生態保育及學術研究，【應諮商並取得原住民族或部落同意或參與】，原住民得分享相關利益；營利所得提撥一定比例納入原住民族綜合發展基金。
適用辦理方式: 全路線
觸發條件: 基地位於原住民保留地、傳統領域土地或部落周邊一定範圍內之公有土地
回答型態: 3遵照辦理
資料來源／判斷依據: 原住民保留地圖層；原民會公告之傳統領域與部落範圍
進綜理表: 是
評估事項: 土地權屬
○△╳判定邏輯(初擬): ○:不在原住民族土地或部落周邊範圍／△:位於範圍內，須辦部落諮商同意／╳:部落不同意
因應手段: 接案初期查傳統領域與部落範圍；辦理部落諮商取得同意或參與
手段法源: 原基法§21Ⅳ授權之諮商取得同意辦法（未收錄）
手段門檻: —
時程約束: 諮商程序耗時，須於興辦事業計畫送審前啟動
完成後可升級為○: 部分（取得同意）
核對狀態: 已核對(全國法規資料庫 D0130003 107.06.20 版§2、§21 逐字核對，2026-11-13；71層 原住民族基本法第21條及原住民保留地開發管理辦法-重點)
覆寫/從屬總編規則: —
