rule_id: IRL-18
法規: 原住民保留地開發管理辦法
法規代碼: D0060026
現行版本: 114.01.13
編: —
條號: '18'
條文要旨: 原住民取得原住民保留地所有權後，除政府指定之特定用途（土地徵收條例§3、§4Ⅰ事業及一併徵收；災害預防應變復建用地；抵繳遺產稅或贈與稅；公法上金錢給付執行未拍定）外，【移轉之承受人以原住民為限】。
適用辦理方式: 變更編定／開發許可
觸發條件: 基地含原住民所有之原住民保留地，且申請人非原住民
回答型態: 6實質計算
資料來源／判斷依據: 地籍登記（所有權人、原住民保留地註記）；申請人身分
進綜理表: 是
評估事項: 土地權屬
○△╳判定邏輯(初擬): ○:申請人具原住民身分或不需移轉所有權／△:改以參與投資（§26）或租用（IRL-24）取得使用權／╳:非原住民須取得所有權方能開發
因應手段: 改採原住民地主協議計價參與投資（§26）或租用公有保留地（§24）
手段法源: 原住民保留地開發管理辦法§24、§26
手段門檻: —
時程約束: 接案初期
完成後可升級為○: 部分
核對狀態: 已核對(全國法規資料庫 D0060026 114.01.13 版逐字核對，2026-11-13；71層 原住民族基本法第21條及原住民保留地開發管理辦法-重點)
覆寫/從屬總編規則: —
