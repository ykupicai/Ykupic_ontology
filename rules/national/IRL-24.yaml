rule_id: IRL-24
法規: 原住民保留地開發管理辦法
法規代碼: D0060026
現行版本: 114.01.13
編: —
條號: '24'
條文要旨: 礦業、土石、觀光遊憩、加油站、農產品集貨場倉儲、工業資源開發、原住民族文化保存、醫療保健、【社會福利】、郵電運輸、金融服務及其他經中央主管機關核定事業，優先輔導原住民或原住民機構、法人、團體開發或興辦。申請【租用】原住民保留地：檢具開發或興辦計畫圖說（申請書及事業計畫、1/5000以上地形圖及地籍套繪之用地配置圖、【興辦事業回饋計畫】）向鄉（鎮、市、區）公所申請，經土地權利審查委員會擬具意見，【層報中央主管機關核准】，並俟取得目的事業主管機關核准文件後租用，每期≤9年。【非原住民】申請者，鄉公所先【公告30日】，期滿無原住民申請始得辦理。§26：原住民已取得所有權者，協議計價經縣市主管機關同意後參與投資。
適用辦理方式: 變更編定／開發許可
觸發條件: 基地含公有原住民保留地，須租用作開發或興辦
回答型態: 3遵照辦理
資料來源／判斷依據: 地籍登記（管理機關原民會、原住民保留地註記）；事業類別
進綜理表: 是
評估事項: 土地權屬
○△╳判定邏輯(初擬): ○:不涉公有原住民保留地／△:須依§24租用（非原住民另須公告30日、原民會核准）／╳:事業不在列舉且未獲中央主管機關核定，或公告期間有原住民申請
因應手段: 與原住民或原住民法人合作申請；備妥回饋計畫；預留公告30日與審查委員會、原民會核准時程
手段法源: 原住民保留地開發管理辦法§24、§26
手段門檻: 租期9年；公告30日；配置圖比例尺≥1/5000
時程約束: 租用核准須俟目的事業主管機關核准開發文件
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫 D0060026 114.01.13 版逐字核對，2026-11-13；71層 原住民族基本法第21條及原住民保留地開發管理辦法-重點)
覆寫/從屬總編規則: —
