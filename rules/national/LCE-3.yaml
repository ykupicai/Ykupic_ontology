rule_id: LCE-3
法規: 非都市土地變更編定執行要點
法規代碼: FL003207
現行版本: 110.07.15 台內地字第1100263626號令（88.09.03 公發布；法源＝管制規則§27Ⅲ）
編: —
條號: 第三點
條文要旨: 目的事業主管機關核准興辦事業計畫，應依管制規則§30Ⅳ徵得【變更前目的事業主管機關】（附錄一之一）及有關機關（附錄一之二）同意，並審查事業計畫之可行性、必要性（或總量管制）、土地區位或面積規模。申請人應於提送計畫前，就【附錄一之二查詢項目】逐一向主管機關查詢並附於計畫書；核准文件應敘明已完成查核、無禁限建及不得設置或興辦情事。（第六點：已會簽相同項目並核准者，6個月內變更編定審查免再重複會審）
適用辦理方式: 變更編定
觸發條件: 非都市土地申請使用地變更編定
回答型態: 3遵照辦理
資料來源／判斷依據: 附錄一之二查詢結果
進綜理表: 是
評估事項: —
○△╳判定邏輯(初擬): ○:附錄一之二查詢完成且無禁限建／△:查詢結果待回覆或涉限建／╳:查詢結果為禁建或不得設置
因應手段: 送件前完成附錄一之二逐項查詢
手段法源: —
手段門檻: —
時程約束: 送件前
完成後可升級為○: 可
核對狀態: 已核對(內政部 glrs.moi.gov.tw FL003207 第1～10點，2026-11-12 知識庫拆條；71層 非都市土地變更編定執行要點-重點)
覆寫/從屬總編規則: LUR-030 之執行細節
