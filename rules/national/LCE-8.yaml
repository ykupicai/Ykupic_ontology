rule_id: LCE-8
法規: 非都市土地變更編定執行要點
法規代碼: FL003207
現行版本: 110.07.15 台內地字第1100263626號令（88.09.03 公發布；法源＝管制規則§27Ⅲ）
編: —
條號: 第八點
條文要旨: 申請變更編定為【特定目的事業用地】，以各該使用區無其他適當使用地可變更編定者為限，且以政府機關或公營事業機構興辦為主；但屬下列【30款】之一，經縣市目的事業主管機關依§30徵得同意核准興辦事業計畫者，得變更為特目用地：財團法人文教設施、學校、幼兒園、(四)發電廠、變電所、配電中心、輸配電鐵塔、油庫、輸油氣、液化石油氣分裝、天然氣貯存、加油加氣加壓整壓配氣計量站、自然泉飲用水包裝、農漁民團體集貨運銷冷凍倉儲、農漁業生產加工運銷、碾米、休閒農業設施、動物保護收容、社會福利設施、土資場、可燃性高壓氣體儲存、醫療護理精神復健機構、廢棄物與污水處理、廣播電視、電信、電磁波檢測、區委會審議通過無適當用地者、宗教建築、生物技術產業、運動場館、職安訓練與技能檢定場地、離島文創、兒童課後照顧、長期照顧服務機構、寵物生命紀念設施、地方創生事業設施、特定工廠設施。需中央目的事業主管機關核准者應附核准文件。
適用辦理方式: 變更編定
觸發條件: 非都市土地申請使用地變更編定
回答型態: 是否
資料來源／判斷依據: 興辦事業用途
進綜理表: 是
評估事項: 使用地變更
○△╳判定邏輯(初擬): ○:用途屬第八點列舉款次之一／△:用途性質相近但未明文列舉（如儲能設備），待目的事業主管機關認定／╳:非列舉用途且非政府、公營興辦
因應手段: 改以其他適當使用地類別申請；或由目的事業主管機關認定所屬款次
手段法源: —
手段門檻: —
時程約束: 接案初期
完成後可升級為○: —
核對狀態: 已核對(內政部 glrs.moi.gov.tw FL003207 第1～10點，2026-11-12 知識庫拆條；71層 非都市土地變更編定執行要點-重點)
覆寫/從屬總編規則: —
