rule_id: LUR-007
法規: 非都市土地使用管制規則
法規代碼: D0060013
現行版本: （現行）
編: null
條號: '7'
條文要旨: 山坡地範圍內森林區、山坡地保育區及風景區之土地，在未編定使用地之類別前，【適用林業用地之管制】。→ 地籍使類為「暫未編定」者，容許使用（附表一）與變更原則（附表三）一律比照林業用地判斷，不可視為無管制。
適用辦理方式: 容許使用／變更編定／開發許可
觸發條件: 基地位於山坡地範圍內之森林區、山坡地保育區或風景區，且使類為暫未編定（空白或「暫未編定」）
回答型態: 說明
資料來源／判斷依據: 基地.shp 使分＋使類（暫未編定）＋NGIS 山坡地套疊
進綜理表: 是
評估事項: 使用地變更
○△╳判定邏輯(初擬): 不單獨判定；說明暫未編定部分比照林業用地之結論，併入使用地變更列
因應手段: —（法定適用，依林業用地路徑辦理）
手段法源: —
手段門檻: —
時程約束: —
完成後可升級為○: 否
核對狀態: 已核對(2026-10-13 全國法規資料庫 D0060013 第7條官方原文核對（基隆七堵自強段養生村案）)
覆寫/從屬總編規則: LUR-006 容許使用、LUR-027 附表三之前提
