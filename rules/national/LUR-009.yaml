rule_id: LUR-009
法規: 非都市土地使用管制規則
法規代碼: D0060013
現行版本: 115.05.27
編: —
條號: '9'
條文要旨: 非都市土地建蔽率／容積率上限（★§9 無附表，上限列在第一項條文）：甲建、乙建60%/240%；丙建40%/120%；丁建70%/300%；窯業60%/120%；交通、遊憩、殯葬40%/120%；【特定目的事業用地60%/180%】；縣市得酌予調降。Ⅱ核定開發計畫之工商綜合區特定專用區、非製造業工業區之特目用地依核定計畫；Ⅲ依工輔法§28-10變更之特目用地建蔽率不受60%限制但≤70%；Ⅳ主管機關核定之土地使用計畫低於上限者依核定計畫管制；Ⅴ其他使用地由各中央主管機關訂定。
適用辦理方式: 變更編定／開發許可
觸發條件: 變更編定為建築用地或特目用地，或既有特目用地擴建
回答型態: 6實質計算
資料來源／判斷依據: 配置圖各棟建築面積與樓地板面積；原核准興辦事業計畫之核定強度
進綜理表: 是
評估事項: 使用強度
○△╳判定邏輯(初擬): ○:全案建蔽／容積在法定上限及原核定計畫值內／△:超過原核定值但在法定上限內（須辦興辦事業計畫變更）／╳:超過法定上限
因應手段: 調整配置或樓層；超過原核定值者辦理興辦事業計畫變更
手段法源: 管制規則§9Ⅳ、§30
手段門檻: 特目60%/180%；丁建70%/300%
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫 D0060013 115.05.27 版逐字核對，2026-11-13；71層 非都市土地使用管制規則-重點)
覆寫/從屬總編規則: 開發許可案另受核定開發計畫管制（§9Ⅱ）
