rule_id: LUR-011
法規: 非都市土地使用管制規則
法規代碼: D0060013
現行版本: （現行）
編: —
條號: '11'
條文要旨: 申請開發達一定規模應辦理使用分區變更：鄉村區社區計畫50戶或1公頃以上；工業區10公頃以上(產創5公頃)；特定專用區—遊憩5公頃、學校10公頃、高爾夫10公頃、公墓5公頃、其他殯葬2公頃、【其他開發2公頃以上】
適用辦理方式: L0分流
觸發條件: 基地總面積
回答型態: 6實質計算
資料來源／判斷依據: joined shp 面積合計
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:達2公頃可循分區變更（特定專用區）／△:接近門檻須確認計算基準／╳:未達規模不得辦分區變更（應改走變更編定或容許使用）
因應手段: 面積未達門檻者改走變更編定或容許使用路線
手段法源: 管制規則§27~§30
手段門檻: 2公頃（其他開發）
時程約束: 接案初期分流
完成後可升級為○: 不適用（分流用）
核對狀態: 已核對(全國法規資料庫 D0060013 §11)
覆寫/從屬總編規則: —
