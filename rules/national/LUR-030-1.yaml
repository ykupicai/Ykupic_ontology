rule_id: LUR-030-1
法規: 非都市土地使用管制規則
法規代碼: D0060013
現行版本: 115.05.27
編: —
條號: 30-1
條文要旨: 依§30擬具之興辦事業計畫，不得位於區域計畫規定之第一級環境敏感地區
適用辦理方式: 變更編定
觸發條件: 走變更編定且命中第一級環敏
回答型態: 2不適用／6實質計算
資料來源／判斷依據: 環境敏感套疊.csv（第一級項目）
進綜理表: 是
評估事項: 環境敏感
○△╳判定邏輯(初擬): ○:無第一級套疊／△:符合§30-1明文例外之一且待主管機關書面意見／╳:命中第一級且無明文例外（不建議辦理變更編定）
因應手段: 先停止可行性承諾；確認命中項目與主管機關；回查該敏感項目中央目的事業法令是否有明文例外；取得書面意見
手段法源: 管制規則§30-1~§30-4
手段門檻: —
時程約束: 接案初期停止檢核
完成後可升級為○: 部分（例外成立才可）
核對狀態: 已核對(衍古30_通用實務「第一級環境敏感地開發限制」)
覆寫/從屬總編規則: —
