rule_id: LUR-030-2
法規: 非都市土地使用管制規則
法規代碼: D0060013
現行版本: （現行）
編: —
條號: 30-2
條文要旨: 興辦事業計畫範圍內有夾雜第一級環境敏感地區之零星土地，須符合四款始得納入：①基於整體開發規劃需要 ②維持原使用分區及原使用地類別（或同意變更為國土保安用地）③【面積不超過基地開發面積百分之十】④擬定管理維護措施
適用辦理方式: 變更編定
觸發條件: 走變更編定且命中第一級環敏零星夾雜
回答型態: 2不適用／6實質計算
資料來源／判斷依據: 環境敏感套疊.csv（第一級項目）＋基地面積（算夾雜比例）
進綜理表: 是
評估事項: 環境敏感
○△╳判定邏輯(初擬): ○:無夾雜／△:夾雜≤10%且四款可符合（待主管機關認定）／╳:夾雜逾10%
因應手段: 維持原地形地貌不開發、擬定管理維護措施後納入
手段法源: 管制規則§30-2
手段門檻: 10%
時程約束: 送件前
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫逐條抄錄)
覆寫/從屬總編規則: —
