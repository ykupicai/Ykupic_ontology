rule_id: LUR-030-3
法規: 非都市土地使用管制規則
法規代碼: D0060013
現行版本: 115.05.27
編: —
條號: 30-3
條文要旨: ★依§30擬具之興辦事業計畫【位於第二級環境敏感地區】者，應說明下列事項並徵詢各項環境敏感地區之中央法令規定之目的事業主管機關意見：一、就所屬環境敏感地區特性提出具體防範及補救措施，並不得違反各項環境敏感地區劃設所依據之中央目的事業法令之禁止或限制規定。二、就所屬環境敏感地區特性規範土地使用種類及強度。★走變更編定引本條；走開發許可引開發審議規範§9-4，兩套條號不可互換
適用辦理方式: 變更編定
觸發條件: 走變更編定且命中第二級環敏
回答型態: 6實質計算
資料來源／判斷依據: 環境敏感套疊.csv（第二級項目）＋需函詢各該主管機關
進綜理表: 是
評估事項: 環境敏感
○△╳判定邏輯(初擬): ○:無第二級套疊／△:有套疊，須提防範補救措施並徵詢主管機關（結果未定）／╳:違反該敏感項目中央法令禁止規定
因應手段: 提具體防範及補救措施、規範使用種類強度並函詢各該主管機關
手段法源: 管制規則§30-3
手段門檻: —
時程約束: 送件前取得書面意見
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫逐條抄錄)
覆寫/從屬總編規則: —
