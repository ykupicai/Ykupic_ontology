rule_id: LUR-030-4
法規: 非都市土地使用管制規則
法規代碼: D0060013
現行版本: 115.05.27
編: —
條號: 30-4
條文要旨: 依§30擬具之興辦事業計畫【位屬原住民保留地】者，在不妨礙國土保安、環境資源保育、原住民生計及原住民行政之原則下，得為觀光遊憩、加油站、農產品集貨場倉儲設施、原住民文化保存、【社會福利】及其他經中央原住民族主管機關同意興辦之事業，【不受§30-1（第一級環敏）限制】。
適用辦理方式: 變更編定
觸發條件: 走變更編定且基地位屬原住民保留地
回答型態: 2不適用／3遵照辦理
資料來源／判斷依據: 地籍登記（標示部註記原住民保留地）；原住民保留地圖層
進綜理表: 是
評估事項: 土地權屬
○△╳判定邏輯(初擬): ○:非原住民保留地／△:位屬保留地且事業在列舉內，或列舉外待原民會同意（另須 IRL-24、IPA-21）／╳:列舉外且原民會不同意
因應手段: 確認事業類別是否在列舉內；列舉外者函請原民會同意
手段法源: 管制規則§30-4；原住民保留地開發管理辦法§24
手段門檻: —
時程約束: 接案初期
完成後可升級為○: 部分（土地取得仍依 IRL-24）
核對狀態: 已核對(全國法規資料庫 D0060013 115.05.27 版逐字核對，2026-11-13；71層 非都市土地使用管制規則-重點)
覆寫/從屬總編規則: 排除 LUR-030-1；開發許可路徑見 GEN-011
