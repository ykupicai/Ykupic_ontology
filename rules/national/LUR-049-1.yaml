rule_id: LUR-049-1
法規: 非都市土地使用管制規則
法規代碼: D0060013
現行版本: 115.05.27 修正
編: —
條號: 49-1
條文要旨: 縣市受理變更編定案件，除§28Ⅱ免擬興辦事業計畫、非山坡地、經區委會審議通過或§48Ⅰ②③情形外，【應組專案小組審查】。專案小組審查【山坡地變更編定】案件時，興辦事業計畫範圍內土地經依建築相關法令認定有下列情形者【不得規劃作建築使用】：一、坡度陡峭；二、地質結構不良、地層破碎、【活動斷層】或順向坡有滑動之虞；三、現有礦場、廢土堆、坑道及其周圍有危害安全之虞；四、河岸侵蝕或向源侵蝕有危及基地安全之虞；五、有崩塌或洪患之虞；六、依其他法律規定不得建築。
適用辦理方式: 變更編定（山坡地）
觸發條件: 山坡地範圍內申請使用地變更編定（未經區委會審議者）
回答型態: 6實質計算
資料來源／判斷依據: 山坡地範圍；坡度、地質（活動斷層、順向坡）、河岸、崩塌洪患套疊；技師簽證之不得規劃建築使用評估
進綜理表: 是
評估事項: 地形坡度
○△╳判定邏輯(初擬): ○:非山坡地／△:山坡地，須提專案小組並附不得規劃建築使用評估（建築配置避開六款範圍）／╳:建築配置無法避開六款範圍
因應手段: 建築物配置避開不得規劃建築範圍，該範圍改作開放空間；委託技師辦理評估並簽證
手段法源: 建築技術規則建築設計施工編§262；變更編定執行要點第二點
手段門檻: 依 BTR-262 各款門檻
時程約束: 變更編定審查
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫 D0060013 115.05.27 版 §49-1，2026-11-12 知識庫拆條；71層 非都市土地使用管制規則-重點)
覆寫/從屬總編規則: 認定基準見 BTR-262；書件見 LCE-3（執行要點第二點）
