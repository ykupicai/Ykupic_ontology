rule_id: LUR-052-1
法規: 非都市土地使用管制規則
法規代碼: D0060013
現行版本: （現行）
編: —
條號: 52-1
條文要旨: ★興辦事業計畫土地【位屬山坡地範圍】者，面積【不得少於10公頃】。十款例外：①依§6容許使用 ②依§31~§35-1、§40、§42-1、§45、§46、§46-1辦理 ③【興闢公共設施、公用事業、慈善、社會福利、醫療保健、教育文化事業或其他公共建設所必要之設施，經依中央目的事業主管機關訂定之審議規範核准】④地方需要並經中央農業主管機關專案輔導之政策性或公用性農業產銷設施 ⑤遊憩設施土地面積達5公頃以上 ⑥風景區內遊憩設施經報奉行政院核定 ⑦農村社區土地重劃 ⑧國防設施 ⑨取得特定工廠登記 ⑩依其他法律規定得為建築使用
適用辦理方式: 變更編定
觸發條件: 基地位屬山坡地範圍
回答型態: 6實質計算
資料來源／判斷依據: 環境敏感套疊.csv（山坡地範圍）＋基地面積
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:≥10公頃；或位於山坡地且經縣市政府依光電審查作業要點審查符合變更規定（★該要點第七點明文得適用第三款公用事業、免受10公頃限制）／△:未達10公頃且尚未經縣市政府審查認定／╳:未達10公頃且無例外可主張
因應手段: ★依非都市土地申請變更為太陽光電發電設施使用興辦事業計畫審查作業要點【第七點】主張適用第三款公用事業（明文授權，非個案主張）；或擴大基地至10公頃
手段法源: 管制規則§52-1Ⅰ③＋光電審查作業要點第七點＋再生能源發展條例§15Ⅰ
手段門檻: 10公頃
時程約束: 接案初期分流
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫逐條抄錄)
覆寫/從屬總編規則: —
