rule_id: MED-1-1
法規: 都市計畫農業區保護區變更為醫療專用區回饋處理原則
法規代碼: FL003631
現行版本: 93.02.19 台內營字第0930082119號函修正（86.08.05 公發布；法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 壹之壹
條文要旨: 申請變更之農業區、保護區土地位於山坡地者，除應符合山坡地建築管理辦法外：(一)坵塊圖平均坡度【40%以上】應維持原始地貌、林相，不得變更及開發利用，且不得計入申請變更面積；(二)平均坡度【30%至40%】以作為開放性公共設施（公園、綠地、道路等）為限，不得建築使用；(三)其餘得依整體規劃開發建築。
適用辦理方式: 都計變更
觸發條件: 都市計畫農業區或保護區申請變更為醫療專用區
回答型態: 6實質計算
資料來源／判斷依據: 坵塊圖坡度分析（限山坡地）
進綜理表: 是
評估事項: 地形坡度
○△╳判定邏輯(初擬): ○:非山坡地，或坡度<30%／△:含30～40%須配置為開放性公設／╳:坡度≥40%部分不得計入且不得開發
因應手段: —
手段法源: —
手段門檻: 30%／40%
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(內政部 glrs.moi.gov.tw FL003631 原文壹～柒，2026-11-12 知識庫拆條；71層 都市計畫農業區保護區變更為醫療專用區回饋處理原則-重點)
覆寫/從屬總編規則: 醫療專用區專則，優先於 FL003637（UAG 系列）同類規定；未規定事項由 UAG 補充
