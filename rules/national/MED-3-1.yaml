rule_id: MED-3-1
法規: 都市計畫農業區保護區變更為醫療專用區回饋處理原則
法規代碼: FL003631
現行版本: 93.02.19 台內營字第0930082119號函修正（86.08.05 公發布；法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 參一、三、四
條文要旨: 依醫療專用區事業需求自行規劃出入道路、公共停車場、公園、綠地、體育場所、兒童遊樂場、廣場、消防、上下水道、污水處理及環保設施等【必要性服務設施】，面積【不得低於申請變更土地總面積30%】；其中申請範圍內聯外出入道路應劃設為都市計畫【道路用地】並於開發完成後【捐贈】予縣市，其餘均規劃為醫療專用區、產權仍屬原所有權人。可建築基地扣除必要性服務設施後分別計算建蔽率、容積率；配置區位應納入主要計畫及細部計畫書圖。
適用辦理方式: 都計變更
觸發條件: 都市計畫農業區或保護區申請變更為醫療專用區
回答型態: 6實質計算
資料來源／判斷依據: 土地使用計畫面積表
進綜理表: 是
評估事項: 規劃配置
○△╳判定邏輯(初擬): ○:必要性服務設施≥30%／△:接近門檻須調整配置／╳:—（屬規劃義務）
因應手段: 調整配置
手段法源: —
手段門檻: 30%
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(內政部 glrs.moi.gov.tw FL003631 原文壹～柒，2026-11-12 知識庫拆條；71層 都市計畫農業區保護區變更為醫療專用區回饋處理原則-重點)
覆寫/從屬總編規則: 醫療專用區專則，優先於 FL003637（UAG 系列）同類規定；未規定事項由 UAG 補充
