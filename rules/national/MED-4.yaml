rule_id: MED-4
法規: 都市計畫農業區保護區變更為醫療專用區回饋處理原則
法規代碼: FL003631
現行版本: 93.02.19 台內營字第0930082119號函修正（86.08.05 公發布；法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 肆
條文要旨: 為回饋地方，開發者經都委會決議，應提供醫療專用區內建築物總樓地板面積【至少10%以上之室內公益性空間】，供縣市政府或鄉鎮市公所作地方公共衛生、教育、文化活動使用；建物所有權仍屬開發者，使用面積、性質、範圍另行議定並納入細部計畫書。
適用辦理方式: 都計變更
觸發條件: 都市計畫農業區或保護區申請變更為醫療專用區
回答型態: 6實質計算
資料來源／判斷依據: 建築計畫總樓地板面積
進綜理表: 是
評估事項: 規劃配置
○△╳判定邏輯(初擬): ○:規劃室內公益空間≥10%／△:比例與使用方式待與地方政府議定／╳:—
因應手段: —
手段法源: —
手段門檻: 總樓地板10%
時程約束: 都委會審議
完成後可升級為○: 可
核對狀態: 已核對(內政部 glrs.moi.gov.tw FL003631 原文壹～柒，2026-11-12 知識庫拆條；71層 都市計畫農業區保護區變更為醫療專用區回饋處理原則-重點)
覆寫/從屬總編規則: 醫療專用區專則，優先於 FL003637（UAG 系列）同類規定；未規定事項由 UAG 補充
