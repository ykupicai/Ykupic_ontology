rule_id: MED-5
法規: 都市計畫農業區保護區變更為醫療專用區回饋處理原則
法規代碼: FL003631
現行版本: 93.02.19 台內營字第0930082119號函修正（86.08.05 公發布；法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 伍
條文要旨: 基地範圍外，地方政府配合依現行都市計畫優先開闢或拓寬之相關聯外道路【工程費用】（不含土地取得經費），由開發者負擔。
適用辦理方式: 都計變更
觸發條件: 都市計畫農業區或保護區申請變更為醫療專用區
回答型態: 3遵照辦理
資料來源／判斷依據: —
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): 財務負擔揭露，不判○△╳
因應手段: —
手段法源: —
手段門檻: —
時程約束: 開發期間
完成後可升級為○: —
