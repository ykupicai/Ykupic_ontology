rule_id: MED-6
法規: 都市計畫農業區保護區變更為醫療專用區回饋處理原則
法規代碼: FL003631
現行版本: 93.02.19 台內營字第0930082119號函修正（86.08.05 公發布；法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 陸、柒
條文要旨: 經都委會審議通過後，開發者對依決議所作之自願捐贈或負擔承諾，應與縣市政府【簽訂協議書】並納入計畫書，始得核定或備案公告發布實施。自治條例或主要計畫通盤檢討書另有規定，或屬配合國家重大建設者，得經內政部都委會審決不適用本原則全部或一部；未規定事項以內政部都委會決議為準。
適用辦理方式: 都計變更
觸發條件: 都市計畫農業區或保護區申請變更為醫療專用區
回答型態: 3遵照辦理
資料來源／判斷依據: —
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): 程序條，不判○△╳
因應手段: —
手段法源: —
手段門檻: —
時程約束: 都委會審議通過後
完成後可升級為○: —
