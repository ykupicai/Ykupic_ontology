rule_id: MRT-001
法規: 大眾捷運法／大眾捷運系統兩側禁建限建辦法
法規代碼: K0120001／K0120007
現行版本: 大眾捷運法 115.01.14 修正；禁建限建辦法 113.11.19 修正（交通部會同內政部）
編: null
條號: 法§45～§45-3；辦法§6、§7、§9、§22
條文要旨: 主管機關於捷運路線經行政院核定後，會同當地政府於兩側勘定並公告【禁建或限建範圍】，不受相關土地使用管制法令限制（法§45）。【禁建範圍】（辦法附件一）內除捷運設施、連通設施或開發建築物外，不得建造建築物、構築工程設施、設置廣告物、堆置障礙物、土地開挖或其他妨礙捷運安全之工程行為（法§45-1、辦法§6）；公告前既存合法建物得按現狀使用，僅得修繕或拆除、不得增建改建（辦法§22）。【限建範圍】（辦法附件二）內建造建築物、工程設施、廣告物、地基調查鑽孔、抽降地下水、管線開挖、地下構造物拆除等行為，主管機關核准前應先會商捷運主管機關（法§45-2、辦法§7）；申請建造、拆除、雜項執照須另附安全影響評估報告、監測計畫等，由建管機關會商捷運主管機關審核同意（辦法§9）。
適用辦理方式: 全部（都會區）
觸發條件: 基地與 NGIS 2-31 大眾捷運系統兩側禁建限建地區有交集
回答型態: 是否
資料來源／判斷依據: NGIS 2-31 圖層。⚠ 面積要取【聯集】不可相加——NGIS 對本圖層逐面各回一列且彼此重疊（內湖案三面：環狀線、環北_二側限建範圍、NH-ALING限建線，相加 50.3% vs 聯集 36.04%，高估四成）。⚠ 禁限建的成因不必然是現有營運路線：內湖案文湖線雖通過基地南側，但該範圍實來自環狀線與環北段（規劃中路線），歸因寫錯會被審查抓
進綜理表: 是
評估事項: 大眾捷運系統兩側禁建限建
○△╳判定邏輯(初擬): ○:未位於禁建、限建範圍／△:位於限建範圍，建築配置與開挖須捷運主管機關審核（影響地下室、基礎設計與時程）／╳:位於禁建範圍（捷運設施或聯合開發建築物除外）
因應手段: 建築配置與開挖深度洽該市捷運工程局核准
手段法源: ★待補
手段門檻: null
時程約束: null
完成後可升級為○: 是
