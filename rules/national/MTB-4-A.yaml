rule_id: MTB-4-A
法規: 汽車運輸業審核細則（§4 附件 汽車運輸業停車場設置規定）
法規代碼: K0040004
現行版本: 115.08.31 修正（交通部）
編: —
條號: §4 附件 第三～九點
條文要旨: 汽車運輸業停車場（路外停車場）：非都市土地範圍內者應符合非都市土地使用管制規則（第三點）。【出入口】不得設於道路交岔分叉路口、圓環、平交道10公尺內；消防隊、公共消防栓10公尺內；公共汽車招呼站及加油站10公尺內；學校、戲院門前兩側30公尺內——經交通工程改善並經縣市政府確認無妨礙者不在此限（第四點）。應懸掛公司名稱標牌並設周圍圍籬（第五點）。【停車位數】按營業車輛數1/8換算（遊覽車客運業1/10）（第六點）。【場內通行車道面積≥停車場總面積10%】；車位尺寸：小型客貨車5.25×2.5公尺、大型客車12×3、大型貨車11×3、曳引車6×3、拖車12×3（第七點）。申請文件含3個月內土地使用分區證明；租用或借用契約年限不得少於2年（公有地不少於1年）（第九點）。
適用辦理方式: 變更編定
觸發條件: 興辦汽車運輸業場站之停車場（交通用地變更編定）
回答型態: 6實質計算
資料來源／判斷依據: 基地出入口周邊10／30公尺內設施（路口、消防栓、站牌、加油站、學校）；配置圖車道與車位尺寸；租約年限
進綜理表: 是
評估事項: 規劃配置
○△╳判定邏輯(初擬): ○:出入口避開限制範圍、車道≥10%、車位尺寸與數量符合、租約≥2年／△:出入口落在限制範圍須交通工程改善並經縣市確認，或租約待補／╳:—
因應手段: 調整出入口位置或辦理交通工程改善；租約延長至2年以上
手段法源: 附件第四點但書
手段門檻: 10／30公尺；車道10%；車位1/8；租約2年
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫 K0040004 §4 及附件「汽車運輸業停車場設置規定」官方 PDF，2026-11-12 知識庫拆條；71層 汽車運輸業審核細則與停車場法-場站-重點)
覆寫/從屬總編規則: MTB-4 第四款站場設備之附件；縣市依停車場法§23另訂設置規定者從其規定（PKA-23）
