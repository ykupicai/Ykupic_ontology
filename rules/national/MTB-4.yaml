rule_id: MTB-4
法規: 汽車運輸業審核細則
法規代碼: K0040004
現行版本: 115.08.31 修正（交通部）
編: —
條號: §4
條文要旨: 公路主管機關核准汽車運輸業籌設，應合於：(一)合於當地運輸需要（至少一目）；(二)增進公眾便利；(三)具充分經營財力（最低資本額，如汽車貨運業2,500萬元、汽車貨櫃貨運業3,000萬元、汽車路線貨運業5,000萬元）；(四)具足夠車輛及站場設備（如汽車貨運業全新貨車20輛以上）；站場設備含營業所站、【汽車運輸業停車場設置規定（附件）】——停車場所在地縣市依停車場法§23另訂設置規定者從其規定，並應設乙種以上汽車修理廠或委託代辦。
適用辦理方式: 變更編定
觸發條件: 興辦汽車運輸業場站（交通用地變更編定）
回答型態: 3遵照辦理
資料來源／判斷依據: 業者籌設計畫；縣市停車場設置規定
進綜理表: 是
評估事項: —
○△╳判定邏輯(初擬): ○:已取得公路主管機關籌設核准／△:籌設申請中，停車場規模須符合設置規定／╳:—
因應手段: 依附件或縣市規定規劃停車場面積
手段法源: —
手段門檻: —
時程約束: 興辦事業計畫申請前
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫 K0040004 §4 及附件「汽車運輸業停車場設置規定」官方 PDF，2026-11-12 知識庫拆條；71層 汽車運輸業審核細則與停車場法-場站-重點)
覆寫/從屬總編規則: PTH-TRA-2（屏東縣）
