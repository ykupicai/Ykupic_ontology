rule_id: NPL-3
法規: 國有非公用土地提供申請開發案件處理要點
法規代碼: GL008781(財政部)
現行版本: 112.09.15 台財產管字第11240009760號令
編: —
條號: 第三點
條文要旨: 申請開發範圍內之國有土地，除下列情形外得同意提供申請開發：(一)經行政院、財政部、國產署或執行機關核定計畫、用途或處理方式；(二)經政府機關申請撥用或保留公用；(三)【位於都市計畫範圍內】；(四)屬【林班地、保安林地】；(五)已有民眾申請增劃編為原住民保留地；(六)國有土地面積達申請開發範圍總面積【50%以上】；(七)被占用且占用人涉竊佔偵辦中；(八)被占用（經目的事業主管機關確認有輔導合法化必要者除外）；(九)已提供使用權（申請人為使用權人且無違約者除外）；(十)不符法令得辦理處分及收益；(十一)經財政部或相關主管機關認定不宜。興辦【公用事業】者不受第三款、第四款之保安林地、第六款、第八款、第九款限制（須附保安林主管機關無妨礙證明、地上物切結等）。（相關：國有財產法§53，非公用空地未達1,650㎡得標售，1,650㎡以上不得標售）
適用辦理方式: 全路線
觸發條件: 申請開發範圍內含國有非公用土地，須取具國有土地同意合併開發證明
回答型態: 6實質計算
資料來源／判斷依據: 地籍清冊（管理機關＝財政部國有財產署）；都市計畫範圍；保安林套疊
進綜理表: 是
評估事項: 土地權屬
○△╳判定邏輯(初擬): ○:無國有地，或國有地不屬十一款情形／△:有國有地，同意合併開發待國產署核發意向書／╳:屬十一款情形之一且非公用事業（例：都市計畫範圍內、國有地≥50%）
因應手段: 剔除國有地；或改循讓售、標售（國有財產法§53 面積限制）；公用事業者附證明文件申請
手段法源: GL008781 第三點第二項；國有財產法§53
手段門檻: 國有地面積50%
時程約束: 送件前
完成後可升級為○: 可
核對狀態: 已核對(財政部主管法規共用系統 law-out.mof.gov.tw GL008781 第三點，2026-11-12 知識庫拆條；71層 國有非公用土地提供申請開發案件處理要點-重點)
覆寫/從屬總編規則: —
