rule_id: NSP-023
法規: 國土計畫法
法規代碼: D0070230
現行版本: 114.01.20 修正
編: —
條號: 23Ⅱ但書
條文要旨: 國土功能分區之使用地編定、容許使用、禁止或限制使用等管制規則由中央主管機關定之；【但屬實施都市計畫或國家公園計畫者，仍依都市計畫法、國家公園法及其相關法規實施管制】。
適用辦理方式: 容許使用／變更編定／使用許可／都計變更
觸發條件: 基地位於都市計畫區或國家公園範圍
回答型態: 是否
資料來源／判斷依據: 都市計畫或國家公園範圍套疊
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:基地位於非都市土地，依國土計畫（新制）或區域計畫（舊制）路徑檢核／△:基地跨都市計畫區或國家公園界線，兩側分別適用不同法制／╳:—（本條僅決定適用法制）
因應手段: 都市計畫區內改查都市計畫法體系；國家公園內改查國家公園法體系
手段法源: 國土計畫法§23Ⅱ但書
手段門檻: —
時程約束: 接案初期分流
完成後可升級為○: —
