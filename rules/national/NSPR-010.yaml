rule_id: NSPR-010
法規: 國土計畫使用許可審議規則
法規代碼: D0070310
現行版本: 114.05.01 訂定（尚未施行）
編: —
條號: '10'
條文要旨: 申請案件應【至少設置二條聯絡道路】各自連結聯外道路，一條作為主要聯絡道路，另一條作為能容納消防車通行之緊急通路，並應符合條文附表設置基準（表格見全文檔案，未抄錄）；【附表未列之使用計畫，主要聯絡道路路寬不得小於 8 公尺】。經審議會徵詢交通主管機關，認定情況特殊且足供需求、無影響安全之虞者，得不受限制。
適用辦理方式: 使用許可（國土計畫法）
觸發條件: 本法規施行，且基地所在縣市國土功能分區圖公告實施後（區域計畫法停止適用後）；案件須申請使用許可（海洋資源地區除外，§28）
回答型態: 6實質計算
資料來源／判斷依據: 聯絡道路調查（條數、路寬、是否連通聯外道路）＋§10 附表各使用計畫基準
進綜理表: 是
評估事項: 交通
○△╳判定邏輯(初擬): ○:二條聯絡道路，主要聯絡道路寬度符合附表（未列者≥8公尺）／△:僅一條或寬度不足，須主張情況特殊並徵詢交通主管機關／╳:無聯絡道路可連通聯外道路
因應手段: 拓寬道路或取得通行權；主張§10Ⅱ情況特殊
手段法源: 審議規則§10Ⅱ
手段門檻: 2 條；附表未列者主要聯絡道路≥8公尺
時程約束: 選址階段
完成後可升級為○: 可
核對狀態: '已核對(全國法規資料庫全文，2026-11-20 TN 逐字比對原文後撰寫；2026-11-23 TN 自行轉正（review_mode: self），每月抽查)；⚠ 本法規尚未施行（全國法規資料庫標示尚未生效、施行日期由中央主管機關定之，2026-11-20 查證），現行案件不得據以檢核'
