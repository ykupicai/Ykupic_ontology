rule_id: NSPR-014
法規: 國土計畫使用許可審議規則
法規代碼: D0070310
現行版本: 114.05.01 訂定（尚未施行）
編: —
條號: '14'
條文要旨: 申請人應依使用需求及環境特性，於使用範圍內設置公共設施或必要性服務設施：道路人行道、公共停車場、污水廢棄物等環保設施、雨水排放與滯洪設施、水電公用設施、植栽景觀、服務管理中心、公園綠地廣場等；【屬住宅使用計畫者，最少每人 3 平方公尺作為公園使用，且應集中規劃並緊臨住宅區】，並設社區中心。屬國土計畫法§29 公共設施或住宅使用計畫者，應提出公共設施規劃載明於使用計畫書，分期分區者並提分期分區計畫。
適用辦理方式: 使用許可（國土計畫法）
觸發條件: 本法規施行，且基地所在縣市國土功能分區圖公告實施後（區域計畫法停止適用後）；案件須申請使用許可
回答型態: 逐點檢核
資料來源／判斷依據: 土地使用配置圖、計畫人口
進綜理表: 是
評估事項: 規劃配置
○△╳判定邏輯(初擬): ○:各項必要公設已配置；住宅案公園≥每人3㎡且集中緊鄰住宅區／△:部分公設待補配置／╳:住宅案公園面積不足
因應手段: —
手段法源: —
手段門檻: 住宅：公園每人≥3㎡
時程約束: 規劃配置階段
完成後可升級為○: 可
核對狀態: '已核對(全國法規資料庫全文，2026-11-20 TN 逐字比對原文後撰寫；2026-11-23 TN 自行轉正（review_mode: self），每月抽查)；⚠ 本法規尚未施行（全國法規資料庫標示尚未生效、施行日期由中央主管機關定之，2026-11-20 查證），現行案件不得據以檢核'
