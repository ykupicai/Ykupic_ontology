rule_id: NSPR-015
法規: 國土計畫使用許可審議規則
法規代碼: D0070310
現行版本: 114.05.01 訂定（尚未施行）
編: —
條號: '15'
條文要旨: 範圍內原始地形於坵塊圖上【平均坡度 30% 以上之地區，不得作為建築基地】：30% 以上未超過 40% 之地區，以作為開放性公共設施或必要性服務設施使用為限；【40% 以上為不可使用區】，應維持原始地形地貌，但因整體規劃需要經審議會同意，得規劃其面積 20% 作道路、公園、綠地及滯洪池等使用並免計入不可使用區。例外：§16 掩埋場、土石採取等使用階段，§25 專案輔導合法案件另依其規定。
適用辦理方式: 使用許可（國土計畫法）
觸發條件: 本法規施行，且基地所在縣市國土功能分區圖公告實施後（區域計畫法停止適用後）；案件須申請使用許可，且基地有坡地
回答型態: 6實質計算
資料來源／判斷依據: 坵塊圖平均坡度分析
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:建築配置均位於平均坡度<30% 區域／△:30%～40% 區域僅作開放性公設，或40% 以上區域擬動用 20% 須審議會同意／╳:建築基地位於平均坡度≥30% 區域
因應手段: 調整配置避開陡坡；40% 以上區域主張 20% 例外
手段法源: 審議規則§15②但書
手段門檻: 30%／40%；例外 20%
時程約束: 規劃配置階段
完成後可升級為○: 可
核對狀態: '已核對(全國法規資料庫全文，2026-11-20 TN 逐字比對原文後撰寫；2026-11-23 TN 自行轉正（review_mode: self），每月抽查)；⚠ 本法規尚未施行（全國法規資料庫標示尚未生效、施行日期由中央主管機關定之，2026-11-20 查證），現行案件不得據以檢核'
