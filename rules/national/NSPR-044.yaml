rule_id: NSPR-044
法規: 國土計畫使用許可審議規則
法規代碼: D0070310
現行版本: 114.05.01 訂定（尚未施行）
編: —
條號: 44～46
條文要旨: 城鄉發展地區許可條件：§44 應分析所在縣市人口年齡結構、成長與分布、交通與公設服務水準、【同性質使用土地之分布、使用及閒置狀況】，從供需面說明實際使用需求，並徵詢目的事業主管機關意見或取得意見文件。§45 說明維生、教育、生活、安全、交通等公共設施或公共建設計畫之配合情形，無法配合者應提具體替代措施經審議會同意。§46 應視需要規劃或提供大眾運輸服務或設施。
適用辦理方式: 使用許可（國土計畫法）
觸發條件: 本法規施行，且基地所在縣市國土功能分區圖公告實施後（區域計畫法停止適用後）；案件須申請使用許可，且基地位於城鄉發展地區
回答型態: 說明
資料來源／判斷依據: 人口統計、同性質土地供給與閒置調查、公共設施服務現況
進綜理表: 是
評估事項: 供需分析
○△╳判定邏輯(初擬): ○:供需分析可說明需求且公設可配合／△:部分公設無法配合，須提替代措施經審議會同意／╳:同性質土地閒置充足，無法說明需求
因應手段: 提出替代措施（自設維生設施、接駁運輸等）
手段法源: 審議規則§45Ⅱ
手段門檻: —
時程約束: 使用計畫書撰擬階段
完成後可升級為○: —
核對狀態: '已核對(全國法規資料庫全文，2026-11-20 TN 逐字比對原文後撰寫；2026-11-23 TN 自行轉正（review_mode: self），每月抽查)；⚠ 本法規尚未施行（全國法規資料庫標示尚未生效、施行日期由中央主管機關定之，2026-11-20 查證），現行案件不得據以檢核'
