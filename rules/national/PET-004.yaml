rule_id: PET-004
法規: 非都市土地申請變更為寵物生命紀念設施使用興辦事業計畫審查作業要點
法規代碼: GL001615
現行版本: 115.06.15 農護字第1150072522號令（112.07.11 訂定；農業部，法源＝管制規則§30Ⅳ）
編: —
條號: 第四點
條文要旨: 土地條件：(一)面積不得少於【0.2公頃】；位於山坡地範圍內者不得少於【10公頃】，但①政府興辦 ②民間興辦使用【殯葬用地】設置含寵物屍體存放及處理設施及其他生命紀念設施，並經直轄市、縣（市）政府認定具公益性者，得認定符合管制規則§52-1第三款公共設施、免受10公頃限制；(二)建蔽率≤60%、容積率≤180%；(三)留設綠地≥申請變更編定土地面積20%。申請面積累計【達2公頃以上】者，應依管制規則第三章及開發審議作業規範辦理使用分區變更。
適用辦理方式: 變更編定
觸發條件: 用途=寵物生命紀念設施（非都市土地變更為特定目的事業用地）
回答型態: 6實質計算
資料來源／判斷依據: 基地登記面積（以相連塊計）＋環敏山坡地套疊
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:非山坡地≥0.2公頃，或山坡地≥10公頃／△:山坡地未達10公頃但屬政府興辦或殯葬用地待認定公益性／╳:山坡地未達10公頃且非上述例外；達2公頃另走開發許可
因應手段: 整併土地至相連≥10公頃；或改用殯葬用地並申請公益性認定
手段法源: GL001615第四點第一項第一款；管制規則§52-1Ⅰ③
手段門檻: 0.2公頃／10公頃／2公頃
時程約束: 接案初期分流
完成後可升級為○: 可
核對狀態: 已核對(農業部 law.moa.gov.tw GL001615 要點本文＋115修正版附件一原文逐點抄錄，2026-10-22 下載；萬里加投段案)；2026-11-12 知識庫回官方原文抽核相符（71層 非都市土地申請變更為寵物生命紀念設施使用興辦事業計畫審查作業要點-重點）
覆寫/從屬總編規則: LUR-052-1、LUR-011
