rule_id: PET-005
法規: 非都市土地申請變更為寵物生命紀念設施使用興辦事業計畫審查作業要點
法規代碼: GL001615
現行版本: 115.06.15 農護字第1150072522號令（112.07.11 訂定；農業部，法源＝管制規則§30Ⅳ）
編: —
條號: 第五點
條文要旨: 農業部受理案件之興辦事業計畫應載：計畫緣起、目的、資源調查、現況分析（含土地同意書、謄本、1/1200以上配置圖標明隔離綠帶或設施、1/5000以上位置圖；使用特定農業區者說明如何減少對周遭農業生產環境影響；使用殯葬用地者須提殯葬主管機關確認無殯葬設施需求之證明，位於山坡地另附公益性認定）、經營管理計畫（屬農業用地者應擬具農業用地變更使用說明書、污染防治計畫等）。設施無必要性或配置、經營管理計畫顯不合理者，不予同意。
適用辦理方式: 變更編定
觸發條件: 用途=寵物生命紀念設施（非都市土地變更為特定目的事業用地）
回答型態: 3遵照辦理
資料來源／判斷依據: —
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): 書件要求，不判○△╳
因應手段: —
手段法源: —
手段門檻: —
時程約束: 送件前
完成後可升級為○: —
核對狀態: 已核對(農業部 law.moa.gov.tw GL001615 要點本文＋115修正版附件一原文逐點抄錄，2026-10-22 下載；萬里加投段案)；2026-11-12 知識庫回官方原文抽核相符（71層 非都市土地申請變更為寵物生命紀念設施使用興辦事業計畫審查作業要點-重點）
