rule_id: PET-006
法規: 非都市土地申請變更為寵物生命紀念設施使用興辦事業計畫審查作業要點
法規代碼: GL001615
現行版本: 115.06.15 農護字第1150072522號令（112.07.11 訂定；農業部，法源＝管制規則§30Ⅳ）
編: —
條號: 第六點、第九點
條文要旨: 期限：【限第二點第一項由農業部審查之案件（特定農業區或跨縣市）】農業部同意後3個月內依第七點向縣市申請並完成設定地上權（土地所有權人免設定）；縣市依管制規則§28核准變更編定後2年內依計畫營運使用（不可歸責得展延一次、不超過2年），逾期農業部得廢止同意（第六點）。【所有案件】縣市核准興辦事業計畫後3個月內依§28申請變更編定，逾期得廢止；核准後縣市造冊列管、每年稽查（第九點）。
適用辦理方式: 變更編定
觸發條件: 用途=寵物生命紀念設施（非都市土地變更為特定目的事業用地）
回答型態: 3遵照辦理
資料來源／判斷依據: —
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): 時程約束，不判○△╳
因應手段: —
手段法源: —
手段門檻: 3個月／2年
時程約束: 核准後
完成後可升級為○: —
核對狀態: 已核對(農業部 law.moa.gov.tw GL001615 要點本文＋115修正版附件一原文逐點抄錄，2026-10-22 下載；萬里加投段案)；2026-11-12 知識庫回官方原文抽核相符（71層 非都市土地申請變更為寵物生命紀念設施使用興辦事業計畫審查作業要點-重點）
覆寫/從屬總編規則: —
