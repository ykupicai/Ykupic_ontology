rule_id: PET-008
法規: 非都市土地申請變更為寵物生命紀念設施使用興辦事業計畫審查作業要點
法規代碼: GL001615
現行版本: 115.06.15 農護字第1150072522號令（112.07.11 訂定；農業部，法源＝管制規則§30Ⅳ）
編: —
條號: 第八點
條文要旨: 縣市政府動物保護主管單位主辦，會同農政、建設、城鄉、地政、環保、水利、水保、民政實地會勘，審查區位無可替代性及事業設置必要性，並注意：(一)應辦水保或環評者須經主管機關審查通過；(二)位於山坡地者，無管制規則§49-1Ⅱ不得建築情形時，應評估【確有地方性需求】並考量可行性、必要性（或總量管制）、區位及規模；(三)位於地質敏感區者依地質法§8辦理基地地質調查及地質安全評估；(四)涉及農業用地變更者依農變要點辦理；(五)【應臨接道路】；(六)已擅自變更使用者應先裁處始得受理。
適用辦理方式: 變更編定
觸發條件: 用途=寵物生命紀念設施（非都市土地變更為特定目的事業用地）
回答型態: 6實質計算
資料來源／判斷依據: 環敏套疊（山坡地、地質敏感區）＋臨路評估
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): 臨接道路：○直接臨路／△須取得通行或指定建築線待認定／╳不臨路且無替代；山坡地地方性需求、地質調查：△（待會勘審查）
因應手段: 論述服務範圍內需求（寵物登記數、既有設施量）；辦理基地地質調查
手段法源: GL001615第八點；地質法§8
手段門檻: —
時程約束: 送件前
完成後可升級為○: 可
核對狀態: 已核對(農業部 law.moa.gov.tw GL001615 要點本文＋115修正版附件一原文逐點抄錄，2026-10-22 下載；萬里加投段案)；2026-11-12 知識庫回官方原文抽核相符（71層 非都市土地申請變更為寵物生命紀念設施使用興辦事業計畫審查作業要點-重點）
覆寫/從屬總編規則: —
