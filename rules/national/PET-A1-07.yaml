rule_id: PET-A1-07
法規: 非都市土地申請變更為寵物生命紀念設施使用興辦事業計畫審查作業要點
法規代碼: GL001615
現行版本: 115.06.15 農護字第1150072522號令（112.07.11 訂定；農業部，法源＝管制規則§30Ⅳ）
編: —
條號: 附件一第七點
條文要旨: 其他法律或自治條例未有規定者，設置地點距離下列場所不得少於【500公尺】：(一)儲存或製造炸藥、棉花藥、雷汞或其他相類爆裂物及其主要原料之場所；(二)依石油管理法、公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法認定其他易燃之氣體、油料之場所。
適用辦理方式: 變更編定
觸發條件: 用途=寵物生命紀念設施（非都市土地變更為特定目的事業用地）
回答型態: 6實質計算
資料來源／判斷依據: 測繪中心環域 API（dis，依名稱篩加油站／加氣站／瓦斯等）
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:500公尺內無／△:部分基地在500公尺內（屍體存放及處理設施配置於500公尺外即可）／╳:全基地在500公尺內
因應手段: 設施配置避開500公尺範圍；名稱未帶關鍵字之危險物品場所函詢消防局
手段法源: —
手段門檻: 500公尺
時程約束: 送件前
完成後可升級為○: 可
核對狀態: 已核對(農業部 law.moa.gov.tw GL001615 要點本文＋115修正版附件一原文逐點抄錄，2026-10-22 下載；萬里加投段案)；2026-11-12 知識庫回官方原文抽核相符（71層 非都市土地申請變更為寵物生命紀念設施使用興辦事業計畫審查作業要點-重點）
覆寫/從屬總編規則: —
