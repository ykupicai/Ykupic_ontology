rule_id: PET-A1-12
法規: 非都市土地申請變更為寵物生命紀念設施使用興辦事業計畫審查作業要點
法規代碼: GL001615
現行版本: 115.06.15 農護字第1150072522號令（112.07.11 訂定；農業部，法源＝管制規則§30Ⅳ）
編: —
條號: 附件一第十二點
條文要旨: 寵物骨灰樹葬、灑葬區規劃地點距離【自來水水質水量保護區內之自來水取水口】不得少於【1,000公尺】。
適用辦理方式: 變更編定
觸發條件: 用途=寵物生命紀念設施（非都市土地變更為特定目的事業用地）
回答型態: 2不適用／6實質計算
資料來源／判斷依據: 取水口點位（無公開圖資，函詢自來水事業機構）
進綜理表: 是
評估事項: 環境敏感
○△╳判定邏輯(初擬): 未規劃樹葬灑葬區→不適用／有規劃且未取得取水口位置→△
因應手段: 函詢自來水事業機構取水口位置；樹葬灑葬區配置於1,000公尺外
手段法源: —
手段門檻: 1,000公尺
時程約束: 送件前
完成後可升級為○: 可
核對狀態: 已核對(農業部 law.moa.gov.tw GL001615 要點本文＋115修正版附件一原文逐點抄錄，2026-10-22 下載；萬里加投段案)；2026-11-12 知識庫回官方原文抽核相符（71層 非都市土地申請變更為寵物生命紀念設施使用興辦事業計畫審查作業要點-重點）
覆寫/從屬總編規則: —
