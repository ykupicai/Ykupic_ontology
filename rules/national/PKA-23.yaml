rule_id: PKA-23
法規: 停車場法
法規代碼: K0040033
現行版本: 114.11.19 修正（交通部）
編: —
條號: §23
條文要旨: 汽車運輸業、買賣業、修理業、洗車業及其他與汽車服務有關之行業，應設置其業務必要之停車場；停車場之設置規定由直轄市或縣（市）各該行業之主管機關定之。
適用辦理方式: 變更編定
觸發條件: 汽車運輸業、買賣、修理、洗車等汽車服務業設置業務必要停車場
回答型態: 3遵照辦理
資料來源／判斷依據: 縣市該行業停車場設置規定
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): 程序條，不判○△╳；須查縣市是否另訂設置規定
因應手段: —
手段法源: —
手段門檻: —
時程約束: 規劃階段
完成後可升級為○: —
核對狀態: 已核對(全國法規資料庫 K0040033 §23，2026-11-12 知識庫拆條；71層 汽車運輸業審核細則與停車場法-場站-重點)
覆寫/從屬總編規則: —
