rule_id: PKT-4
法規: 利用空地申請設置臨時路外停車場辦法
法規代碼: K0040034
現行版本: 111.08.11 修正（交通部；法源＝停車場法§11Ⅱ）
編: —
條號: §4
條文要旨: 臨時路外停車場基地臨接之道路【實際寬度】（不含退縮）：供機車停放者≥3.5公尺；供小型車停放者≥6公尺（經地方主管機關認定無礙行車及安全者得≥5公尺，單行道得≥3.5公尺）；供大型車停放者≥10公尺（經認定得≥6公尺）。臨接道路應維持聯通同寬或較寬之聯外道路。
適用辦理方式: 容許使用／變更編定（停車場）
觸發條件: 停車場（臨時路外停車場申請；或變更編定為交通用地之停車場，臺南市交通局參照本條作設計標準，見旗勝案）
回答型態: 6實質計算
資料來源／判斷依據: 臨路評估成果（實際路寬，不含退縮）
進綜理表: 是
評估事項: 臨路情形
○△╳判定邏輯(初擬): ○:實際路寬達原則門檻（機車3.5／小型車6／大型車10公尺）／△:僅達但書寬度，須地方主管機關認定無礙／╳:未達但書寬度
因應手段: 改變停放車種；提出區域屬性與出入口設計說明申請認定
手段法源: §4Ⅰ但書；§9Ⅱ
手段門檻: 3.5／6（5、3.5）／10（6）公尺
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫 K0040034 全文，2026-11-12 知識庫拆條；71層 利用空地申請設置臨時路外停車場辦法-重點)
覆寫/從屬總編規則: —
