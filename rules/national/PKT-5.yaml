rule_id: PKT-5
法規: 利用空地申請設置臨時路外停車場辦法
法規代碼: K0040034
現行版本: 111.08.11 修正（交通部；法源＝停車場法§11Ⅱ）
編: —
條號: §5
條文要旨: 地面層出入口：(一)距【順向道路交叉口5公尺】以上；(二)臨接道路未設人行道者自建築線【退縮1.5公尺】以上（經認定無礙者得免）；(三)自建築線後退2公尺之出入口中心線上一點至道路中心，【左右各60度】範圍無礙視線並設緩衝空間；(四)出入口至車輛管制設施應規劃【停等空間】：小型車6×6公尺、大型車6×12公尺（內藏式轉盤或車位鎖除外）。無建築物平面式得以道路境界線代替建築線；無實體人行道且6個以下小型車位經認定無礙者，得不受第一、二、四款限制。
適用辦理方式: 容許使用／變更編定（停車場）
觸發條件: 停車場（臨時路外停車場申請；或變更編定為交通用地之停車場，臺南市交通局參照本條作設計標準，見旗勝案）
回答型態: 6實質計算
資料來源／判斷依據: 配置圖；出入口與路口距離
進綜理表: 是
評估事項: 規劃配置
○△╳判定邏輯(初擬): ○:出入口距路口≥5公尺且停等空間、視距、退縮均符合／△:須調整出入口位置或配置／╳:—
因應手段: 調整出入口位置與配置
手段法源: —
手段門檻: 路口5公尺；退縮1.5公尺；視距60度；停等6×6／6×12公尺
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫 K0040034 全文，2026-11-12 知識庫拆條；71層 利用空地申請設置臨時路外停車場辦法-重點)
覆寫/從屬總編規則: —
