rule_id: PKT-6
法規: 利用空地申請設置臨時路外停車場辦法
法規代碼: K0040034
現行版本: 111.08.11 修正（交通部；法源＝停車場法§11Ⅱ）
編: —
條號: §6
條文要旨: 平面式停車位、車道及曲線半徑：大型車車位寬4公尺×長12公尺以上、車道寬10公尺以上、內側曲線半徑≥10公尺；小型車車位2.5×5.25公尺以上、車道單車道3.5公尺／雙車道5.5公尺以上、內側曲線半徑≥5公尺；機車車位0.7×2公尺以上、車道1.5公尺以上。汽車運輸業者專供該業車輛停放者，車道面積及車位大小依汽車運輸業審核細則（MTB-4-A）。
適用辦理方式: 容許使用／變更編定（停車場）
觸發條件: 停車場（臨時路外停車場申請；或變更編定為交通用地之停車場，臺南市交通局參照本條作設計標準，見旗勝案）
回答型態: 6實質計算
資料來源／判斷依據: 配置圖
進綜理表: 是
評估事項: 規劃配置
○△╳判定邏輯(初擬): ○:車位、車道、曲線半徑符合／△:須調整配置（可停車位數下降）／╳:—
因應手段: 調整配置
手段法源: —
手段門檻: 車位與車道尺寸如要旨
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫 K0040034 全文，2026-11-12 知識庫拆條；71層 利用空地申請設置臨時路外停車場辦法-重點)
覆寫/從屬總編規則: 汽車運輸業專用者改依 MTB-4-A
