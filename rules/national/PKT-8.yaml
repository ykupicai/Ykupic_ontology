rule_id: PKT-8
法規: 利用空地申請設置臨時路外停車場辦法
法規代碼: K0040034
現行版本: 111.08.11 修正（交通部；法源＝停車場法§11Ⅱ）
編: —
條號: §8
條文要旨: 都市計畫範圍內之臨時路外停車場，於核定使用期間：設置於【住宅區】者應符合住宅區建蔽率、容積率及建築高度；其餘區位按都市計畫法令【停車場用地】規定，建築高度依建築技術規則。基地跨住宅區及其他分區者分別計算，不得合計。
適用辦理方式: 容許使用（臨時路外停車場）
觸發條件: 都市計畫範圍內申請臨時路外停車場
回答型態: 6實質計算
資料來源／判斷依據: 都市計畫使用分區；建築配置
進綜理表: 是
評估事項: 規劃配置
○△╳判定邏輯(初擬): ○:強度符合所在分區或停車場用地規定／╳:超過（調整即可，改△）
因應手段: —
手段法源: —
手段門檻: 依分區或停車場用地
時程約束: 規劃階段
完成後可升級為○: —
核對狀態: 已核對(全國法規資料庫 K0040034 全文，2026-11-12 知識庫拆條；71層 利用空地申請設置臨時路外停車場辦法-重點)
覆寫/從屬總編規則: —
