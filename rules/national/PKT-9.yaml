rule_id: PKT-9
法規: 利用空地申請設置臨時路外停車場辦法
法規代碼: K0040034
現行版本: 111.08.11 修正（交通部；法源＝停車場法§11Ⅱ）
編: —
條號: §9～§12
條文要旨: 公私有空地之所有人、管理機關、承租人或地上權人申請臨時路外停車場，檢具設置申請書、土地權利證明、【土地使用分區證明】、建築線指示圖（無建築物平面式免）、地籍圖、設置計畫（含【使用期限】、管理事項、圍籬透空率≥70%、場內與出入口配置、交通動線）。地方主管機關會商有關機關審核後發給【設置許可並核定使用期限】；許可後【6個月內】應申請【臨時建築許可】，逾期或作廢者設置許可失效；開放前訂管理規範報核備並領得【停車場登記證】始得營業，登記證效期依核准使用年限。主體結構除基礎外不得為鋼筋混凝土，須得隨時拆遷（§2）。
適用辦理方式: 容許使用（臨時路外停車場）
觸發條件: 利用公私有空地申請設置臨時路外停車場（不變更編定之替代路徑）
回答型態: 3遵照辦理
資料來源／判斷依據: —
進綜理表: 是
評估事項: —
○△╳判定邏輯(初擬): ○:取得設置許可及臨時建築許可／△:申請中；使用期限與非RC結構限制須揭露／╳:—
因應手段: —
手段法源: —
手段門檻: —
