rule_id: PV14-01
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第14編
條號: 一
條文要旨: 應以太陽光電發電設備、昇壓站、變電所、變流設備等為主；其餘定有建蔽容積之設施用地面積合計未超過2公頃且未超過基地面積10%者，依本專編辦理；超過者應依本專編第3~7點辦理
適用辦理方式: 開發許可
觸發條件: —
回答型態: 6實質計算
資料來源／判斷依據: 設施配置面積／基地面積（判斷是否適用本專編簡化規定）
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:附屬設施<2ha且<10%（適用本專編）／△:接近門檻須調整配置／╳:超過門檻須依§3~7全套辦理
因應手段: 調整附屬設施配置，使定有建蔽容積之設施用地面積合計 <2公頃且 <基地面積10%
手段法源: 第14編§1Ⅱ
手段門檻: 2公頃且10%
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(大福能源北門案定稿本制式檢核表 p.97-113)；2026-11-12 知識庫回內政部 glrs.moi.gov.tw FL003635 111.05.20 版原文逐點核對（71層 非都市土地開發審議作業規範-重點）
覆寫/從屬總編規則: —
