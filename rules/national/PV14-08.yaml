法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第14編
條號: 八
條文要旨: 地形測量及地質剖面書圖得簡化：得以五千分之一像片基本圖或臺灣通用電子地圖製作（範圍以地籍圖為準）；得免鑽探，惟地質敏感區依地質法辦理
適用辦理方式: 開發許可
