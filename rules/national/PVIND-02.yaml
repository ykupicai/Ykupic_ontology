rule_id: PVIND-02
法規: 非都市土地申請變更為太陽光電發電設施使用興辦事業計畫審查作業要點
法規代碼: FL060265
現行版本: （經濟部；法源＝管制規則§30Ⅳ）
編: —
條號: '2'
條文要旨: 已取得【經濟部核發太陽光電發電廠電業籌備創設】者，得依本要點申請興辦事業計畫審查。本要點所稱太陽光電發電設施包含太陽光電模組、變流器、電力網設備及線路
適用辦理方式: 變更編定
觸發條件: 所有走變更編定之光電案
回答型態: 3遵照辦理
資料來源／判斷依據: 需先取得：經濟部電業籌備創設許可
進綜理表: 是
評估事項: 必要文件
○△╳判定邏輯(初擬): ○:已取得電業籌備創設許可／△:尚未取得（★屬申請資格前提，非事後補件）／╳:未能取得
因應手段: 先向經濟部申請太陽光電發電廠電業籌備創設許可
手段法源: 光電審查作業要點第2點
手段門檻: —
時程約束: ★申請資格前提，須先取得（非事後補件）
完成後可升級為○: 可
核對狀態: 已核對(經濟部能源署官方修正規定PDF全文逐點；law.moea FL060265網頁403)
覆寫/從屬總編規則: —
