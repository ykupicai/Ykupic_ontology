rule_id: PVIND-03
法規: 非都市土地申請變更為太陽光電發電設施使用興辦事業計畫審查作業要點
法規代碼: FL060265
現行版本: （經濟部；法源＝管制規則§30Ⅳ）
編: —
條號: 3及附表
條文要旨: ★縣市政府受理申請【變更編定】為太陽光電發電設施使用時，得參照【附表：使用分區內各種使用地申請變更編定為太陽光電發電設施受理原則】辦理。記號：×＝不得申請變更編定；＋＝得申請變更編定；○＝得逕予容許毋需變更。高可信度結論：①特定農業區之農業用地一律× ②林業用地9個分區皆為× ③一般農業區之農牧用地為＋。附表說明5：本表僅為得否受理申請變更原則，准否變更仍應符合各用地相關法令規定。★★適用範圍（使用者2026-07-27指正）：「變更編定」＝使用分區不變、僅變更其內之使用地類別（管制規則§27），本附表即在此前提下適用；面積達2公頃以上者走開發許可（分區＋編定一起變），依第五點(八)轉軌至開發審議規範，不受本附表限制
適用辦理方式: ★僅【變更編定】（分區不變、只變更使用地）
觸發條件: ★僅在走【變更編定】時檢核（面積未達2公頃、使用分區不變者）。達2公頃以上走【開發許可】者，依本要點第五點(八)其土地使用計畫轉依開發審議規範辦理，在不涉及第一級環境敏感地區之前提下該等使用地【可以申請變更】，本列填「-」不適用
回答型態: 6實質計算
資料來源／判斷依據: joined shp 使分欄＋使類欄（逐宗地比對附表）
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): 【走變更編定時】○:使用地類別於該分區為＋或○／△:部分宗地類別待確認／╳:類別於該分區為×（林業用地、特定農業區農業用地、交通/水利/生態保護/國土保安用地等）。【走開發許可時】-（非此法規之項目）——改依 GEN-018 總編§18 檢核林相
因應手段: ①走變更編定而類別為×者：自申請範圍剔除，或先辦理使用地類別變更 ②★若面積可達2公頃以上，改走【開發許可】即不受附表限制（前提：不涉第一級環境敏感地區）
手段法源: 本要點第三點及附表
手段門檻: 見附表矩陣
時程約束: 接案初期（清冊健檢階段即可逐宗檢核）
完成後可升級為○: 部分
核對狀態: 已核對(經濟部能源署官方修正規定PDF全文逐點；law.moea FL060265網頁403)；★附表為PDF圖表判讀，逐格引用前請回原附表核對
覆寫/從屬總編規則: LUR-027／達2公頃者轉 PVIND-05-8→GEN-018
