rule_id: PVIND-05-5
法規: 非都市土地申請變更為太陽光電發電設施使用興辦事業計畫審查作業要點
法規代碼: FL060265
現行版本: （經濟部；法源＝管制規則§30Ⅳ）
編: —
條號: 5(五)
條文要旨: ★依本要點申請土地變更編定之案件，【不得使用特定農業區農業用地】；如有涉及其他使用分區之農業用地變更使用者，應依農業主管機關同意農業用地變更使用審查作業要點之規定辦理，並依【農業發展條例第12條】相關規定繳交【農業用地變更回饋金】
適用辦理方式: 變更編定
觸發條件: 基地涉農業用地
回答型態: 2不適用／6實質計算
資料來源／判斷依據: joined shp 使分欄（特農區判別）＋使類欄
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:非特定農業區農業用地／△:一般農業區等農業用地（須依農業要點取得同意並繳回饋金）／╳:屬特定農業區農業用地（本要點明文不得使用）
因應手段: 調整基地範圍排除特定農業區農業用地；其他分區農地依農業要點取得同意並繳交回饋金
手段法源: 本要點第五點(五)＋農發條例§12
手段門檻: —
時程約束: 農業主管機關同意前
完成後可升級為○: 可
核對狀態: 已核對(經濟部能源署官方修正規定PDF全文逐點；law.moea FL060265網頁403)
覆寫/從屬總編規則: AGR-010
