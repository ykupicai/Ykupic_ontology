rule_id: PVIND-05-6
法規: 非都市土地申請變更為太陽光電發電設施使用興辦事業計畫審查作業要點
法規代碼: FL060265
現行版本: （經濟部；法源＝管制規則§30Ⅳ）
編: —
條號: 5(六)
條文要旨: ★申請變更編定土地【應臨接道路】，其道路之寬度應依【實施區域計畫地區建築管理辦法及建築技術規則】規定辦理。★注意：走變更編定（未達2公頃）者臨路依此；走開發許可（達2公頃）者依審議作業規範§26 與太陽光電設施開發案基地聯絡道路審議原則——兩條路的臨路標準不同
適用辦理方式: 變更編定
觸發條件: 走變更編定路線
回答型態: 6實質計算
資料來源／判斷依據: 臨路評估/成果.xlsx（道路寬度）
進綜理表: 是
評估事項: 臨路情形
○△╳判定邏輯(初擬): ○:符合實施區域計畫地區建築管理辦法及建築技術規則之臨接道路寬度／△:寬度待確認或須指定建築線／╳:未臨接道路（袋地）且無法取得通行
因應手段: 確認臨接道路寬度符合建築管理辦法與建築技術規則；必要時取得鄰地通行同意並指定建築線
手段法源: 本要點第五點(六)
手段門檻: 依建築技術規則
時程約束: 送件前
完成後可升級為○: 可
核對狀態: 已核對(經濟部能源署官方修正規定PDF全文逐點；law.moea FL060265網頁403)
覆寫/從屬總編規則: GEN-026
