rule_id: PVIND-05-7
法規: 非都市土地申請變更為太陽光電發電設施使用興辦事業計畫審查作業要點
法規代碼: FL060265
現行版本: （經濟部；法源＝管制規則§30Ⅳ）
編: —
條號: 5(七)
條文要旨: ★就興辦事業之可行性、必要性、土地區位、面積規模，以及與其他鄰近事業是否具關聯性等予以審查；【如經審認確與其他鄰近興辦事業具關聯性，屬原有興辦事業之擴增（即與原有事業計畫係屬同一興辦事業計畫），其新舊申請變更之土地面積應累計計算】，並填具審查表（附件三）簽會相關機關後簽註具體設置意見
適用辦理方式: 變更編定
觸發條件: 同一開發者於鄰近有其他光電案
回答型態: 6實質計算
資料來源／判斷依據: 同一開發者之鄰近案件清冊＋基地面積
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:與鄰近事業無關聯性／△:具關聯性須累計面積，累計後仍未達2公頃／╳:累計後達2公頃以上，須改走開發許可（時程與成本大幅增加）
因應手段: ★防切小案條款：規劃階段即將同一開發者鄰近案件面積合併評估，避免被認定同一興辦事業後累計跨門檻
手段法源: 本要點第五點(七)
手段門檻: 2公頃（累計）
時程約束: 接案初期分流即須評估
完成後可升級為○: —
核對狀態: 已核對(經濟部能源署官方修正規定PDF全文逐點；law.moea FL060265網頁403)
覆寫/從屬總編規則: LUR-011
