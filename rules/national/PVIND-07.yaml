rule_id: PVIND-07
法規: 非都市土地申請變更為太陽光電發電設施使用興辦事業計畫審查作業要點
法規代碼: FL060265
現行版本: （經濟部；法源＝管制規則§30Ⅳ）
編: —
條號: '7'
條文要旨: ★★【第七點】申請人擬具之興辦事業計畫土地位於【山坡地範圍內】，且經直轄市、縣（市）政府依本要點審查符合變更規定者，依【再生能源發展條例第15條第1項】規定，得認定適用【非都市土地使用管制規則第52條之1第3款所定之公用事業，免受山坡地開發建築面積不得少於十公頃限制】
適用辦理方式: 變更編定
觸發條件: 光電案基地位於山坡地範圍且面積未達10公頃
回答型態: 5交互參照
資料來源／判斷依據: 環境敏感套疊.csv（山坡地範圍）＋基地面積
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:位於山坡地且經縣市政府依本要點審查符合變更規定 → 明文免受10公頃限制／△:尚未經縣市政府審查認定／╳:—
因應手段: 依本要點第七點主張適用管制規則§52-1③公用事業，免受山坡地10公頃限制（須先經縣市政府依本要點審查）
手段法源: 本要點第七點＋再生能源發展條例§15Ⅰ＋管制規則§52-1③
手段門檻: 免受10公頃限制
時程約束: 縣市政府審查階段
完成後可升級為○: 可
核對狀態: 已核對(經濟部能源署官方修正規定PDF全文逐點；law.moea FL060265網頁403)
覆寫/從屬總編規則: LUR-052-1
