rule_id: RBM-005
法規: 實施區域計畫地區建築管理辦法
法規代碼: D0070123
現行版本: 88.12.24
編: null
條號: '5'
條文要旨: 於各種用地內申請建造自用農舍者，總樓地板面積不得超過495平方公尺，建築面積不得超過其耕地面積10%，建築物高度不得超過3層樓並不得超過10.5公尺，最大基層建築面積不得超過330平方公尺。
適用辦理方式: 容許使用（興建農舍）
觸發條件: 興建個別農舍
回答型態: 實算
資料來源／判斷依據: 基地登記面積×10% 與 330 ㎡ 取小
進綜理表: 是
評估事項: 興建農舍
○△╳判定邏輯(初擬): ○:—（規模上限，供配置）
因應手段: —
手段法源: —
手段門檻: —
時程約束: —
完成後可升級為○: —
核對狀態: 已核對(2026-10-02～03 官方原文逐條核對（彌陀安港段587案）)
覆寫/從屬總編規則: 與 FARM-009 取較嚴者
