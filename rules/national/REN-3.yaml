rule_id: REN-3
法規: 再生能源發展條例
法規代碼: J0130032
現行版本: 114.06.11 修正（經濟部）
編: —
條號: §3第十一款、第十四款
條文要旨: 【再生能源發電設備】指經主管機關認定符合§4Ⅳ辦法之發電設備；【儲能設備】指儲存電能並穩定電力系統之設備，包含儲能組件、電力轉換及電能管理系統等——兩者分列定義。（電業法§2第十二款儲能設備定義相同；第八款特定電力供應業含設置儲能設備參與電力交易平台者）
適用辦理方式: 變更編定
觸發條件: 興辦儲能設備或再生能源發電設備，需認定用途類別
回答型態: 5交互參照
資料來源／判斷依據: 興辦事業計畫之設施組成
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): 定義列，不判○△╳：用於認定獨立儲能是否屬「太陽光電設施」（AGR-007-1 對象）
因應手段: —
手段法源: —
手段門檻: —
時程約束: —
完成後可升級為○: —
核對狀態: 已核對(全國法規資料庫 J0130032 §3，2026-11-12 知識庫拆條；71層 再生能源發展條例與電業法-儲能-重點)
覆寫/從屬總編規則: AGR-007-1、LCE-8 之用途認定依據
