rule_id: RPA-015
法規: 區域計畫法施行細則
法規代碼: D0070031
現行版本: 102.10.23
編: —
條號: '15'
條文要旨: 開發計畫應包括：開發內容分析／基地環境資料分析／實質發展計畫／公共設施營運管理計畫／平地之整地排水工程／其他應表明事項。有關文件包括：申請人清冊／設計人清冊／土地清冊／相關簽證技師資料／土地及建築物權利證明文件／★【相關主管機關或事業機構同意文件】／其他文件
適用辦理方式: 開發許可
觸發條件: 所有開發許可案
回答型態: 3遵照辦理
資料來源／判斷依據: 需函詢：能源主管機關（電業籌設許可）／台電／各該事業機構
進綜理表: 是
評估事項: 必要文件
○△╳判定邏輯(初擬): ○:必要同意文件已齊備／△:尚未取得電業籌設許可等關鍵同意文件（送件前必須取得）／╳:關鍵機關明確不同意
因應手段: 先取得電業籌設許可等相關主管機關或事業機構同意文件
手段法源: 區計法細則§15Ⅱ⑥
手段門檻: —
時程約束: ★送件前必須齊備（缺件將被通知限期補正）
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫逐條抄錄)
覆寫/從屬總編規則: —
