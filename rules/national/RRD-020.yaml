rule_id: RRD-020
法規: 農村再生發展區計畫審核及管理監督辦法
法規代碼: M0110023
現行版本: 115.06.12 修正
編: —
條號: 20、21
條文要旨: 發展區各功能分區之容許使用項目、細目、認定基準及使用地類別如附表二，分「免辦理認定基準審查」與「需辦理認定基準審查」二類（§20）。發展區計畫核定後，各功能分區土地之使用【以中央主管機關公告之容許使用項目、細目為限】；依規定應辦理容許使用同意且屬附表二需辦理認定基準審查（△）者，目的事業主管機關於同意容許使用前，【應先徵得直轄市或縣（市）主管機關同意】（§21）。附表二備註：○免審查、△需經縣市主管機關認定基準審查、－該功能分區不得使用；除農村再生設施外之各項使用項目，仍應符合管制規則附表一規定。
適用辦理方式: 容許使用
觸發條件: 基地位於已核定之農村再生發展區
回答型態: 逐點檢核
資料來源／判斷依據: 發展區核定公告之功能分區與容許使用項目、細目（辦法§17 公告事項）＋附表二
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:擬設項目於所在功能分區為「○」，且符合管制規則附表一／△:為「△」，須先經縣市主管機關認定基準審查同意／╳:為「－」或未列入該發展區公告之容許項目
因應手段: 項目不在公告範圍：請縣市政府依§19 辦理發展區計畫變更（準用公開閱覽、公聽會等程序）
手段法源: 發展區辦法§19
手段門檻: —
時程約束: 容許申請前
完成後可升級為○: 可
核對狀態: '已核對(全國法規資料庫全文＋附表二、附表三官方附檔 PDF，2026-11-20 TN 逐字比對原文後撰寫；2026-11-23 TN 自行轉正（review_mode: self），每月抽查)'
