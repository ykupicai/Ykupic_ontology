rule_id: RRD-030
法規: 農村再生發展區計畫審核及管理監督辦法
法規代碼: M0110023
現行版本: 115.06.12 修正
編: —
條號: '30'
條文要旨: 農村再生發展區內之土地使用，需辦理非都市土地使用地變更編定者，【應符合已核定之農村再生發展區計畫，並應經直轄市或縣（市）主管機關同意】。
適用辦理方式: 變更編定
觸發條件: 基地位於已核定之農村再生發展區，且需辦理使用地變更編定
回答型態: 是否
資料來源／判斷依據: 發展區計畫功能分區與容許項目、縣市主管機關同意文件
進綜理表: 是
評估事項: 程序要件
○△╳判定邏輯(初擬): ○:變更後用途符合發展區計畫，且已取得縣市主管機關同意／△:符合計畫，同意文件尚未取得／╳:變更後用途不符發展區計畫
因應手段: 先向縣市主管機關（農業單位）取得同意；不符計畫者須先辦發展區計畫變更
手段法源: 發展區辦法§19、§30
手段門檻: —
時程約束: 變更編定申請前
完成後可升級為○: 可
核對狀態: '已核對(全國法規資料庫全文，2026-11-20 TN 逐字比對原文後撰寫；2026-11-23 TN 自行轉正（review_mode: self），每月抽查)'
覆寫/從屬總編規則: —
