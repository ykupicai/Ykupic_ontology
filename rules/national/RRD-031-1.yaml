rule_id: RRD-031-1
法規: 農村再生發展區計畫審核及管理監督辦法
法規代碼: M0110023
現行版本: 115.06.12 修正
編: —
條號: 31-1＋附表三
條文要旨: 發展區計畫【核定前】，中央主管機關得依農村再生條例規定，興建或補助供公眾使用之農村再生設施，其容許使用項目如附表三（安全設施：社區道路、溝渠、標示解說設施≤45㎡、水土保持及防災設施；保育設施：生態保育設施；生活基礎設施：步道、網路資訊建設、自用自來水及水資源再利用、衛生設施（含公廁）≤45㎡；休憩設施：自行車道寬度原則≤2公尺、簡易平面停車場、廣場、環境綠美化、景觀休閒設施、運動設施；其他：傳統建築、文物及文化設施（以維護既有設施為限）、其他農村再生設施）。申請應檢附：申請人身分或立案證明（政府機關免附）、【中央主管機關興建或補助設置之證明文件】、謄本、配置圖（≥1/500）、位置略圖、土地使用同意書或委託經營契約書（單獨所有免附）等，各三份，向縣市主管機關申請。
適用辦理方式: 容許使用
觸發條件: 基地所在社區尚無已核定之農村再生發展區計畫，擬設置農村再生設施
回答型態: 逐點檢核
資料來源／判斷依據: 中央主管機關（農村發展及水土保持署）興建或補助核定文件＋附表三項目與認定基準
進綜理表: 是
評估事項: 程序要件
○△╳判定邏輯(初擬): ○:屬中央興建或補助、供公眾使用，項目列於附表三且符合認定基準／△:補助核定文件尚未取得／╳:非中央興建或補助（例：民間自行出資）或項目不在附表三——發展區核定前無其他容許路徑
因應手段: 爭取中央補助；或待縣市政府擬訂並經核定發展區計畫後，改依§27、§28 申請
手段法源: 發展區辦法§31-1、附表三
手段門檻: 標示解說設施、衛生設施≤45㎡；自行車道寬原則≤2公尺；配置圖≥1/500
時程約束: 容許申請前
完成後可升級為○: 可
核對狀態: '已核對(全國法規資料庫全文＋附表二、附表三官方附檔 PDF，2026-11-20 TN 逐字比對原文後撰寫；2026-11-23 TN 自行轉正（review_mode: self），每月抽查)'
