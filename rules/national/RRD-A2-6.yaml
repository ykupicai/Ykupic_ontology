rule_id: RRD-A2-6
法規: 農村再生發展區計畫審核及管理監督辦法
法規代碼: M0110023
現行版本: 115.06.12 修正
編: —
條號: 附表二備註6、7
條文要旨: 附表二各項使用項目之使用地類別【屬水利用地者，需經水利主管機關同意】；【屬林業用地者，需經林業主管機關同意】（備註6、7）。備註4：農村再生設施之細目免辦理認定基準者，仍須符合其他相關法令規定。
適用辦理方式: 容許使用
觸發條件: 農村再生發展區內擬使用之土地編定為水利用地或林業用地
回答型態: 是否
資料來源／判斷依據: 基地使用地類別（地籍屬性）＋水利、林業主管機關同意文件
進綜理表: 是
評估事項: 程序要件
○△╳判定邏輯(初擬): ○:非水利、林業用地，或已取得各該主管機關同意／△:屬水利或林業用地，同意尚未取得／╳:主管機關不同意
因應手段: 容許申請前先洽水利主管機關（水利用地）或林業主管機關（林業用地）取得同意
手段法源: 發展區辦法附表二備註6、7
手段門檻: —
時程約束: 容許申請前
完成後可升級為○: 可
核對狀態: '已核對(全國法規資料庫全文＋附表二、附表三官方附檔 PDF，2026-11-20 TN 逐字比對原文後撰寫；2026-11-23 TN 自行轉正（review_mode: self），每月抽查)'
