rule_id: SFA-10
法規: 特定工廠申請變更編定為特定目的事業用地審查辦法
法規代碼: J0030153
現行版本: 115.03.18 修正（經濟部；法源＝工廠管理輔導法§28-10Ⅴ）
編: —
條號: §10
條文要旨: 應於用地計畫核定次日起【2年內】依核定用地計畫完成工廠登記（2公頃以上須取得開發許可者自開發許可核定次日起算）；未完成者得申請展延，展延總計【不得超過2年】且【不得逾民國129年3月19日】，逾期用地計畫核定失效。
適用辦理方式: 變更編定／開發許可（特定工廠用地計畫）
觸發條件: 取得特定工廠登記之工廠，坐落非都市土地申請用地計畫
回答型態: 3遵照辦理
資料來源／判斷依據: —
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): 時程約束，不判○△╳
因應手段: —
手段法源: —
手段門檻: —
時程約束: 核定後2年；展延至多2年且不逾129.03.19
完成後可升級為○: —
核對狀態: 已核對(全國法規資料庫 J0030153 原文 115.03.18 版，2026-11-12 知識庫拆條；71層 特定工廠申請變更編定為特定目的事業用地審查辦法-重點)
覆寫/從屬總編規則: —
