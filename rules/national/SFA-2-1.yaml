rule_id: SFA-2-1
法規: 特定工廠申請變更編定為特定目的事業用地審查辦法
法規代碼: J0030153
現行版本: 115.03.18 修正（經濟部；法源＝工廠管理輔導法§28-10Ⅴ）
編: —
條號: §2Ⅰ
條文要旨: 取得特定工廠登記者位於工輔法§28-10Ⅰ①【群聚地區】，【優先】採新訂都市計畫或開發產業園區規劃處理，依都市計畫法、區域計畫法、國土計畫法辦理土地使用分區變更或使用許可。
適用辦理方式: 變更編定／開發許可（特定工廠用地計畫）
觸發條件: 取得特定工廠登記之工廠，坐落非都市土地申請用地計畫
回答型態: 6實質計算
資料來源／判斷依據: 主管機關公告之群聚地區範圍
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:非群聚地區／△:位於群聚地區，須確認主管機關是否已規劃新訂都計或產業園區（見 SFA-7-6）／╳:—
因應手段: 向主管機關確認群聚地區規劃情形
手段法源: —
手段門檻: —
時程約束: 接案初期
完成後可升級為○: —
核對狀態: 已核對(全國法規資料庫 J0030153 原文 115.03.18 版，2026-11-12 知識庫拆條；71層 特定工廠申請變更編定為特定目的事業用地審查辦法-重點)
覆寫/從屬總編規則: —
