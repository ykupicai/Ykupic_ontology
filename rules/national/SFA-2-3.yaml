rule_id: SFA-2-3
法規: 特定工廠申請變更編定為特定目的事業用地審查辦法
法規代碼: J0030153
現行版本: 115.03.18 修正（經濟部；法源＝工廠管理輔導法§28-10Ⅴ）
編: —
條號: §2Ⅲ
條文要旨: 非群聚地區且位於都市計畫以外者：土地面積【未達2公頃】依本辦法提用地計畫、變更編定為特定目的事業用地；【2公頃以上未達5公頃】取得用地計畫核定後，併依管制規則及審議規範擬具開發計畫取得開發許可，變更為特定專用區；【5公頃以上】依產業創新條例辦理分區變更為工業區，不適用本辦法。（都市計畫土地依都市計畫法辦理，§2Ⅱ）
適用辦理方式: 變更編定／開發許可（特定工廠用地計畫）
觸發條件: 取得特定工廠登記之工廠，坐落非都市土地申請用地計畫
回答型態: 6實質計算
資料來源／判斷依據: 特登廠地面積；都市計畫範圍
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): 分流列，不判○△╳：<2公頃→變更編定／2～5公頃→用地計畫＋開發許可（加跑 _共通_開發許可）／≥5公頃→不適用本辦法
因應手段: —
手段法源: —
手段門檻: 2公頃／5公頃
時程約束: 接案初期分流
完成後可升級為○: —
核對狀態: 已核對(全國法規資料庫 J0030153 原文 115.03.18 版，2026-11-12 知識庫拆條；71層 特定工廠申請變更編定為特定目的事業用地審查辦法-重點)
覆寫/從屬總編規則: —
