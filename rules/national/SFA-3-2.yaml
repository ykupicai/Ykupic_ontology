rule_id: SFA-3-2
法規: 特定工廠申請變更編定為特定目的事業用地審查辦法
法規代碼: J0030153
現行版本: 115.03.18 修正（經濟部；法源＝工廠管理輔導法§28-10Ⅴ）
編: —
條號: §3②
條文要旨: 用地計畫申請前【三年內】，未有因違反環保法規經環境保護主管機關認定【情節重大命令停工或停業】者。
適用辦理方式: 變更編定／開發許可（特定工廠用地計畫）
觸發條件: 取得特定工廠登記之工廠，坐落非都市土地申請用地計畫
回答型態: 是否
資料來源／判斷依據: 環保主管機關裁處紀錄（申請人提供或函詢）
進綜理表: 是
評估事項: —
○△╳判定邏輯(初擬): ○:三年內無／△:待查證／╳:有（§7Ⅱ 應予駁回）
因應手段: —
手段法源: —
手段門檻: —
時程約束: 申請前三年
完成後可升級為○: —
核對狀態: 已核對(全國法規資料庫 J0030153 原文 115.03.18 版，2026-11-12 知識庫拆條；71層 特定工廠申請變更編定為特定目的事業用地審查辦法-重點)
覆寫/從屬總編規則: —
