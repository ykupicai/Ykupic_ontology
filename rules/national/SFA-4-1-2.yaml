rule_id: SFA-4-1-2
法規: 特定工廠申請變更編定為特定目的事業用地審查辦法
法規代碼: J0030153
現行版本: 115.03.18 修正（經濟部；法源＝工廠管理輔導法§28-10Ⅴ）
編: —
條號: §4Ⅰ②
條文要旨: 申請用地計畫核定應檢附【特定工廠登記文件影本】（§4Ⅰ 共十一款文件，一式八份）。
適用辦理方式: 變更編定／開發許可（特定工廠用地計畫）
觸發條件: 取得特定工廠登記之工廠，坐落非都市土地申請用地計畫
回答型態: 3遵照辦理
資料來源／判斷依據: 特定工廠登記證明
進綜理表: 是
評估事項: —
○△╳判定邏輯(初擬): ○:已取得特定工廠登記／╳:未取得（不適用本辦法）
因應手段: —
