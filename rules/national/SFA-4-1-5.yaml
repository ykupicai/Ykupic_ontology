rule_id: SFA-4-1-5
法規: 特定工廠申請變更編定為特定目的事業用地審查辦法
法規代碼: J0030153
現行版本: 115.03.18 修正（經濟部；法源＝工廠管理輔導法§28-10Ⅴ）
編: —
條號: §4Ⅰ⑤
條文要旨: 涉及農業用地變更者，應依農業主管機關同意農業用地變更使用審查作業要點擬具【農業用地變更使用說明書】（特定工廠不豁免農變要點）。
適用辦理方式: 變更編定／開發許可（特定工廠用地計畫）
觸發條件: 取得特定工廠登記之工廠，坐落非都市土地申請用地計畫
回答型態: 5交互參照
資料來源／判斷依據: 使用地類別
進綜理表: 是
評估事項: 農業用地變更
○△╳判定邏輯(初擬): 交互參照 AGR 系列（含 AGR-005 不同意變更情形）；特定農業區另見行政院核定輔導計畫（尚無官方原文佐證，未拆條）
因應手段: —
手段法源: —
手段門檻: —
時程約束: 送件時
完成後可升級為○: —
核對狀態: 已核對(全國法規資料庫 J0030153 原文 115.03.18 版，2026-11-12 知識庫拆條；71層 特定工廠申請變更編定為特定目的事業用地審查辦法-重點)
覆寫/從屬總編規則: 從農變要點 AGR 系列
