rule_id: SFA-4-1-9
法規: 特定工廠申請變更編定為特定目的事業用地審查辦法
法規代碼: J0030153
現行版本: 115.03.18 修正（經濟部；法源＝工廠管理輔導法§28-10Ⅴ）
編: —
條號: §4Ⅰ⑨
條文要旨: 屬【山坡地】並經認定須擬具水土保持計畫者，應檢附【水土保持完工證明文件】。
適用辦理方式: 變更編定／開發許可（特定工廠用地計畫）
觸發條件: 取得特定工廠登記之工廠，坐落非都市土地申請用地計畫
回答型態: 6實質計算
資料來源／判斷依據: 山坡地範圍套疊
進綜理表: 是
評估事項: 地形坡度
○△╳判定邏輯(初擬): ○:非山坡地，或山坡地已取得水保完工證明／△:山坡地須擬水保計畫、完工證明待取得／╳:—
因應手段: 辦理水土保持計畫並取得完工證明
手段法源: —
手段門檻: —
時程約束: 送件時
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫 J0030153 原文 115.03.18 版，2026-11-12 知識庫拆條；71層 特定工廠申請變更編定為特定目的事業用地審查辦法-重點)
覆寫/從屬總編規則: —
