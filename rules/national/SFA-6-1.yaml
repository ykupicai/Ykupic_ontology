rule_id: SFA-6-1
法規: 特定工廠申請變更編定為特定目的事業用地審查辦法
法規代碼: J0030153
現行版本: 115.03.18 修正（經濟部；法源＝工廠管理輔導法§28-10Ⅴ）
編: —
條號: §6①②
條文要旨: 申請範圍與相鄰農業用地應規劃隔離綠帶或設施（相鄰農地已取得特登廠地者於相鄰處得免）：申請面積【未達2公頃】者，寬度【至少1.5公尺】且面積【不少於申請面積30%】；2公頃以上未達5公頃者依審議規範。必要時得使用【毗連土地至多3公尺】範圍規劃為隔離綠帶，視同廠地面積納入申請範圍。位於農產業群聚地區者限以隔離綠帶規劃（§6③）。
適用辦理方式: 變更編定／開發許可（特定工廠用地計畫）
觸發條件: 取得特定工廠登記之工廠，坐落非都市土地申請用地計畫
回答型態: 6實質計算
資料來源／判斷依據: 配置圖；相鄰土地使用地類別
進綜理表: 是
評估事項: 規劃配置
○△╳判定邏輯(初擬): ○:綠帶寬度≥1.5m且面積≥30%／△:須使用毗連土地或拆除既有建物（§8 切結）始能達成／╳:—
因應手段: 使用毗連土地至多3m；既有建物切結拆除（§8）
手段法源: J0030153 §6②、§8
手段門檻: 1.5公尺；30%
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫 J0030153 原文 115.03.18 版，2026-11-12 知識庫拆條；71層 特定工廠申請變更編定為特定目的事業用地審查辦法-重點)
覆寫/從屬總編規則: —
