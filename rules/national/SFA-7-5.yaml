rule_id: SFA-7-5
法規: 特定工廠申請變更編定為特定目的事業用地審查辦法
法規代碼: J0030153
現行版本: 115.03.18 修正（經濟部；法源＝工廠管理輔導法§28-10Ⅴ）
編: —
條號: §7Ⅴ
條文要旨: 主管機關於用地計畫核定前，應確認申請人已提出完成【廢（污）水排放計畫之證明文件】：事業廢水→依水污染防治法取得排放許可或簡易排放許可；生活污水→取得相關主管機關同意對外排放文件。
適用辦理方式: 變更編定／開發許可（特定工廠用地計畫）
觸發條件: 取得特定工廠登記之工廠，坐落非都市土地申請用地計畫
回答型態: 3遵照辦理
資料來源／判斷依據: 排放許可文件
進綜理表: 是
評估事項: —
○△╳判定邏輯(初擬): ○:已取得／△:待取得（核定前須補齊）／╳:—
因應手段: 申請排放許可或同意對外排放文件
手段法源: —
手段門檻: —
時程約束: 用地計畫核定前
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫 J0030153 原文 115.03.18 版，2026-11-12 知識庫拆條；71層 特定工廠申請變更編定為特定目的事業用地審查辦法-重點)
覆寫/從屬總編規則: —
