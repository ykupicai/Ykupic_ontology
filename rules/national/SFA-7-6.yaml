rule_id: SFA-7-6
法規: 特定工廠申請變更編定為特定目的事業用地審查辦法
法規代碼: J0030153
現行版本: 115.03.18 修正（經濟部；法源＝工廠管理輔導法§28-10Ⅴ）
編: —
條號: §7Ⅵ
條文要旨: 用地計畫之土地位於【群聚地區】，且經主管機關規劃採新訂都市計畫或開發產業園區區位時，直轄市、縣（市）主管機關【得駁回】其申請。
適用辦理方式: 變更編定／開發許可（特定工廠用地計畫）
觸發條件: 取得特定工廠登記之工廠，坐落非都市土地申請用地計畫
回答型態: 6實質計算
資料來源／判斷依據: 群聚地區範圍及主管機關規劃
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:非群聚地區／△:位於群聚地區但尚未規劃新訂都計或產業園區／╳:位於已規劃區位（得駁回）
因應手段: —
手段法源: —
手段門檻: —
時程約束: 接案初期
完成後可升級為○: —
核對狀態: 已核對(全國法規資料庫 J0030153 原文 115.03.18 版，2026-11-12 知識庫拆條；71層 特定工廠申請變更編定為特定目的事業用地審查辦法-重點)
覆寫/從屬總編規則: —
