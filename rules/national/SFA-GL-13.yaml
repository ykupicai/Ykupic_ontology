rule_id: SFA-GL-13
法規: 優化特定工廠用地計畫審核作業工作指引（行政指引）
法規代碼: 經濟部中部辦公室112.09
現行版本: 112.09（位於非都市土地且申請面積未達2公頃之申請案件適用）
編: —
條號: 工作指引第13頁（審查要領二、3）
條文要旨: 用地計畫所附地形測量圖現況與特定工廠登記登載不符者（如取得臨時工廠登記後增建之建築物、雨遮、停車棚），屬【105年5月20日以後增建之地上物】，其適法性為【工業主管機關審查權責】，得經農林航測所、國土測繪圖資服務雲等查核；有不符者應書面通知業者【30日內陳述意見】，無理由者【依法駁回】。
適用辦理方式: 變更編定（特定工廠用地計畫，未達2公頃）
觸發條件: 特定工廠申請用地計畫核定（非都市土地、未達2公頃）
回答型態: 6實質計算
資料來源／判斷依據: 正射影像逐年比對（105.05.20前後）；特定工廠登記登載範圍
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:現況與特登登載一致／△:有疑似105.05.20後增建，須陳述意見／╳:確認增建且陳述無理由（駁回）
因應手段: 申請前以正射影像比對並拆除或說明不符部分
手段法源: —
手段門檻: —
時程約束: 申請前
完成後可升級為○: 可
核對狀態: 已核對(sdd.nat.gov.tw 官方 PDF，使用者 2026-11-12 提供連結；原件存 _佐證；71層 特定工廠申請變更編定為特定目的事業用地審查辦法-重點)
覆寫/從屬總編規則: —
