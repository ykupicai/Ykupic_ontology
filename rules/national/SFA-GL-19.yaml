rule_id: SFA-GL-19
法規: 優化特定工廠用地計畫審核作業工作指引（行政指引）
法規代碼: 經濟部中部辦公室112.09
現行版本: 112.09（位於非都市土地且申請面積未達2公頃之申請案件適用）
編: —
條號: 工作指引第19頁（農業主管機關審查要領1）
條文要旨: 審查農業用地變更使用說明書之【必要性、合理性及無可替代性】：因行政院110.09.14院臺經字第1100181578號核定輔導計畫在案，【顯見特定工廠申請廠地範圍土地合法化經營具其必要性、合理性及無可替代性，與一般素地開發之性質有別】。另隔離綠帶上既有建築物緩拆者，須拆除並設置完成、經工業主管機關會同農業主管機關【勘驗】後，始核發農業用地變更使用同意文件（不得未勘驗即核發）。
適用辦理方式: 變更編定（特定工廠用地計畫，未達2公頃）
觸發條件: 特定工廠申請用地計畫核定（非都市土地、未達2公頃）
回答型態: 3遵照辦理
資料來源／判斷依據: —
進綜理表: 是
評估事項: 農業用地變更
○△╳判定邏輯(初擬): ○:引用本指引論證無可替代性／△:緩拆案勘驗前尚未取得農地變更同意文件／╳:—
因應手段: 農業用地變更使用說明書引用本指引第19頁論據
手段法源: —
手段門檻: —
時程約束: 用地計畫審查
完成後可升級為○: 可
核對狀態: 已核對(sdd.nat.gov.tw 官方 PDF，使用者 2026-11-12 提供連結；原件存 _佐證；71層 特定工廠申請變更編定為特定目的事業用地審查辦法-重點)
覆寫/從屬總編規則: 補強 AGR-005 第五點審查之無可替代性論證
