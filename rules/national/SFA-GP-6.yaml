rule_id: SFA-GP-6
法規: 特定工廠申請利用非都市土地特定農業區用地變更輔導計畫（行政計畫）
法規代碼: 院臺經字第1100181578號
現行版本: 110.09.14 行政院核定；實施期程至129.03.19（依工輔法§28-10Ⅳ）
編: —
條號: 第三點、第六點
條文要旨: 適用對象：依工輔法§28-5或§28-6取得特定工廠登記，並依§28-10申請土地變更者。非屬群聚地區：≥5公頃依產創條例申請產業園區；2～5公頃取得用地計畫核定後併辦開發許可變更為特定專用區；未達2公頃申請用地計畫變更為特定目的事業用地（因整體規劃需要縣市得駁回，第三點(二)2(3)）。★第六點：申請案涉及【特定農業區之農業用地變更】者，縣市主管機關【得依農變要點第6點但書第2款（經行政院核定之計畫所需用地）受理申請】。
適用辦理方式: 變更編定／開發許可（特定工廠用地計畫）
觸發條件: 取得特定工廠登記之工廠，申請利用非都市土地特定農業區土地變更
回答型態: 6實質計算
資料來源／判斷依據: 使用分區（特定農業區）；特定工廠登記
進綜理表: 是
評估事項: 農業用地變更
○△╳判定邏輯(初擬): ○:非特定農業區／△:特定農業區，依本計畫第六點啟動農變要點第六點但書第二款受理（仍須審查第五點不同意情形）／╳:未取得特定工廠登記（不適用本計畫）
因應手段: 援引本計畫第六點及農變要點第六點但書第二款
手段法源: 農變要點第六點但書第二款
手段門檻: —
時程約束: 接案初期
完成後可升級為○: 可
核對狀態: 已核對(輔導計畫核定本 PDF，桃園市政府網站轉載、使用者 2026-11-12 提供；文號經經濟部工作指引第13頁引述互證；原件存 _佐證；71層 特定工廠申請變更編定為特定目的事業用地審查辦法-重點)
覆寫/從屬總編規則: 覆寫 AGR-006 特定農業區不同意變更之判定（特定工廠案改判△）
