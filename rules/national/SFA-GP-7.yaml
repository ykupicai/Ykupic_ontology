rule_id: SFA-GP-7
法規: 特定工廠申請利用非都市土地特定農業區用地變更輔導計畫（行政計畫）
法規代碼: 院臺經字第1100181578號
現行版本: 110.09.14 行政院核定；實施期程至129.03.19（依工輔法§28-10Ⅳ）
編: —
條號: 第七點(二)
條文要旨: 申請面積未達5公頃者隔離綠帶彈性作法：1.與相鄰農業用地應規劃隔離綠帶或設施（相鄰農地已取得特登廠地者免）；2.必要時得使用【毗連土地至多1.5公尺】規劃為隔離綠帶並納入申請範圍；3.隔離綠帶範圍內應拆除之既有建築物，檢附切結書者得於申請廠房使用執照前拆除（緩拆），未完成者廢止用地計畫並恢復原編定。（★審查辦法§6②後訂為【至多3公尺】，以辦法為準）
適用辦理方式: 變更編定／開發許可（特定工廠用地計畫）
觸發條件: 取得特定工廠登記之工廠，申請利用非都市土地特定農業區土地變更
回答型態: 5交互參照
資料來源／判斷依據: —
進綜理表: 否
評估事項: 規劃配置
○△╳判定邏輯(初擬): 交互參照 SFA-6-1（毗連土地寬度以審查辦法3公尺為準，計畫之1.5公尺為舊口徑）
因應手段: —
手段法源: —
手段門檻: —
時程約束: —
完成後可升級為○: —
核對狀態: 已核對(輔導計畫核定本 PDF，桃園市政府網站轉載、使用者 2026-11-12 提供；文號經經濟部工作指引第13頁引述互證；原件存 _佐證；71層 特定工廠申請變更編定為特定目的事業用地審查辦法-重點)
覆寫/從屬總編規則: 被 SFA-6-1（J0030153 §6②）覆寫
