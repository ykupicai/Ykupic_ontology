rule_id: SP01-01A
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第1編
條號: 一之一
條文要旨: 住宅社區申請開發基地位於【一般農業區】者，面積須為【10公頃以上】
適用辦理方式: 開發許可
觸發條件: 開發類型=住宅社區且位於一般農業區
回答型態: 6實質計算
資料來源／判斷依據: joined shp 面積＋使分欄
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:≥10公頃／△:接近門檻須確認計算基準／╳:未達10公頃
因應手段: 擴大基地範圍；或改採其他開發類型／辦理方式
手段法源: 第1編第一之一點
手段門檻: 10公頃
時程約束: 接案初期分流
完成後可升級為○: 可
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
覆寫/從屬總編規則: LUR-011
