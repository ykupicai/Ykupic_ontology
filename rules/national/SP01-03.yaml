rule_id: SP01-03
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第1編
條號: 三
條文要旨: 住宅社區基地內原始地形在坵塊圖上平均坡度【30%以下】之土地面積應占全區總面積【30%以上或3公頃以上】
適用辦理方式: 開發許可
觸發條件: 開發類型=住宅社區
回答型態: 6實質計算
資料來源／判斷依據: DEM 坡度分析（25m×25m坵塊法）
進綜理表: 是
評估事項: 地形坡度
○△╳判定邏輯(初擬): ○:坡度30%以下土地達全區30%或3公頃以上／△:接近門檻須重算坵塊／╳:未達門檻
因應手段: 縮減基地範圍排除陡坡，提高平緩地占比
手段法源: 第1編第三點
手段門檻: 30%或3公頃
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
覆寫/從屬總編規則: GEN-016
