rule_id: SP01-07
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第1編
條號: 七
條文要旨: 住宅社區基地開發應於集合住宅或建築組群之外圍設置【10公尺以上】緩衝帶，且【得以道路為緩衝帶】
適用辦理方式: 開發許可
觸發條件: 開發類型=住宅社區
回答型態: 6實質計算
資料來源／判斷依據: 緩衝綠帶/（面積統計）＋配置圖
進綜理表: 是
評估事項: 規劃配置
○△╳判定邏輯(初擬): ○:外圍達10公尺以上緩衝帶（得以道路充當）／△:寬度不足須調整配置／╳:—
因應手段: 劃設10公尺以上緩衝帶，得以既有道路充當
手段法源: 第1編第七點
手段門檻: 10公尺
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
覆寫/從屬總編規則: GEN-040
