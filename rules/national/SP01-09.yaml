rule_id: SP01-09
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第1編
條號: 九
條文要旨: 住宅社區應確保基地連接縣道(含)以上聯絡道路系統交通順暢：開發完成後平日尖峰小時交通流量不得超過該道路系統【C級】服務水準之最小剩餘容量，對鄰近重要路口延滯不得低於C級；無剩餘容量時暫停核發開發許可（但有計畫道路或提交通改善計畫並徵得道路主管機關同意者不在此限）★總編§27為D級，本編加嚴為C級
適用辦理方式: 開發許可
觸發條件: 開發類型=住宅社區
回答型態: 6實質計算
資料來源／判斷依據: 交通量分析
進綜理表: 是
評估事項: 臨路情形
○△╳判定邏輯(初擬): ○:達C級服務水準／△:須提交通改善計畫並徵得道路主管機關同意／╳:無剩餘容量且無改善方案
因應手段: 提出交通改善計畫並徵得道路主管機關同意
手段法源: 第1編第九點
手段門檻: C級服務水準
時程約束: 送件前
完成後可升級為○: 可
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
覆寫/從屬總編規則: GEN-027
