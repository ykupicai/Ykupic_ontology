rule_id: SP01-24
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第1編
條號: 二十四
條文要旨: 原獎勵投資條例工業區解除編定後既存聚集住宅案：(二)申請範圍鄰接丁種建築用地者應留設【20公尺以上】緩衝綠帶或隔離設施；周邊丁建屬特殊性工業使用者【不得少於60公尺】(三)公共設施用地比例不得低於扣除緩衝綠帶及隔離設施剩餘基地面積【25%】(一)申請面積不得大於區內既存聚集住宅建築土地面積【3倍】。★本點並豁免總編14/17/28/30/32/34/35/39/40/44及本編2/3/5-7/12-14點
適用辦理方式: 開發許可
觸發條件: 開發類型=住宅社區(解除工業區編定既存聚集住宅)
回答型態: 6實質計算
資料來源／判斷依據: 配置面積統計＋周邊用地類別
進綜理表: 是
評估事項: 規劃配置
○△╳判定邏輯(初擬): ○:鄰丁建側達20公尺(特殊性工業60公尺)且公設≥25%／△:比例或寬度不足須調整／╳:面積逾既存住宅用地3倍
因應手段: 留設20/60公尺緩衝綠帶；提高公設比至25%
手段法源: 第1編第二十四點
手段門檻: 20／60公尺；公設25%；面積3倍
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
覆寫/從屬總編規則: GEN-040
