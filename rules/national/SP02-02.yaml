rule_id: SP02-02
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第2編
條號: 二
條文要旨: 高爾夫球場保育區面積不得小於扣除不可開發區面積後剩餘基地面積之【25%】；且【70%】的保育區應維持原始地形面貌不得變更地形
適用辦理方式: 開發許可
觸發條件: 開發類型=高爾夫球場
回答型態: 6實質計算
資料來源／判斷依據: DEM＋配置圖
進綜理表: 是
評估事項: 生態文資
○△╳判定邏輯(初擬): ○:保育區≥25%且其70%維持原地形／△:比例不足／╳:—
因應手段: 調整配置提高保育區比例
手段法源: 第2編第二點
手段門檻: 25%（其中70%維持原地形）
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
覆寫/從屬總編規則: GEN-017
