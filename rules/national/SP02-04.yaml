rule_id: SP02-04
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第2編
條號: 四
條文要旨: 高爾夫球場會館建築基地面積【不得大於1公頃】。另第5點：基地經整地面積扣除球道及會館建築部分應綠化，剩餘面積每單位平方公尺至少植喬木一株（單位以成樹樹冠直徑平方計）；第8點：得設附屬住宿設施，樓地板面積以不超過核准會館樓地板面積【五分之一】為則且應位於會館建築基地範圍內
適用辦理方式: 開發許可
觸發條件: 開發類型=高爾夫球場
回答型態: 6實質計算
資料來源／判斷依據: 建築計畫
