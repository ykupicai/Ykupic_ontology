rule_id: SP03-04
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第3編
條號: 四
條文要旨: 遊憩設施區遊客餐飲住宿設施建築基地面積：(一)以【遊樂區性質】為主者不得超過扣除不可開發區及保育區後剩餘基地面積之【30%】(二)以【旅館性質】為主者不得超過【55%】，其餘可開發土地並應設置觀光遊憩管理服務設施
適用辦理方式: 開發許可
觸發條件: 開發類型=遊憩設施區
回答型態: 6實質計算
資料來源／判斷依據: 配置面積統計
進綜理表: 是
評估事項: 規劃配置
○△╳判定邏輯(初擬): ○:未超過所屬性質上限／△:接近上限須確認性質認定／╳:超過上限
因應手段: 調降餐飲住宿設施建築基地面積；或釐清主要用途性質認定
手段法源: 第3編第四點
手段門檻: 遊樂區30%／旅館55%
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
覆寫/從屬總編規則: —
