rule_id: SP05-02
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第5編
條號: 二
條文要旨: 廢棄物衛生掩埋場採衛生掩埋法者應建立地下水監測系統，於基地內設置【4口以上】地下水觀測井：至少【1口】位於場地水力坡線【上游】；至少【3口】位於【下游】並應各具不同深度；下游3口中至少【1口應靠近掩埋場】設置、其餘位於基地境界線內
適用辦理方式: 開發許可
觸發條件: 開發類型=廢棄物衛生掩埋場
回答型態: 3遵照辦理
資料來源／判斷依據: 監測計畫
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): —
因應手段: 設置4口以上地下水觀測井（上游1、下游3且不同深度）
手段法源: 第5編第二點
手段門檻: 4口
時程約束: 施工前
完成後可升級為○: —
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
覆寫/從屬總編規則: —
