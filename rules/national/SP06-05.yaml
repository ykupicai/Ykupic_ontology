rule_id: SP06-05
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第6編
條號: 五
條文要旨: 殯葬設施應設置足夠聯絡道路，路寬應滿足開發完成後聯絡道路尖峰小時服務水準【D級以上】且【不得低於6公尺】；未達該服務水準者應研擬地區交通運輸管理計畫。如未採前項設置者，路寬依計畫使用容量分級：2,000以下≥6公尺、2,000以上未滿5,000≥8公尺、5,000以上≥10公尺。聯絡道路拓寬位於山坡地者應避免破壞生態環境及地形地貌
適用辦理方式: 開發許可
觸發條件: 開發類型=殯葬設施
回答型態: 6實質計算
資料來源／判斷依據: 臨路評估/成果.xlsx（道路寬度）＋計畫使用容量(墓基數＋骨灰罐數)
進綜理表: 是
評估事項: 臨路情形
○△╳判定邏輯(初擬): ○:達D級服務水準且≥6公尺（或達該容量級距寬度）／△:未達須拓寬或研擬交通運輸管理計畫／╳:無拓寬空間
因應手段: 拓寬聯絡道路；或研擬地區交通運輸管理計畫
手段法源: 第6編第五點
手段門檻: D級服務水準且≥6公尺；容量分級6／8／10公尺
時程約束: 送件前
完成後可升級為○: 可
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
覆寫/從屬總編規則: GEN-026
