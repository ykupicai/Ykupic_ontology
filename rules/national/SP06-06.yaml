rule_id: SP06-06
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第6編
條號: 六
條文要旨: 殯葬設施屬【埋藏性質之墓區】應留設一定比例土地作綠化空地、水土保持設施及墓區內步道等使用：基地位於【山坡地】者比例不得小於墓區面積【50%】；位於【平地】者不得小於墓區面積【30%】。另計畫使用容量計算：埋藏性質依殯葬管理條例§23；非埋藏性質骨灰罐每罐0.15㎡、骨骸罐每罐0.3㎡樓地板面積
適用辦理方式: 開發許可
觸發條件: 開發類型=殯葬設施
回答型態: 6實質計算
資料來源／判斷依據: 配置面積統計
進綜理表: 是
評估事項: 規劃配置
○△╳判定邏輯(初擬): ○:達該區位比例／△:不足須調整／╳:—
因應手段: 提高綠化空地比例
手段法源: 第6編第六點
手段門檻: 山坡地50%／平地30%
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
覆寫/從屬總編規則: —
