rule_id: SP08-01
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第8編
條號: 一
條文要旨: 非都市土地申請開發工業區面積【不得少於10公頃】。★但依據【產業創新條例】等有關規定申請開發者面積【不得少於5公頃】
適用辦理方式: 開發許可
觸發條件: 開發類型=工業區開發計畫
回答型態: 6實質計算
資料來源／判斷依據: joined shp 面積合計
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:≥10公頃（或依產創條例≥5公頃）／△:接近門檻／╳:未達下限
因應手段: 擴大基地；或改依產業創新條例等規定申請（下限降為5公頃）
手段法源: 第8編第一點
手段門檻: 10公頃／產創5公頃
時程約束: 接案初期分流
完成後可升級為○: 可
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
覆寫/從屬總編規則: LUR-011
