rule_id: SP08-06
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第8編
條號: 六
條文要旨: 工業區形狀應完整連接，連接部分最小寬度【不得少於50公尺】。★但經區委會認定情況特殊且符合整體規劃開發並無影響安全之虞者不在此限。第2項：基地中有部分為非申請開發範圍之地區者應維持該等地區出入道路之功能
適用辦理方式: 開發許可
觸發條件: 開發類型=工業區開發計畫
回答型態: 6實質計算
資料來源／判斷依據: 基地幾何（最小連接寬度）
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:連接部分≥50公尺／△:不足但可報區委會認定情況特殊／╳:基地破碎無法連接
因應手段: 調整基地範圍使連接部分達50公尺；或報區委會認定情況特殊
手段法源: 第8編第六點
手段門檻: 50公尺
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
覆寫/從屬總編規則: GEN-014
