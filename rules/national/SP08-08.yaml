rule_id: SP08-08
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第8編
條號: 八
條文要旨: 工業區應依開發面積、工業密度及出入交通量，設置【二條以上獨立】之聯絡道路，主要聯絡道路路寬【不得小於15公尺】；前項聯絡道路其中一條作為【緊急通路，寬度不得小於7公尺】；★第3項：區域計畫委員會得依據工業區之鄉鎮地區環境限制、區位條件、工業性質【酌減】其聯絡道路寬度
適用辦理方式: 開發許可
觸發條件: 開發類型=工業區開發計畫
回答型態: 6實質計算
資料來源／判斷依據: 臨路評估/成果.xlsx（臨路三態＋道路寬度）
進綜理表: 是
評估事項: 臨路情形
○△╳判定邏輯(初擬): ○:≥2條獨立且主要≥15公尺、緊急≥7公尺／△:寬度不足但可依第3項請區委會依鄉鎮環境限制/區位/工業性質酌減／╳:僅1條聯絡道路
因應手段: 拓寬主要聯絡道路；或依第8點第3項請區委會酌減（須具鄉鎮地區環境限制、區位條件或工業性質之理由）
手段法源: 第8編第八點
手段門檻: 主要15公尺／緊急7公尺（得酌減）
時程約束: 送件前
完成後可升級為○: 可
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
覆寫/從屬總編規則: GEN-026
