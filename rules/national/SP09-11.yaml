rule_id: SP09-11
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第9編
條號: 十一
條文要旨: 工業區細部計畫區內道路：主要道路≥12公尺(全線須植栽綠化)、次要道路≥10公尺、服務道路≥8公尺；★但位屬工廠管理輔導法群聚地區、或依該法取得特定工廠登記面積達5公頃以上申請開發產業園區者，主次要道路寬度得酌減，最小不得低於8公尺
適用辦理方式: 開發許可
觸發條件: 開發類型=工業區細部計畫
回答型態: 6實質計算
資料來源／判斷依據: 區內道路配置圖
進綜理表: 是
評估事項: 臨路情形
○△╳判定邏輯(初擬): ○:各級道路均達標／△:屬群聚地區或特登工廠≥5公頃產業園區得酌減至8公尺／╳:低於8公尺絕對下限
因應手段: 調整區內道路配置；群聚地區或特登工廠案申請酌減
手段法源: 第9編第十一點
手段門檻: 12／10／8公尺（酌減下限8公尺）
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
覆寫/從屬總編規則: GEN-026
