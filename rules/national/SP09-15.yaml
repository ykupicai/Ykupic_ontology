rule_id: SP09-15
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第9編
條號: 十五
條文要旨: 工業區開發後透水面積【不得小於基地面積之30%】★注意分母為「基地面積」，與總編§32「扣除不可開發區及保育區後剩餘基地面積」不同；基地位於地下水補注地質敏感區者依地質敏感區基地地質調查及地質安全評估作業準則辦理
適用辦理方式: 開發許可
觸發條件: 開發類型=工業區細部計畫
回答型態: 6實質計算
資料來源／判斷依據: 配置面積統計
進綜理表: 是
評估事項: 透水率
○△╳判定邏輯(初擬): ○:透水面積≥基地面積30%／△:不足須調整鋪面／╳:—
因應手段: 調整鋪面材質提高透水面積
手段法源: 第9編第十五點
手段門檻: 基地面積30%
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
覆寫/從屬總編規則: GEN-032
