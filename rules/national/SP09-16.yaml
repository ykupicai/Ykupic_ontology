rule_id: SP09-16
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第9編
條號: 十六
條文要旨: 工業區整地應配合自然景觀風貌：基地內除建築物、道路、水域及必要之作業營運等人工設施外應予綠化，【綠覆率應達60%以上】；整地後坡面應處理成和緩曲面；應研擬控制土壤沖蝕量措施；應擬定表土貯存計畫；棄土取土地點應依法取得相關主管機關同意
適用辦理方式: 開發許可
觸發條件: 開發類型=工業區細部計畫
回答型態: 6實質計算
資料來源／判斷依據: 配置面積統計
進綜理表: 是
評估事項: 規劃配置
○△╳判定邏輯(初擬): ○:綠覆率≥60%／△:不足須調整綠化配置／╳:—
因應手段: 提高綠化面積達綠覆率60%
手段法源: 第9編第十六點
手段門檻: 綠覆率60%
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
覆寫/從屬總編規則: —
