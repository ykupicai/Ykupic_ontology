rule_id: SP09-19
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第9編
條號: 十九
條文要旨: 工業區【住宅社區用地】建蔽率≤50%、容積率≤200%；山坡地範圍建蔽率≤40%、容積率≤120%。【生產事業用地】編定為特定目的事業用地者容積率≤180%；★但申請人提出增加需求經區委會審議認定具合理性者得酌增，容積率不得超過【240%】
適用辦理方式: 開發許可
觸發條件: 開發類型=工業區細部計畫
回答型態: 6實質計算
資料來源／判斷依據: 建築計畫
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): —
因應手段: 提出增加容積需求報區委會審議（上限240%）
手段法源: 第9編第十九點
手段門檻: 住宅50%/200%；山坡地40%/120%；生產事業180%(得增至240%)
時程約束: 規劃階段
完成後可升級為○: —
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
覆寫/從屬總編規則: —
