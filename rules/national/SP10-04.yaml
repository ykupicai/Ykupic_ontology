條文要旨: 休閒農場內應辦理土地使用變更之使用地內休閒農業設施，與休閒農場範圍外緊鄰土地使用性質不相容者，應設置【適當之】緩衝綠帶或隔離設施（未定數值）
適用辦理方式: 開發許可
觸發條件: 開發類型=休閒農場
回答型態: 6實質計算
資料來源／判斷依據: 緩衝綠帶/（面積統計）
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): —
因應手段: 設置適當緩衝綠帶或隔離設施（寬度由個案認定）
手段法源: 第10編第四點
手段門檻: 無數值
時程約束: 規劃階段
完成後可升級為○: —
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
