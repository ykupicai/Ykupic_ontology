rule_id: SP10-05
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第10編
條號: 五
條文要旨: 休閒農場應設置足夠之聯絡道路，路寬不得小於6公尺。★但經農業主管機關依法列入專案輔導之已開發休閒農場申請案，有具體交通改善計畫且經區域計畫委員會同意者，不在此限
適用辦理方式: 開發許可
觸發條件: 開發類型=休閒農場
回答型態: 6實質計算
資料來源／判斷依據: 臨路評估/成果.xlsx（道路寬度）
進綜理表: 是
評估事項: 臨路情形
○△╳判定邏輯(初擬): ○:≥6公尺／△:不足但屬專案輔導已開發休閒農場且有具體交通改善計畫／╳:不臨路且非專案輔導案
因應手段: 拓寬；或以專案輔導身分提具體交通改善計畫報區委會同意
手段法源: 第10編第五點
手段門檻: 6公尺
時程約束: 送件前
完成後可升級為○: 可
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
覆寫/從屬總編規則: GEN-026
