rule_id: SP11-04
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第11編
條號: 四
條文要旨: 填海造地【禁止區位14款】：①國家公園區域及其外5公里 ②依法劃指定公告之保育區保護區保留區及其外5公里 ③沿海自然保護區及其外5公里或一般保護區內 ④要塞地帶、海岸管制區、重要軍事設施管制區及其他法令禁建限建範圍 ⑤依法設立海水浴場及其外3公里 ⑥縣市級以上風景特定區 ⑦古蹟及重要考古遺址及其外3公里 ⑧重要濕地及其外3公里 ⑨海洋放流管3公里或海底纜管1公里 ⑩人工魚礁區及其外3公里 ⑪中央管及縣市管河川河口區 ⑫活動斷層500公尺 ⑬已依法令設定礦區或土石區 ⑭經劃編公告保安林。★但經各該目的事業主管機關同意或認定不影響者不在此限
適用辦理方式: 開發許可
觸發條件: 開發類型=填海造地
回答型態: 2不適用／6實質計算
資料來源／判斷依據: 海域圖層套疊
進綜理表: 是
評估事項: 環境敏感
○△╳判定邏輯(初擬): ○:14款均不命中／△:命中但已取得目的事業主管機關同意或認定不影響／╳:命中且無法取得同意
因應手段: 函詢各該目的事業主管機關取得同意或不影響認定
手段法源: 第11編第四點
手段門檻: 各款距離門檻（5／3／1公里、500公尺）
時程約束: 送件前
完成後可升級為○: 可
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
覆寫/從屬總編規則: GEN-009
