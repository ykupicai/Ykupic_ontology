rule_id: SP11-06
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第11編
條號: 六
條文要旨: 填海造地開發面積以適用為原則；面積在【250公頃以上】者應視土地利用方式及內陸排水需要設置【隔離水道】，寬度依水工模型試驗及數值模式推算結果決定；開發基地形狀以接近方形或半圓形為原則
適用辦理方式: 開發許可
觸發條件: 開發類型=填海造地
回答型態: 6實質計算
資料來源／判斷依據: 基地面積
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): —
因應手段: 設置隔離水道（寬度依水工模型試驗決定）
手段法源: 第11編第六點
手段門檻: 250公頃
時程約束: 規劃階段
完成後可升級為○: —
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
覆寫/從屬總編規則: LUR-011
