rule_id: SP11-21
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第11編
條號: 二十一
條文要旨: 填築新生地應設置防風、飛砂防止、潮害防備等保護林帶：主要受風面【主林帶不小於50公尺、總寬度不小於100公尺為原則】；★新生地供【農、林、漁、牧】使用者保護林帶寬度【得減為二分之一】；位於【離島地區】者得視實際需要設置、不受寬度限制
適用辦理方式: 開發許可
觸發條件: 開發類型=填海造地
回答型態: 6實質計算
資料來源／判斷依據: 配置圖＋風向分析
進綜理表: 是
評估事項: 規劃配置
○△╳判定邏輯(初擬): ○:主林帶≥50公尺且總寬≥100公尺(農林漁牧用得減半／離島不受限)／△:寬度不足須調整／╳:—
因應手段: 供農林漁牧使用者主張減半；離島案主張不受限
手段法源: 第11編第二十一點
手段門檻: 主林帶50公尺／總寬100公尺(得減半)
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
覆寫/從屬總編規則: GEN-041
