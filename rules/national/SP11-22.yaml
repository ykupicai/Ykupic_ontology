rule_id: SP11-22
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第11編
條號: 二十二
條文要旨: 填海造地應依開發面積、人口規模、產業密度及出入交通量需求預測設置足夠聯絡道路；主要聯絡道路容量設計以尖峰時間【不低於C級】道路服務水準為考量，且道路等級【不得小於標準雙車道公路】；開發區應開闢通路以維護民眾親水及公共通行權益
適用辦理方式: 開發許可
觸發條件: 開發類型=填海造地
回答型態: 6實質計算
資料來源／判斷依據: 交通量分析
進綜理表: 是
評估事項: 臨路情形
○△╳判定邏輯(初擬): ○:達C級且標準雙車道以上並已開闢親水通路／△:須提交通改善／╳:—
因應手段: 提出交通改善計畫
手段法源: 第11編第二十二點
手段門檻: C級服務水準／標準雙車道公路
時程約束: 送件前
完成後可升級為○: 可
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
覆寫/從屬總編規則: GEN-026
