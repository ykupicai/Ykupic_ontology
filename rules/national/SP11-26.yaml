rule_id: SP11-26
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第11編
條號: 二十六
條文要旨: 填海造地開發區內工業區與區內或區外之集合住宅或聚落，應有【50公尺以上】寬度之綠帶作為緩衝區；第2項：緩衝區寬度【得將道路或隔離水道併入計算】，但【其中綠帶寬度應至少20公尺】；第3項：建築線與堤防胸牆外緣線間距離應在【50公尺以上】
適用辦理方式: 開發許可
觸發條件: 開發類型=填海造地
回答型態: 6實質計算
資料來源／判斷依據: 配置圖量測；「聚落」認定用 大量圖資轉換工具/scripts/settlement_check.py（門牌坐標開放資料聚類，非數環域內門牌數）
進綜理表: 是
評估事項: 規劃配置
○△╳判定邏輯(初擬): ○:緩衝區≥50公尺(其中綠帶≥20公尺)且建築線退縮≥50公尺／△:不足須調整配置（得併計道路或隔離水道）／╳:—
因應手段: 以道路或隔離水道併入緩衝區寬度計算；調整建築線退縮
手段法源: 第11編第二十六點
手段門檻: 緩衝區50公尺(綠帶20公尺)／退縮50公尺
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
覆寫/從屬總編規則: GEN-040
