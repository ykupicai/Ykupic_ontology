rule_id: SP12-05
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第12編
條號: 五
條文要旨: 工商綜合區基地聯絡道路應至少有【二條獨立】通往外接道路，其中一條路寬至少【15.5公尺】以上，另一條可為緊急通路、寬度【不得小於7.5公尺】。★第2項：前項路寬經區委會認定情況特殊，有具體交通改善計畫且經區委會同意者，不在此限
適用辦理方式: 開發許可
觸發條件: 開發類型=工商綜合區
回答型態: 6實質計算
資料來源／判斷依據: 臨路評估/成果.xlsx（臨路三態＋道路寬度）
進綜理表: 是
評估事項: 臨路情形
○△╳判定邏輯(初擬): ○:≥2條獨立且主要≥15.5公尺、緊急≥7.5公尺／△:寬度不足但有具體交通改善計畫報區委會同意／╳:僅1條
因應手段: 拓寬；或提具體交通改善計畫報區委會同意
手段法源: 第12編第五點
手段門檻: 主要15.5公尺／緊急7.5公尺
時程約束: 送件前
完成後可升級為○: 可
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
覆寫/從屬總編規則: GEN-026
