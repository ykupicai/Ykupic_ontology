rule_id: SP12-06
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第12編
條號: 六
條文要旨: 基地供購物中心、工商服務及展覽或批發量販使用者，其進出口之一【半徑500公尺內】設有大眾捷運系統或鐵路之客運車站時，區委會得視情況【折減】其聯絡道路之寬度限制
適用辦理方式: 開發許可
觸發條件: 開發類型=工商綜合區且鄰近軌道車站
回答型態: 6實質計算
資料來源／判斷依據: 進出口位置＋軌道車站位置
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): —
因應手段: 以鄰近軌道車站為由申請折減聯絡道路寬度
手段法源: 第12編第六點
手段門檻: 500公尺
時程約束: 送件前
完成後可升級為○: —
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
覆寫/從屬總編規則: SP12-05
