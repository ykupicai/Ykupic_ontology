rule_id: SP12-17
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第12編
條號: 十七
條文要旨: 工商綜合區應設置足供區內開發衍生行為所需之【必要性服務設施】，其面積佔申請開發土地總面積之比例【依附表五】辦理；用地應於分割後變更編定為適當用地；屬通過性道路者應【捐贈並分割移轉登記為該管地方政府所有】
適用辦理方式: 開發許可
觸發條件: 開發類型=工商綜合區
回答型態: 6實質計算
資料來源／判斷依據: 配置面積統計＋附表五
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): —
因應手段: 依附表五配置必要性服務設施；通過性道路辦理捐贈
手段法源: 第12編第十七點
手段門檻: 見附表五
時程約束: 規劃階段
完成後可升級為○: —
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
覆寫/從屬總編規則: —
