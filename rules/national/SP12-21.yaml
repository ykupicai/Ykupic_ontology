rule_id: SP12-21
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第12編
條號: 二十一
條文要旨: 工商綜合區開發後基地內透水面積【不得小於扣除生態綠地面積後剩餘基地面積之30%】。★但經區委會認定無影響安全之虞者不在此限
適用辦理方式: 開發許可
觸發條件: 開發類型=工商綜合區
回答型態: 6實質計算
資料來源／判斷依據: 配置面積統計
進綜理表: 是
評估事項: 透水率
○△╳判定邏輯(初擬): ○:≥30%（扣除生態綠地後）／△:不足須調整或報區委會認定無安全之虞／╳:—
因應手段: 調整鋪面材質；或報區委會認定無影響安全之虞
手段法源: 第12編第二十一點
手段門檻: 30%
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
覆寫/從屬總編規則: GEN-032
