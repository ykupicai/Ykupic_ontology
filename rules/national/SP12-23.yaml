rule_id: SP12-23
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第12編
條號: 二十三
條文要旨: 工商綜合區各種使用可建築用地建蔽率上限：綜合工業60%、倉儲物流80%、工商服務及展覽60%、修理服務業70%、批發量販80%、購物中心60%；以垂直混合使用規劃者以較低者為限。另第20點：單身員工宿舍社區用地面積≤申請開發土地總面積【3%】、樓地板總面積≤每位計畫住宿員工30㎡合計
適用辦理方式: 開發許可
觸發條件: 開發類型=工商綜合區
回答型態: 6實質計算
資料來源／判斷依據: 建築計畫
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): —
因應手段: —
手段法源: 第12編第二十三點
手段門檻: 各使用別60~80%；員工宿舍3%
時程約束: 規劃階段
完成後可升級為○: —
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
覆寫/從屬總編規則: —
