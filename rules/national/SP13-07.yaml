rule_id: SP13-07
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第13編
條號: 七
條文要旨: 農村社區土地重劃基地聯絡道路應至少有【獨立二條】通往聯外道路，其中一條路寬至少【6公尺】以上，另一條可為緊急通路且寬度須能容納消防車通行。★但經區委會認定情況特殊且足供需求並無影響安全之虞者不在此限。第2項：重劃完成後平日尖峰小時交通流量不得使基地連接縣道(含)以上聯絡道路系統服務水準低於【D級】★注意：本編第2點已豁免總編§26，改依本點
適用辦理方式: 開發許可
觸發條件: 開發類型=農村社區土地重劃
回答型態: 6實質計算
資料來源／判斷依據: 臨路評估/成果.xlsx（臨路三態＋道路寬度）
進綜理表: 是
評估事項: 臨路情形
○△╳判定邏輯(初擬): ○:≥2條獨立且其一≥6公尺並達D級服務水準／△:不足但可援引本點但書或提交通改善計畫／╳:僅1條且無但書適用
因應手段: 拓寬或另闢；或援引本點但書；或提交通改善計畫報區委會同意
手段法源: 第13編第七點
手段門檻: 主要6公尺／D級服務水準
時程約束: 送件前
完成後可升級為○: 可
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
覆寫/從屬總編規則: GEN-026
