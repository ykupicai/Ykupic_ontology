rule_id: SP13-10
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第13編
條號: 十／十一
條文要旨: 農村社區土地重劃基地內【乙種建築用地】使用強度：平地建蔽率≤60%、容積率≤150%；山坡地建蔽率≤40%、容積率≤100%。★但基地內既存已編定之建築用地或經區委會審議同意者不在此限。第11點：新建建築物高度【不得超過3層樓且不得超過10.5公尺】
適用辦理方式: 開發許可
觸發條件: 開發類型=農村社區土地重劃
回答型態: 6實質計算
資料來源／判斷依據: 建築計畫
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): —
