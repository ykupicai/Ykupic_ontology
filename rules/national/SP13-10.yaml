手段法源: 第13編第十／十一點
手段門檻: 平地60%/150%、山坡地40%/100%；高度3層且10.5公尺
時程約束: 規劃階段
完成後可升級為○: —
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
