rule_id: SP13-12
法規: 非都市土地開發審議作業規範
法規代碼: FL003635
現行版本: 111.05.20 台內營字第1110807961號
編: 第13編
條號: 十二
條文要旨: 農村社區土地重劃【住宅分區之外圍】應設置適當之緩衝帶，且【得以道路、防風林、綠帶、河川、區域灌排水路充當】。★但範圍內【既存之建築用地】不在此限。（總編§40已由本編第2點豁免）
適用辦理方式: 開發許可
觸發條件: 開發類型=農村社區土地重劃
回答型態: 6實質計算
資料來源／判斷依據: 周邊地物判讀＋既存建築用地範圍
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): —
因應手段: 以既有道路／防風林／河川／區域灌排水路充當緩衝帶；既存建築用地免設
手段法源: 第13編第十二點
手段門檻: 無數值
時程約束: 規劃階段
完成後可升級為○: —
核對狀態: 已核對(內政部glrs全文111.05.20逐點抄錄)
覆寫/從屬總編規則: GEN-040
