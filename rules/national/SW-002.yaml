rule_id: SW-002
法規: 非都市土地申請變更作為社會福利設施使用其事業計畫審查作業要點
法規代碼: FL053363
現行版本: 93.01.12 內授中社字第0930708866號令（88.11.11 訂定；102.07.23 業務移撥衛生福利部）
編: —
條號: 第二點
條文要旨: 社會福利設施定義：兒童及少年、婦女、老人、身心障礙福利機構、社會救助機構、社區活動中心或其他中央法規明定地方政府應按需要設立或獎勵民間興辦之各類社會福利設施。社區活動中心限縣市政府、鄉鎮市區公所或社區發展協會興建，原則一社區一所。
適用辦理方式: 變更編定
觸發條件: 用途=社會福利設施（兒少、婦女、老人、身障福利機構、社會救助機構、社區活動中心等）
回答型態: 是否
資料來源／判斷依據: 社政主管機關認定
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:屬列名機構且經社政主管機關認定／△:待認定／╳:非社會福利設施
因應手段: 向縣市社會局（處）確認設施屬性
手段法源: —
手段門檻: —
時程約束: 接案初期分流
完成後可升級為○: 可
核對狀態: 已核對(內政部 glrs.moi.gov.tw FL053363 原文逐點抄錄，2026-11-12)；2026-11-12 知識庫回官方原文抽核相符（71層 非都市土地申請變更作為社會福利設施使用其事業計畫審查作業要點-重點）
覆寫/從屬總編規則: —
