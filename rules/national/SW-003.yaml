rule_id: SW-003
法規: 非都市土地申請變更作為社會福利設施使用其事業計畫審查作業要點
法規代碼: FL053363
現行版本: 93.01.12 內授中社字第0930708866號令（88.11.11 訂定；102.07.23 業務移撥衛生福利部）
編: —
條號: 第三點
條文要旨: 申請書件一式十份：申請書、興辦社會福利事業計畫（緣起、目的、需求評估〔轄區同性質設施分布容量、供需及急迫性〕、營運計畫）、應予保護禁止或限制建築地區查詢結果一覽表（附表二）、農地變更使用說明書（涉農地變更者）、使用清冊、變更編定使用同意書、謄本、配置圖（≥1/1200）及位置圖（≥1/5000）。
適用辦理方式: 變更編定
觸發條件: 用途=社會福利設施（兒少、婦女、老人、身障福利機構、社會救助機構、社區活動中心等）
回答型態: 3遵照辦理
資料來源／判斷依據: —
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): 書件要求，不判○△╳
因應手段: —
手段法源: —
手段門檻: —
時程約束: 送件前
完成後可升級為○: —
核對狀態: 已核對(內政部 glrs.moi.gov.tw FL053363 原文逐點抄錄，2026-11-12)；2026-11-12 知識庫回官方原文抽核相符（71層 非都市土地申請變更作為社會福利設施使用其事業計畫審查作業要點-重點）
覆寫/從屬總編規則: —
