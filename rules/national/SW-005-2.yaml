rule_id: SW-005-2
法規: 非都市土地申請變更作為社會福利設施使用其事業計畫審查作業要點
法規代碼: FL053363
現行版本: 93.01.12 內授中社字第0930708866號令（88.11.11 訂定；102.07.23 業務移撥衛生福利部）
編: —
條號: 第五點(二)
條文要旨: 申請使用山坡地範圍內各種使用區之土地，應依水土保持法、山坡地保育利用條例、管制規則及山坡地建築管理辦法辦理，並【不得使用】依山坡地土地可利用限度分類標準查定為【五級地之宜林地及六級地之加強保育地】。
適用辦理方式: 變更編定
觸發條件: 用途=社會福利設施（兒少、婦女、老人、身障福利機構、社會救助機構、社區活動中心等）
回答型態: 2不適用／6實質計算
資料來源／判斷依據: 環敏山坡地套疊；山坡地土地可利用限度查定（水保局／縣市）
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): 非山坡地→不適用／山坡地且非五、六級→○／查定未明→△／含五、六級地→╳（剔除該部分）
因應手段: 調查土地可利用限度查定結果，剔除五、六級地
手段法源: —
手段門檻: —
時程約束: 送件前
完成後可升級為○: 可（剔除後）
核對狀態: 已核對(內政部 glrs.moi.gov.tw FL053363 原文逐點抄錄，2026-11-12)；2026-11-12 知識庫回官方原文抽核相符（71層 非都市土地申請變更作為社會福利設施使用其事業計畫審查作業要點-重點）
覆寫/從屬總編規則: —
