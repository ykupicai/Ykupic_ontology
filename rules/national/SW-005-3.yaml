rule_id: SW-005-3
法規: 非都市土地申請變更作為社會福利設施使用其事業計畫審查作業要點
法規代碼: FL053363
現行版本: 93.01.12 內授中社字第0930708866號令（88.11.11 訂定；102.07.23 業務移撥衛生福利部）
編: —
條號: 第五點(三)
條文要旨: 擬興辦事業用地不得使用【特定農業區經辦竣農地重劃之農牧用地】。但在不影響農地重劃區完整性及農業生產環境原則下，符合下列之一者不在此限：1.經行政院核定之公共建設所需用地；2.經目的事業主管機關查明確屬88.02.20前已違規使用、列為專案輔導之社會福利機構用地，且89.05.03前已受理、處理程序尚未終結者。
適用辦理方式: 變更編定
觸發條件: 用途=社會福利設施（兒少、婦女、老人、身障福利機構、社會救助機構、社區活動中心等）
回答型態: 6實質計算
資料來源／判斷依據: 農地重劃區圖層＋基地使用分區（特定農業區）＋使類（農牧）
進綜理表: 是
評估事項: 農業用地變更
○△╳判定邏輯(初擬): 非特定農業區或未涉重劃區→○／特農區重劃區農牧用地且符合但書→△／符合條件且無但書→╳
因應手段: 剔除特農區重劃區農牧用地
手段法源: —
手段門檻: —
時程約束: 接案初期分流
完成後可升級為○: 可（剔除後）
核對狀態: 已核對(內政部 glrs.moi.gov.tw FL053363 原文逐點抄錄，2026-11-12)；2026-11-12 知識庫回官方原文抽核相符（71層 非都市土地申請變更作為社會福利設施使用其事業計畫審查作業要點-重點）
覆寫/從屬總編規則: AGR-006
