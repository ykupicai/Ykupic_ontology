rule_id: SW-005-5
法規: 非都市土地申請變更作為社會福利設施使用其事業計畫審查作業要點
法規代碼: FL053363
現行版本: 93.01.12 內授中社字第0930708866號令（88.11.11 訂定；102.07.23 業務移撥衛生福利部）
編: —
條號: 第五點(五)
條文要旨: 建築基地應【臨接道路】，或以通路連接道路，其通路寬度依實施區域計畫地區建築管理辦法及建築技術規則規定辦理。
適用辦理方式: 變更編定
觸發條件: 用途=社會福利設施（兒少、婦女、老人、身障福利機構、社會救助機構、社區活動中心等）
回答型態: 6實質計算
資料來源／判斷依據: 臨路評估/成果.xlsx＋鄰地地籍（道路坐落地號使類）
進綜理表: 是
評估事項: 臨路情形
○△╳判定邏輯(初擬): ○:臨接交通用地道路／△:以私設通路連接或道路坐落私地待認定／╳:不臨路且無通路
因應手段: 取得通行權或土地通行同意書；留設通路
手段法源: 實施區域計畫地區建築管理辦法§11
手段門檻: 依建築技術規則通路寬度
時程約束: 送件前
完成後可升級為○: 可
核對狀態: 已核對(內政部 glrs.moi.gov.tw FL053363 原文逐點抄錄，2026-11-12)；2026-11-12 知識庫回官方原文抽核相符（71層 非都市土地申請變更作為社會福利設施使用其事業計畫審查作業要點-重點）
覆寫/從屬總編規則: RBM-011
