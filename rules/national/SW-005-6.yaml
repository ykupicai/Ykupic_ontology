rule_id: SW-005-6
法規: 非都市土地申請變更作為社會福利設施使用其事業計畫審查作業要點
法規代碼: FL053363
現行版本: 93.01.12 內授中社字第0930708866號令（88.11.11 訂定；102.07.23 業務移撥衛生福利部）
編: —
條號: 第五點(六)
條文要旨: 申請地區不得位於相關法規劃定應予保護或禁止、限制建築之管制區。
適用辦理方式: 變更編定
觸發條件: 用途=社會福利設施（兒少、婦女、老人、身障福利機構、社會救助機構、社區活動中心等）
回答型態: 6實質計算
資料來源／判斷依據: ⓪b 環敏 NGIS 套疊＋附表二查詢結果
進綜理表: 是
評估事項: 環境敏感
○△╳判定邏輯(初擬): ○:均未涉及／△:涉第二級或限建待主管機關意見／╳:位於禁止建築管制區
因應手段: 剔除涉及禁建範圍之土地
手段法源: 管制規則§30-1、§30-3
手段門檻: —
時程約束: 送件前
完成後可升級為○: 可（剔除後）
核對狀態: 已核對(內政部 glrs.moi.gov.tw FL053363 原文逐點抄錄，2026-11-12)；2026-11-12 知識庫回官方原文抽核相符（71層 非都市土地申請變更作為社會福利設施使用其事業計畫審查作業要點-重點）
覆寫/從屬總編規則: LUR-030-1、LUR-030-3
