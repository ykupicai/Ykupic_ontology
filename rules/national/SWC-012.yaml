rule_id: SWC-012
法規: 水土保持法
法規代碼: M0110001
現行版本: 105.11.30
編: —
條號: '12'
條文要旨: 於山坡地或森林區內從事下列行為應先擬具水土保持計畫送核定：①修築農路或整坡作業 ②探礦採礦鑿井採取土石 ③修建鐵路公路其他道路或溝渠 ④開發建築用地、設置公園墳墓遊憩用地運動場地或軍事訓練場、堆積土石、處理廢棄物或其他開挖整地。★§12Ⅱ：水保計畫未經核定前，各目的事業主管機關不得逕行核發開發或利用之許可。§12Ⅳ：屬中央指定種類且規模未達所定者，得以簡易水土保持申報書代替
適用辦理方式: 全路線
觸發條件: 基地位於山坡地（§3③：標高100公尺以上，或未滿100公尺而平均坡度5%以上之劃定範圍）
回答型態: 2不適用／3遵照辦理
資料來源／判斷依據: 環境敏感套疊.csv（山坡地範圍）★須查法定劃定圖資，不可目視判斷
進綜理表: 是
評估事項: 地形坡度
○△╳判定邏輯(初擬): ○:非山坡地劃定範圍／△:屬山坡地須辦水土保持計畫（或簡易申報書）並經核定／╳:屬特定水土保持區（第一級環敏）
因應手段: 委託水保技師辦理水土保持計畫；規模未達中央所定者以簡易水土保持申報書辦理
手段法源: 水土保持法§12Ⅰ、§12Ⅳ
手段門檻: 中央主管機關指定之種類與規模（子法待補）
時程約束: ★須先取得水保計畫核定，目的事業主管機關方得核發開發許可（§12Ⅱ）
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫 M0110001 §12；已建 71 層筆記)
覆寫/從屬總編規則: —
