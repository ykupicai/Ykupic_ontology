rule_id: SWCR-03
法規: 水土保持計畫審核監督辦法
法規代碼: M0110012
現行版本: 114.09.09
編: —
條號: '3'
條文要旨: 於山坡地或森林區內從事水保法§12Ⅰ各款行為，且【挖方及填方加計總和或堆積土石方分別未滿2,000立方公尺】者，其水土保持計畫得以【簡易水土保持申報書】代替，共12款規模（例：修築農路路基寬未滿4公尺且長未滿500公尺；整坡作業開挖整地面積未滿1公頃；採取土石未滿30立方公尺；農業生產設施建築面積及開挖整地面積合計未滿1公頃；其他開發建築用地未滿500平方公尺）。★本辦法全文無「出流管制」，既有簡報引其§2 談出流管制屬引錯法規
適用辦理方式: 全路線
觸發條件: 基地位於山坡地或森林區
回答型態: 2不適用／6實質計算
資料來源／判斷依據: 環境敏感套疊.csv（山坡地）＋挖填方量估算
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): —
因應手段: 規模未達者以簡易水土保持申報書辦理（可大幅縮短時程）
手段法源: 水保計畫審核監督辦法§3
手段門檻: 挖填方2,000m³；各款規模
時程約束: 取得開發許可前
完成後可升級為○: —
核對狀態: 已核對(全國法規資料庫逐條抄錄)
覆寫/從屬總編規則: SWC-012
