rule_id: UAG-12
法規: 都市計畫農業區變更使用審議規範
法規代碼: FL003637
現行版本: 107.01.25 台內營字第1060816880號令（86.02.17 訂定；內政部，法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 第十二點
條文要旨: 土地區位應以【鄰近已發展地區或規劃為發展區者優先】，且面積應符合：(一)直轄市、省轄市、縣轄市計畫地區【不得小於3公頃】；(二)鄉街計畫、鎮計畫及特定區計畫地區【不得小於5公頃】。事業計畫經中央主管機關同意，或申請土地四周因下列情形致無法擴展者，得不受面積限制：(一)河川、湖泊或山崖等自然地形阻隔；(二)8公尺以上既成或計畫道路或其他人為重大設施阻隔；(三)為已發展或規劃為發展區所包圍。
適用辦理方式: 都計變更
觸發條件: 都市計畫農業區申請變更為其他使用區（另訂有該變更用途之審議規範或處理原則者從其規定，第二點）
回答型態: 6實質計算
資料來源／判斷依據: 基地登記面積；都市計畫種類（市／鄉街／鎮／特定區）；四周道路寬度與分區
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:達3／5公頃門檻／△:未達門檻但符第二項例外（中央同意或四周阻隔包圍）或得引第二點之一（UAG-2-1）由都委會審決／╳:未達門檻且無任何例外
因應手段: 擴大申請範圍；或舉證四周阻隔／包圍；或取得目的事業主管機關同意引第二點之一
手段法源: FL003637 第十二點第二項、第二點之一
手段門檻: 3公頃（市）／5公頃（鄉街、鎮、特定區）
時程約束: 接案初期
完成後可升級為○: 可
核對狀態: 已核對(內政部 glrs.moi.gov.tw FL003637 原文，2026-11-12 知識庫拆條；71層 都市計畫農業區變更使用審議規範-重點)
覆寫/從屬總編規則: —
