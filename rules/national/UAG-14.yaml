rule_id: UAG-14
法規: 都市計畫農業區變更使用審議規範
法規代碼: FL003637
現行版本: 107.01.25 台內營字第1060816880號令（86.02.17 訂定；內政部，法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 第十四點
條文要旨: 申請變更使用之土地應臨接或設置【8公尺以上之聯外道路】，且該聯外道路須有足夠容量可容納該開發所產生之交通需求。
適用辦理方式: 都計變更
觸發條件: 都市計畫農業區申請變更為其他使用區（另訂有該變更用途之審議規範或處理原則者從其規定，第二點）
回答型態: 6實質計算
資料來源／判斷依據: 臨路評估成果（道路寬度、開闢狀況）；交通影響評估
進綜理表: 是
評估事項: 臨路情形
○△╳判定邏輯(初擬): ○:臨接已開闢8m以上道路且容量足夠／△:道路寬度達標但容量待交評，或須自行設置聯外道路／╳:無法臨接或設置8m聯外道路
因應手段: 自行設置8m以上聯外道路；提出交通改善計畫
手段法源: FL003637 第十四點
手段門檻: 8公尺
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(內政部 glrs.moi.gov.tw FL003637 原文，2026-11-12 知識庫拆條；71層 都市計畫農業區變更使用審議規範-重點)
覆寫/從屬總編規則: —
