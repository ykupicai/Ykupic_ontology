rule_id: UAG-15
法規: 都市計畫農業區變更使用審議規範
法規代碼: FL003637
現行版本: 107.01.25 台內營字第1060816880號令（86.02.17 訂定；內政部，法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 第十五點
條文要旨: 不得位於：(一)【重要水庫集水區】（現有、興建中、規劃完成且核定作民生用水，或集水區面積大於50平方公里之水庫或離槽水庫；範圍依水庫治理機關認定之管理範圍，或大壩上游全流域）；(二)相關主管機關依法劃定或法規規定【禁止開發之土地】（詳附表）。
適用辦理方式: 都計變更
觸發條件: 都市計畫農業區申請變更為其他使用區（另訂有該變更用途之審議規範或處理原則者從其規定，第二點）
回答型態: 6實質計算
資料來源／判斷依據: 環敏套疊（水庫集水區、附表各禁止開發區位）
進綜理表: 是
評估事項: 環境敏感
○△╳判定邏輯(初擬): ○:均未涉及／△:涉及但圖資邊界或附表適用待主管機關確認／╳:位於重要水庫集水區或附表禁止開發土地
因應手段: 剔除涉及範圍
手段法源: —
手段門檻: —
時程約束: 接案初期
完成後可升級為○: —
核對狀態: 已核對(內政部 glrs.moi.gov.tw FL003637 原文，2026-11-12 知識庫拆條；71層 都市計畫農業區變更使用審議規範-重點)
覆寫/從屬總編規則: —
