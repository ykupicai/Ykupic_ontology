rule_id: UAG-16
法規: 都市計畫農業區變更使用審議規範
法規代碼: FL003637
現行版本: 107.01.25 台內營字第1060816880號令（86.02.17 訂定；內政部，法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 第十六點
條文要旨: 位於【自來水水質水量保護區】者依自來水法管制；承受水體未達公告水質標準、已超過管制總量或經水利機關認為河防安全堪虞者【不得開發】。已公告飲用水水源水質保護區或取水口一定距離者依飲用水管理條例；未公告者另須符合：距豐水期水體岸邊水平【1,000公尺】內、取水口上游半徑1公里集水區及下游半徑400公尺內，禁止水保以外之一切開發整地。但保護區劃定前已實施都市計畫地區，或提出廢水三級處理等改善措施經保護區主管機關同意並送都委會審查通過者，不在此限。
適用辦理方式: 都計變更
觸發條件: 都市計畫農業區申請變更為其他使用區（另訂有該變更用途之審議規範或處理原則者從其規定，第二點）
回答型態: 6實質計算
資料來源／判斷依據: 環敏套疊（自來水水質水量保護區、飲用水水源水質保護區、取水口）；承受水體水質
進綜理表: 是
評估事項: 環境敏感
○△╳判定邏輯(初擬): ○:未位於保護區／△:位於保護區但屬劃定前已實施都市計畫地區或擬提三級處理等改善措施／╳:位於水岸1,000m或取水口範圍內且無但書適用，或承受水體不符
因應手段: 廢水三級處理及工程改善措施經主管機關同意
手段法源: FL003637 第十六點第二項但書
手段門檻: —
時程約束: 送件前
完成後可升級為○: —
核對狀態: 已核對(內政部 glrs.moi.gov.tw FL003637 原文，2026-11-12 知識庫拆條；71層 都市計畫農業區變更使用審議規範-重點)
覆寫/從屬總編規則: —
