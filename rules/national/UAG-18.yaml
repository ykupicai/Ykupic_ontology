rule_id: UAG-18
法規: 都市計畫農業區變更使用審議規範
法規代碼: FL003637
現行版本: 107.01.25 台內營字第1060816880號令（86.02.17 訂定；內政部，法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 第十八點
條文要旨: 位於自來水淨水廠取水口上游豐水期水體岸邊水平【1,000公尺】以內，且尚無銜接至取水口下游之專用污水下水道系統者，【應暫停受理】都市計畫變更；但提出該系統設置計畫且已解決所經地區土地問題者不在此限，並應優先施工完成。
適用辦理方式: 都計變更
觸發條件: 都市計畫農業區申請變更為其他使用區（另訂有該變更用途之審議規範或處理原則者從其規定，第二點）
回答型態: 6實質計算
資料來源／判斷依據: 淨水廠取水口位置；污水下水道系統
進綜理表: 是
評估事項: 環境敏感
○△╳判定邏輯(初擬): ○:不在範圍內／△:在範圍內但已提專用污水下水道設置計畫／╳:在範圍內且無設置計畫（暫停受理）
因應手段: 提出專用污水下水道系統設置計畫並解決土地問題
手段法源: FL003637 第十八點但書
手段門檻: —
時程約束: 送件前
完成後可升級為○: 可
核對狀態: 已核對(內政部 glrs.moi.gov.tw FL003637 原文，2026-11-12 知識庫拆條；71層 都市計畫農業區變更使用審議規範-重點)
覆寫/從屬總編規則: —
