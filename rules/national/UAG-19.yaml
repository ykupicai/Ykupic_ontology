rule_id: UAG-19
法規: 都市計畫農業區變更使用審議規範
法規代碼: FL003637
現行版本: 107.01.25 台內營字第1060816880號令（86.02.17 訂定；內政部，法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 第十九點
條文要旨: 位於依法劃定之【海岸（域）管制區、山地管制區、重要軍事設施管制區或要塞堡壘地帶】者，除依主管機關公告之管制事項管制外，辦理變更審議時並應【先徵詢主管機關意見】。
適用辦理方式: 都計變更
觸發條件: 都市計畫農業區申請變更為其他使用區（另訂有該變更用途之審議規範或處理原則者從其規定，第二點）
回答型態: 6實質計算
資料來源／判斷依據: 環敏套疊（四類管制區）
進綜理表: 是
評估事項: 環境敏感
○△╳判定邏輯(初擬): ○:均未涉及／△:涉及，須先徵詢主管機關意見／╳:主管機關公告管制事項明文禁止
因應手段: 審議前函詢主管機關
手段法源: —
手段門檻: —
時程約束: 審議前
完成後可升級為○: —
核對狀態: 已核對(內政部 glrs.moi.gov.tw FL003637 原文，2026-11-12 知識庫拆條；71層 都市計畫農業區變更使用審議規範-重點)
覆寫/從屬總編規則: —
