rule_id: UAG-2-1
法規: 都市計畫農業區變更使用審議規範
法規代碼: FL003637
現行版本: 107.01.25 台內營字第1060816880號令（86.02.17 訂定；內政部，法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 第二點之一
條文要旨: 有下列情事之一者，得由各級都市計畫委員會就實際情形審決，不適用本規範全部或一部：(一)變更範圍內現有聚落建築密集；(二)計畫書圖不符、發照錯誤、地形修測、計畫圖重製或基地畸零狹小，配合都市整體發展而變更；(三)經目的事業主管機關同意興辦教育、文化、社會福利、醫療照顧服務、寺廟宗教、公用設施或公益設施等事業需要而變更；(四)各級政府整體開發而變更。另第五十二點：自治條例或主要計畫通盤檢討書另有規定、或配合國家重大建設者，得經內政部都委會審決。
適用辦理方式: 都計變更
觸發條件: 都市計畫農業區申請變更為其他使用區（另訂有該變更用途之審議規範或處理原則者從其規定，第二點）
回答型態: 3遵照辦理
資料來源／判斷依據: 目的事業主管機關同意函；現況聚落／計畫圖資
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): 非判定列：作為 UAG-12 等基地條件未達時的排除路徑；是否適用屬都委會裁量，引用時一律判△
因應手段: 先取得目的事業主管機關同意興辦函（第三款）
手段法源: FL003637 第二點之一、第五十二點
手段門檻: —
時程約束: 送件前
完成後可升級為○: —
核對狀態: 已核對(內政部 glrs.moi.gov.tw FL003637 原文，2026-11-12 知識庫拆條；71層 都市計畫農業區變更使用審議規範-重點)
覆寫/從屬總編規則: —
