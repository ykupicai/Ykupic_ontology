rule_id: UAG-22-1
法規: 都市計畫農業區變更使用審議規範
法規代碼: FL003637
現行版本: 107.01.25 台內營字第1060816880號令（86.02.17 訂定；內政部，法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 第二十二點之一
條文要旨: 開發後包含基地之各級集水區，以【25年】發生一次暴雨產生之對外排放逕流量總和不得超出開發前，並以【100年】發生一次暴雨強度提供滯洪設施；逕流係數參考水土保持技術規範並取上限值；逕流量計算應經依法登記開業之專業技師簽證（政府機關內具相當類科技師證書者提供者除外）；山坡地案件水保法另有規定者從其規定。
適用辦理方式: 都計變更
觸發條件: 都市計畫農業區申請變更為其他使用區（另訂有該變更用途之審議規範或處理原則者從其規定，第二點）
回答型態: 6實質計算
資料來源／判斷依據: 排水計畫（技師簽證）
進綜理表: 是
評估事項: 規劃配置
○△╳判定邏輯(初擬): ○:已規劃滯洪設施符合25年／100年標準／△:滯洪量體待技師計算／╳:—（屬規劃義務）
因應手段: 規劃滯洪池並由技師簽證
手段法源: —
手段門檻: 25年對外逕流不增加；100年暴雨強度設滯洪
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(內政部 glrs.moi.gov.tw FL003637 原文，2026-11-12 知識庫拆條；71層 都市計畫農業區變更使用審議規範-重點)
覆寫/從屬總編規則: —
