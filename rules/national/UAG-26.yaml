rule_id: UAG-26
法規: 都市計畫農業區變更使用審議規範
法規代碼: FL003637
現行版本: 107.01.25 台內營字第1060816880號令（86.02.17 訂定；內政部，法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 第二十六點
條文要旨: 申請變更使用範圍毗鄰外側土地，除面臨具隔離功能之海、湖、河等公共水域，或山林、公園等永久性公共綠地、空地者外，應設置【隔離綠地或退縮建築，距離須在10公尺以上】。
適用辦理方式: 都計變更
觸發條件: 都市計畫農業區申請變更為其他使用區（另訂有該變更用途之審議規範或處理原則者從其規定，第二點）
回答型態: 6實質計算
資料來源／判斷依據: 配置圖；毗鄰土地使用
進綜理表: 是
評估事項: 規劃配置
○△╳判定邏輯(初擬): ○:已規劃≥10m隔離綠地或退縮／△:基地狹長致扣除後可建築面積不足，須檢討配置／╳:—
因應手段: 配置10m隔離綠地或退縮建築
手段法源: —
手段門檻: 10公尺
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(內政部 glrs.moi.gov.tw FL003637 原文，2026-11-12 知識庫拆條；71層 都市計畫農業區變更使用審議規範-重點)
覆寫/從屬總編規則: 與農變要點 AGR-010（隔離綠帶）併存
