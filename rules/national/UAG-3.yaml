rule_id: UAG-3
法規: 都市計畫農業區變更使用審議規範
法規代碼: FL003637
現行版本: 107.01.25 台內營字第1060816880號令（86.02.17 訂定；內政部，法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 第三點
條文要旨: 申請人應檢具【土地使用同意書】及變更都市計畫書圖（含建築計畫及環境調查分析報告）送直轄市或縣（市）政府查核無誤後，依都市計畫法§27 辦理都市計畫變更（程序如附圖）。擬舉辦之事業依規定須經目的事業主管機關核准者，應【先徵得各該目的事業主管機關同意】後辦理。
適用辦理方式: 都計變更
觸發條件: 都市計畫農業區申請變更為其他使用區（另訂有該變更用途之審議規範或處理原則者從其規定，第二點）
回答型態: 3遵照辦理
資料來源／判斷依據: 土地權屬清冊；目的事業主管機關同意函
進綜理表: 是
評估事項: 土地權屬
○△╳判定邏輯(初擬): ○:同意書齊備且（如需）已取得目的事業主管機關同意／△:同意書或目的事業同意尚未取得／╳:—
因應手段: 取得全部所有權人土地使用同意書；事業須核准者先取得目的事業主管機關同意
手段法源: FL003637 第三點；都市計畫法§27
手段門檻: —
時程約束: 送件前
完成後可升級為○: 可
核對狀態: 已核對(內政部 glrs.moi.gov.tw FL003637 原文，2026-11-12 知識庫拆條；71層 都市計畫農業區變更使用審議規範-重點)
覆寫/從屬總編規則: —
