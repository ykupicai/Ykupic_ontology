rule_id: UAG-30
法規: 都市計畫農業區變更使用審議規範
法規代碼: FL003637
現行版本: 107.01.25 台內營字第1060816880號令（86.02.17 訂定；內政部，法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 第三十點
條文要旨: 變更為住宅社區使用時，得規劃部分土地作為社區性商業使用，其面積【不得超過申請變更使用土地總面積10%】。
適用辦理方式: 都計變更
觸發條件: 都市計畫農業區申請變更為其他使用區（另訂有該變更用途之審議規範或處理原則者從其規定，第二點）
回答型態: 6實質計算
資料來源／判斷依據: 土地使用計畫面積表
進綜理表: 是
評估事項: 規劃配置
○△╳判定邏輯(初擬): ○:社區商業≤10%或未規劃／╳:>10%（調整配置即可，改△）
因應手段: 調整商業使用面積
手段法源: —
手段門檻: 10%
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(內政部 glrs.moi.gov.tw FL003637 原文，2026-11-12 知識庫拆條；71層 都市計畫農業區變更使用審議規範-重點)
覆寫/從屬總編規則: —
