rule_id: UAG-39
法規: 都市計畫農業區變更使用審議規範
法規代碼: FL003637
現行版本: 107.01.25 台內營字第1060816880號令（86.02.17 訂定；內政部，法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 第三十九點
條文要旨: 原始地形在坵塊圖上平均坡度【達15%以上】之建築基地，建蔽率【≤40%】、平均容積率【≤100%】；其餘建築基地建蔽率【≤50%】、平均容積率【≤200%】。公設及代用地超過最低比例者得酌予提高平均容積率，提高部分不得超過上限之20%。
適用辦理方式: 都計變更
觸發條件: 都市計畫農業區申請變更為其他使用區（另訂有該變更用途之審議規範或處理原則者從其規定，第二點）
回答型態: 6實質計算
資料來源／判斷依據: 坵塊圖平均坡度；土地使用計畫
進綜理表: 是
評估事項: 規劃配置
○△╳判定邏輯(初擬): ○:規劃強度在上限內／╳:超過上限（調整計畫即可，改△）
因應手段: —
手段法源: —
手段門檻: 坡度≥15%：40%／100%；其餘：50%／200%
時程約束: 規劃階段
完成後可升級為○: 可
核對狀態: 已核對(內政部 glrs.moi.gov.tw FL003637 原文，2026-11-12 知識庫拆條；71層 都市計畫農業區變更使用審議規範-重點)
覆寫/從屬總編規則: —
