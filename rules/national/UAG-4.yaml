rule_id: UAG-4
法規: 都市計畫農業區變更使用審議規範
法規代碼: FL003637
現行版本: 107.01.25 台內營字第1060816880號令（86.02.17 訂定；內政部，法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 第四點
條文要旨: 辦理機關依第三點及第十二～十九點基地條件查核無誤並認定符合都市計畫法§27 後，應即辦理公開展覽及說明會，公展完成後【1個月內】提該管都委會審議；直轄市、縣（市）都委會審議通過後【3個月內】依都市計畫法§19 報內政部核定。都委會審議應允許與案情有關之公民或團體代表列席陳述意見。
適用辦理方式: 都計變更
觸發條件: 都市計畫農業區申請變更為其他使用區（另訂有該變更用途之審議規範或處理原則者從其規定，第二點）
回答型態: 3遵照辦理
資料來源／判斷依據: —
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): 程序條，不判○△╳
因應手段: —
手段法源: —
手段門檻: —
時程約束: 公展後1個月內提會；地方通過後3個月內報核
完成後可升級為○: —
核對狀態: 已核對(內政部 glrs.moi.gov.tw FL003637 原文，2026-11-12 知識庫拆條；71層 都市計畫農業區變更使用審議規範-重點)
覆寫/從屬總編規則: —
