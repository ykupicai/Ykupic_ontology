rule_id: UAG-44
法規: 都市計畫農業區變更使用審議規範
法規代碼: FL003637
現行版本: 107.01.25 台內營字第1060816880號令（86.02.17 訂定；內政部，法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 第四十四點
條文要旨: 協議書應載明：(一)具結保證依核准之都市計畫實施進度及事業財務計畫開發建設（住宅社區並切結依社區經營管理計畫實施）；(二)自願捐贈之公設用地及代用地座落、面積及現金金額；(三)違反前二款規定之效力。
適用辦理方式: 都計變更
觸發條件: 都市計畫農業區申請變更為其他使用區（另訂有該變更用途之審議規範或處理原則者從其規定，第二點）
回答型態: 3遵照辦理
資料來源／判斷依據: —
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): 程序條，不判○△╳
因應手段: —
手段法源: —
手段門檻: —
時程約束: 協議書簽訂時
