rule_id: UAG-45
法規: 都市計畫農業區變更使用審議規範
法規代碼: FL003637
現行版本: 107.01.25 台內營字第1060816880號令（86.02.17 訂定；內政部，法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 第四十五點
條文要旨: 協議書違約效力包括：(一)【廢止開發許可】並公告；(二)限期依都市計畫法定程序將土地【變更為原使用分區】或其他適當分區；(三)已完成所有權移轉登記之公設用地、代用地及提供之現金【不予發還】。
適用辦理方式: 都計變更
觸發條件: 都市計畫農業區申請變更為其他使用區（另訂有該變更用途之審議規範或處理原則者從其規定，第二點）
回答型態: 3遵照辦理
資料來源／判斷依據: —
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): 風險揭露，不判○△╳；評估報告應載明違約三效力
因應手段: —
手段法源: —
手段門檻: —
時程約束: 開發完成前
完成後可升級為○: —
核對狀態: 已核對(內政部 glrs.moi.gov.tw FL003637 原文，2026-11-12 知識庫拆條；71層 都市計畫農業區變更使用審議規範-重點)
覆寫/從屬總編規則: —
