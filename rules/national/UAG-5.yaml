rule_id: UAG-5
法規: 都市計畫農業區變更使用審議規範
法規代碼: FL003637
現行版本: 107.01.25 台內營字第1060816880號令（86.02.17 訂定；內政部，法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 第五點
條文要旨: 依法須辦理環境影響評估及水土保持者，都市計畫變更審議、環評及水保計畫審查得採【平行作業】；但須辦環評者，報請核定時必須檢具環保主管機關審查通過之環境影響說明書或評估報告書。
適用辦理方式: 都計變更
觸發條件: 都市計畫農業區申請變更為其他使用區（另訂有該變更用途之審議規範或處理原則者從其規定，第二點）
回答型態: 3遵照辦理
資料來源／判斷依據: 環評認定結果（EIA-24／EIA-25）
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): 程序條，不判○△╳；須辦環評者報核定前必須取得環評審查通過
因應手段: —
手段法源: FL003637 第五點
手段門檻: —
時程約束: 報核定前
完成後可升級為○: —
核對狀態: 已核對(內政部 glrs.moi.gov.tw FL003637 原文，2026-11-12 知識庫拆條；71層 都市計畫農業區變更使用審議規範-重點)
覆寫/從屬總編規則: —
