rule_id: UAG-50
法規: 都市計畫農業區變更使用審議規範
法規代碼: FL003637
現行版本: 107.01.25 台內營字第1060816880號令（86.02.17 訂定；內政部，法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 第五十點
條文要旨: 申請人違反協議書規定事項，當地直轄市、縣（市）政府得【廢止開發許可】，並由原都市計畫變更機關依協議書或計畫書載明期限，依法定程序將土地變更回復原使用分區或其他適當分區，已移轉之捐贈土地及現金不予發還。
適用辦理方式: 都計變更
觸發條件: 都市計畫農業區申請變更為其他使用區（另訂有該變更用途之審議規範或處理原則者從其規定，第二點）
回答型態: 3遵照辦理
資料來源／判斷依據: —
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): 風險揭露，不判○△╳
因應手段: —
手段法源: —
手段門檻: —
時程約束: 開發完成前
完成後可升級為○: —
