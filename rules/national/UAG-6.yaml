rule_id: UAG-6
法規: 都市計畫農業區變更使用審議規範
法規代碼: FL003637
現行版本: 107.01.25 台內營字第1060816880號令（86.02.17 訂定；內政部，法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 第六點
條文要旨: 都市計畫變更案經核定機關都委會審議通過後，申請人應即與當地直轄市或縣（市）政府【簽訂協議書】；申請人完成協議書簽訂後，核定機關始予核定或轉報備案、發布實施，並依規定核發開發許可。
適用辦理方式: 都計變更
觸發條件: 都市計畫農業區申請變更為其他使用區（另訂有該變更用途之審議規範或處理原則者從其規定，第二點）
回答型態: 3遵照辦理
資料來源／判斷依據: —
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): 程序條，不判○△╳；協議書未簽不會核定發布
因應手段: —
手段法源: —
手段門檻: —
時程約束: 都委會審議通過後
完成後可升級為○: —
核對狀態: 已核對(內政部 glrs.moi.gov.tw FL003637 原文，2026-11-12 知識庫拆條；71層 都市計畫農業區變更使用審議規範-重點)
覆寫/從屬總編規則: —
