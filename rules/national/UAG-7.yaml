rule_id: UAG-7
法規: 都市計畫農業區變更使用審議規範
法規代碼: FL003637
現行版本: 107.01.25 台內營字第1060816880號令（86.02.17 訂定；內政部，法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 第七點
條文要旨: 取得開發許可後，應先申領雜項執照，完成雜項工程及【興闢完成公共設施】，經查驗合格、辦理移交並完成【自願捐贈土地之移轉登記及現金之提供】後，始得申領建造執照。現金因情形特殊經協議並報都委會同意者得分期繳納，並納入都市計畫書。
適用辦理方式: 都計變更
觸發條件: 都市計畫農業區申請變更為其他使用區（另訂有該變更用途之審議規範或處理原則者從其規定，第二點）
回答型態: 3遵照辦理
資料來源／判斷依據: —
進綜理表: 否
評估事項: —
○△╳判定邏輯(初擬): 時程約束，不判○△╳（實務最常被誤判：都委會通過≠可建築）
因應手段: —
手段法源: —
手段門檻: —
時程約束: 建造執照前須完成公設興闢移交及捐地移轉
完成後可升級為○: —
核對狀態: 已核對(內政部 glrs.moi.gov.tw FL003637 原文，2026-11-12 知識庫拆條；71層 都市計畫農業區變更使用審議規範-重點)
覆寫/從屬總編規則: —
