rule_id: WRA-002-1
法規: 出流管制計畫書與規劃書審核監督及免辦認定辦法
法規代碼: J0110108
現行版本: 114.09.03
編: —
條號: 2-1
條文要旨: 建築法新建造建築物且全部位於都市計畫區者，面積達0.2公頃以上應提計畫書；未達1公頃但已辦雨水流出抑制或貯留設施者得免提（§2-1Ⅱ）
適用辦理方式: 都市計畫區
觸發條件: 都計區新建建築≥0.2公頃
回答型態: 2不適用
資料來源／判斷依據: 是否位於都計區
進綜理表: 否
評估事項: 出流管制
○△╳判定邏輯(初擬): —
因應手段: 設置雨水流出抑制或貯滯留設施
手段法源: 出流管制辦法§2-1Ⅱ
手段門檻: 0.2~1公頃
時程約束: 建照申請前
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫 J0110108)
覆寫/從屬總編規則: —
