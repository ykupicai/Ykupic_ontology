rule_id: WRA-003
法規: 出流管制計畫書與規劃書審核監督及免辦認定辦法
法規代碼: J0110108
現行版本: 114.09.03
編: —
條號: '3'
條文要旨: 應提出流管制【規劃書】：符合計畫書應提出條件、面積達1公頃以上，且涉及非都市土地使用分區變更，或新訂/擴大都市計畫、個案變更、通盤檢討涉農業區保護區公設變更為可建築用地者
適用辦理方式: 開發許可／都計變更
觸發條件: 面積≥1公頃且涉分區變更
回答型態: 6實質計算
資料來源／判斷依據: 基地面積＋是否走分區變更
進綜理表: 是
評估事項: 出流管制
○△╳判定邏輯(初擬): ○:已取得規劃書核定函／△:須辦理規劃書且尚未取得核定函／╳:主管機關不予核定
因應手段: 委託水利技師辦理出流管制規劃書並送水利主管機關核定
手段法源: 出流管制辦法§3Ⅰ（法源：水利法§83-7Ⅸ、§83-8Ⅴ、§83-10Ⅲ）
手段門檻: 面積≥1公頃且涉分區變更
時程約束: ★應於提出開發計畫書件申請前提出，並於各級區域計畫委員會審議前取得核定函
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫 J0110108)
覆寫/從屬總編規則: —
