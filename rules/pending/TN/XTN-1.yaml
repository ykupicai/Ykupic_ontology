rule_id: XTN-1
法規: 非都市土地使用管制規則
法規代碼: D0060013
現行版本: （現行）
編: —
條號: 附表一（農村再生設施列）
條文要旨: 容許使用項目「農村再生設施」只列於【農牧用地、林業用地、養殖用地、交通用地、水利用地、生態保護用地、國土保安用地】7 種使用地；不分細目，附帶條件：一、應依農村再生發展區計畫審核及管理監督辦法規定辦理；二、位於全國區域計畫規定之沿海自然保護區者，需經保護區主管機關許可。
適用辦理方式: 容許使用
觸發條件: 擬於非都市土地設置農村再生設施
回答型態: 逐點檢核
資料來源／判斷依據: 基地使用地類別（地籍屬性）＋環境敏感套疊（沿海自然保護區）
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:使用地屬上列 7 種之一，且不在沿海自然保護區（或已取得保護區主管機關許可）／△:位於沿海自然保護區，尚待保護區主管機關許可／╳:使用地不屬上列 7 種（例：甲乙丙丁種建築用地、遊憩用地不在此列）
因應手段: 使用地不符者：改擇符合之使用地，或另依變更編定程序辦理；細目、認定基準與申請程序改查農再發展區辦法（見 XTN-3、XTN-8）
手段法源: 管制規則附表一附帶條件一、二
手段門檻: —
時程約束: 容許申請前
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫附表一官方附檔 PDF（2026-11-19 逐列抄錄，見 law_notes 附表一各用地篇），2026-11-20 TN 逐字比對原文後撰寫；未覆核)
覆寫/從屬總編規則: —
