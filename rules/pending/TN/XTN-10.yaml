rule_id: XTN-10
法規: 農村再生發展區計畫審核及管理監督辦法
法規代碼: M0110023
現行版本: 115.06.12 修正
編: —
條號: 4、5
條文要旨: 發展區計畫得分為農村生活區、農村生產區、農村生態區、農村文化區四種功能分區，【應包含二個以上功能分區】，各功能分區應整體規劃，不得零星分布及重疊（§4）。農村生活區得劃設於非都市土地甲、乙、丙種建築用地及現有農村聚落與生活需求之區域，【最小面積為1公頃以上】（§5）。
適用辦理方式: 農村再生（發展區計畫擬訂）
觸發條件: 協助縣市政府擬訂或檢討農村再生發展區計畫
回答型態: 逐點檢核
資料來源／判斷依據: 發展區計畫草案之功能分區圖與面積計算
進綜理表: 否
評估事項: 規劃配置
○△╳判定邏輯(初擬): ○:功能分區≥2種、不零星不重疊，生活區≥1公頃／╳:僅1種功能分區、分區零星或重疊，或生活區<1公頃
因應手段: 調整分區界線（得依村里界、道路、農水路、地形地物或宗地界線劃定，辦法§10）
手段法源: 發展區辦法§10
手段門檻: 生活區≥1公頃；功能分區≥2種
時程約束: 草案擬訂階段
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫全文，2026-11-20 TN 逐字比對原文後撰寫；未覆核)
覆寫/從屬總編規則: —
