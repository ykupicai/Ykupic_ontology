rule_id: XTN-11
法規: 農村社區土地重劃條例
法規代碼: D0060007
現行版本: 91.12.11 修正
編: —
條號: 6、7、9
條文要旨: 縣市主管機關辦理農村社區土地重劃：擬訂重劃計畫書圖、舉辦聽證會後，【經區內私有土地所有權人過半數，且其所有土地面積超過區內私有土地總面積半數之同意】，報中央主管機關核定後公告30日（§6）。土地所有權人申請優先辦理（§7）及自行組成重劃會辦理（§9Ⅲ：所有權人合計超過二分之一，且所有面積合計超過私有土地面積二分之一同意，就全部土地辦理並經縣市主管機關核准）均須同樣「雙過半」同意。本條例所稱農村社區指非都市土地之鄉村區、農村聚落及原住民聚落（§3）。
適用辦理方式: 農村社區土地重劃
觸發條件: 以農村社區土地重劃方式辦理
回答型態: 6實質計算
資料來源／判斷依據: 重劃區私有土地所有權人名冊（人數、持分面積）與同意書統計
進綜理表: 是
評估事項: 程序要件
○△╳判定邏輯(初擬): ○:同意人數與同意面積均超過私有土地之半數／△:僅一項過半，或同意書尚在徵集／╳:人數與面積均未過半
因應手段: 持續溝通徵集同意書；必要時調整重劃區範圍
手段法源: 重劃條例§6、§7、§9Ⅲ
手段門檻: 人數＞1/2 且面積＞1/2（私有土地）
時程約束: 報核前
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫全文，2026-11-20 TN 逐字比對原文後撰寫；未覆核)
覆寫/從屬總編規則: —
