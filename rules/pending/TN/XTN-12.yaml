rule_id: XTN-12
法規: 農村社區土地重劃條例
法規代碼: D0060007
現行版本: 91.12.11 修正
編: —
條號: '8'
條文要旨: 縣市主管機關於重劃計畫書圖公告時，得同時公告於一定期限內【禁止重劃區內建築改良物之新建、增建、改建及採取土石或變更地形】；禁止期間【不得超過1年6個月】，公告無須徵詢所有權人意見。違反禁止事項者，因重劃拆除之改良物不予補償（§13Ⅱ但書）。
適用辦理方式: 農村社區土地重劃
觸發條件: 重劃區內有建築或整地計畫
回答型態: 是否
資料來源／判斷依據: 縣市政府重劃計畫公告（是否併同公告禁建事項及期間）
進綜理表: 是
評估事項: 時程
○△╳判定邏輯(初擬): ○:不在禁建公告期間內，或計畫內容不屬禁止事項／△:位於重劃區但尚未公告，須預估禁建期（最長18個月）對時程之影響／╳:於禁建期間擬新建、增建、改建或變更地形
因應手段: 排程避開禁建期；或待重劃分配確定後再申請
手段法源: 重劃條例§8
手段門檻: 最長1年6個月
時程約束: 重劃計畫公告起
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫全文，2026-11-20 TN 逐字比對原文後撰寫；未覆核)
覆寫/從屬總編規則: —
