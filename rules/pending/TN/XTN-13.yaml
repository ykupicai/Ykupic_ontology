rule_id: XTN-13
法規: 農村社區土地重劃條例
法規代碼: D0060007
現行版本: 91.12.11 修正
編: —
條號: '11'
條文要旨: 行政業務費及規劃設計費由政府負擔；工程費由政府與土地所有權人分擔（比例由行政院定之）。道路、溝渠、電信電力地下化、下水道、廣場、活動中心、綠地等公共設施用地，除以原公有道路、溝渠、河川及未登記地四項抵充外，不足土地及拆遷補償費、貸款利息由參加重劃土地所有權人【按土地受益比例共同負擔】，並【以重劃區內未建築土地按評定重劃後地價折價抵付】，無未建築土地者改以現金繳納。折價抵付合計面積【以不超過重劃區總面積35%為限】（經私有地主人數與面積雙過半同意者不在此限）；重劃前編定為建築用地以外之土地，【應提供負擔至少40%土地】。
適用辦理方式: 農村社區土地重劃
觸發條件: 以農村社區土地重劃方式辦理
回答型態: 6實質計算
資料來源／判斷依據: 重劃計畫書之負擔計算（公設用地面積、抵充土地、評定地價）＋各宗土地重劃前使用地類別
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:共同負擔≤35%，且非建築用地負擔≥40% 已納入計算／△:共同負擔超過35%，須取得雙過半同意／╳:共同負擔超過35% 且無法取得雙過半同意
因應手段: 調整公設配置以降低負擔，或取得雙過半同意
手段法源: 重劃條例§11Ⅳ但書
手段門檻: 共同負擔≤35%；非建築用地負擔≥40%
時程約束: 計畫書擬訂階段
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫全文，2026-11-20 TN 逐字比對原文後撰寫；未覆核)
覆寫/從屬總編規則: —
