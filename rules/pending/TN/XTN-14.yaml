rule_id: XTN-14
法規: 農村社區土地重劃條例
法規代碼: D0060007
現行版本: 91.12.11 修正
編: —
條號: '18'
條文要旨: 重劃後土地分配以重劃前原有土地相關位次為準：已有建築物且不妨礙重劃計畫者按原位置分配；同一所有權人數宗土地各達最小分配面積者逐宗分配，未達者得合併分配；【應分配面積未達或合併後仍未達最小分配面積標準二分之一者，除申請與他人合併分配外，以現金補償】，已達二分之一者得於深度較淺或地價較低之土地按最小分配面積分配。最小分配面積標準由縣市主管機關於規劃設計時定之，但不得小於畸零地使用規則規定之寬度、深度及面積。
適用辦理方式: 農村社區土地重劃
觸發條件: 以農村社區土地重劃方式辦理，且區內有小面積持分或零星土地
回答型態: 6實質計算
資料來源／判斷依據: 地籍資料（各所有權人應分配面積）＋縣市政府訂定之最小分配面積標準
進綜理表: 否
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:各所有權人應分配面積均達最小分配面積標準／△:部分所有權人介於1/2 至1倍標準之間，將於較淺或地價較低土地分配／╳:部分所有權人未達1/2 標準，將以現金補償（須事先說明）
因應手段: 協調所有權人申請合併分配
手段法源: 重劃條例§18Ⅰ③
手段門檻: 最小分配面積標準之1/2
時程約束: 規劃設計階段
完成後可升級為○: —
核對狀態: 已核對(全國法規資料庫全文，2026-11-20 TN 逐字比對原文後撰寫；未覆核)
覆寫/從屬總編規則: —
