rule_id: XTN-16
法規: 國土計畫法
法規代碼: D0070230
現行版本: 114.01.20 修正
編: —
條號: 45Ⅲ
條文要旨: 縣市主管機關應於縣市國土計畫公告實施後十年內，依中央主管機關指定之日期一併公告國土功能分區圖；【自公告國土功能分區圖之日起，區域計畫法停止適用】。公告前，非都市土地仍依區域計畫法、非都市土地使用管制規則與開發審議作業規範辦理。
適用辦理方式: 容許使用／變更編定／開發許可／使用許可
觸發條件: 所有非都市土地案件
回答型態: 是否
資料來源／判斷依據: 中央主管機關公告之國土功能分區圖公告日期（內政部國土管理署）
進綜理表: 是
評估事項: 時程
○△╳判定邏輯(初擬): ○:申請時國土功能分區圖尚未公告，依區域計畫法舊制辦理／△:預計審查期間跨越分區圖公告日，須同時盤點新舊制路徑與過渡規定／╳:—（本條僅決定適用法制）
因應手段: 申請時程跨越公告日者，提早送件並確認過渡條款（核發後應循事項辦法§6、審議規則§56）
手段法源: 國土計畫法§45Ⅲ
手段門檻: —
時程約束: 接案初期分流
完成後可升級為○: —
核對狀態: 已核對(全國法規資料庫全文，2026-11-20 TN 逐字比對原文後撰寫；未覆核)
覆寫/從屬總編規則: —
