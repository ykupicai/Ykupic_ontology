rule_id: XTN-17
法規: 國土計畫法
法規代碼: D0070230
現行版本: 114.01.20 修正
編: —
條號: 24Ⅰ、Ⅱ
條文要旨: 於符合國土功能分區及其分類使用原則下，【從事一定規模以上或性質特殊之土地使用】，應由申請人檢具§26 書圖文件申請使用許可（認定標準另定）。使用許可【不得變更國土功能分區、分類】；填海造地案件限於城鄉發展地區申請，並符合海岸及海域之規劃。
適用辦理方式: 使用許可（國土計畫法）
觸發條件: 縣市國土功能分區圖公告實施後
回答型態: 是否
資料來源／判斷依據: 基地面積、擬設使用項目、所在國土功能分區及分類
進綜理表: 是
評估事項: 程序要件
○△╳判定邏輯(初擬): ○:未達一定規模且非性質特殊，免申請使用許可（依管制規則申請同意使用）／△:達一定規模或屬性質特殊，須申請使用許可（門檻見 XTN-21～XTN-25）／╳:擬藉使用許可變更國土功能分區或分類，或於城鄉發展地區以外申請填海造地
因應手段: 須變更分區者，改循國土計畫檢討變更程序
手段法源: 國土計畫法§15
手段門檻: —
時程約束: 接案初期分流
完成後可升級為○: —
核對狀態: 已核對(全國法規資料庫全文，2026-11-20 TN 逐字比對原文後撰寫；未覆核)
覆寫/從屬總編規則: —
