rule_id: XTN-18
法規: 國土計畫法
法規代碼: D0070230
現行版本: 114.01.20 修正
編: —
條號: 24Ⅲ
條文要旨: 使用許可由縣市主管機關受理。申請範圍屬【國土保育地區或海洋資源地區者，核轉中央主管機關審議】，其餘由縣市主管機關審議；但申請範圍【跨二個以上縣市】、興辦國防或重大公共設施或公用事業計畫【跨二個以上國土功能分區致審議機關不同】，或【填海造地案件】，由中央主管機關審議。
適用辦理方式: 使用許可（國土計畫法）
觸發條件: 縣市國土功能分區圖公告實施後，且案件須申請使用許可
回答型態: 說明
資料來源／判斷依據: 基地所在國土功能分區、行政區界、使用計畫性質
進綜理表: 是
評估事項: 程序要件
○△╳判定邏輯(初擬): ○:縣市審議（範圍僅在農業發展或城鄉發展地區、單一縣市）／△:中央審議（含國土保育或海洋資源地區、跨縣市、重大公設跨分區致審議機關不同、填海造地），時程須另估中央審議會排程／╳:—
因應手段: —
手段法源: —
手段門檻: —
時程約束: 排程估算
完成後可升級為○: —
核對狀態: 已核對(全國法規資料庫全文，2026-11-20 TN 逐字比對原文後撰寫；未覆核)
覆寫/從屬總編規則: —
