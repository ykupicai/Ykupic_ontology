rule_id: XTN-19
法規: 國土計畫法
法規代碼: D0070230
現行版本: 114.01.20 修正
編: —
條號: '28'
條文要旨: 核發使用許可案件，【中央主管機關收取國土保育費】，【縣市主管機關收取影響費】（改善或增建相關公共設施之用，得以使用許可範圍內可建築土地抵充）。縣市未於一定期限內按用途使用者，申請人得要求返還；影響費如係配合整體國土計畫推動、指導性質，或其他法律定有同性質費用者，得予減免。費額與計算依國土保育費及影響費收取辦法。
適用辦理方式: 使用許可（國土計畫法）
觸發條件: 縣市國土功能分區圖公告實施後，且案件取得使用許可
回答型態: 數值
資料來源／判斷依據: 國土保育費及影響費收取辦法附表一至三計算公式
進綜理表: 是
評估事項: 財務
○△╳判定邏輯(初擬): ○:已估算兩項費用並納入財務計畫／△:屬得減免情形（國土計畫推動指導性質、其他法律已收同性質費用、國防或重大公設），須另檢具證明申請／╳:—
因應手段: 屬城鄉發展優先順序或重大公設者，可申請調降必要項目影響費（收取辦法§5，最低至50%）
手段法源: 國土計畫法§28Ⅲ、收取辦法§5
手段門檻: —
時程約束: 使用計畫書撰擬階段
完成後可升級為○: —
核對狀態: 已核對(全國法規資料庫全文，2026-11-20 TN 逐字比對原文後撰寫；未覆核)
覆寫/從屬總編規則: —
