rule_id: XTN-2
法規: 農村再生條例
法規代碼: M0110017
現行版本: 99.08.04 公布
編: —
條號: '17'
條文要旨: 農村再生發展區內土地使用，應配合農村再生發展區計畫內容實施管理（§17Ⅰ）；容許使用項目、認定基準、使用強度、建築風貌、管理監督與審核程序，授權農村再生發展區計畫審核及管理監督辦法定之（§17Ⅱ）。另都市計畫或國家公園區域內辦理農村活化再生之地區，土地使用管制仍依都市計畫法或國家公園法辦理（§33）。
適用辦理方式: 容許使用／變更編定
觸發條件: 基地位於已核定之農村再生發展區
回答型態: 是否
資料來源／判斷依據: 縣市政府公告之農村再生發展區範圍、地政機關土地參考資訊檔（辦法§29 登錄之功能分區）
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:基地不在任何已核定發展區內（依一般管制規則檢核）／△:基地在已核定發展區內，須另查該發展區功能分區與容許項目（XTN-3）／╳:—（本條僅決定適用路徑）
因應手段: 向縣市政府或查土地參考資訊檔確認是否位於已核定發展區及所屬功能分區
手段法源: 農再條例§17、發展區辦法§29
手段門檻: —
時程約束: 接案初期分流
完成後可升級為○: —
核對狀態: 已核對(全國法規資料庫全文，2026-11-20 TN 逐字比對原文後撰寫；未覆核)
覆寫/從屬總編規則: —
