rule_id: XTN-20
法規: 國土計畫法
法規代碼: D0070230
現行版本: 114.01.20 修正
編: —
條號: '32'
條文要旨: 國土功能分區圖公告後，區域計畫實施前或原合法之建築物、設施與管制規則不符者，【除准修繕外，不得增建或改建】；縣市主管機關認有必要時得限期令其變更使用或遷移（損害應予適當補償），令其變更或遷移前，得為原來之合法使用或改為妨礙目的較輕之使用。既有合法可建築用地經縣市國土計畫變更為非可建築用地者，其損失應予適當補償。
適用辦理方式: 容許使用／變更編定／使用許可
觸發條件: 縣市國土功能分區圖公告實施後，且基地有既有合法建物或設施
回答型態: 是否
資料來源／判斷依據: 既有建物使用執照或合法證明、國土功能分區圖與使用地編定（含可建築用地註記）
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:既有使用符合新管制規則／△:不符新管制，僅能修繕、不得增改建（擴建計畫受限）／╳:擬增建或改建不符新管制之既有建物
因應手段: 既有可建築用地改為非可建築者，依補償辦法申請補償
手段法源: 國土計畫法§32Ⅱ、Ⅲ
手段門檻: —
時程約束: 分區圖公告後
完成後可升級為○: —
核對狀態: 已核對(全國法規資料庫全文，2026-11-20 TN 逐字比對原文後撰寫；未覆核)
覆寫/從屬總編規則: —
