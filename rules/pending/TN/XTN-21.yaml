rule_id: XTN-21
法規: 一定規模以上或性質特殊土地申請使用許可認定標準
法規代碼: D0070312
現行版本: 114.05.01 內授國計字第1140805747號令訂定（尚未施行）
編: —
條號: 3、4、5、7
條文要旨: 一定規模以上之認定基準：【國土保育地區及農業發展地區第一類至第三類 2 公頃以上；農業發展地區第四類 3 公頃以上；城鄉發展地區 5 公頃以上】；附表一至三所列使用項目依其所定面積（§3Ⅰ），海洋資源地區依附表四（§3Ⅱ）。跨國土保育、農業發展、城鄉發展地區者 2 公頃以上，但休閒農業設施 10 公頃、自來水及水利設施 5 公頃、國防設施 30 公頃（§4）。毗鄰且屬同一興辦事業計畫之二個以上案件【累計面積】達門檻者應申請使用許可；線狀設施面積免計入（§5）。農村社區土地重劃案件為 3 公頃以上（§7）。未達門檻但縣市國土計畫指定應申請者，從其規定（§6）。
適用辦理方式: 使用許可（國土計畫法）
觸發條件: 本法規施行，且基地所在縣市國土功能分區圖公告實施後（區域計畫法停止適用後）
回答型態: 6實質計算
資料來源／判斷依據: 基地面積（含毗鄰同一興辦事業計畫之其他案件）＋所在國土功能分區及分類
進綜理表: 是
評估事項: 程序要件
○△╳判定邏輯(初擬): ○:未達所在分區門檻（且非性質特殊、縣市國土計畫未指定），免申請使用許可／△:接近門檻，或有毗鄰同性質案件須累計／╳:達門檻，須申請使用許可
因應手段: 規模控制在門檻以下（不得以分割申請規避：毗鄰同一興辦事業計畫者累計計算）
手段法源: 認定標準§5Ⅰ
手段門檻: 國保、農一～農三 2ha；農四 3ha；城鄉 5ha；農再重劃 3ha
時程約束: 接案初期分流
完成後可升級為○: —
核對狀態: 已核對(全國法規資料庫全文＋內政部 glrs 附表一至六官方附檔 PDF，2026-11-20 TN 逐字比對原文後撰寫；未覆核)；⚠ 本法規尚未施行（全國法規資料庫標示尚未生效、施行日期由中央主管機關定之，2026-11-20 查證），現行案件不得據以檢核
覆寫/從屬總編規則: —
