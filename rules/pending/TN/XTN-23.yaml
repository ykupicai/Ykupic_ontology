rule_id: XTN-23
法規: 一定規模以上或性質特殊土地申請使用許可認定標準
法規代碼: D0070312
現行版本: 114.05.01 內授國計字第1140805747號令訂定（尚未施行）
編: —
條號: 3Ⅰ但書＋附表二
條文要旨: 農業發展地區例外門檻：農作產銷設施、水產設施、畜牧設施、動物保護相關設施、農業改良試驗設施 5 公頃以上；休閒農業設施 10 公頃以上（且住宿、餐飲、加工、展售解說等設施達 1 公頃者）；住宅（不含民宿）3 公頃以上；特定工業設施 2 公頃以上未達 5 公頃；自來水設施、水利設施 5 公頃以上；水利設施（防洪排水）以必要性附屬設施面積 2 公頃以上認定；教育設施（學校）5 公頃以上；【再生能源設施 5 公頃以上】；國防設施 30 公頃以上。
適用辦理方式: 使用許可（國土計畫法）
觸發條件: 本法規施行，且基地所在縣市國土功能分區圖公告實施後（區域計畫法停止適用後）；基地位於農業發展地區
回答型態: 6實質計算
資料來源／判斷依據: 擬設使用項目＋使用面積
進綜理表: 是
評估事項: 程序要件
○△╳判定邏輯(初擬): ○:使用項目屬附表二且未達所列面積／△:接近所列面積／╳:達所列面積，須申請使用許可
因應手段: —
手段法源: —
手段門檻: 依附表二各項目面積（再生能源 5ha）
時程約束: 接案初期分流
完成後可升級為○: —
核對狀態: 已核對(全國法規資料庫全文＋內政部 glrs 附表一至六官方附檔 PDF，2026-11-20 TN 逐字比對原文後撰寫；未覆核)；⚠ 本法規尚未施行（全國法規資料庫標示尚未生效、施行日期由中央主管機關定之，2026-11-20 查證），現行案件不得據以檢核
覆寫/從屬總編規則: —
