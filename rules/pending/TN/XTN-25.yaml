rule_id: XTN-25
法規: 一定規模以上或性質特殊土地申請使用許可認定標準
法規代碼: D0070312
現行版本: 114.05.01 內授國計字第1140805747號令訂定（尚未施行）
編: —
條號: 8＋附表五
條文要旨: 國土保育、農業發展、城鄉發展地區之【性質特殊】土地使用（不論面積均須申請使用許可）：寵物生命紀念設施（不含寵物骨灰灑葬區）；礦業使用及其設施（限採礦、石油、天然氣採礦）；土石採取及其設施；廢棄物清除處理設施（限衛生掩埋場、封閉掩埋場、焚化處理廠）；殯葬設施（限公墓、殯儀館、火化場）；油（氣）設施（石油煉製及其必要附屬設施）；以及於城鄉發展地區海域之填海造地（築堤、排水、填土、造陸）。海洋資源地區另依附表六。
適用辦理方式: 使用許可（國土計畫法）
觸發條件: 本法規施行，且基地所在縣市國土功能分區圖公告實施後（區域計畫法停止適用後）
回答型態: 是否
資料來源／判斷依據: 擬設使用項目與細目
進綜理表: 是
評估事項: 程序要件
○△╳判定邏輯(初擬): ○:非附表五所列項目／╳:屬附表五所列項目，不論面積均須申請使用許可
因應手段: —
手段法源: —
手段門檻: 不論面積
時程約束: 接案初期分流
完成後可升級為○: —
核對狀態: 已核對(全國法規資料庫全文＋內政部 glrs 附表一至六官方附檔 PDF，2026-11-20 TN 逐字比對原文後撰寫；未覆核)；⚠ 本法規尚未施行（全國法規資料庫標示尚未生效、施行日期由中央主管機關定之，2026-11-20 查證），現行案件不得據以檢核
覆寫/從屬總編規則: —
