rule_id: XTN-26
法規: 國土計畫使用許可申請辦法
法規代碼: GL001691
現行版本: 114.05.01 內授國計字第1140805749號令訂定（尚未施行）
編: —
條號: '3'
條文要旨: 申請案件應符合四項要件（查核表附表一）：一、符合國土計畫土地使用管制規則；二、符合一定規模以上或性質特殊認定標準（填海造地限城鄉發展地區）；三、具備使用許可審議規則應檢附之書圖文件；四、屬國土計畫法§17 性質重要且一定規模以上之部門計畫者，已於先期規劃階段徵詢同級國土計畫主管機關意見。不符者書面通知【30日內補正】，屆期未補正或補正不完全者【不予受理】。
適用辦理方式: 使用許可（國土計畫法）
觸發條件: 本法規施行，且基地所在縣市國土功能分區圖公告實施後（區域計畫法停止適用後）；案件須申請使用許可
回答型態: 逐點檢核
資料來源／判斷依據: 申請書件、管制規則容許情形、部門計畫先期徵詢紀錄
進綜理表: 是
評估事項: 程序要件
○△╳判定邏輯(初擬): ○:四項要件均已具備／△:部門計畫尚未完成先期徵詢，或書圖待補／╳:擬設項目不符管制規則
因應手段: 補正期限 30 日，送件前先自行以附表一查核表檢核
手段法源: 申請辦法§3Ⅱ
手段門檻: 補正 30 日
時程約束: 送件前
完成後可升級為○: 可
核對狀態: 已核對(內政部主管法規系統 glrs 全文（全國法規資料庫交叉確認未生效），2026-11-20 TN 逐字比對原文後撰寫；未覆核)；⚠ 本法規尚未施行（全國法規資料庫標示尚未生效、施行日期由中央主管機關定之，2026-11-20 查證），現行案件不得據以檢核
覆寫/從屬總編規則: —
