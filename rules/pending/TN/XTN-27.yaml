rule_id: XTN-27
法規: 國土計畫使用許可申請辦法
法規代碼: GL001691
現行版本: 114.05.01 內授國計字第1140805749號令訂定（尚未施行）
編: —
條號: '6'
條文要旨: 主管機關應自申請案件【提送同級國土計畫審議會審議之次日起 90 日內】作成許可與否之決定；必要時得延長一次，【延長不超過 90 日】。審議須補正者限期補正，屆期未補正或補正不完全者應予駁回，補正期限不計入審議期間。申請人得於決定前撤回。（起算點不同於區域計畫法施行細則之繳費次日起算）
適用辦理方式: 使用許可（國土計畫法）
觸發條件: 本法規施行，且基地所在縣市國土功能分區圖公告實施後（區域計畫法停止適用後）；案件須申請使用許可
回答型態: 數值
資料來源／判斷依據: 審議會受理日期、補正通知
進綜理表: 否
評估事項: 時程
○△╳判定邏輯(初擬): 說明型：法定審議期間 90 日＋延長 90 日（補正期間另計），排程時以此估算
因應手段: —
手段法源: —
手段門檻: 90 日＋90 日
時程約束: 審議期間
完成後可升級為○: —
核對狀態: 已核對(內政部主管法規系統 glrs 全文（全國法規資料庫交叉確認未生效），2026-11-20 TN 逐字比對原文後撰寫；未覆核)；⚠ 本法規尚未施行（全國法規資料庫標示尚未生效、施行日期由中央主管機關定之，2026-11-20 查證），現行案件不得據以檢核
覆寫/從屬總編規則: —
