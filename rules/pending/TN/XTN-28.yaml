rule_id: XTN-28
法規: 國土計畫使用許可申請辦法
法規代碼: GL001691
現行版本: 114.05.01 內授國計字第1140805749號令訂定（尚未施行）
編: —
條號: '9'
條文要旨: 已許可之使用計畫，經目的事業主管機關認定未變更原興辦事業計畫性質，有下列情形之一者，應依§2～§7 完整程序辦理變更：一、增加或減少原許可計畫範圍；二、變更土地使用配置；三、增加使用項目；四、增加使用強度；五、變更審議規則所定應由審議會同意之情況特殊或例外情形，或影響費數值。有下列情形之一者，得製作【變更內容對照表】送主管機關同意，免依§5、§6（公展、公聽會及審議期限）辦理：一、因地籍測量、分割或坐標誤差、誤植，或政府徵收、撥用、協議價購致增減範圍；二、增加使用項目經認定不影響原設施相容性；三、變更土地使用管制要點且未涉前項各款；四、變更住宅社區維護管理事項；五、變更申請人、計畫名稱、使用地名稱或更正書圖。變更興辦事業計畫性質者，依§8 重新申請並廢止原許可。
適用辦理方式: 變更使用計畫（國土計畫法）
觸發條件: 本法規施行，且基地所在縣市國土功能分區圖公告實施後（區域計畫法停止適用後）；已取得使用許可，擬變更使用計畫
回答型態: 逐點檢核
資料來源／判斷依據: 變更前後對照（範圍、配置、項目、強度）、目的事業主管機關認定
進綜理表: 是
評估事項: 程序要件
○△╳判定邏輯(初擬): ○:屬第二項五款之一，可走變更內容對照表簡化程序／△:屬第一項五款之一，須走完整程序（公展、公聽會、審議）／╳:變更興辦事業計畫性質，須重新申請並廢止原許可
因應手段: 規劃變更內容時優先落在簡化情形內
手段法源: 申請辦法§9Ⅱ
手段門檻: —
時程約束: 變更規劃階段
完成後可升級為○: —
核對狀態: 已核對(內政部主管法規系統 glrs 全文（全國法規資料庫交叉確認未生效），2026-11-20 TN 逐字比對原文後撰寫；未覆核)；⚠ 本法規尚未施行（全國法規資料庫標示尚未生效、施行日期由中央主管機關定之，2026-11-20 查證），現行案件不得據以檢核
