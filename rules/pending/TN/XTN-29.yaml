rule_id: XTN-29
法規: 國土計畫使用許可申請辦法
法規代碼: GL001691
現行版本: 114.05.01 內授國計字第1140805749號令訂定（尚未施行）
編: —
條號: '12'
條文要旨: 取得使用許可後：一、【收受許可通知之日起 1 年內】取得使用地變更及公共設施用地移轉登記文件，得於期限屆滿前申請展期，每次不超過 1 年、【以 2 次為限】；二、【10 年內】取得目的事業主管機關認定開發完成或營運登記文件，或成立管理組織（農村社區土地重劃案件應於期限內完成重劃），得提展期計畫申請展期，不超過 5 年、【以 1 次為限】；三、填海造地依施工管理辦法期限申請造地施工計畫。依法得徵收或依農村社區土地重劃條例申請重劃者，不受第一款限制。【逾期者許可失其效力】。
適用辦理方式: 使用許可（國土計畫法）
觸發條件: 本法規施行，且基地所在縣市國土功能分區圖公告實施後（區域計畫法停止適用後）；已取得使用許可
回答型態: 數值
資料來源／判斷依據: 許可通知收受日期、使用地變更與公設移轉登記進度、開發進度
進綜理表: 是
評估事項: 時程
○△╳判定邏輯(初擬): ○:各期限內可完成／△:須申請展期（第一款最多 2 次、第二款 1 次）／╳:逾期未完成且未展期，許可失效
因應手段: 期限屆滿前申請展期
手段法源: 申請辦法§12Ⅰ①②但書
手段門檻: 1 年（展期 1 年×2）；10 年（展期 5 年×1）
時程約束: 許可後
完成後可升級為○: 可
核對狀態: 已核對(內政部主管法規系統 glrs 全文（全國法規資料庫交叉確認未生效），2026-11-20 TN 逐字比對原文後撰寫；未覆核)；⚠ 本法規尚未施行（全國法規資料庫標示尚未生效、施行日期由中央主管機關定之，2026-11-20 查證），現行案件不得據以檢核
覆寫/從屬總編規則: —
