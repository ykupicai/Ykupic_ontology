rule_id: XTN-33
法規: 國土計畫使用許可審議規則
法規代碼: D0070310
現行版本: 114.05.01 訂定（尚未施行）
編: —
條號: '18'
條文要旨: 應自使用範圍邊界線退縮設置隔離綠帶或設施，【寬度不得小於 10 公尺】；但【緊鄰農業發展地區第一類或國土保育地區】，或屬【農業科技設施、工業設施、油（氣）設施及電力設施】之使用計畫者，【不得小於 20 公尺】。經審議會認定影響程度較低或情況特殊者：一、緊鄰道路、公園、綠地、河川區域、區域排水或海堤區域且無前述 20 公尺情形，得酌減寬度或以建築退縮植栽綠化辦理；二、鄰接管制規則同一群組使用項目，經徵詢目的事業主管機關得免留設；三、保留現況合法建築致無法留設者，得於其他邊界留設相等面積；四、性質特殊且規模小於 1 公頃者，得由審議會酌予調整。農村社區土地重劃案件得不受本條限制（§29），專案輔導合法案件依§25。
適用辦理方式: 使用許可（國土計畫法）
觸發條件: 本法規施行，且基地所在縣市國土功能分區圖公告實施後（區域計畫法停止適用後）；案件須申請使用許可（海洋資源地區除外）
回答型態: 6實質計算
資料來源／判斷依據: 基地四周鄰接之國土功能分區（是否農一或國保）、使用計畫性質、緩衝綠帶劃設（buffer-greenbelt）
進綜理表: 是
評估事項: 規劃配置
○△╳判定邏輯(初擬): ○:可完整劃設 10 公尺（或依情形 20 公尺）隔離綠帶或設施／△:部分邊界須主張第二項例外（待審議會認定）／╳:扣除隔離綠帶後無足夠可利用面積
因應手段: 主張第二項四款例外；調整範圍
手段法源: 審議規則§18Ⅱ、§25②、§29
手段門檻: 一般 10 公尺；鄰農一、國保或屬農業科技、工業、油氣、電力設施 20 公尺
時程約束: 規劃配置階段
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫全文，2026-11-20 TN 逐字比對原文後撰寫；未覆核)；⚠ 本法規尚未施行（全國法規資料庫標示尚未生效、施行日期由中央主管機關定之，2026-11-20 查證），現行案件不得據以檢核
覆寫/從屬總編規則: —
