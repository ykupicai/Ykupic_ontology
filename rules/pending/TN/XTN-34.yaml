rule_id: XTN-34
法規: 國土計畫使用許可審議規則
法規代碼: D0070310
現行版本: 114.05.01 訂定（尚未施行）
編: —
條號: '21'
條文要旨: 扣除不可使用區及資源保育區面積後，【山坡地透水面積應達剩餘計畫面積 50%，平地應達 30%】；位於地下水補注地質敏感區者，依地質敏感區基地地質調查及地質安全評估作業準則辦理。國土保育地區另提高為山坡地 60%、平地 40%（§31④）；專案輔導合法案件為 30%（§25⑤）。
適用辦理方式: 使用許可（國土計畫法）
觸發條件: 本法規施行，且基地所在縣市國土功能分區圖公告實施後（區域計畫法停止適用後）；案件須申請使用許可（海洋資源地區除外）
回答型態: 6實質計算
資料來源／判斷依據: 透水面積計算（天然地面＋透水鋪面）、山坡地範圍套疊
進綜理表: 是
評估事項: 規劃配置
○△╳判定邏輯(初擬): ○:透水面積達門檻／╳:未達門檻
因應手段: 增加植栽區或改用透水鋪面
手段法源: 審議規則§4④
手段門檻: 山坡地 50%、平地 30%（國保 60%／40%）
時程約束: 規劃配置階段
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫全文，2026-11-20 TN 逐字比對原文後撰寫；未覆核)；⚠ 本法規尚未施行（全國法規資料庫標示尚未生效、施行日期由中央主管機關定之，2026-11-20 查證），現行案件不得據以檢核
覆寫/從屬總編規則: —
