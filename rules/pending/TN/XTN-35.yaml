rule_id: XTN-35
法規: 國土計畫使用許可審議規則
法規代碼: D0070310
現行版本: 114.05.01 訂定（尚未施行）
編: —
條號: '22'
條文要旨: 應提出綠化計畫（緩衝、遮蔽、隔離、綠蔭、防音、防風、防火及地被等機能植栽）；就範圍內現有植栽詳細調查，【樹高 10 公尺以上】及【樹高 5 公尺以上且面積達 500 平方公尺之樹林，應予原地保存】，因改變地貌需要得於區內移植（另提保存、移植或再利用措施經審議會同意者不在此限）。範圍內【綠覆率應達 50%】（國土保育地區 60%，§31③；專案輔導合法案件 30%，§25④）。
適用辦理方式: 使用許可（國土計畫法）
觸發條件: 本法規施行，且基地所在縣市國土功能分區圖公告實施後（區域計畫法停止適用後）；案件須申請使用許可（海洋資源地區除外）
回答型態: 6實質計算
資料來源／判斷依據: 植栽現況調查（樹高、樹林面積）、綠覆率計算
進綜理表: 是
評估事項: 規劃配置
○△╳判定邏輯(初擬): ○:綠覆率≥50%，且應保存樹木已原地保存或區內移植／△:須提其他保存措施經審議會同意／╳:綠覆率未達門檻
因應手段: 區內移植；提保存或再利用措施
手段法源: 審議規則§22Ⅰ②但書
手段門檻: 綠覆率 50%（國保 60%）；樹高≥10m、≥5m 且≥500㎡樹林
時程約束: 規劃配置階段
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫全文，2026-11-20 TN 逐字比對原文後撰寫；未覆核)；⚠ 本法規尚未施行（全國法規資料庫標示尚未生效、施行日期由中央主管機關定之，2026-11-20 查證），現行案件不得據以檢核
覆寫/從屬總編規則: —
