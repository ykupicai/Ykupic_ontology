rule_id: XTN-36
法規: 國土計畫使用許可審議規則
法規代碼: D0070310
現行版本: 114.05.01 訂定（尚未施行）
編: —
條號: 30～33
條文要旨: 國土保育地區許可條件：§30 應說明範圍及面積合理性並以最小需用為原則；國防或重大公設應說明區位無可替代性。§31 留設開放及緩衝空間、不破壞生態廊道，【綠覆率 60%】，透水面積【山坡地 60%、平地 40%】。§32 原始地形最小擾動：建築集中配置、道路順應地形、挖填最小及平衡，範圍外取棄土應取得同意文件。§33 應劃設資源保育區實施彌補復育，【面積不得小於扣除不可使用區面積之 30%】，應完整集中、不得作建築基地或道路公設（生態工法滯洪設施經審議會同意得納入）；國防或重大公設經同意得於同一鄉鎮市區內劃設或以其他措施替代。
適用辦理方式: 使用許可（國土計畫法）
觸發條件: 本法規施行，且基地所在縣市國土功能分區圖公告實施後（區域計畫法停止適用後）；案件須申請使用許可，且基地位於國土保育地區
回答型態: 逐點檢核
資料來源／判斷依據: 土地使用配置圖、資源保育區面積計算、綠覆率與透水面積計算、挖填方計算
進綜理表: 是
評估事項: 規劃配置
○△╳判定邏輯(初擬): ○:四條要件均符合（資源保育區≥30%、綠覆率≥60%、透水達門檻）／△:屬國防或重大公設，擬於範圍外劃設資源保育區須審議會同意／╳:資源保育區不足 30%，或綠覆率、透水面積未達門檻
因應手段: 擴大範圍以容納資源保育區；重大公設主張範圍外彌補
手段法源: 審議規則§33Ⅱ
手段門檻: 資源保育區≥30%；綠覆率 60%；透水 60%／40%
時程約束: 規劃配置階段
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫全文，2026-11-20 TN 逐字比對原文後撰寫；未覆核)；⚠ 本法規尚未施行（全國法規資料庫標示尚未生效、施行日期由中央主管機關定之，2026-11-20 查證），現行案件不得據以檢核
覆寫/從屬總編規則: —
