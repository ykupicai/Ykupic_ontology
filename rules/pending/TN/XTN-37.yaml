rule_id: XTN-37
法規: 國土計畫使用許可審議規則
法規代碼: D0070310
現行版本: 114.05.01 訂定（尚未施行）
編: —
條號: 41～43
條文要旨: 農業發展地區許可條件：§41 不得影響周邊既有農業生產環境完整性——設施集中連貫設置、避免夾雜或妨礙既有農業生產經營設施，非農業設施之型態應配合周邊地形地貌、不影響農業生產與生態平衡。§42 不得影響周邊既有水資源供應——【不得妨礙既有上、下游農業灌排水功能】，產生生活或事業廢污水者【應採灌排分離】。§43 範圍內興建必要之農業相關設施，應具體說明與當地農業生產經營及產業鏈之關聯性。
適用辦理方式: 使用許可（國土計畫法）
觸發條件: 本法規施行，且基地所在縣市國土功能分區圖公告實施後（區域計畫法停止適用後）；案件須申請使用許可，且基地位於農業發展地區
回答型態: 逐點檢核
資料來源／判斷依據: 周邊農地利用現況（LUIMAP）、灌排系統套疊、廢污水排放規劃
進綜理表: 是
評估事項: 規劃配置
○△╳判定邏輯(初擬): ○:設施集中、不夾雜農地，灌排分離且不影響上下游灌排／△:須改道灌排水路或廢污水排放尚待農田水利主管機關同意／╳:將夾雜既有農地造成零星使用，或阻斷灌排
因應手段: 調整範圍避免夾雜；設置灌排分離系統並取得農田水利主管機關同意
手段法源: 審議規則§41、§42
手段門檻: —
時程約束: 選址與規劃配置階段
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫全文，2026-11-20 TN 逐字比對原文後撰寫；未覆核)；⚠ 本法規尚未施行（全國法規資料庫標示尚未生效、施行日期由中央主管機關定之，2026-11-20 查證），現行案件不得據以檢核
覆寫/從屬總編規則: —
