rule_id: XTN-39
法規: 國土計畫使用許可核發後應循事項辦法
法規代碼: GL001690
現行版本: 114.05.01 內授國計字第1140805750號令訂定（尚未施行）
編: —
條號: '2'
條文要旨: 取得使用許可之申請人應【依序】完成：一、使用計畫範圍內應登記為縣市或鄉鎮市有之公共設施用地，完成分割、移轉登記；二、繳交國土保育費及影響費；三、依使用計畫內容辦理使用地編定或變更；四、依使用計畫完成公共設施興建，經縣市政府勘驗合格、領得使用執照後移轉登記為縣市或鄉鎮市有。分期分區者，第一、三、四款按分期分區計畫辦理。公共設施移轉完成後，其餘非公共設施用地建築物始得核發使用執照（§5、國土計畫法§29Ⅱ，另有替代方案經同意者除外）。
適用辦理方式: 使用許可（國土計畫法）
觸發條件: 本法規施行，且基地所在縣市國土功能分區圖公告實施後（區域計畫法停止適用後）；已取得使用許可
回答型態: 說明
資料來源／判斷依據: 許可文件、公設用地分割及移轉進度、規費繳納收據
進綜理表: 是
評估事項: 時程
○△╳判定邏輯(初擬): 說明型：排定後續作業順序（公設用地移轉→繳費→使用地變更→公設興建移轉→其餘建物使照），並與申請辦法§12 期限（XTN-29）一併控管
因應手段: —
手段法源: 國土計畫法§29
手段門檻: —
時程約束: 許可後
完成後可升級為○: —
核對狀態: 已核對(內政部主管法規系統 glrs 全文（全國法規資料庫交叉確認未生效），2026-11-20 TN 逐字比對原文後撰寫；未覆核)；⚠ 本法規尚未施行（全國法規資料庫標示尚未生效、施行日期由中央主管機關定之，2026-11-20 查證），現行案件不得據以檢核
覆寫/從屬總編規則: —
