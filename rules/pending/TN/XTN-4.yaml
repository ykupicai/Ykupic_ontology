rule_id: XTN-4
法規: 農村再生發展區計畫審核及管理監督辦法
法規代碼: M0110023
現行版本: 115.06.12 修正
編: —
條號: '26'
條文要旨: 農村再生設施之興建高度【不得超過10.5公尺】。但下列情形之一，且核定於農村再生發展區計畫者，不在此限：一、景觀休閒設施之眺望設施；二、配合公共安全或環境保育目的設置之設施。
適用辦理方式: 容許使用
觸發條件: 設置農村再生設施
回答型態: 6實質計算
資料來源／判斷依據: 設施配置圖／立面圖之設計高度
進綜理表: 是
評估事項: 規劃配置
○△╳判定邏輯(初擬): ○:高度≤10.5公尺／△:超過10.5公尺，屬眺望設施或公共安全、環境保育設施，但尚未核定於發展區計畫／╳:超過10.5公尺且不屬兩款例外
因應手段: 降低設計高度；屬例外者，請縣市政府將該設施核定於發展區計畫
手段法源: 發展區辦法§26但書
手段門檻: 10.5公尺
時程約束: 設計階段
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫全文，2026-11-20 TN 逐字比對原文後撰寫；未覆核)
覆寫/從屬總編規則: —
