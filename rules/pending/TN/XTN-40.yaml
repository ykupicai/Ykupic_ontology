rule_id: XTN-40
法規: 國土保育費及影響費收取辦法
法規代碼: D0070311
現行版本: 114.05.01 訂定（尚未施行）
編: —
條號: '9'
條文要旨: 國土保育費及影響費之計算應載明於使用計畫；申請人應於【辦理使用地變更前】依許可內容繳交，【屆期未繳交者，原許可自始不生效力】。變更使用計畫衍生影響費者，由主管機關於許可時載明繳交期限，屆期未繳者變更之許可不生效力。應繳費用由申請人檢附計算檢核表（附表五）送縣市主管機關查核後通知繳交；以可建築土地抵充影響費者，應於使用地變更前完成分割移轉登記。繳交後除誤繳、溢繳外不得退費（§10）。
適用辦理方式: 使用許可（國土計畫法）
觸發條件: 本法規施行，且基地所在縣市國土功能分區圖公告實施後（區域計畫法停止適用後）；已取得使用許可
回答型態: 是否
資料來源／判斷依據: 主管機關繳費通知、繳納收據
進綜理表: 是
評估事項: 財務
○△╳判定邏輯(初擬): ○:已於使用地變更前繳清／△:已通知繳費尚未繳納／╳:屆期未繳，原許可自始不生效力
因應手段: —
手段法源: —
手段門檻: 使用地變更前
時程約束: 許可後、使用地變更前
完成後可升級為○: —
核對狀態: 已核對(全國法規資料庫全文，2026-11-20 TN 逐字比對原文後撰寫；未覆核)；⚠ 本法規尚未施行（全國法規資料庫標示尚未生效、施行日期由中央主管機關定之，2026-11-20 查證），現行案件不得據以檢核
覆寫/從屬總編規則: —
