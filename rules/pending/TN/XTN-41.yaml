rule_id: XTN-41
法規: 環境影響評估法施行細則
法規代碼: O0090002
現行版本: 115.02.05
編: —
條號: '12'
條文要旨: 環評主管機關分工依附表一；二個以上應實施環評之開發行為合併評估時合併審查，涉及不同主管機關或基地跨越二個以上直轄市、縣（市）者由中央主管機關審查；不屬附表一或分工有爭議者由中央會商地方認定；審查中管轄權變更者原則移送有管轄權機關（經開發單位及有管轄權機關同意得由原機關續辦至審查完成）。
適用辦理方式: 全路線
觸發條件: 開發行為經認定應實施環評，需判斷由中央（環境部）或地方環保局審查
回答型態: 逐點檢核
資料來源／判斷依據: 開發行為類型（附表一對應項）＋基地區位套疊（國家公園、國家風景區、重要濕地、野生動物保護區等）＋是否跨縣市＋是否合併評估
進綜理表: 否
評估事項: 環評
○△╳判定邏輯(初擬): ○:依附表一明確屬地方主管機關，且未合併評估、未跨縣市／△:附表一無對應類型或分工有爭議，待中央會商認定／╳:屬附表一中央欄、合併評估涉及中央事項或跨縣市，須送環境部審查（非不可行，屬審查機關與時程判斷）
因應手段: 依附表一確認審查機關；有疑義時函請環境部認定；評估時程以中央審查流程估算
手段法源: 施行細則§12Ⅰ～Ⅳ、附表一
手段門檻: —
時程約束: 環說書送審前
完成後可升級為○: 否
核對狀態: 已核對(全國法規資料庫全文 115.02.05 版第12條全條抄錄，2026-11-25 TN 撰寫；未覆核)
覆寫/從屬總編規則: —
