rule_id: XTN-42
法規: 環境影響評估法施行細則
法規代碼: O0090002
現行版本: 115.02.05
編: —
條號: 附表一（第十七、十九項）
條文要旨: 遊樂區之開發：位於國家公園或國家風景區之遊樂區由中央主管機關審查；非位於國家公園或國家風景區之遊樂區、動物園由直轄市、縣（市）主管機關審查。旅館、觀光旅館之開發：位於國家公園、野生動物保護區或野生動物重要棲息環境、重要濕地、臺灣沿海地區自然環境保護計畫核定公告之自然保護區或一般保護區、國家風景區或國家森林遊樂區者由中央審查；非位於上列區位者由直轄市、縣（市）審查。
適用辦理方式: 全路線
觸發條件: 遊樂區或旅館、觀光旅館開發經認定應實施環評
回答型態: 逐點檢核
資料來源／判斷依據: 基地套疊國家公園、國家風景區、國家森林遊樂區、重要濕地、野生動物保護區／重要棲息環境、沿海自然保護區或一般保護區範圍
進綜理表: 否
評估事項: 環評
○△╳判定邏輯(初擬): ○:基地不在上列任一區位，由地方環保局審查／△:基地鄰接上列區位、邊界待套疊確認／╳:基地位於上列區位之一，由環境部審查（僅鄰接不算位於）
因應手段: 套疊各區位範圍確認是否「位於」；遊樂區與旅館併案者，任一部分屬中央即依§12Ⅱ由中央合併審查
手段法源: 施行細則§12、附表一第十七、十九項
手段門檻: —
時程約束: 環說書送審前
完成後可升級為○: 否
核對狀態: 已核對(全國法規資料庫附表一附檔 PDF 115.02.05 版，依欄位座標確認所屬欄，2026-11-25 TN 撰寫；未覆核)
覆寫/從屬總編規則: —
