rule_id: XTN-43
法規: 都市計畫工業區檢討變更審議規範
法規代碼: FL003620
現行版本: 100.12.23 台內營字第1000810325號令（83.09.23 訂定；內政部，法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 第二點、第三點
條文要旨: 適用範圍：(一)依通檢辦法工業區檢討基準檢討後不適合繼續作工業使用者；(二)極易造成污染及危害公共安全之工廠經地方政府審核應予搬遷者，或其他為配合都市發展、經濟發展需要所作之必要變更。程序：(一)通盤檢討—經檢討屬【必要之工業區，不得辦理變更為其他使用】；(二)個案變更—2.申請人興辦事業有具體可行之財務及實施計畫者，經認定符合【都市計畫法第二十七條第一項第三款、第四款】規定後依程序辦理；須經目的事業主管機關核准者應先徵得其同意。
適用辦理方式: 都計變更
觸發條件: 都市計畫工業區申請變更為非工業使用（住宅區、商業區、其他分區或公共設施用地）
回答型態: 6實質計算
資料來源／判斷依據: 工業區屬性（是否經通檢認定為必要之工業區）；申請路徑（通盤檢討／個案變更）；是否能被認定符合都市計畫法§27Ⅰ③④
進綜理表: 是
評估事項: 程序要件
○△╳判定邏輯(初擬): ○:擬定機關擬於通盤檢討納入變更，或已認定符合§27Ⅰ③④／△:私人申請個案變更、尚待主管機關認定§27Ⅰ③④／╳:經通檢認定為必要之工業區
因應手段: 改循通盤檢討納入；提出具體可行之財務及實施計畫爭取認定§27Ⅰ③④
手段法源: 都市計畫法§26、§27Ⅰ③④；FL003620 第三點
手段門檻: —
時程約束: 接案初期分流
完成後可升級為○: 可
核對狀態: 已核對(內政部主管法規共用系統 FL003620 友善列印版全文，2026-11-26 TN 逐點比對原文後撰寫；71層 都市計畫工業區檢討變更審議規範-重點；未覆核)
覆寫/從屬總編規則: —
