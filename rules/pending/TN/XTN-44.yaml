rule_id: XTN-44
法規: 都市計畫工業區檢討變更審議規範
法規代碼: FL003620
現行版本: 100.12.23 台內營字第1000810325號令（83.09.23 訂定；內政部，法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 第四點
條文要旨: 基本要件：(一)生產中之合法工廠申請變更者，應於都市計畫報請核定時檢具【註銷工廠登記之證明文件或經地方工業主管機關核定之遷廠計畫書】，遷廠期程納入計畫書；(二)生產中之工廠，雇主歇業或完成遷廠前依勞動基準法相關法令及勞動契約辦理；(三)申請人應提出【整體開發計畫及財務計畫】納入變更主要計畫書；(四)依法應辦環評者，環評與都市計畫變更併行審查；(五)環境現況調查具土壤、地下水或廢棄物污染者，處理方式納入書件。
適用辦理方式: 都計變更
觸發條件: 都市計畫工業區申請變更為非工業使用（住宅區、商業區、其他分區或公共設施用地）
回答型態: 逐點檢核
資料來源／判斷依據: 基地內有無生產中工廠及工廠登記；環評認定；土壤地下水調查
進綜理表: 是
評估事項: 程序要件
○△╳判定邏輯(初擬): ○:無生產中工廠且無污染、已備整體開發及財務計畫／△:有生產中工廠須遷廠計畫書或註銷登記、或須環評併行／╳:—
因應手段: 註銷工廠登記或提遷廠計畫書；辦理土壤及地下水調查
手段法源: FL003620 第四點、第十一點
手段門檻: —
時程約束: 都市計畫報請核定前
完成後可升級為○: 可
核對狀態: 已核對(內政部主管法規共用系統 FL003620 友善列印版全文，2026-11-26 TN 逐點比對原文後撰寫；71層 都市計畫工業區檢討變更審議規範-重點；未覆核)
覆寫/從屬總編規則: —
