rule_id: XTN-45
法規: 都市計畫工業區檢討變更審議規範
法規代碼: FL003620
現行版本: 100.12.23 台內營字第1000810325號令（83.09.23 訂定；內政部，法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 第五點第一款
條文要旨: 區位：工業區之區位，因都市發展結構之改變，【對社區生活環境發生不良影響者，或較適宜作為其他使用且不妨礙鄰近土地使用者】，得變更作為住宅區、商業區或其他使用分區。
適用辦理方式: 都計變更
觸發條件: 都市計畫工業區申請變更為非工業使用（住宅區、商業區、其他分區或公共設施用地）
回答型態: 說明
資料來源／判斷依據: 基地周邊分區與土地使用現況（是否鄰接住宅區、周邊工業使用是否持續）
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:周邊已轉為住商使用、變更不妨礙鄰近工業使用／△:周邊仍以工業使用為主，須論述不妨礙鄰地／╳:—
因應手段: 於計畫書論述區位合理性及與鄰近工業使用之隔離措施
手段法源: FL003620 第五點第一款
手段門檻: —
時程約束: 接案初期
完成後可升級為○: 可
核對狀態: 已核對(內政部主管法規共用系統 FL003620 友善列印版全文，2026-11-26 TN 逐點比對原文後撰寫；71層 都市計畫工業區檢討變更審議規範-重點；未覆核)
覆寫/從屬總編規則: —
