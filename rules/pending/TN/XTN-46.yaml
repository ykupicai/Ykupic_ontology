rule_id: XTN-46
法規: 都市計畫工業區檢討變更審議規範
法規代碼: FL003620
現行版本: 100.12.23 台內營字第1000810325號令（83.09.23 訂定；內政部，法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 第五點第二款
條文要旨: 總量管制：1.變更工業區為住宅區者，不得違反都市計畫定期通盤檢討實施辦法有關【住宅區檢討基準】之規定；2.變更為商業區者，不得違反【商業區檢討基準】之規定。
適用辦理方式: 都計變更
觸發條件: 都市計畫工業區申請變更為非工業使用（住宅區、商業區、其他分區或公共設施用地）
回答型態: 6實質計算
資料來源／判斷依據: 該都市計畫計畫人口與住宅區／商業區面積供需檢討（通盤檢討書）
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:計畫區住宅區（商業區）尚有不足，變更後仍符檢討基準／△:供需未明須檢討／╳:住宅區已供過於求、違反檢討基準
因應手段: 引用最近一次通盤檢討書之計畫人口與住宅區供需分析
手段法源: 都市計畫定期通盤檢討實施辦法（住宅區、商業區檢討基準）
手段門檻: —
時程約束: 接案初期
完成後可升級為○: 可
核對狀態: 已核對(內政部主管法規共用系統 FL003620 友善列印版全文，2026-11-26 TN 逐點比對原文後撰寫；71層 都市計畫工業區檢討變更審議規範-重點；未覆核)
覆寫/從屬總編規則: —
