rule_id: XTN-47
法規: 都市計畫工業區檢討變更審議規範
法規代碼: FL003620
現行版本: 100.12.23 台內營字第1000810325號令（83.09.23 訂定；內政部，法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 第五點第三款
條文要旨: 編定工業區之檢討：都市計畫範圍內之工業區，經工業主管機關依獎勵投資條例或促進產業升級條例【編定為工業區者，在未經工業主管機關公告解除前，不得變更使用】。
適用辦理方式: 都計變更
觸發條件: 都市計畫工業區申請變更為非工業使用（住宅區、商業區、其他分區或公共設施用地）
回答型態: 是否
資料來源／判斷依據: 經濟部工業局（產業發展署）編定工業區範圍
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:非編定工業區／△:—／╳:屬編定工業區且未公告解除
因應手段: 洽工業主管機關公告解除編定
手段法源: FL003620 第五點第三款
手段門檻: —
時程約束: 接案初期
完成後可升級為○: 不可（須主管機關公告解除）
核對狀態: 已核對(內政部主管法規共用系統 FL003620 友善列印版全文，2026-11-26 TN 逐點比對原文後撰寫；71層 都市計畫工業區檢討變更審議規範-重點；未覆核)
覆寫/從屬總編規則: —
