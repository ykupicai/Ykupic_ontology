rule_id: XTN-48
法規: 都市計畫工業區檢討變更審議規範
法規代碼: FL003620
現行版本: 100.12.23 台內營字第1000810325號令（83.09.23 訂定；內政部，法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 第六點本文、第一款、第二款
條文要旨: 申請人於主要計畫核定前，應檢附【全部土地所有權人】土地使用變更同意書或同意開發證明文件，與地方政府或鄉（鎮、市）公所簽定協議書，同意納入計畫書：(一)捐贈公共設施用地及可建築土地，1.變更為住宅區、商業區者，合計占變更工業區土地總面積比例分別【不得低於37%、40.5%】，其他分區由都委會審決；2.其中公共設施用地【不得低於30%】。(二)公設用地作多目標使用以供非營利性公共使用者為限。
適用辦理方式: 都計變更
觸發條件: 都市計畫工業區申請變更為非工業使用（住宅區、商業區、其他分區或公共設施用地）
回答型態: 6實質計算
資料來源／判斷依據: 申請範圍登記面積；所有權人數與同意狀況
進綜理表: 是
評估事項: 附帶條件
○△╳判定邏輯(初擬): ○:取得全部所有權人同意且捐贈後可建築面積仍可行／△:同意書未齊或捐贈後規模不經濟／╳:無法取得全部所有權人同意
因應手段: 取得全部所有權人同意；捐贈可建築土地經都委會同意得改捐代金（第八點）
手段法源: FL003620 第六點、第八點
手段門檻: 住宅區合計≥37%且公設≥30%；商業區合計≥40.5%且公設≥30%
時程約束: 主要計畫核定前
完成後可升級為○: 可
核對狀態: 已核對(內政部主管法規共用系統 FL003620 友善列印版全文，2026-11-26 TN 逐點比對原文後撰寫；71層 都市計畫工業區檢討變更審議規範-重點；未覆核)
覆寫/從屬總編規則: —
