rule_id: XTN-49
法規: 都市計畫工業區檢討變更審議規範
法規代碼: FL003620
現行版本: 100.12.23 台內營字第1000810325號令（83.09.23 訂定；內政部，法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 第六點第三款至第五款
條文要旨: (三)變更主要計畫得由申請人併同擬定或變更細部計畫，自行整體規劃、興建、管理及維護；(四)區內【全部公共設施用地之建設費及樁位測定費均由開發者自行負擔】；(五)細部計畫發布實施【三年內應開發建設】，未依遷廠期程、實施進度及協議書辦理者，由擬定機關查明並於【一年內依法定程序檢討變更恢復為原計畫工業區】，土地權利關係人不得提出異議。
適用辦理方式: 都計變更
觸發條件: 都市計畫工業區申請變更為非工業使用（住宅區、商業區、其他分區或公共設施用地）
回答型態: 3遵照辦理
資料來源／判斷依據: 開發時程、財務計畫
進綜理表: 是
評估事項: 附帶條件
○△╳判定邏輯(初擬): ○:開發時程與財務可於三年內完成／△:時程或財務不確定／╳:—
因應手段: 於協議書與財務計畫明訂實施進度
手段法源: FL003620 第六點
手段門檻: 三年內開發建設
時程約束: 細部計畫發布實施後三年
完成後可升級為○: —
核對狀態: 已核對(內政部主管法規共用系統 FL003620 友善列印版全文，2026-11-26 TN 逐點比對原文後撰寫；71層 都市計畫工業區檢討變更審議規範-重點；未覆核)
覆寫/從屬總編規則: —
