rule_id: XTN-5
法規: 農村再生發展區計畫審核及管理監督辦法
法規代碼: M0110023
現行版本: 115.06.12 修正
編: —
條號: 27、28
條文要旨: 農村再生設施依附表二應申請容許使用者，申請人應檢附：最近一個月土地登記及地籍圖謄本（能申請電子謄本者免附）、設施配置圖（比例尺不小於1/500）、位置略圖、土地使用同意書（單獨所有者免附），各三份，向土地所在縣市主管機關申請（§27）。申請容許使用【限於已核定之農村再生發展區計畫公共設施項目】，並應符合附表二之認定基準；【位於農村生產區者，不得妨礙農田灌溉或排水功能】；未符本辦法或違反其他法令者，縣市主管機關應不予同意（§28）。
適用辦理方式: 容許使用
觸發條件: 發展區計畫已核定，申請農村再生設施容許使用
回答型態: 逐點檢核
資料來源／判斷依據: 發展區計畫公共設施規劃（辦法§9④）、附表二認定基準、農田水利設施與灌排系統套疊
進綜理表: 是
評估事項: 程序要件
○△╳判定邏輯(初擬): ○:設施屬發展區計畫所列公共設施項目、符合附表二認定基準，且（位於生產區時）不影響灌排／△:位於生產區，灌排影響尚待農田水利主管機關確認／╳:不屬發展區計畫公共設施項目，或不符認定基準
因應手段: 不屬計畫公共設施項目者：請縣市政府依§19Ⅱ增加公共設施種類或數量（未涉容許項目變更者，以變更前後對照表報中央核定公告）
手段法源: 發展區辦法§19Ⅱ
手段門檻: 配置圖比例尺≥1/500
時程約束: 容許申請前
完成後可升級為○: 可
核對狀態: 已核對(全國法規資料庫全文＋附表二、附表三官方附檔 PDF，2026-11-20 TN 逐字比對原文後撰寫；未覆核)
覆寫/從屬總編規則: —
