rule_id: XTN-50
法規: 都市計畫工業區檢討變更審議規範
法規代碼: FL003620
現行版本: 100.12.23 台內營字第1000810325號令（83.09.23 訂定；內政部，法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 第七點
條文要旨: 工業區變更後容積率＝變更前工業區容積率×變更前工業區面積／（變更前工業區面積－變更後公共設施用地面積），且【不得大於鄰近使用性質相同使用分區之容積率】。獎勵、移轉及其他名目容積合計【不得大於基準容積之0.5倍】（相關法令另有規定者不在此限）。捐贈比例未達第六點第一款第一目者，除有特殊理由外，基準容積應予降低。
適用辦理方式: 都計變更
觸發條件: 都市計畫工業區申請變更為非工業使用（住宅區、商業區、其他分區或公共設施用地）
回答型態: 6實質計算
資料來源／判斷依據: 變更前工業區容積率（該都市計畫土地使用管制要點）；鄰近同性質分區容積率；捐贈公設面積
進綜理表: 是
評估事項: 規劃標準
○△╳判定邏輯(初擬): ○:依公式算得容積率不超過鄰近住宅區／△:公式值超過鄰近住宅區須取低值／╳:—
因應手段: —
手段法源: FL003620 第七點
手段門檻: 獎勵＋移轉≤基準容積×0.5
時程約束: 規劃階段
完成後可升級為○: —
核對狀態: 已核對(內政部主管法規共用系統 FL003620 友善列印版全文，2026-11-26 TN 逐點比對原文後撰寫；71層 都市計畫工業區檢討變更審議規範-重點；未覆核)
覆寫/從屬總編規則: —
