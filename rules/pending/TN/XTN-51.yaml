rule_id: XTN-51
法規: 都市計畫工業區檢討變更審議規範
法規代碼: FL003620
現行版本: 100.12.23 台內營字第1000810325號令（83.09.23 訂定；內政部，法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 第八點
條文要旨: 開發方式：(一)捐贈土地—以捐贈公設用地及可建築土地為原則；捐贈之可建築土地經都委會同意得改以【捐獻代金】折算繳納，數額＝三家以上專業估價者查估變更後全部可建築土地價格（取最高價）×應捐可建築土地面積／全部可建築土地面積，得分期繳納，費用由申請人負擔，【不得低於變更後第一次公告土地現值之1.4倍】；(二)自辦市地重劃—同意依第六點者得採之，公設比例單獨計列，不含以原公有道路、溝渠、河川及未登記地抵充部分。
適用辦理方式: 都計變更
觸發條件: 都市計畫工業區申請變更為非工業使用（住宅區、商業區、其他分區或公共設施用地）
回答型態: 說明
資料來源／判斷依據: 基地規模（可否切出完整可建築土地捐贈）；公告土地現值
進綜理表: 是
評估事項: 附帶條件
○△╳判定邏輯(初擬): ○:可依規定捐地或代金／△:基地小、捐地難以切出完整可建築土地，須申請改捐代金／╳:—
因應手段: 申請都委會同意改捐代金
手段法源: FL003620 第八點
手段門檻: 代金≥變更後第一次公告現值×1.4
時程約束: 主要計畫審議時
完成後可升級為○: 可
核對狀態: 已核對(內政部主管法規共用系統 FL003620 友善列印版全文，2026-11-26 TN 逐點比對原文後撰寫；71層 都市計畫工業區檢討變更審議規範-重點；未覆核)
覆寫/從屬總編規則: —
