rule_id: XTN-52
法規: 都市計畫工業區檢討變更審議規範
法規代碼: FL003620
現行版本: 100.12.23 台內營字第1000810325號令（83.09.23 訂定；內政部，法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 第九點
條文要旨: 捐贈之可建築土地應為完整可供建築之土地並於計畫圖標示。計畫容納人口以【每人50平方公尺住宅樓地板面積、每四人為一戶】計算，並配置必要公共設施用地；計算計畫區內【車輛預估數20%】之停車需求，規劃公共停車場或供公眾使用之停車空間。變更主要計畫發布實施後，地政機關依平均地權條例第46條核實調整地價。
適用辦理方式: 都計變更
觸發條件: 都市計畫工業區申請變更為非工業使用（住宅區、商業區、其他分區或公共設施用地）
回答型態: 6實質計算
資料來源／判斷依據: 變更後住宅樓地板面積
進綜理表: 是
評估事項: 規劃標準
○△╳判定邏輯(初擬): ○:依基準配置人口、公設與停車／△:基地小無法配置公共停車場須以供公眾使用停車空間替代／╳:—
因應手段: —
手段法源: FL003620 第九點
手段門檻: 每人50㎡、每戶4人；停車20%
時程約束: 規劃階段
完成後可升級為○: —
核對狀態: 已核對(內政部主管法規共用系統 FL003620 友善列印版全文，2026-11-26 TN 逐點比對原文後撰寫；71層 都市計畫工業區檢討變更審議規範-重點；未覆核)
覆寫/從屬總編規則: —
