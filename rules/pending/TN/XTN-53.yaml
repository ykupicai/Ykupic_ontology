rule_id: XTN-53
法規: 都市計畫工業區檢討變更審議規範
法規代碼: FL003620
現行版本: 100.12.23 台內營字第1000810325號令（83.09.23 訂定；內政部，法源＝都市計畫法§27-1Ⅱ）
編: —
條號: 第十二點
條文要旨: 下列情形之一，得經都市計畫委員會就實際情形審決，【不適用本規範全部或一部】：(一)政府依法實施區段徵收或市地重劃，或依都市更新條例實施都市更新；(二)配合國家重大建設，或地方自治條例或各該主要計畫通盤檢討書另有規定，或另定有變更用途之使用區審議規範或處理原則；(三)因計畫書圖不符、發照錯誤、地形修測、計畫圖重製或【基地畸零狹小】，配合都市整體發展而變更；(四)變更範圍內現有聚落建築密集，或變更後未增加允許使用項目，或變更後使用性質非屬住宅或商業。
適用辦理方式: 都計變更
觸發條件: 都市計畫工業區申請變更為非工業使用（住宅區、商業區、其他分區或公共設施用地）
回答型態: 是否
資料來源／判斷依據: 該都市計畫通盤檢討書有無工業區變更專屬規定；基地是否畸零狹小或現有聚落
進綜理表: 是
評估事項: 程序要件
○△╳判定邏輯(初擬): ○:符合排除條款之一，得由都委會審決不適用本規範／△:須論證是否符合／╳:—（不符合僅表示回到本規範一般規定）
因應手段: 查通盤檢討書；論證畸零狹小或聚落密集
手段法源: FL003620 第十二點
手段門檻: —
時程約束: 接案初期
完成後可升級為○: 可
核對狀態: 已核對(內政部主管法規共用系統 FL003620 友善列印版全文，2026-11-26 TN 逐點比對原文後撰寫；71層 都市計畫工業區檢討變更審議規範-重點；未覆核)
覆寫/從屬總編規則: —
