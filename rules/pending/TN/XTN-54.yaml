rule_id: XTN-54
法規: 非都市土地設置營建剩餘土石方臨時暫置場作業規定
法規代碼: GL001768
現行版本: 115.07.24 台內國字第1150808491號令（內政部；執行機關國土管理署）
編: —
條號: 第4點
條文要旨: 申請人須符合下列各款之一：【直轄市、縣（市）政府】；【工程主辦（管）機關】；【依法登記之公會】。三擇一；民間業者不得直接申請。
適用辦理方式: 臨時使用（臨時暫置場）
觸發條件: 非都市土地擬設置營建剩餘土石方臨時暫置場
回答型態: 是否
資料來源／判斷依據: 申請人身分（登記文件或機關函文）
進綜理表: 是
評估事項: 申請資格
○△╳判定邏輯(初擬): ○:申請人屬三類之一／╳:不屬三類（民間業者須由工程主辦機關或公會出面）
因應手段: 改由工程主辦機關或依法登記之公會出面申請
手段法源: 暫置作業規定第4點
手段門檻: —
時程約束: 開案初期
完成後可升級為○: —
核對狀態: 已核對(內政部法規共用系統 glrs.moi.gov.tw GL001768 官方頁原文，2026-11-26 TN 逐點讀取後撰寫；71層 非都市土地設置營建剩餘土石方臨時暫置場作業規定-重點；未覆核)
覆寫/從屬總編規則: —
