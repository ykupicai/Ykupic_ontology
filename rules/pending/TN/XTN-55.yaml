rule_id: XTN-55
法規: 非都市土地設置營建剩餘土石方臨時暫置場作業規定
法規代碼: GL001768
現行版本: 115.07.24 台內國字第1150808491號令（內政部；執行機關國土管理署）
編: —
條號: 第5點Ⅰ(一)
條文要旨: 暫置場之設置位置【不得位於特定農業區、森林區、河川區或第一級環境敏感區】。
適用辦理方式: 臨時使用（臨時暫置場）
觸發條件: 非都市土地擬設置營建剩餘土石方臨時暫置場
回答型態: 是否
資料來源／判斷依據: 基地使用分區（地籍屬性）＋環境敏感地區查詢結果（單一窗口，法定認定以主管機關為準）
進綜理表: 是
評估事項: 土地條件、環境敏感
○△╳判定邏輯(初擬): ○:均不涉及／╳:位於特定農業區、森林區、河川區或第一級環敏（全域條件，剔除土地仍無法排除者判╳）
因應手段: 剔除涉及土地；環敏以單一窗口正式查詢為準
手段法源: 暫置作業規定第5點Ⅰ(一)
手段門檻: —
時程約束: 選址階段
完成後可升級為○: —
核對狀態: 已核對(內政部法規共用系統 glrs.moi.gov.tw GL001768 官方頁原文，2026-11-26 TN 逐點讀取後撰寫；71層 非都市土地設置營建剩餘土石方臨時暫置場作業規定-重點；未覆核)
覆寫/從屬總編規則: —
