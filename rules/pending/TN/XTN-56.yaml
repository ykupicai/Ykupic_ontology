rule_id: XTN-56
法規: 非都市土地設置營建剩餘土石方臨時暫置場作業規定
法規代碼: GL001768
現行版本: 115.07.24 台內國字第1150808491號令（內政部；執行機關國土管理署）
編: —
條號: 第5點Ⅰ(二)、Ⅱ
條文要旨: 暫置場須【距離學校、幼兒園或醫院一公里以上】；距離以暫置場申請範圍界線及建築基地境界線【最近二點直線測量】。
適用辦理方式: 臨時使用（臨時暫置場）
觸發條件: 非都市土地擬設置營建剩餘土石方臨時暫置場
回答型態: 6實質計算
資料來源／判斷依據: 申請範圍界線與學校、幼兒園、醫院建築基地境界線之直線距離（圖資＋現勘；幼兒園圖資可能不全，必要時函詢教育局）
進綜理表: 是
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:≥1公里／╳:<1公里
因應手段: 調整申請範圍；幼兒園收錄不全時函詢教育局
手段法源: 暫置作業規定第5點Ⅰ(二)、Ⅱ
手段門檻: 1公里
時程約束: 選址階段
完成後可升級為○: —
核對狀態: 已核對(內政部法規共用系統 glrs.moi.gov.tw GL001768 官方頁原文，2026-11-26 TN 逐點讀取後撰寫；71層 非都市土地設置營建剩餘土石方臨時暫置場作業規定-重點；未覆核)
覆寫/從屬總編規則: —
