rule_id: XTN-57
法規: 非都市土地設置營建剩餘土石方臨時暫置場作業規定
法規代碼: GL001768
現行版本: 115.07.24 台內國字第1150808491號令（內政部；執行機關國土管理署）
編: —
條號: 第6點Ⅱ(五)1
條文要旨: 臨時使用說明書應載明暫置之土質條件：砂石類、黏土及粉土類；【磚塊或混凝土塊(B5類)僅限暫置於特定專用區或工業區】。
適用辦理方式: 臨時使用（臨時暫置場）
觸發條件: 非都市土地擬設置營建剩餘土石方臨時暫置場
回答型態: 是否
資料來源／判斷依據: 擬暫置土質種類＋基地使用分區
進綜理表: 是
評估事項: 土質條件
○△╳判定邏輯(初擬): ○:僅暫置砂石、黏土、粉土類，或含B5類但位於特定專用區／工業區／△:含B5類且非特定專用區、工業區（須剔除B5類）
因應手段: 非特定專用區、工業區者僅收砂石類、黏土及粉土類；營建混合物業者先問土質是否含B5類
手段法源: 暫置作業規定第6點Ⅱ(五)1
手段門檻: —
時程約束: 申請前
完成後可升級為○: —
核對狀態: 已核對(內政部法規共用系統 glrs.moi.gov.tw GL001768 官方頁原文，2026-11-26 TN 逐點讀取後撰寫；71層 非都市土地設置營建剩餘土石方臨時暫置場作業規定-重點；未覆核)
覆寫/從屬總編規則: —
