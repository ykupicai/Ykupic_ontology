rule_id: XTN-58
法規: 非都市土地設置營建剩餘土石方臨時暫置場作業規定
法規代碼: GL001768
現行版本: 115.07.24 台內國字第1150808491號令（內政部；執行機關國土管理署）
編: —
條號: 第6點Ⅱ(六)1
條文要旨: 環境維護措施：設置圍籬高度【不得低於一點八公尺】；位於農業用地者，至少設置【一點五公尺隔離綠帶】，且其面積【不得少於申請事業面積之百分之三十】。
適用辦理方式: 臨時使用（臨時暫置場）
觸發條件: 非都市土地擬設置營建剩餘土石方臨時暫置場
回答型態: 6實質計算
資料來源／判斷依據: 基地用地別（農業用地＝非交通用地，依農變要點§2認定）；綠帶實算面積比例
進綜理表: 是
評估事項: 環境維護
○△╳判定邏輯(初擬): ○:非農業用地（如丁種建築用地）不適用綠帶，圍籬≥1.8m／△:農業用地，綠帶寬≥1.5m且面積≥30%須實算／╳:綠帶面積不足
因應手段: 農業用地實算綠帶（寬1.5m、比例30%）；是否另需農業主管機關同意，本規定未明文，須洽該管機關
手段法源: 暫置作業規定第6點Ⅱ(六)1
手段門檻: 圍籬1.8m；綠帶1.5m且≥30%
時程約束: 申請前
完成後可升級為○: —
核對狀態: 已核對(內政部法規共用系統 glrs.moi.gov.tw GL001768 官方頁原文，2026-11-26 TN 逐點讀取後撰寫；71層 非都市土地設置營建剩餘土石方臨時暫置場作業規定-重點；未覆核)
覆寫/從屬總編規則: —
