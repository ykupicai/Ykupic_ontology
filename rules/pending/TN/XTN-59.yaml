rule_id: XTN-59
法規: 非都市土地設置營建剩餘土石方臨時暫置場作業規定
法規代碼: GL001768
現行版本: 115.07.24 台內國字第1150808491號令（內政部；執行機關國土管理署）
編: —
條號: 第7點
條文要旨: 暫置場設置期限為【三年】，必要時得申請【展延二年】，並以【一次為限】。
適用辦理方式: 臨時使用（臨時暫置場）
觸發條件: 非都市土地擬設置營建剩餘土石方臨時暫置場
回答型態: 說明
資料來源／判斷依據: 核准函所載期限
進綜理表: 是
評估事項: 時程
○△╳判定邏輯(初擬): ○:規劃期程在3年內，或已預留一次2年展延／╳:期程超過3＋2年
因應手段: 屆滿3個月前申請展延或提送場地復原申請（第8點(五)、第11點）
手段法源: 暫置作業規定第7點
手段門檻: 3年＋2年（一次）
時程約束: 屆滿前3個月
完成後可升級為○: —
核對狀態: 已核對(內政部法規共用系統 glrs.moi.gov.tw GL001768 官方頁原文，2026-11-26 TN 逐點讀取後撰寫；71層 非都市土地設置營建剩餘土石方臨時暫置場作業規定-重點；未覆核)
覆寫/從屬總編規則: —
