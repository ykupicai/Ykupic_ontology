rule_id: XTN-60
法規: 非都市土地設置營建剩餘土石方臨時暫置場作業規定
法規代碼: GL001768
現行版本: 115.07.24 台內國字第1150808491號令（內政部；執行機關國土管理署）
編: —
條號: 第8點(三)
條文要旨: 申請人應於內政部通知繳納保證金之日起【一個月內】繳納，逾期不予核准；暫置面積【五公頃以下新臺幣三十萬元】，【超過五公頃每增加一公頃加收新臺幣六萬元】，不足一公頃以一公頃計。
適用辦理方式: 臨時使用（臨時暫置場）
觸發條件: 非都市土地擬設置營建剩餘土石方臨時暫置場
回答型態: 6實質計算
資料來源／判斷依據: 暫置面積（公頃）
進綜理表: 是
評估事項: 費用
○△╳判定邏輯(初擬): 保證金＝≤5公頃30萬元；>5公頃：30萬＋6萬×(⌈面積⌉−5)
因應手段: 預留保證金；通知後1個月內繳納
手段法源: 暫置作業規定第8點(三)
手段門檻: 5公頃以下30萬；每增1公頃加6萬
時程約束: 內政部通知後1個月內
完成後可升級為○: —
核對狀態: 已核對(內政部法規共用系統 glrs.moi.gov.tw GL001768 官方頁原文，2026-11-26 TN 逐點讀取後撰寫；71層 非都市土地設置營建剩餘土石方臨時暫置場作業規定-重點；未覆核)
覆寫/從屬總編規則: —
