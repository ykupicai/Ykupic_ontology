rule_id: XTN-61
法規: 自來水法
法規代碼: J0110055
現行版本: 全國法規資料庫現行條文（本條原文2026-11-26讀取，修正日期未逐筆查）
編: —
條號: §11Ⅰ⑥、Ⅱ
條文要旨: 自來水事業得申請劃定公布水質水量保護區，依本法或相關法律規定【禁止或限制】下列貽害水質與水量之行為：【設置垃圾掩埋場或焚化爐、傾倒、施放或棄置垃圾、灰渣、土石、污泥】等足以污染水源水質物品（Ⅰ⑥）。前項各款行為，【為居民生活或地方公共建設所必要，且經主管機關核准者，不在此限】（Ⅱ）。
適用辦理方式: 容許使用／變更編定／臨時使用
觸發條件: 基地位於自來水水質水量保護區，擬設置掩埋、堆置或暫置土石之設施
回答型態: 是否
資料來源／判斷依據: 環境敏感地區查詢（自來水水質水量保護區）＋自來水事業／主管機關同意文件。注意：本條是「得劃定保護區並依本法或相關法律禁止或限制」，具體禁限內容依保護區公告與相關法律，非本條直接禁止
進綜理表: 是
評估事項: 環境敏感
○△╳判定邏輯(初擬): ○:不在保護區，或已取得主管機關核准（居民生活或地方公共建設所必要）／△:位於保護區，須洽主管機關／╳:位於保護區且不屬必要情形
因應手段: 洽自來水法主管機關（經濟部）及自來水事業確認；以核准為必要條件
手段法源: 自來水法§11Ⅱ
手段門檻: —
時程約束: 選址階段
完成後可升級為○: —
核對狀態: 已核對(全國法規資料庫 law.moj.gov.tw J0110055 §11 官方頁原文，2026-11-26 TN 讀取後撰寫；71層 自來水法-水質水量保護區-重點；未覆核)
覆寫/從屬總編規則: —
