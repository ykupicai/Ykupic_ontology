rule_id: XTN-62
法規: 臺南市營建工程賸餘土石方處理及資源堆置處理場設置管理自治條例
法規代碼: GL000306(臺南市)
現行版本: 112.10.19 府法制字1121355105A號令（臺南市政府工務局）
編: —
條號: §3④(一)
條文要旨: 收容處理場所之【土石方資源堆置處理場（土資場）】：指供營建餘土【暫屯、堆置、填埋、轉運、回收、分類、加工、煆燒及再生利用】之場所。
適用辦理方式: 容許使用／變更編定／臨時使用
觸發條件: 臺南市轄內擬設置暫屯、堆置營建餘土之場所（含政策性臨時暫置場）
回答型態: 是否
資料來源／判斷依據: 擬設場所之功能（是否含暫屯、堆置、轉運等）；臺南市工務局解釋
進綜理表: 是
評估事項: 程序要件
○△╳判定邏輯(初擬): ○:經工務局確認不屬土資場，或已另依自治條例申請／△:功能涵蓋暫屯、堆置，是否另須依自治條例申請待確認（若須，§19禁止設置地區同樣適用）
因應手段: 函詢臺南市工務局確認臨時暫置場是否另依自治條例申請
手段法源: 自治條例§3④(一)、§19
手段門檻: —
時程約束: 開案初期
完成後可升級為○: —
核對狀態: 已核對(臺南市法規資料庫 law01.tainan.gov.tw GL000306 官方頁原文，2026-11-26 TN 讀取§3④(一)；71層 臺南市營建工程賸餘土石方處理及資源堆置處理場設置管理自治條例-重點；未覆核)
覆寫/從屬總編規則: —
