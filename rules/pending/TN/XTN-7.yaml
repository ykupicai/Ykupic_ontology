rule_id: XTN-7
法規: 農村再生發展區計畫審核及管理監督辦法
法規代碼: M0110023
現行版本: 115.06.12 修正
編: —
條號: '31'
條文要旨: 發展區計畫經中央主管機關核定後，各功能分區內原有合法容許使用之項目，未符該功能分區規定者，【得為從來之使用】；其增建或改建，不得違反發展區計畫所定各功能分區原則。
適用辦理方式: 容許使用／變更編定
觸發條件: 基地位於已核定之農村再生發展區，且有發展區核定前之既有合法使用
回答型態: 是否
資料來源／判斷依據: 既有使用之合法證明（容許使用同意、建照、使用執照等）與核定時間
進綜理表: 否
評估事項: 土地條件
○△╳判定邏輯(初擬): ○:既有使用於核定前已合法，維持從來之使用／△:擬增建或改建，須檢核是否違反所在功能分區原則（辦法§5～§8）／╳:既有使用非屬合法
因應手段: —
手段法源: —
手段門檻: —
時程約束: —
完成後可升級為○: —
核對狀態: 已核對(全國法規資料庫全文，2026-11-20 TN 逐字比對原文後撰寫；未覆核)
覆寫/從屬總編規則: —
